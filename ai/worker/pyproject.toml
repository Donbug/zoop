[project]
name = "zoop-ai-worker"
version = "0.1.0"
description = "Zoop S1 durable document AI execution worker"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "httpx==0.28.1"]

[project.scripts]
zoop-ai = "zoop_ai.cli:main"
zoop-ai-chat = "zoop_ai.chat_cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoop_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
