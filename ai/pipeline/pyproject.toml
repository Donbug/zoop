[project]
name = "zoop-ai-pipeline"
version = "0.1.0"
description = "Zoop S2-1/S2-2/S3 offline source preparation, candidate extraction and relation processes, the S4 read-only dependents report and the nonpublic S3 -> Neo4j version projection (private PoC coupled)"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "lxml==6.1.3",
  "neo4j==6.3.1",
  "pypdf==6.19.0",
  "investmate-poc",
]

[project.scripts]
zoop-ai-ingest = "zoop_ai_pipeline.ingestion_cli:main"
zoop-ai-extract = "zoop_ai_pipeline.extraction_cli:main"
zoop-ai-relation = "zoop_ai_pipeline.relation_cli:main"
zoop-ai-dependents = "zoop_ai_pipeline.dependency_cli:main"
zoop-ai-graph = "zoop_ai_pipeline.graph_projection_cli:main"

[dependency-groups]
# The S1 worker is only a test dependency: citation parity checks compare against its public exact() rule.
dev = ["pytest==9.1.1", "zoop-ai-worker"]

[tool.uv]
package = true

[tool.uv.sources]
# Same pinned PoC commit as prototype/bff (private org repo; CI authenticates with the registered GitHub App token).
investmate-poc = { git = "https://github.com/Donbug/investmate-poc.git", rev = "fa446e7c72edfa06ec1a0e8e999199a21d31c695" }
zoop-ai-worker = { path = "../worker" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoop_ai_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
