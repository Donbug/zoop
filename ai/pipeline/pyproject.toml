[project]
name = "zoop-ai-pipeline"
version = "0.1.0"
description = "Zoop native document collection and preparation, replay/live event and relation analysis, final operator review, private graph projection and application handoff"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "lxml==6.1.3",
  "neo4j==6.3.1",
  "pypdf==6.19.0",
]

[project.scripts]
zoop-ai-collect = "zoop_ai_pipeline.collection_cli:main"
zoop-ai-ingest = "zoop_ai_pipeline.ingestion_cli:main"
zoop-ai-extract = "zoop_ai_pipeline.extraction_cli:main"
zoop-ai-relation = "zoop_ai_pipeline.relation_cli:main"
zoop-ai-dependents = "zoop_ai_pipeline.dependency_cli:main"
zoop-ai-graph = "zoop_ai_pipeline.graph_projection_cli:main"
zoop-ai-handoff = "zoop_ai_pipeline.handoff_cli:main"
zoop-ai-handoff-exposure = "zoop_ai_pipeline.handoff_exposure_cli:main"
zoop-ai-issue-summary = "zoop_ai_pipeline.issue_summary_cli:main"
zoop-ai-private-news = "zoop_ai_pipeline.private_intake_cli:main"
zoop-ai-collector = "zoop_ai_pipeline.collector_cli:main"

[dependency-groups]
# The S1 worker is only a test dependency: citation parity checks compare against its public exact() rule.
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "zoop-ai-worker"]
# Installed only into the collector image (`uv sync --group container`): the S3 checkpoint store, no other code path imports boto3.
container = ["boto3==1.43.121"]

[tool.uv]
package = true

[tool.uv.sources]
zoop-ai-worker = { path = "../worker" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoop_ai_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
