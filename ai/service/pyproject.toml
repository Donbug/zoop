[project]
name = "zoop-ai-service"
version = "0.1.0"
description = "Zoop S1 internal loopback HTTP transport to the installed zoop-ai CLI"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.54.0", "pydantic==2.13.5"]

[project.scripts]
zoop-ai-service = "zoop_ai_service.main:main"

[dependency-groups]
# Test-only: the real installed `zoop-ai` console script plus public fixtures. The service never imports zoop_ai.
dev = ["pytest==9.1.1", "httpx==0.28.1", "zoop-ai-worker"]

[tool.uv.sources]
zoop-ai-worker = { path = "../worker" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoop_ai_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
