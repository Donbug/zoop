spring:
  application:
    name: zoop-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger and the generated OpenAPI document are enabled by default and can be disabled per environment.
springdoc:
  api-docs:
    enabled: ${ZOOP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${ZOOP_SWAGGER_ENABLED:false}
    path: /swagger-ui.html

zoop:
  market:
    quote-provider: ${ZOOP_QUOTE_PROVIDER:toss}
    toss-client-id: ${ZOOP_TOSS_CLIENT_ID:}
    toss-client-secret: ${ZOOP_TOSS_CLIENT_SECRET:}
    toss-base-url: ${ZOOP_TOSS_BASE_URL:https://openapi.tossinvest.com}
    metrics-provider: ${ZOOP_METRICS_PROVIDER:off}
    naver-domestic-url: ${ZOOP_NAVER_DOMESTIC_URL:https://m.stock.naver.com}
    naver-world-url: ${ZOOP_NAVER_WORLD_URL:https://api.stock.naver.com}
    naver-autocomplete-url: ${ZOOP_NAVER_AC_URL:https://ac.stock.naver.com}
    timeout: ${ZOOP_MARKET_TIMEOUT:5s}
    quote-cache-ttl: ${ZOOP_MARKET_QUOTE_CACHE_TTL:5m}
    metrics-cache-ttl: ${ZOOP_MARKET_METRICS_CACHE_TTL:30m}
    price-cache-ttl: ${ZOOP_MARKET_PRICE_CACHE_TTL:30s}
    cache-max-entries: ${ZOOP_MARKET_CACHE_MAX_ENTRIES:2048}
    provider-max-concurrent-requests: ${ZOOP_MARKET_MAX_CONCURRENT_REQUESTS:4}
  api:
    cors:
      allowed-origins: ${ZOOP_API_CORS_ALLOWED_ORIGINS:}
  auth:
    allowed-origins: ${ZOOP_AUTH_ALLOWED_ORIGINS:}
    allow-http-loopback-origins: false
    session-cookie-secure: true
    social:
      frontend-origin: ${ZOOP_AUTH_SOCIAL_FRONTEND_ORIGIN:}
  admin:
    session:
      idle-timeout: ${ZOOP_ADMIN_IDLE_TIMEOUT:30m}
      absolute-timeout: ${ZOOP_ADMIN_ABSOLUTE_TIMEOUT:8h}
  graph:
    snapshot:
      # Public graph snapshot source: none (default; reads fail closed), fixture (local/dev synthetic data only) or artifact
      # (snapshots staged by the operator graph handoff import, read-only and verified; needs artifact-root).
      source: ${ZOOP_GRAPH_SNAPSHOT_SOURCE:none}
      artifact-root: ${ZOOP_GRAPH_SNAPSHOT_ARTIFACT_ROOT:}
    activation:
      # The public exclusion store (FS081, disclosure_exclusion_*) now always exists, so activation checks the version's current
      # exclusions and this switch has no effect. It only matters for a DisclosureExclusionReader without a store (tests).
      allow-without-exclusion-store: ${ZOOP_GRAPH_ACTIVATION_ALLOW_WITHOUT_EXCLUSION_STORE:false}
  chat:
    # Accepting new questions and retries needs a ChatEngine, registered by zoop.ai.chat-client.enabled=true. Off by default:
    # submit and retry answer 503 MODEL_UNAVAILABLE instead of leaving a job queued forever, and startup refuses intake on
    # without an engine. Reading conversations and jobs always works.
    questions-enabled: ${ZOOP_CHAT_QUESTIONS_ENABLED:false}
    executor:
      # Claims queued jobs and recovers expired leases in the web application; runs nothing while no ChatEngine exists.
      enabled: ${ZOOP_CHAT_EXECUTOR_ENABLED:true}
      workers: ${ZOOP_CHAT_EXECUTOR_WORKERS:2}
  analysis:
    analyze-plan:
      # Executes fixed admitted S2/S3 units only; completion does not collect or publish data.
      # Enabling requires all three HTTP clients, a common base URL and the expected AI principal.
      enabled: ${ZOOP_ANALYSIS_ANALYZE_PLAN_ENABLED:false}
      expected-principal: ${ZOOP_ANALYSIS_ANALYZE_PLAN_EXPECTED_PRINCIPAL:}
      poll-interval: ${ZOOP_ANALYSIS_ANALYZE_PLAN_POLL_INTERVAL:2s}
      attempt-deadline: ${ZOOP_ANALYSIS_ANALYZE_PLAN_ATTEMPT_DEADLINE:30m}
      lease: ${ZOOP_ANALYSIS_ANALYZE_PLAN_LEASE:150s}
      max-consecutive-failures: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_CONSECUTIVE_FAILURES:5}
      max-recovery-dispatches: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_RECOVERY_DISPATCHES:3}
      max-reclaims: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_RECLAIMS:16}
    review-sync:
      # Runs only with analyze-plan: re-reads observed units' S2/S3 results into the admin review targets.
      interval: ${ZOOP_ANALYSIS_REVIEW_SYNC_INTERVAL:60s}
      batch: ${ZOOP_ANALYSIS_REVIEW_SYNC_BATCH:20}
  ai:
    client:
      # Internal S1 AI transport client. Disabled by default; the application starts without any AI setting.
      # When enabled, every value below is validated at startup and an invalid one fails startup (see api/docs/AI_INTEGRATION.md).
      enabled: ${ZOOP_AI_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_CLIENT_MAX_RESPONSE_BYTES:8388608}
    extraction-client:
      # Internal S2 extraction-job transport client. Disabled by default; same validation as the S1 client above.
      enabled: ${ZOOP_AI_EXTRACTION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_EXTRACTION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_EXTRACTION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_EXTRACTION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_EXTRACTION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_EXTRACTION_CLIENT_MAX_RESPONSE_BYTES:8388608}
    relation-client:
      # Internal S3 relation-job transport client. Disabled by default; same validation as the S1 client above.
      enabled: ${ZOOP_AI_RELATION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_RELATION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_RELATION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_RELATION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_RELATION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_RELATION_CLIENT_MAX_RESPONSE_BYTES:8388608}
    plan-admission-client:
      # Exact-plan admission transport only. Active admission is not source rights, execution readiness or spending authority.
      enabled: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_MAX_RESPONSE_BYTES:16000000}
    chat-client:
      # Chatbot model stages through ai/service (POST /internal/v1/chat-stages/{stage}). Disabled by default. Enabled, it
      # registers the chat engine, so zoop.chat.questions-enabled may be turned on. mode: replay (AI-side fixtures, no network)
      # or live (real Luna/Jev calls behind the AI service's own chat gate and call ceiling; paid calls need approval).
      enabled: ${ZOOP_AI_CHAT_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_CHAT_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_CHAT_CLIENT_TOKEN:}
      mode: ${ZOOP_AI_CHAT_CLIENT_MODE:replay}
      connect-timeout: ${ZOOP_AI_CHAT_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_CHAT_CLIENT_REQUEST_TIMEOUT:35s}
      max-response-bytes: ${ZOOP_AI_CHAT_CLIENT_MAX_RESPONSE_BYTES:2097152}
  document-import:
    # Operator-only, non-web import of S2-1 extracted text (see api/docs/DOCUMENT_IMPORT.md). Disabled by default; the
    # application starts without any of these settings. Enabled, it refuses to start unless the run is non-web
    # (--spring.main.web-application-type=none) and every path below is valid. Paths only; the database uses DB_*.
    enabled: ${ZOOP_DOCUMENT_IMPORT_ENABLED:false}
    request: ${ZOOP_DOCUMENT_IMPORT_REQUEST:}
    result: ${ZOOP_DOCUMENT_IMPORT_RESULT:}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  document-analysis:
    # Operator-only, non-web analysis of registered documents by the S1 AI service (see api/docs/DOCUMENT_ANALYSIS.md).
    # Disabled by default; the application starts without any of these settings. Enabled, it refuses to start unless the run is
    # non-web (--spring.main.web-application-type=none), the S1 AI client is enabled (zoop.ai.client.*), the document import is
    # not enabled in the same process, and every path below is valid. `grants` is the operator's flat S1 grant registry (the
    # same file the AI service reads as ZOOP_AI_SERVICE_GRANTS). Paths only; the database uses DB_*.
    enabled: ${ZOOP_DOCUMENT_ANALYSIS_ENABLED:false}
    request: ${ZOOP_DOCUMENT_ANALYSIS_REQUEST:}
    result: ${ZOOP_DOCUMENT_ANALYSIS_RESULT:}
    grants: ${ZOOP_DOCUMENT_ANALYSIS_GRANTS:}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  graph-handoff-import:
    # Operator-only, non-web staging of one AI handoff as an INACTIVE graph version (see api/README.md). Disabled by default; the
    # application starts without any of these settings. Enabled, it refuses to start unless the run is non-web
    # (--spring.main.web-application-type=none), no document import/analysis and no fixture snapshot source runs in the same process,
    # and every path below is valid. There is ONE source registry (`ingestion-sources`) and ONE S2-1 ledger (`ingestion-state-dir`):
    # the handoff export and the per-observation `zoop-ai-ingest export --require-store` both read them. `canonical`, `decisions`
    # and `bindings` are the operator files the handoff was frozen with (pinned by hash in its manifest). Paths only; the database
    # uses DB_*, which no CLI receives.
    enabled: ${ZOOP_GRAPH_HANDOFF_IMPORT_ENABLED:false}
    request: ${ZOOP_GRAPH_HANDOFF_IMPORT_REQUEST:}
    result: ${ZOOP_GRAPH_HANDOFF_IMPORT_RESULT:}
    handoff-cli: ${ZOOP_HANDOFF_CLI:}
    handoff-state-dir: ${ZOOP_HANDOFF_STATE_DIR:}
    relation-state-dir: ${ZOOP_RELATION_STATE_DIR:}
    extraction-state-dir: ${ZOOP_EXTRACTION_STATE_DIR:}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    canonical: ${ZOOP_HANDOFF_CANONICAL:}
    decisions: ${ZOOP_HANDOFF_DECISIONS:}
    bindings: ${ZOOP_HANDOFF_BINDINGS:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  disclosure-exclusion:
    # Operator-only, non-web write of the public exclusion store (FS081, see api/README.md): `exclude` from an AI exposure report
    # (zoop-ai-handoff-exposure output, embedded in the request) or an explicit `lift`. Disabled by default. Enabled, it refuses a
    # web context and any path that is not normalized and absolute. The artifact root is only read (import receipts).
    enabled: ${ZOOP_DISCLOSURE_EXCLUSION_ENABLED:false}
    request: ${ZOOP_DISCLOSURE_EXCLUSION_REQUEST:}
    result: ${ZOOP_DISCLOSURE_EXCLUSION_RESULT:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  document-read:
    # Public GET /api/v1/evidence/{id} (see api/docs/DOCUMENT_ANALYSIS.md, api/docs/GRAPH_READ_HANDOFF.md). All settings are optional,
    # independent of the operator import/analysis flags above, and read-only: nothing is created, locked or written. Paths only;
    # the database uses DB_*.
    # `grants` is the operator's flat S1 grant registry (the same file as ZOOP_DOCUMENT_ANALYSIS_GRANTS / the AI service),
    # re-read on every request; unset, every S1 evidence read answers 503.
    # `ingestion-sources` is the operator's S2-1 source registry for graph evidence reads. It MUST name the same file as
    # ZOOP_INGESTION_SOURCES (the registry the handoff import checks), is re-read on every request, has no default and never falls
    # back to the S1 registry; unset, every graph evidence read answers 503.
    # `artifact-root` is only needed to read the exact receipt of a summary served from the AI artifact cache and the import
    # receipt of a graph version; unset, only those reads answer 503. A set value that is not a normalized absolute path to an
    # existing file/directory fails startup.
    grants: ${ZOOP_DOCUMENT_READ_GRANTS:}
    ingestion-sources: ${ZOOP_DOCUMENT_READ_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_DOCUMENT_READ_ARTIFACT_ROOT:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
