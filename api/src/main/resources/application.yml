spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: zoop-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger and the generated OpenAPI document are enabled by default and can be disabled per environment.
springdoc:
  api-docs:
    enabled: ${ZOOP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${ZOOP_SWAGGER_ENABLED:false}
    path: /swagger-ui.html

zoop:
  market:
    quote-provider: ${ZOOP_QUOTE_PROVIDER:toss}
    toss-client-id: ${ZOOP_TOSS_CLIENT_ID:}
    toss-client-secret: ${ZOOP_TOSS_CLIENT_SECRET:}
    toss-base-url: ${ZOOP_TOSS_BASE_URL:https://openapi.tossinvest.com}
    metrics-provider: ${ZOOP_METRICS_PROVIDER:off}
    naver-domestic-url: ${ZOOP_NAVER_DOMESTIC_URL:https://m.stock.naver.com}
    naver-world-url: ${ZOOP_NAVER_WORLD_URL:https://api.stock.naver.com}
    naver-autocomplete-url: ${ZOOP_NAVER_AC_URL:https://ac.stock.naver.com}
    timeout: ${ZOOP_MARKET_TIMEOUT:5s}
    quote-cache-ttl: ${ZOOP_MARKET_QUOTE_CACHE_TTL:5m}
    metrics-cache-ttl: ${ZOOP_MARKET_METRICS_CACHE_TTL:30m}
    price-cache-ttl: ${ZOOP_MARKET_PRICE_CACHE_TTL:30s}
    cache-max-entries: ${ZOOP_MARKET_CACHE_MAX_ENTRIES:2048}
    provider-max-concurrent-requests: ${ZOOP_MARKET_MAX_CONCURRENT_REQUESTS:4}
  api:
    cors:
      allowed-origins: ${ZOOP_API_CORS_ALLOWED_ORIGINS:}
  auth:
    allowed-origins: ${ZOOP_AUTH_ALLOWED_ORIGINS:}
    allow-http-loopback-origins: false
    session-cookie-secure: true
    social:
      frontend-origin: ${ZOOP_AUTH_SOCIAL_FRONTEND_ORIGIN:}
  admin:
    session:
      idle-timeout: ${ZOOP_ADMIN_IDLE_TIMEOUT:30m}
      absolute-timeout: ${ZOOP_ADMIN_ABSOLUTE_TIMEOUT:8h}
    review:
      reconcile:
        # Settles review decisions whose AI answer was lost, from the AI ledger, in the web application on its own thread. Runs
        # only while the AI relation client is configured (zoop.ai.relation-client.enabled=true); on by default then.
        enabled: ${ZOOP_ADMIN_REVIEW_RECONCILE_ENABLED:true}
        interval: ${ZOOP_ADMIN_REVIEW_RECONCILE_INTERVAL:PT1M}
        min-age: ${ZOOP_ADMIN_REVIEW_RECONCILE_MIN_AGE:PT2M}
        batch: ${ZOOP_ADMIN_REVIEW_RECONCILE_BATCH:50}
  graph:
    snapshot:
      # Public graph snapshot source: none (default; reads fail closed), fixture (local/dev synthetic data only) or artifact
      # (snapshots staged by the operator graph handoff import, read-only and verified; needs artifact-root).
      source: ${ZOOP_GRAPH_SNAPSHOT_SOURCE:none}
      artifact-root: ${ZOOP_GRAPH_SNAPSHOT_ARTIFACT_ROOT:}
    round:
      # #55 periodic public-graph round inside the web application. Off by default. Enabled, one thread (graph-round) opens a
      # row per calendar slot (first-slot-at + k * slot-interval, slot-count a day, in zone; plus the freeze-only slots) and moves
      # every open round through R1..R7: AI round-run (round-client), analyze_plan under system:scheduler, AI round-handoff with
      # the app's bindings, then the import bridge (R7: the round's handoff is staged by the same importer as the operator
      # command, read over the handoff-read client, written into zoop.graph.snapshot.artifact-root, which must be an artifact
      # source here). Needs zoop.ai.round-client, zoop.ai.handoff-read-client and zoop.analysis.analyze-plan enabled.
      # import-source cli runs the installed zoop-ai-ingest export --require-store for the observation re-check (local,
      # single-instance operation); the round bridge rejects http until it is wired to the observation-export client.
      enabled: ${ZOOP_GRAPH_ROUND_ENABLED:false}
      interval: ${ZOOP_GRAPH_ROUND_INTERVAL:PT15S}
      lease: ${ZOOP_GRAPH_ROUND_LEASE:PT2M}
      zone: ${ZOOP_GRAPH_ROUND_ZONE:Asia/Seoul}
      first-slot-at: ${ZOOP_GRAPH_ROUND_FIRST_SLOT_AT:09:05}
      slot-interval: ${ZOOP_GRAPH_ROUND_SLOT_INTERVAL:PT30M}
      slot-count: ${ZOOP_GRAPH_ROUND_SLOT_COUNT:18}
      # Freeze-only slots (team decision 8): no run, a carry-only freeze so jobs finished after the last run are published the same day.
      freeze-only: ${ZOOP_GRAPH_ROUND_FREEZE_ONLY:18:05}
      lookback: ${ZOOP_GRAPH_ROUND_LOOKBACK:PT30M}
      max-open-rounds: ${ZOOP_GRAPH_ROUND_MAX_OPEN_ROUNDS:3}
      # R4 waits this long for the analyze_plan job (longer than zoop.analysis.analyze-plan.attempt-deadline; a round's analysis
      # may take more than one slot).
      analysis-wait-deadline: ${ZOOP_GRAPH_ROUND_ANALYSIS_WAIT_DEADLINE:PT2H}
      operator: ${ZOOP_GRAPH_ROUND_OPERATOR:scheduler}
      wait-retry-after: ${ZOOP_GRAPH_ROUND_WAIT_RETRY_AFTER:PT1M}
      busy-retry-after: ${ZOOP_GRAPH_ROUND_BUSY_RETRY_AFTER:PT5M}
      max-attempts-per-stage: ${ZOOP_GRAPH_ROUND_MAX_ATTEMPTS_PER_STAGE:20}
      import-source: ${ZOOP_GRAPH_ROUND_IMPORT_SOURCE:cli}
      ingestion-cli: ${ZOOP_GRAPH_ROUND_INGESTION_CLI:}
      ingestion-state-dir: ${ZOOP_GRAPH_ROUND_INGESTION_STATE_DIR:}
      ingestion-sources: ${ZOOP_GRAPH_ROUND_INGESTION_SOURCES:}
    activation:
      # The public exclusion store (FS081, disclosure_exclusion_*) now always exists, so activation checks the version's current
      # exclusions and this switch has no effect. It only matters for a DisclosureExclusionReader without a store (tests).
      allow-without-exclusion-store: ${ZOOP_GRAPH_ACTIVATION_ALLOW_WITHOUT_EXCLUSION_STORE:false}
    auto-activation:
      # FS059: while the active pointer is absent or a fixture, the web application can publish the newest eligible native
      # import after the same checks as an admin activation (system actor in the activation history). A real active version
      # requires cumulative composition and manual CAS activation. Off by default; a restart changes it. Imports from lookback
      # before start count; refusals use retry-after and unavailable sources use unavailable-retry-after. Runs on its own thread.
      enabled: ${ZOOP_GRAPH_AUTO_ACTIVATION_ENABLED:false}
      interval: ${ZOOP_GRAPH_AUTO_ACTIVATION_INTERVAL:PT15S}
      lookback: ${ZOOP_GRAPH_AUTO_ACTIVATION_LOOKBACK:PT30M}
      retry-after: ${ZOOP_GRAPH_AUTO_ACTIVATION_RETRY_AFTER:PT5M}
      unavailable-retry-after: ${ZOOP_GRAPH_AUTO_ACTIVATION_UNAVAILABLE_RETRY_AFTER:PT1M}
  chat:
    # Accepting new questions and retries needs a ChatEngine, registered by zoop.ai.chat-client.enabled=true. Off by default:
    # submit and retry answer 503 MODEL_UNAVAILABLE instead of leaving a job queued forever, and startup refuses intake on
    # without an engine. Reading conversations and jobs always works.
    questions-enabled: ${ZOOP_CHAT_QUESTIONS_ENABLED:false}
    approved-docs:
      # Q01 help.search and screenSpec.read. Keep off until immutable approved versions of both guides have been registered
      # in chat_document_versions. Enabling without both current approved documents fails startup instead of exposing drafts.
      enabled: ${ZOOP_CHAT_APPROVED_DOCS_ENABLED:false}
    executor:
      # Claims queued jobs and recovers expired leases in the web application; runs nothing while no ChatEngine exists.
      enabled: ${ZOOP_CHAT_EXECUTOR_ENABLED:true}
      workers: ${ZOOP_CHAT_EXECUTOR_WORKERS:2}
    mcp:
      # POST /mcp: the chatbot's read tools for a running job, over MCP Streamable HTTP (api/docs/chat-mcp.md). Off by
      # default, and the path does not exist then. Enabled, it needs ZOOP_CHAT_MCP_ACTIVE_KEY_ID and ZOOP_CHAT_MCP_KEYS (the
      # job-scoped grant tokens' signing keys, not the model API key) and ZOOP_CHAT_MCP_SEND_GRANTS / ZOOP_CHAT_MCP_SEND_RECIPIENT
      # (the operator chat grant registry every result is checked against before it is sent, and the agent recipient).
      # Turning it on outside local tests waits for the remaining conditions in api/docs/chat-mcp.md 5.
      enabled: ${ZOOP_CHAT_MCP_ENABLED:false}
      # The agent path (Luna chooses the reads through this endpoint, the server approves each call). Off by default; needs
      # the endpoint above and the chat model stages. The URL the model provider reaches this endpoint at is set on the AI
      # runtime (ZOOP_AI_CHAT_MCP_SERVER_URL), the only server a run's grant is ever sent to.
      agent-enabled: ${ZOOP_CHAT_AGENT_ENABLED:false}
    web:
      # The supplementary web search tool (api/docs/chat-web-search.md). Off by default. No real provider is selected yet:
      # enabled, it needs provider=synthetic (fixture hits under example domains, local and tests only). It is never
      # planned by the router; it is an MCP tool of the agent path, whose answers cite its hits as web_result.
      enabled: ${ZOOP_CHAT_WEB_ENABLED:false}
      provider: ${ZOOP_CHAT_WEB_PROVIDER:none}
  analysis:
    analyze-plan:
      # Executes fixed admitted S2/S3 units only; completion does not collect or publish data.
      # Enabling requires all three HTTP clients, a common base URL and the expected AI principal.
      enabled: ${ZOOP_ANALYSIS_ANALYZE_PLAN_ENABLED:false}
      expected-principal: ${ZOOP_ANALYSIS_ANALYZE_PLAN_EXPECTED_PRINCIPAL:}
      poll-interval: ${ZOOP_ANALYSIS_ANALYZE_PLAN_POLL_INTERVAL:2s}
      attempt-deadline: ${ZOOP_ANALYSIS_ANALYZE_PLAN_ATTEMPT_DEADLINE:30m}
      lease: ${ZOOP_ANALYSIS_ANALYZE_PLAN_LEASE:150s}
      max-consecutive-failures: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_CONSECUTIVE_FAILURES:5}
      max-recovery-dispatches: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_RECOVERY_DISPATCHES:3}
      max-reclaims: ${ZOOP_ANALYSIS_ANALYZE_PLAN_MAX_RECLAIMS:16}
    review-sync:
      # Runs only with analyze-plan: re-reads observed units' S2/S3 results into the admin review targets.
      interval: ${ZOOP_ANALYSIS_REVIEW_SYNC_INTERVAL:60s}
      batch: ${ZOOP_ANALYSIS_REVIEW_SYNC_BATCH:20}
  ai:
    # Exact host names (comma separated) every AI client below may also reach over plain http besides loopback. Empty by
    # default: every other host needs https. Dev lists its in-VPC Service Connect name (ai) because it has no certificate;
    # the bearer token and response bodies then travel unencrypted inside the VPC. Never set in production.
    plaintext-http-hosts: ${ZOOP_AI_PLAINTEXT_HTTP_HOSTS:}
    client:
      # Internal S1 AI transport client. Disabled by default; the application starts without any AI setting.
      # When enabled, every value below is validated at startup and an invalid one fails startup (see api/docs/AI_INTEGRATION.md).
      enabled: ${ZOOP_AI_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_CLIENT_MAX_RESPONSE_BYTES:8388608}
    extraction-client:
      # Internal S2 extraction-job transport client. Disabled by default; same validation as the S1 client above.
      enabled: ${ZOOP_AI_EXTRACTION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_EXTRACTION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_EXTRACTION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_EXTRACTION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_EXTRACTION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_EXTRACTION_CLIENT_MAX_RESPONSE_BYTES:8388608}
    relation-client:
      # Internal S3 relation-job transport client. Disabled by default; same validation as the S1 client above.
      enabled: ${ZOOP_AI_RELATION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_RELATION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_RELATION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_RELATION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_RELATION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_RELATION_CLIENT_MAX_RESPONSE_BYTES:8388608}
    plan-admission-client:
      # Exact-plan admission transport only. Active admission is not source rights, execution readiness or spending authority.
      enabled: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_PLAN_ADMISSION_CLIENT_MAX_RESPONSE_BYTES:16000000}
    handoff-exposure-client:
      # Identity-only exposure query (scope handoff.exposure) for the operator exclusion command. A proposal, never an exclusion.
      enabled: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_REQUEST_TIMEOUT:60s}
      max-response-bytes: ${ZOOP_AI_HANDOFF_EXPOSURE_CLIENT_MAX_RESPONSE_BYTES:7340032}
    handoff-read-client:
      # Read-only handoff family (scope handoff.read): GET /internal/v1/graph-handoffs/{id} and /bundle. Used only by the graph
      # handoff import with handoff-source=http in place of the installed zoop-ai-handoff export. A bundle is at most 6 MiB.
      enabled: ${ZOOP_AI_HANDOFF_READ_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_HANDOFF_READ_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_HANDOFF_READ_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_HANDOFF_READ_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_HANDOFF_READ_CLIENT_REQUEST_TIMEOUT:60s}
      max-response-bytes: ${ZOOP_AI_HANDOFF_READ_CLIENT_MAX_RESPONSE_BYTES:16777216}
    observation-export-client:
      # Observation export route (scope observation.read): POST /internal/v1/observations/export runs the installed
      # zoop-ai-ingest export --require-store on the AI side for ONE observation and answers the CLI's JSON (document.text
      # included). Used by the graph handoff import and the document import with observation-source=http. The AI child runs at most 45 s and the
      # answer is at most 16 MiB, so the request deadline stays above 45 s. One request = one observation; no batch, no job.
      enabled: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_TOKEN:}
      connect-timeout: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_REQUEST_TIMEOUT:50s}
      max-response-bytes: ${ZOOP_AI_OBSERVATION_EXPORT_CLIENT_MAX_RESPONSE_BYTES:16777216}
    round-client:
      # Round-run and round-handoff families (scopes round.run, round.read; #387 ①② contract of 2026-10-30): POST/GET
      # /internal/v1/round-runs and /internal/v1/round-handoffs. Used only by the graph round scheduler. Status answers are
      # small; the freeze request carries the bindings export (up to 4 MB).
      enabled: ${ZOOP_AI_ROUND_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_ROUND_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_ROUND_CLIENT_TOKEN:}
      expected-principal: ${ZOOP_AI_ROUND_CLIENT_EXPECTED_PRINCIPAL:}
      connect-timeout: ${ZOOP_AI_ROUND_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_ROUND_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${ZOOP_AI_ROUND_CLIENT_MAX_RESPONSE_BYTES:2097152}
    chat-client:
      # Chatbot model stages through ai/service (POST /internal/v1/chat-stages/{stage}). Disabled by default. Enabled, it
      # registers the chat engine, so zoop.chat.questions-enabled may be turned on. mode: replay (AI-side fixtures, no network)
      # or live (real Luna/Jev calls behind the AI service's own chat gate and call ceiling; paid calls need approval).
      enabled: ${ZOOP_AI_CHAT_CLIENT_ENABLED:false}
      base-url: ${ZOOP_AI_CHAT_CLIENT_BASE_URL:}
      token: ${ZOOP_AI_CHAT_CLIENT_TOKEN:}
      mode: ${ZOOP_AI_CHAT_CLIENT_MODE:replay}
      connect-timeout: ${ZOOP_AI_CHAT_CLIENT_CONNECT_TIMEOUT:3s}
      request-timeout: ${ZOOP_AI_CHAT_CLIENT_REQUEST_TIMEOUT:35s}
      max-response-bytes: ${ZOOP_AI_CHAT_CLIENT_MAX_RESPONSE_BYTES:2097152}
  document-import:
    # Operator-only, non-web import of S2-1 extracted text (see api/docs/DOCUMENT_IMPORT.md). Disabled by default; the
    # application starts without any of these settings. Enabled, it refuses to start unless the run is non-web
    # (--spring.main.web-application-type=none) and every applicable path below is valid. The target database uses DB_*.
    enabled: ${ZOOP_DOCUMENT_IMPORT_ENABLED:false}
    request: ${ZOOP_DOCUMENT_IMPORT_REQUEST:}
    result: ${ZOOP_DOCUMENT_IMPORT_RESULT:}
    # observation-source: cli (default; the installed zoop-ai-ingest export --require-store, which needs the three
    # ZOOP_INGESTION_* settings) or http (ai/service POST /internal/v1/observations/export through
    # zoop.ai.observation-export-client, which must then be enabled; the three ZOOP_INGESTION_* settings must be left unset).
    # cli ignores an enabled export client (the web application sharing this environment may hold one).
    observation-source: ${ZOOP_DOCUMENT_IMPORT_OBSERVATION_SOURCE:cli}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  document-analysis:
    # Operator-only, non-web analysis of registered documents by the S1 AI service (see api/docs/DOCUMENT_ANALYSIS.md).
    # Disabled by default; the application starts without any of these settings. Enabled, it refuses to start unless the run is
    # non-web (--spring.main.web-application-type=none), the S1 AI client is enabled (zoop.ai.client.*), the document import is
    # not enabled in the same process, and every path below is valid. `grants` is the operator's flat S1 grant registry (the
    # same file the AI service reads as ZOOP_AI_SERVICE_GRANTS). Paths only; the database uses DB_*.
    enabled: ${ZOOP_DOCUMENT_ANALYSIS_ENABLED:false}
    request: ${ZOOP_DOCUMENT_ANALYSIS_REQUEST:}
    result: ${ZOOP_DOCUMENT_ANALYSIS_RESULT:}
    grants: ${ZOOP_DOCUMENT_ANALYSIS_GRANTS:}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  document-bindings:
    # Operator-only, non-web export of the AI handoff's app document bindings file (zoop-app-document-bindings-1, see
    # api/docs/DOCUMENT_BINDINGS.md). Disabled by default; the application starts without any of these settings. Enabled, it
    # refuses to start unless the run is non-web (--spring.main.web-application-type=none) and both files are new normalized
    # absolute paths, and refuses to run next to another operator command (one run per process). It reads the registry only and
    # writes nothing. `scope` is `available` (default: versions of available articles) or `all`; `selection` optionally names an
    # explicit list of document versions.
    enabled: ${ZOOP_DOCUMENT_BINDINGS_ENABLED:false}
    output: ${ZOOP_DOCUMENT_BINDINGS_OUTPUT:}
    result: ${ZOOP_DOCUMENT_BINDINGS_RESULT:}
    selection: ${ZOOP_DOCUMENT_BINDINGS_SELECTION:}
    scope: ${ZOOP_DOCUMENT_BINDINGS_SCOPE:available}
  graph-handoff-import:
    # Operator-only, non-web staging of one AI handoff as an INACTIVE graph version (see api/README.md). Disabled by default; the
    # application starts without any of these settings. Enabled, it refuses to start unless the run is non-web
    # (--spring.main.web-application-type=none), no document import/analysis and no fixture snapshot source runs in the same process,
    # and every applicable path below is valid. Native sources stay on the AI service when both transports are HTTP.
    # CLI transports use either singular native roots or the pinned source-context inventory.
    # HTTP transports require their respective clients and refuse unused CLI settings.
    # The target database uses DB_*, which no CLI receives.
    enabled: ${ZOOP_GRAPH_HANDOFF_IMPORT_ENABLED:false}
    handoff-source: ${ZOOP_GRAPH_HANDOFF_IMPORT_HANDOFF_SOURCE:cli}
    observation-source: ${ZOOP_GRAPH_HANDOFF_IMPORT_OBSERVATION_SOURCE:cli}
    request: ${ZOOP_GRAPH_HANDOFF_IMPORT_REQUEST:}
    result: ${ZOOP_GRAPH_HANDOFF_IMPORT_RESULT:}
    handoff-cli: ${ZOOP_HANDOFF_CLI:}
    handoff-state-dir: ${ZOOP_HANDOFF_STATE_DIR:}
    relation-state-dir: ${ZOOP_RELATION_STATE_DIR:}
    extraction-state-dir: ${ZOOP_EXTRACTION_STATE_DIR:}
    ingestion-cli: ${ZOOP_INGESTION_CLI:}
    ingestion-state-dir: ${ZOOP_INGESTION_STATE_DIR:}
    ingestion-sources: ${ZOOP_INGESTION_SOURCES:}
    source-contexts: ${ZOOP_GRAPH_HANDOFF_IMPORT_SOURCE_CONTEXTS:}
    source-contexts-sha256: ${ZOOP_GRAPH_HANDOFF_IMPORT_SOURCE_CONTEXTS_SHA256:}
    canonical: ${ZOOP_HANDOFF_CANONICAL:}
    decisions: ${ZOOP_HANDOFF_DECISIONS:}
    bindings: ${ZOOP_HANDOFF_BINDINGS:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  graph-delivery:
    seal:
      enabled: ${ZOOP_GRAPH_DELIVERY_SEAL_ENABLED:false}
      command: ${ZOOP_GRAPH_DELIVERY_SEAL_COMMAND:seal}
      destination-id: ${ZOOP_GRAPH_DELIVERY_SEAL_DESTINATION_ID:}
      result: ${ZOOP_GRAPH_DELIVERY_SEAL_RESULT:}
      max-files: ${ZOOP_GRAPH_DELIVERY_SEAL_MAX_FILES:1003}
      max-package-bytes: ${ZOOP_GRAPH_DELIVERY_SEAL_MAX_PACKAGE_BYTES:268435456}
      max-pending-bytes: ${ZOOP_GRAPH_DELIVERY_SEAL_MAX_PENDING_BYTES:1073741824}
    install:
      enabled: ${ZOOP_GRAPH_DELIVERY_INSTALL_ENABLED:false}
      destination-id: ${ZOOP_GRAPH_DELIVERY_INSTALL_DESTINATION_ID:}
      version-id: ${ZOOP_GRAPH_DELIVERY_INSTALL_VERSION_ID:}
      expected-package-digest: ${ZOOP_GRAPH_DELIVERY_INSTALL_EXPECTED_PACKAGE_DIGEST:}
      artifact-root: ${ZOOP_GRAPH_DELIVERY_INSTALL_ARTIFACT_ROOT:}
      result: ${ZOOP_GRAPH_DELIVERY_INSTALL_RESULT:}
      max-files: ${ZOOP_GRAPH_DELIVERY_INSTALL_MAX_FILES:1003}
      max-package-bytes: ${ZOOP_GRAPH_DELIVERY_INSTALL_MAX_PACKAGE_BYTES:268435456}
  disclosure-exclusion:
    # Operator-only, non-web write of the public exclusion store (FS081, see api/README.md): `exclude` from an AI exposure report
    # (zoop-ai-handoff-exposure output, embedded in the request) or an explicit `lift`. Disabled by default. Enabled, it refuses a
    # web context and any path that is not normalized and absolute. The artifact root is only read (import receipts).
    enabled: ${ZOOP_DISCLOSURE_EXCLUSION_ENABLED:false}
    request: ${ZOOP_DISCLOSURE_EXCLUSION_REQUEST:}
    result: ${ZOOP_DISCLOSURE_EXCLUSION_RESULT:}
    artifact-root: ${ZOOP_ARTIFACT_ROOT:}
  document-read:
    # Public GET /api/v1/evidence/{id} (see api/docs/DOCUMENT_ANALYSIS.md, api/docs/GRAPH_READ_HANDOFF.md). All settings are optional,
    # independent of the operator import/analysis flags above, and read-only: nothing is created, locked or written. Paths only;
    # the database uses DB_*.
    # `grants` is the operator's flat S1 grant registry (the same file as ZOOP_DOCUMENT_ANALYSIS_GRANTS / the AI service),
    # re-read on every request; unset, every S1 evidence read answers 503.
    # `ingestion-sources` is the operator's S2-1 source registry for graph evidence reads. It MUST name the same file as
    # ZOOP_INGESTION_SOURCES (the registry the handoff import checks), is re-read on every request, has no default and never falls
    # back to the S1 registry; unset, every graph evidence read answers 503.
    # `artifact-root` is only needed to read the exact receipt of a summary served from the AI artifact cache and the import
    # receipt of a graph version; unset, only those reads answer 503. A set value that is not a normalized absolute path to an
    # existing file/directory fails startup.
    grants: ${ZOOP_DOCUMENT_READ_GRANTS:}
    ingestion-sources: ${ZOOP_DOCUMENT_READ_INGESTION_SOURCES:}
    artifact-root: ${ZOOP_DOCUMENT_READ_ARTIFACT_ROOT:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
