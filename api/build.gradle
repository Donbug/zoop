plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zoop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Default `test`: foundation tests and the AI client tests against in-process stub servers. No Python, no network.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'ai-contract'
		excludeTags 'company-postgres'
	}
}

// Explicit integration gate against a disposable PostgreSQL database (see docs/COMPANY_SEARCH_TESTING.md).
tasks.register('companyIntegrationTest', Test) {
	group = 'verification'
	description = 'Verifies company migrations, JPA startup and catalog search against isolated PostgreSQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'company-postgres'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

// Real cross-language gate: this JVM talks to a running ai/service and the installed zoop-ai CLI (replay only).
// Run it through `make api-ai-smoke`; that script starts the service and exports ZOOP_AI_CONTRACT_MANIFEST.
// Without the manifest the tests fail; they never skip.
tasks.register('aiContractTest', Test) {
	group = 'verification'
	description = 'Runs the cross-language AI transport contract tests against a live ai/service (see make api-ai-smoke).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-contract'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}
