plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.zoop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Cached Spring test contexts share one disposable database; each pool must stay bounded.
tasks.withType(Test).configureEach {
	systemProperty 'zoop.briefing.usage.classpath', sourceSets.test.runtimeClasspath.asPath
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '4'
	systemProperty 'spring.datasource.hikari.minimum-idle', '0'
}

// Default `test`: foundation tests and the AI client tests against in-process stub servers. No Python, no network.
tasks.named('test') {
	// The proof regression launches the actual test-owned CLI in a separate JVM (System.exit must not stop the test worker).
	systemProperty 'zoop.ai.proof.classpath', sourceSets.test.runtimeClasspath.asPath
	useJUnitPlatform {
		excludeTags 'ai-contract'
		excludeTags 'ai-pipeline-contract'
		excludeTags 'ai-chat-contract'
		excludeTags 'company-postgres'
		excludeTags 'briefing-postgres'
		excludeTags 'briefing-replay-postgres'
		excludeTags 'graph-postgres'
	}
}

// Explicit integration gate against a disposable PostgreSQL database (see docs/COMPANY_SEARCH_TESTING.md).
tasks.register('companyIntegrationTest', Test) {
	group = 'verification'
	description = 'Verifies company and graph version migrations, JPA startup, catalog search and graph version selection against isolated PostgreSQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'company-postgres', 'graph-postgres'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('authIntegrationTest', Test) {
	group = 'verification'
	description = 'Verifies authentication migrations and flows against PostgreSQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'auth-postgres'
	}
	outputs.upToDateWhen { false }
	doFirst {
		if (!System.getenv('DB_URL')?.startsWith('jdbc:postgresql:')) {
			throw new GradleException('Set DB_URL to a PostgreSQL test database for authIntegrationTest')
		}
	}
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

// Explicit real-HTTP briefing gate: disposable PostgreSQL and a random-port Spring server, no external calls.
tasks.register('briefingIntegrationTest', Test) {
	group = 'verification'
	description = 'Verifies briefing migrations and DB-backed public HTTP reads against disposable PostgreSQL.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'briefing-postgres' }
	outputs.upToDateWhen { false }
	doFirst {
		if (!System.getenv('DB_URL')?.startsWith('jdbc:postgresql:')) {
			throw new GradleException('Set DB_URL to a disposable PostgreSQL database for briefingIntegrationTest')
		}
	}
	testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

// Development replay has a separate disposable database and never shares the public API test database.
tasks.register('briefingReplayIntegrationTest', Test) {
	group = 'verification'
	description = 'Verifies opt-in local briefing replay import, immutable storage and real HTTP reads.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'briefing-replay-postgres' }
	outputs.upToDateWhen { false }
	doFirst {
		if (!System.getenv('DB_URL')?.startsWith('jdbc:postgresql:')) {
			throw new GradleException('Set DB_URL to a disposable briefing_replay PostgreSQL database')
		}
	}
	testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

// Real cross-language gate: this JVM talks to a running ai/service and the installed zoop-ai CLI (replay only).
// Run it through `make api-ai-smoke`; that script starts the service and exports ZOOP_AI_CONTRACT_MANIFEST.
// Without the manifest the tests fail; they never skip.
tasks.register('aiContractTest', Test) {
	group = 'verification'
	description = 'Runs the cross-language AI transport contract tests against a live ai/service (see make api-ai-smoke).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-contract'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

// Real cross-language gate for the S2 extraction and S3 relation clients: this JVM talks to a running ai/service and the
// installed zoop-ai-extract / zoop-ai-relation over a fresh synthetic operator world (replay only, no model, no network).
// Run it through `make api-ai-pipeline-smoke`; that script prepares the world and exports ZOOP_AI_PIPELINE_MANIFEST.
// Without the manifest the tests fail; they never skip.
tasks.register('aiPipelineContractTest', Test) {
	group = 'verification'
	description = 'Runs the S2/S3 cross-language transport tests against a live ai/service (see make api-ai-pipeline-smoke).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-pipeline-contract'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

// Real cross-language gate for the chatbot model stages: the production ChatModelStages adapters talk to a running ai/service
// and the installed zoop-ai-chat over an authored replay fixture (no model, no network, no PostgreSQL). Run it through
// `make api-ai-chat-smoke`; that script authors the fixture, starts the service and exports ZOOP_AI_CHAT_CONTRACT_MANIFEST.
// Without the manifest the tests fail; they never skip.
tasks.register('aiChatContractTest', Test) {
	group = 'verification'
	description = 'Runs the chatbot model stage cross-language tests against a live ai/service (see make api-ai-chat-smoke).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-chat-contract'
	}
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
	}
}

// Test-owned synthetic consumer. No Spring app queue, policy control, publication or provider calls.
tasks.register('preparePlanAdmissionProof') {
	group = 'verification'
	description = 'Compiles the synthetic admission proof client and writes its direct JVM classpath.'
	dependsOn tasks.named('testClasses')
	doLast {
		layout.buildDirectory.file('plan-admission-proof-classpath.txt').get().asFile.text = sourceSets.test.runtimeClasspath.asPath
	}
}

tasks.register('planAdmissionProof', JavaExec) {
	group = 'verification'
	description = 'Runs the test-owned synthetic exact-plan consumer: config.json reference.json evidence-directory.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.zoop.ai.PlanAdmissionProof'
}
