name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-config:
    name: public-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Validate Actions syntax against actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate public configuration, contracts, generated documents and secrets
        run: make public-check tooling-test
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/repo_checks.py pr-title

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - run: make web-install web-typecheck web-test web-build

  app-web:
    name: app-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.34.6'
          run_install: false
          package_json_file: web/package.json
      - name: Production web (root web/) frozen install, lint, format check, build and Vitest
        run: make app-web-install app-web-lint app-web-format-check app-web-build app-web-test

  ai-pipeline-tests:
    name: ai-pipeline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install the pipeline runtime (public dependencies only, no private Git access or token)
        run: make pipeline-install
      - name: Offline pipeline tests (native replay only, no model token, provider call or real state)
        run: make pipeline-test

  ai-pipeline-smoke:
    name: ai-pipeline-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install the pipeline runtime (public dependencies only, no private Git access or token)
        run: make pipeline-install
      - name: Actual pipeline CLI smokes (native replay only, no model token, provider call or real state)
        run: make pipeline-smoke

  ai-pipeline:
    name: ai-pipeline
    if: always()
    needs: [ai-pipeline-tests, ai-pipeline-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require pipeline tests and CLI smokes
        env:
          TESTS_RESULT: ${{ needs.ai-pipeline-tests.result }}
          SMOKE_RESULT: ${{ needs.ai-pipeline-smoke.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$SMOKE_RESULT" = success

  ai-worker:
    name: ai-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Bootstrap worker's own locked runtime and test tools
        run: make worker-install
      - name: Offline worker tests (no model token or external data)
        run: make worker-test worker-schema-check
      - name: Korean verification authored-control gate (actual installed CLI, loopback only, no model token)
        run: make evaluation-verification-check
      - name: Validate portable authored contract fixture
        run: python ai/worker/scripts/validate_contracts.py

  ai-service:
    name: ai-service
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Bootstrap the service's own locked runtime and the test-only worker (public dependencies, no token)
        run: make service-install
      - name: Offline service tests (4 workers), real loopback smoke and internal OpenAPI drift (no model token, external network or real state)
        run: make service-test service-smoke service-openapi-check

  api-container:
    name: api-container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build API container without AWS credentials
        run: |
          docker build \
            --file api/Dockerfile \
            --tag "zoop-api:ci-${GITHUB_SHA}" \
            api
  ai-container:
    name: ai-container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build AI container without AWS credentials
        run: |
          docker build \
            --file ai/Dockerfile \
            --tag "zoop-ai:ci-${GITHUB_SHA}" \
            ai

  api-tests:
    name: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      company-postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: company_test
          POSTGRES_DB: zoop_company_test_19
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U company_test -d zoop_company_test_19"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21 (fail instead of falling back to another JDK)
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Java tests (foundation + AI client against in-process stub servers; no DB, no Python, no secret) and application assemble
        run: make api-test api-build
      - name: Recorded team briefing replay on its own throwaway DB (no model or price calls)
        run: python3 scripts/briefing_team_demo.py --api-only --once --api-port 0 --web-port 0
      - name: Company catalog PostgreSQL migrations and search integration tests
        env:
          ZOOP_COMPANY_TEST_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
        run: ./api/gradlew -p api companyIntegrationTest --console=plain
      - name: Authentication PostgreSQL integration tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
          DB_USERNAME: company_test
          DB_PASSWORD: ''
        run: ./api/gradlew -p api authIntegrationTest --console=plain
      - name: Briefing PostgreSQL migrations and real HTTP integration tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
          DB_USERNAME: company_test
          DB_PASSWORD: ''
        run: ./api/gradlew -p api briefingIntegrationTest --console=plain
      - name: Local briefing replay PostgreSQL import and HTTP tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_briefing_replay_test
          DB_USERNAME: company_test
          DB_PASSWORD: ''
        run: |
          docker exec "${{ job.services.company-postgres.id }}" createdb -U company_test zoop_briefing_replay_test
          ./api/gradlew -p api briefingReplayIntegrationTest --console=plain
      - name: Bootstrap the ai/service runtime and installed zoop-ai for the real gate (public dependencies, no token)
        run: make service-install
      - name: Real Java client -> ai/service -> zoop-ai replay gate (synthetic in-memory credentials, no model call, no PostgreSQL)
        run: make api-ai-smoke
      - name: Real Java chat adapters -> ai/service -> zoop-ai-chat replay gate (authored synthetic fixture, no model call, no PostgreSQL)
        run: make api-ai-chat-smoke

  api-graph-smoke:
    name: api-graph-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      company-postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: company_test
          POSTGRES_DB: zoop_company_test_19
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U company_test -d zoop_company_test_19"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Build the application jar for the graph handoff import smoke
        run: make api-build
      - name: Bootstrap the ai/pipeline runtime for the graph handoff import smoke (public dependencies, no token)
        run: make pipeline-install
      - name: Create a dedicated empty database for the graph handoff import smoke (the shared test database is never reused)
        env:
          PG_CONTAINER: ${{ job.services.company-postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U company_test -d zoop_company_test_19 -c 'CREATE DATABASE zoop_graph_import_smoke'
      - name: Real installed zoop-ai-handoff/-ingest -> built jar -> PostgreSQL graph handoff import smoke (synthetic, no model call, no activation)
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_graph_import_smoke
          DB_USERNAME: company_test
          DB_PASSWORD: ci-trust-auth-unused
          GRAPH_IMPORT_PSQL_CONTAINER: ${{ job.services.company-postgres.id }}
          GRAPH_IMPORT_DB_USER: company_test
          GRAPH_IMPORT_DB_NAME: zoop_graph_import_smoke
        run: make api-graph-handoff-import-smoke

  api:
    name: api
    if: always()
    needs: [api-tests, api-graph-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require API tests and graph handoff smoke
        env:
          TESTS_RESULT: ${{ needs.api-tests.result }}
          GRAPH_RESULT: ${{ needs.api-graph-smoke.result }}
        run: |
          test "$TESTS_RESULT" = success
          test "$GRAPH_RESULT" = success
  required-ci:
    name: required-ci
    if: always()
    needs:
      - public-config
      - web
      - app-web
      - ai-pipeline-tests
      - ai-pipeline-smoke
      - ai-pipeline
      - ai-worker
      - ai-service
      - api-container
      - api-tests
      - api-graph-smoke
      - api
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to pass, never skip a missing prerequisite
        env:
          PUBLIC_RESULT: ${{ needs.public-config.result }}
          WEB_RESULT: ${{ needs.web.result }}
          APP_WEB_RESULT: ${{ needs.app-web.result }}
          AI_PIPELINE_TESTS_RESULT: ${{ needs.ai-pipeline-tests.result }}
          AI_PIPELINE_SMOKE_RESULT: ${{ needs.ai-pipeline-smoke.result }}
          AI_PIPELINE_RESULT: ${{ needs.ai-pipeline.result }}
          AI_RESULT: ${{ needs.ai-worker.result }}
          AI_SERVICE_RESULT: ${{ needs.ai-service.result }}
          API_CONTAINER_RESULT: ${{ needs.api-container.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          API_GRAPH_RESULT: ${{ needs.api-graph-smoke.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          test "$PUBLIC_RESULT" = success
          test "$WEB_RESULT" = success
          test "$APP_WEB_RESULT" = success
          test "$AI_PIPELINE_TESTS_RESULT" = success
          test "$AI_PIPELINE_SMOKE_RESULT" = success
          test "$AI_PIPELINE_RESULT" = success
          test "$AI_RESULT" = success
          test "$AI_SERVICE_RESULT" = success
          test "$API_CONTAINER_RESULT" = success
          test "$API_TESTS_RESULT" = success
          test "$API_GRAPH_RESULT" = success
          test "$API_RESULT" = success
