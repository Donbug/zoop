name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-config:
    name: public-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Validate Actions syntax against actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate public configuration, contracts, generated documents and secrets
        run: make public-check tooling-test
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/repo_checks.py pr-title
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - run: make web-install web-typecheck web-test web-build
  bff:
    name: bff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private PoC registration (forks cannot receive credentials)
        env:
          POC_APP_ID: ${{ vars.POC_APP_ID }}
          POC_APP_PRIVATE_KEY: ${{ secrets.POC_APP_PRIVATE_KEY }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            printf '%s\n' 'Private PoC tests require a maintainer-reviewed same-repository PR; fork CI is not a full pass.' >&2
            exit 1
          fi
          if [ -z "$POC_APP_ID" ] || [ -z "$POC_APP_PRIVATE_KEY" ]; then
            printf '%s\n' 'Missing POC_APP_ID / POC_APP_PRIVATE_KEY. Register read-only App access to Donbug/investmate-poc; see docs/development/github-setup.md.' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: poc-token
        with:
          app-id: ${{ vars.POC_APP_ID }}
          private-key: ${{ secrets.POC_APP_PRIVATE_KEY }}
          owner: Donbug
          repositories: investmate-poc
          permission-contents: read
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install pinned dependencies with ephemeral read-only credentials
        env:
          POC_READ_TOKEN: ${{ steps.poc-token.outputs.token }}
        run: python scripts/private_poc_sync.py
      - name: Offline BFF tests (no LLM keys or real state)
        env:
          ZOOP_BRIEFING_SCHEDULER: '0'
          ZOOP_QUOTE_PROVIDER: 'off'
          ZOOP_METRICS_PROVIDER: 'off'
          ZOOP_STATE_DIR: ${{ runner.temp }}/zoop-ci-state
        run: make bff-test
      - name: Check generated worker schema and portable fixture drift
        run: make worker-contracts-check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - name: Check BFF-generated web type drift without a running server
        run: make web-install bff-types-check
  ai-worker:
    name: ai-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Bootstrap worker's own locked runtime and test tools
        run: make worker-install
      - name: Offline worker tests (no model token or external data)
        run: make worker-test WORKER_PYTHON=prototype/ai-worker/.venv/bin/python
      - name: Validate portable authored contract fixture
        run: python prototype/ai-worker/scripts/validate_contracts.py
  required-ci:
    name: required-ci
    if: always()
    needs: [public-config, web, bff, ai-worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to pass, never skip a missing prerequisite
        env:
          PUBLIC_RESULT: ${{ needs.public-config.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BFF_RESULT: ${{ needs.bff.result }}
          AI_RESULT: ${{ needs.ai-worker.result }}
        run: |
          test "$PUBLIC_RESULT" = success
          test "$WEB_RESULT" = success
          test "$BFF_RESULT" = success
          test "$AI_RESULT" = success
