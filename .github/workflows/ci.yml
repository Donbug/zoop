name: CI
on:
  push:
    branches: [main]
  pull_request:
    # `edited` (title/body edits) is handled by the lightweight pr-title workflow so it never reruns the full CI.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-config:
    name: public-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: Makefile
          cache-suffix: ${{ github.job }}
      - name: Install the pinned, checksum-verified actionlint release binary (no Go module download or compile)
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate Actions syntax against actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Validate public configuration, contracts, generated documents and secrets
        run: make public-check tooling-test
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # pnpm must be on PATH before setup-node so setup-node can restore the pnpm store cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/web/pnpm-lock.yaml
      - run: make web-install web-typecheck web-test web-build
  app-web:
    name: app-web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.34.6'
          run_install: false
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Production web (root web/) frozen install, lint, format check, build and Vitest
        run: make app-web-install app-web-lint app-web-format-check app-web-build app-web-test
  bff:
    name: bff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private PoC registration (forks cannot receive credentials)
        env:
          POC_APP_ID: ${{ vars.POC_APP_ID }}
          POC_APP_PRIVATE_KEY: ${{ secrets.POC_APP_PRIVATE_KEY }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            printf '%s\n' 'Private PoC tests require a maintainer-reviewed same-repository PR; fork CI is not a full pass.' >&2
            exit 1
          fi
          if [ -z "$POC_APP_ID" ] || [ -z "$POC_APP_PRIVATE_KEY" ]; then
            printf '%s\n' 'Missing POC_APP_ID / POC_APP_PRIVATE_KEY. Register read-only App access to Donbug/investmate-poc; see docs/development/github-setup.md.' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: poc-token
        with:
          app-id: ${{ vars.POC_APP_ID }}
          private-key: ${{ secrets.POC_APP_PRIVATE_KEY }}
          owner: Donbug
          repositories: investmate-poc
          permission-contents: read
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The uv cache stays OFF here: it would hold the private investmate-poc build, and Actions caches are readable by other workflow runs.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Install pinned dependencies with ephemeral read-only credentials
        env:
          POC_READ_TOKEN: ${{ steps.poc-token.outputs.token }}
        run: python scripts/private_poc_sync.py --project prototype/bff
      - name: Install the S1 worker's own locked runtime (public dependencies, no token)
        run: make worker-install
      - name: Offline BFF tests (no LLM keys or real state)
        env:
          ZOOP_BRIEFING_SCHEDULER: '0'
          ZOOP_QUOTE_PROVIDER: 'off'
          ZOOP_METRICS_PROVIDER: 'off'
          ZOOP_STATE_DIR: ${{ runner.temp }}/zoop-ci-state
        run: make bff-test
      - name: Check generated worker schema and portable fixture drift
        run: make worker-contracts-check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: prototype/web/pnpm-lock.yaml
      - name: Check BFF-generated web type drift without a running server
        run: make web-install bff-types-check
  ai-pipeline:
    name: ai-pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/pipeline/uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install the pipeline runtime (public dependencies only, no private Git access or token)
        run: make pipeline-install
      - name: Offline pipeline tests and actual CLI smokes (native replay only, investmate is not installed; no model token, provider call or real state)
        run: make pipeline-test pipeline-smoke
  ai-worker:
    name: ai-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/worker/uv.lock
          cache-suffix: ${{ github.job }}
      - name: Bootstrap worker's own locked runtime and test tools
        run: make worker-install
      - name: Offline worker tests (no model token or external data)
        run: make worker-test worker-schema-check
      - name: Korean verification authored-control gate (actual installed CLI, loopback only, no model token)
        run: make evaluation-verification-check
      - name: Validate portable authored contract fixture
        run: python ai/worker/scripts/validate_contracts.py
  ai-service:
    name: ai-service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/service/uv.lock
          cache-suffix: ${{ github.job }}
      - name: Bootstrap the service's own locked runtime and the test-only worker (public dependencies, no token)
        run: make service-install
      - name: Offline service tests, real loopback smoke and internal OpenAPI drift (no model token, external network or real state)
        run: make service-test service-smoke service-openapi-check
  # The former single `api` job is split into four parallel jobs; together they run exactly the same gates.
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21 (fail instead of falling back to another JDK)
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      # Open-source (MIT) basic provider: caches the Gradle wrapper and dependencies; PR runs restore only, main writes.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Java tests (foundation + AI client against in-process stub servers; no DB, no Python, no secret) and application assemble
        run: make api-test api-build
  api-postgres:
    name: api-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      company-postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: company_test
          POSTGRES_DB: zoop_company_test_19
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U company_test -d zoop_company_test_19"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21 (fail instead of falling back to another JDK)
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Company catalog PostgreSQL migrations and search integration tests
        env:
          ZOOP_COMPANY_TEST_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
        run: ./api/gradlew -p api companyIntegrationTest --console=plain
      - name: Authentication PostgreSQL integration tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
          DB_USERNAME: company_test
          DB_PASSWORD: ''
        run: ./api/gradlew -p api authIntegrationTest --console=plain
      - name: Briefing PostgreSQL migrations and real HTTP integration tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_company_test_19
          DB_USERNAME: company_test
          DB_PASSWORD: ''
        run: ./api/gradlew -p api briefingIntegrationTest --console=plain
  api-ai-smoke:
    name: api-ai-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21 (fail instead of falling back to another JDK)
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/service/uv.lock
          cache-suffix: ${{ github.job }}
      - name: Bootstrap the ai/service runtime and installed zoop-ai for the real gate (public dependencies, no token)
        run: make service-install
      - name: Real Java client -> ai/service -> zoop-ai replay gate (synthetic in-memory credentials, no model call, no PostgreSQL)
        run: make api-ai-smoke
  api-graph-smoke:
    name: api-graph-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      company-postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: company_test
          POSTGRES_DB: zoop_company_test_19
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U company_test -d zoop_company_test_19"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Use the runner's preinstalled JDK 21 (fail instead of falling back to another JDK)
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || [ ! -x "${JAVA_HOME_21_X64}/bin/java" ]; then
            printf '%s\n' 'JAVA_HOME_21_X64 is not available on this runner image; the api build requires JDK 21.' >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: ai/pipeline/uv.lock
          cache-suffix: ${{ github.job }}
      - name: Assemble the application jar the import smoke runs (no tests)
        run: make api-build
      - name: Bootstrap the ai/pipeline runtime for the graph handoff import smoke (public dependencies, no token)
        run: make pipeline-install
      - name: Create a dedicated empty database for the graph handoff import smoke (the shared test database is never reused)
        env:
          PG_CONTAINER: ${{ job.services.company-postgres.id }}
        run: docker exec "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U company_test -d zoop_company_test_19 -c 'CREATE DATABASE zoop_graph_import_smoke'
      - name: Real installed zoop-ai-handoff/-ingest -> built jar -> PostgreSQL graph handoff import smoke (synthetic, no model call, no activation)
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.company-postgres.ports['5432'] }}/zoop_graph_import_smoke
          DB_USERNAME: company_test
          DB_PASSWORD: ci-trust-auth-unused
          GRAPH_IMPORT_PSQL_CONTAINER: ${{ job.services.company-postgres.id }}
          GRAPH_IMPORT_DB_USER: company_test
          GRAPH_IMPORT_DB_NAME: zoop_graph_import_smoke
        run: make api-graph-handoff-import-smoke
  required-ci:
    name: required-ci
    if: always()
    needs: [public-config, web, app-web, bff, ai-pipeline, ai-worker, ai-service, api, api-postgres, api-ai-smoke, api-graph-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to pass, never skip a missing prerequisite
        env:
          PUBLIC_RESULT: ${{ needs.public-config.result }}
          WEB_RESULT: ${{ needs.web.result }}
          APP_WEB_RESULT: ${{ needs.app-web.result }}
          BFF_RESULT: ${{ needs.bff.result }}
          AI_PIPELINE_RESULT: ${{ needs.ai-pipeline.result }}
          AI_RESULT: ${{ needs.ai-worker.result }}
          AI_SERVICE_RESULT: ${{ needs.ai-service.result }}
          API_RESULT: ${{ needs.api.result }}
          API_POSTGRES_RESULT: ${{ needs.api-postgres.result }}
          API_AI_SMOKE_RESULT: ${{ needs.api-ai-smoke.result }}
          API_GRAPH_SMOKE_RESULT: ${{ needs.api-graph-smoke.result }}
        run: |
          test "$PUBLIC_RESULT" = success
          test "$WEB_RESULT" = success
          test "$APP_WEB_RESULT" = success
          test "$BFF_RESULT" = success
          test "$AI_PIPELINE_RESULT" = success
          test "$AI_RESULT" = success
          test "$AI_SERVICE_RESULT" = success
          test "$API_RESULT" = success
          test "$API_POSTGRES_RESULT" = success
          test "$API_AI_SMOKE_RESULT" = success
          test "$API_GRAPH_SMOKE_RESULT" = success
