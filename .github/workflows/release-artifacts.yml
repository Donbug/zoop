name: release-artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-artifacts-${{ github.sha }}
  cancel-in-progress: false
jobs:
  release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restrict artifact preparation to main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require successful CI and every required job on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/require_ci.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.9.0'
          run_install: false
          package_json_file: prototype/web/package.json
      - name: Build web from the CI-verified commit
        run: make web-install web-build
      - name: Recheck allowlisted source for secrets and package with SHA-256
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.ci-run-id }}
          ARTIFACT_COMMIT: ${{ github.sha }}
          ARTIFACT_OUTPUT: ${{ runner.temp }}/zoop-artifacts
        run: |
          make secret-check
          python scripts/package_artifacts.py --root . --output "$ARTIFACT_OUTPUT" --commit "$ARTIFACT_COMMIT" --ci-run-id "$CI_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zoop-prototype-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zoop-artifacts/*.zip
            ${{ runner.temp }}/zoop-artifacts/manifest.json
            ${{ runner.temp }}/zoop-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
