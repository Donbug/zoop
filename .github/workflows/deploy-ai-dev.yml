name: Deploy AI to Dev

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new image only, or build and deploy it to ECS
        required: true
        default: stage-image
        type: choice
        options:
          - stage-image
          - deploy

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-ai-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.AI_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.AI_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.AI_ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.AI_ECS_TASK_DEFINITION }}
  ECS_CONTAINER_NAME: ${{ vars.AI_ECS_CONTAINER_NAME }}

jobs:
  deploy:
    name: Build, stage, or deploy AI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - name: Restrict image publication to main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require successful CI and every required job on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/require_ci.py

      - name: Validate deployment variables
        shell: bash
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          IMAGE_STAGE_ROLE_ARN: ${{ vars.AWS_IMAGE_STAGE_ROLE_ARN }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail

          required_variables=(
            AWS_REGION
            ECR_REPOSITORY
          )

          case "$DEPLOY_OPERATION" in
            stage-image)
              required_variables+=(
                IMAGE_STAGE_ROLE_ARN
              )
              ;;
            deploy)
              required_variables+=(
                DEPLOY_ROLE_ARN
                ECS_CLUSTER
                ECS_SERVICE
                ECS_TASK_DEFINITION
                ECS_CONTAINER_NAME
              )
              ;;
            *)
              echo "::error::Unsupported deployment operation: $DEPLOY_OPERATION"
              exit 1
              ;;
          esac

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::$variable_name is not configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials for image staging
        if: ${{ inputs.operation == 'stage-image' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_STAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: zoop-ai-stage-${{ github.run_id }}

      - name: Configure AWS credentials for ECS deployment
        if: ${{ inputs.operation == 'deploy' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: zoop-ai-deploy-${{ github.run_id }}

      - name: Require an active ECS service for deployment
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          service_count="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'length(services)' \
              --output text
          )"

          if [ "$service_count" != "1" ]; then
            echo "::error::The ECS service could not be found."
            exit 1
          fi

          desired_count="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].desiredCount' \
              --output text
          )"

          if [ -z "$desired_count" ] || [ "$desired_count" = "None" ]; then
            echo "::error::The ECS service desired count could not be determined."
            exit 1
          fi

          if [ "$desired_count" -lt 1 ]; then
            echo "::error::ECS desired count is 0. Activate the service through the approved Terraform procedure before deployment."
            exit 1
          fi

          echo "ECS service desired count: $desired_count"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - name: Build AI image from the CI-verified commit
        id: build-image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_COMMIT: ${{ github.sha }}
          # Each publication builds a run-specific immutable tag; a SHA tag alone is not build provenance.
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          tagged_image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --file ai/Dockerfile \
            --label "org.opencontainers.image.revision=$IMAGE_COMMIT" \
            --tag "$tagged_image" \
            ai

          docker push "$tagged_image"

          lookup_error="$(mktemp)"

          trap 'rm -f "$lookup_error"' EXIT

          lookup_image_digest() {
            : > "$lookup_error"

            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              2>"$lookup_error"
          }

          image_digest=""

          for attempt in $(seq 1 10); do
            set +e
            candidate_digest="$(lookup_image_digest)"
            lookup_status=$?
            set -e

            if [ "$lookup_status" -eq 0 ]; then
              if [[ "$candidate_digest" != sha256:* ]]; then
                cat "$lookup_error" >&2
                echo "::error::ECR lookup succeeded but returned an invalid image digest."
                exit 1
              fi

              image_digest="$candidate_digest"
              break
            fi

            if ! grep -q "ImageNotFoundException" "$lookup_error"; then
              cat "$lookup_error" >&2
              echo "::error::ECR image lookup failed after the image push."
              exit "$lookup_status"
            fi

            echo "Waiting for the pushed image digest: attempt $attempt/10"
            sleep 2
          done

          if [[ "$image_digest" != sha256:* ]]; then
            echo "::error::Could not resolve the ECR image digest."
            exit 1
          fi

          digest_image="$ECR_REGISTRY/$ECR_REPOSITORY@$image_digest"

          echo "Resolved image: $digest_image"
          echo "image=$digest_image" >> "$GITHUB_OUTPUT"
          echo "tagged-image=$tagged_image" >> "$GITHUB_OUTPUT"
          echo "commit=$IMAGE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        if: ${{ inputs.operation == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: Render AI task definition
        if: ${{ inputs.operation == 'deploy' }}
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy AI to Amazon ECS
        if: ${{ inputs.operation == 'deploy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Write workflow summary
        shell: bash
        env:
          DEPLOY_OPERATION: ${{ inputs.operation }}
          RESOLVED_IMAGE: ${{ steps.build-image.outputs.image }}
          IMAGE_COMMIT: ${{ steps.build-image.outputs.commit }}
          TAGGED_IMAGE: ${{ steps.build-image.outputs.tagged-image }}
          CI_RUN_ID: ${{ steps.ci.outputs.ci-run-id }}
          CI_RUN_ATTEMPT: ${{ steps.ci.outputs.ci-run-attempt }}
        run: |
          {
            echo "## AI Dev workflow result"
            echo
            echo "- Operation: \`$DEPLOY_OPERATION\`"
            echo "- Main commit: \`$IMAGE_COMMIT\`"
            echo "- CI run / attempt: \`$CI_RUN_ID\` / \`$CI_RUN_ATTEMPT\`"
            echo "- Image workflow run / attempt: \`$GITHUB_RUN_ID\` / \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Immutable tag: \`$TAGGED_IMAGE\`"
            echo "- Image: \`$RESOLVED_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
