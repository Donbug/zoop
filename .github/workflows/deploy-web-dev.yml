name: Deploy Web to Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy web
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      WEB_BUCKET_NAME: zoop-dev-web-512138915880
      CLOUDFRONT_DISTRIBUTION_ID: E2WIGGJBK20K7J

    steps:
      - name: Checkout the CI-verified main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::$variable_name is not configured in the dev environment."
              exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.34.6'
          run_install: false
          package_json_file: web/package.json

      - name: Build the production web bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Write immutable deployment metadata
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          printf '{\n  "gitSha": "%s",\n  "deployedAtUtc": "%s"\n}\n' \
            "$RELEASE_SHA" "$deployed_at" > web/dist/release.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: zoop-web-deploy-${{ github.run_id }}

      - name: Publish web files
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync web/dist "s3://$WEB_BUCKET_NAME" --delete
          aws s3 cp web/dist/index.html "s3://$WEB_BUCKET_NAME/index.html" \
            --content-type text/html \
            --cache-control 'no-cache,no-store,must-revalidate'
          aws s3 cp web/dist/release.json "s3://$WEB_BUCKET_NAME/release.json" \
            --content-type application/json \
            --cache-control 'no-cache,no-store,must-revalidate'

      - name: Invalidate and wait for CloudFront
        id: cloudfront
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
          echo "invalidation-id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          INVALIDATION_ID: ${{ steps.cloudfront.outputs.invalidation-id }}
        run: |
          {
            echo '## Web Dev deployment'
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Bucket: \`$WEB_BUCKET_NAME\`"
            echo "- CloudFront invalidation: \`$INVALIDATION_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
