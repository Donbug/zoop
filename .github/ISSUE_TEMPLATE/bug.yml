name: Bug / 오류 보고
description: 합성 입력으로 재현하고 기대 결과와 실제 결과를 구분합니다.
title: 'fix: '
body:
  - type: markdown
    attributes:
      value: '민감한 보안 취약점은 공개 이슈 대신 저장소 관리자가 정한 비공개 채널로 전달하세요. 실제 .env, 인증 헤더, 개인정보, 사용자 로그를 첨부하지 마세요.'
  - type: input
    id: traceability
    attributes:
      label: FS / NFS / WBS / screen IDs
      description: 'ID·현재 기능/업무명·BE/FE 역할·최신 고정본 파일/시트/행을 적으세요. 번호 재사용은 의미로 구분하고 모르는 항목은 확인 필요라고 적으세요.'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and environment
      description: '커밋 SHA, 본개발(루트 web/, api/, ai/ 등)/프로토타입과 실제 경로, 앱/도구 버전, 최소 재현 명령·합성 입력을 적으세요. 현재 /api와 목표 /api/v1을 구분합니다.'
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Expected vs actual
      description: '기대 결과와 관측한 오류를 따로 적으세요. 추론과 실제 실행 증거를 구분하세요.'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and recovery
      description: '수정 후 결과, 회귀 테스트, 사용자 복구 방법, 롤백 기준을 적으세요.'
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Actual vs fixture
      options:
        - 'actual: 실제 출처/실행 결과'
        - 'fixture: 합성 재현 입력'
        - 'mixed: 항목별 구분 필요'
        - 'none: 데이터 없음'
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: License, rights, privacy and affected contracts
      description: '사용 권한·민감정보 제거 여부, docs/api 정본의 operationId와 영향받는 producer/consumer·생성물, 필요한 리뷰 역할을 적으세요.'
    validations:
      required: true
