name: Feature / 기능 변경
description: 요구사항과 수용 기준을 연결하고 실제 데이터와 예시를 구분합니다.
title: 'feat: '
body:
  - type: markdown
    attributes:
      value: '비밀 키, 개인정보, 실제 인증 헤더를 붙이지 마세요. 담당자와 labels는 등록 후 팀에서 지정합니다.'
  - type: input
    id: traceability
    attributes:
      label: FS / NFS / WBS / screen IDs
      description: 'ID·현재 기능/업무명·BE/FE 역할·최신 고정본 파일/시트/행을 함께 적으세요. 재사용된 번호는 현행/이력 의미를 구분하고, 해당 사항이 없으면 사유를 적으세요.'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and scope
      description: '사용자 문제, 본개발/프로토타입/계약/문서 중 작업 범위, 실제 변경 경로와 제외 범위를 적으세요. 본개발은 루트 web/, api/, ai/, contracts/, infra/를 사용하며 첫 실제 기능에서 CONTRIBUTING의 생성 조건을 충족합니다.'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: '정상·실패·복구 조건에서 관측할 결과와 검증 명령/입력을 적으세요.'
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contract and affected apps
      description: 'docs/api 정본, stable operationId, web/API/AI producer·consumer·생성물의 영향을 적으세요. 루트 contracts/는 향후 생성물 배포용이며 두 번째 정본이 아닙니다. 현재 /api와 목표 /api/v1을 구분하고 전환 시 전체 caller를 이행합니다.'
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Actual vs fixture
      options:
        - 'actual: 실제 출처이며 사용 권한을 확인해야 합니다.'
        - 'fixture: 합성 데이터이며 실제 결과로 주장하지 않습니다.'
        - 'mixed: 실제 출처와 합성 데이터를 항목별로 구분합니다.'
        - 'none: 데이터를 사용하지 않습니다.'
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: License, rights and privacy
      description: '뉴스·문서·이미지·폰트·의존성의 출처와 권한, 개인정보·보존·모델 전송 경계를 적으세요. 없으면 해당 없음이라고 적으세요.'
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: Tests, reviewer and rollback
      description: '검증 명령·입력·결과, 리뷰 역할, 롤백 기준을 적으세요. 새 본개발 앱은 실제 테스트·루트 runner·CI gate 연결을 포함하며 prototype import/DB 공유를 하지 않습니다. 실제 handle은 팀 확인 뒤 지정합니다.'
    validations:
      required: true
