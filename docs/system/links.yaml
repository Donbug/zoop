schemaVersion: 1
policy: "이 파일은 사람이 편집한다. import_sources.py는 이 파일과 openapi.yaml을 변경하지 않는다. 존재하는 ID만 연결하며 원본 ID 오류를 별칭으로 고치지 않는다. API 연결의 정본은 openapi.yaml의 x-zoop이고 중복 목록을 두지 않는다."
apiContract: "docs/api/openapi.yaml"
featureDecisions:
  "FS???":
    apiDisposition: "계약 미정"
    reason: "브리핑 목록·검색 상세의 잘못된 원본 ID다. 팀 정정 전 명세 번호를 추정하거나 부여하지 않는다. 기존 회차/목록 API 연결과 구분한다."
  "FS0??":
    apiDisposition: "계약 미정"
    reason: "재무 상세 행의 잘못된 원본 ID다. FS042로 추정 치환하지 않는다. 목표 재무 API는 목차 FS042에 연결했다."
  FS050:
    apiDisposition: "계약 미정"
    reason: "AI v2 새 대화 정의와 기존 FS050-01/-02 의미가 다르다. 채택/이전 선언 없이 같은 번호로 통합하지 않는다."
  NFS010:
    apiDisposition: "API 불필요"
    reason: "브라우저·해상도·모바일 지원은 클라이언트/배포 검증 계약이다. 서버 동작 수치가 정해지면 관련 작업에 연결한다."
    screenIds:
      - "M-RULE-01"
      - "M-GRP-01"
      - "M-COM-01"
  NFS011:
    apiDisposition: "API 불필요"
    reason: "키보드·스크린리더·대비 등 화면 접근성은 화면 구현과 점검표의 책임이다."
    screenIds:
      - "STATE-01"
      - "M-RULE-01"
  NFS007:
    apiDisposition: "계약 미정"
    reason: "측정 부하·데이터 규모·표본·성능 목표값이 미정이다. 계약 검증 WBS에 연결하고 서버 성능 수치를 만들어내지 않는다."
    wbsIds:
      - "6.10.4"
  FS044:
    apiDisposition: "기존 API로 지원"
    reason: "카메라·선택·탭·스크롤 복원은 클라이언트 상태다. 기업/그래프 API가 필요한 조회 조건과 버전을 제공하며 복원 전용 서버 API는 만들지 않는다."
    screenIds:
      - "D-COM-03"
      - "D-COM-04"
      - "D-COM-05"
      - "D-COM-06"
      - "M-COM-02"
  FS021:
    apiDisposition: "기존 API로 지원"
    reason: "D-SEN-01은 디자인시스템의 판정 예시이며 실제 모델 호출이나 데모 판정값이 아니다. 문서×기업의 nullable 판정은 기존 문서/근거 API 계약으로 연결하고 예시 전용 API는 만들지 않는다."
    screenIds:
      - "D-SEN-01"
  FS030:
    apiDisposition: "기존 API로 지원"
    reason: "D-SEN-02는 디자인시스템의 회차 판단 예시다. 데모 발행본에는 outlook 값이 없으며 기존 브리핑 API가 발행 시 고정할 판단과 근거 이슈를 제공하는 목표 계약이다."
    screenIds:
      - "D-SEN-02"
