    reason: "개발용 모의 IdP 동의 흐름은 정식 인증 계약에서 제외한다."
  -
    method: "GET"
    path: "/api/health"
    reason: "프로토타입 상태 점검 경로다. 정식 readiness/liveness 계약은 배포 설계에서 별도 확정한다."
  -
    method: "GET"
    path: "/api/briefings/{id}/evaluations"
    reason: "프로토타입에서도 미제공인 가격/예측 평가 자리다. 투자 예측을 목표 계약에 넣지 않는다."
knownDifferences:
  -
    id: "PROTOTYPE_STORAGE"
    reason: "스냅샷 파일·SQLite 상태 디렉터리·데모 재생 스크립트·PoC 샌드박스 명령은 구현 환경 차이이며 정식 API 필드가 아니다."
  -
    id: "AUTH_PROPOSAL"
    reason: "정식 서버의 쿠키 세션·CSRF·/api/v1·오류 코드·불투명 커서는 사용자 잠정 채택/시연 기준이다. 팀 최종 승인·운영값 확정·구현 완료를 뜻하지 않는다."
