  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 83
    rowUnit: xlsx-row
  detailRange: A105:B117
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 107
      rowUnit: xlsx-row
    fields:
      기능명: AI 사용량·비용·오류 통계
      기능 설명: 관리자가 챗봇·뉴스 분석·브리핑별 요청 작업, 실제 AI 호출·재시도, 성공·실패와 처리 시간·사용량을 구분해 운영 현황을
        확인한다. 비용을 제공할 경우 실제 확인 비용과 추정 비용을 구분하고 자료가 없는 값을 0으로 대체하지 않는다.
      선행조건: 승인된 관리자가 AI 운영 통계를 조회한다.
      입력값: 기능·작업·실행·실제 AI 호출의 식별 정보, 요청·검증·저장/완료 상태와 실패 단계, 각 단계의 시각·처리 시간, 확보된 사용량과
        단위, 실제 비용 자료 또는 추정에 사용한 가격·적용 시점·통화·산식, 조회 기간·집계 기준 시점.
      입력·검증 규칙: '관리자 조회 권한을 확인한다. 같은 작업의 재전송·상태 조회·저장 결과 회수를 새 AI 호출로 세지 않는다. 작업 수와
        실제 호출 수를 구분하고 실제 수행한 재시도 호출은 호출 단위로 반영한다.

        기능별로 작업·호출·검증·저장/완료의 상태와 실패 단계를 구분한다. 모델 응답 성공을 최종 결과 저장 성공으로 간주하지 않는다. 처리
        중·보류·상태 미확인을 성공·실패에 임의 배정하지 않는다.

        같은 호출 기록을 중복 집계하지 않는다. 기간 기준 시각·시간대·경계, 처리 시간의 시작/끝과 집계 단위가 정의된 범위에서 집계하고
        기준을 표시한다.

        사용량은 확보된 단위별로 제공한다. 실제 확인 비용은 근거 자료와 범위를, 추정 비용은 적용 가격·시점·통화·산식을 구분해 표시한다.
        서로 다른 단위·통화를 근거 없이 합산하지 않는다.

        실패·재시도 호출도 확보된 사용량·비용을 반영하고 실패라는 이유로 무료로 간주하지 않는다. 미확보·자료 누락·집계 실패를 0으로 대체하지
        않는다.'
      처리 절차 및 분기: '1. 관리자 권한·조회 기간과 지표별 집계 정의를 확인한다.

        2. 기능·작업·실제 호출의 식별 정보를 대조해 중복 기록을 제외하고 각 단계의 상태·시간·사용량을 집계한다.

        3. 확보된 비용은 실제/추정과 산정 근거를 구분해 표시한다. 자료가 일부이면 확인된 범위와 누락을 함께 표시한다.

        4. 조회 기간·단위·집계 기준 시점 및 정상 0·미확보·집계 불가를 구분하여 제공한다.'
      정상 결과: 관리자가 기능별 작업·실제 호출·실패 단계·처리 시간·사용량을 집계 기준과 함께 확인한다. 비용의 실제/추정 여부와 확인 범위·누락을
        구분할 수 있다.
      예외 처리: '권한 없음: 운영 통계를 제공하지 않는다.

        정상 조회에서 대상 작업·호출 없음: 해당 건수는 0으로 표시한다. 비용 0은 해당 범위의 비용 근거가 실제로 0을 확인한 경우에만
        표시한다.

        비용·사용량 자료 없음: 미확보로 표시하며 실패 호출의 비용도 0으로 단정하지 않는다.

        일부 호출 기록 누락·집계 실패: 확인 가능한 범위만 부분 집계로 표시하고 누락/실패 항목을 집계 불가로 구분한다. 부분값을 전체값으로
        표시하지 않는다.

        기간·시간·사용량·비용 산정 정의 미확정: 해당 지표는 기준 미정 또는 산정 불가로 안내한다.'
      수용 기준: '1. 동일 조건의 원천 작업·실제 호출 기록과 집계값이 일치하고 중복 기록·상태 조회·저장 결과 회수로 호출 수가 늘지 않는다.

        2. 실제 재시도 호출은 반영되고 저장만 재시도한 작업은 AI 호출을 추가하지 않는다. 모델 응답 성공과 결과 저장 실패가 구분된다.

        3. 처리 시간·기간·사용량의 정의와 단위가 표시되고 실제/추정 비용·통화·산정 범위가 구분된다.

        4. 실패 호출의 확보된 사용량·비용도 누락하지 않으며, 미확보·부분 누락·집계 실패를 0 또는 전체값으로 표시하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 작업과 실제 호출·재시도 및 실패 단계 구분, 단위/기간 기준 표시, 실제/추정 비용·누락·정상
        0 구분.

        [확인 필요: 집계 기간·시간대·기준 시각·경계, 처리 시간 정의·집계 방식과 사용량 단위 결정 필요]

        [확인 필요: 실제 비용 자료의 범위, 가격 적용 시점·통화·추정 산식·필요한 환산 방식 결정 필요]

        [확인 필요: 운영 기록의 허용 범위·보존 정책 및 부분 누락 복구 방식 결정 필요]'
