  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 93
      rowUnit: xlsx-row
    fields:
      기능명: 실패한 이슈 분석·반영 작업 재시도
      기능 설명: 관리자가 실패한 이슈 분석·저장·공개 반영 작업의 재시도를 요청하면 현재 상태·실패 단계·재시도 허용 여부를 확인하고 허용된
        실패 단계만 복구한다. 상태 조회나 중복 요청을 새 분석·공개 실행으로 처리하지 않는다.
      선행조건: 관리자가 이슈 분석·반영 과정의 실패 로그를 확인하고 해당 작업의 재시도를 요청한다.
      입력값: 실패 작업·분석 회차·결과 버전·실행 및 재시도 요청의 식별 정보, 현재 상태·실패 단계/사유, 보존된 원문·중간 결과·검증 결과와
        근거 참조, 현재 공개 버전·공개 제외 상태.
      입력·검증 규칙: '현재 관리자 재시도 권한·대상 범위를 확인한다. 기존 작업·실행 상태를 정상 조회해 실패 단계와 이전 실행 종료를 확인한
        뒤 재시도 가능 여부를 판단한다. 조회 실패·응답 미수신을 실패 확정으로 취급하지 않는다.

        처리 중이면 새 실행을 시작하지 않고 완료이면 기존 결과를 확인한다. 같은 요청의 재전송·동시 요청으로 유효 실행·저장·공개가 중복되지
        않게 한다.

        보존된 원문·중간 결과를 사용해 허용된 실패 단계만 복구한다. 검증된 결과의 저장 또는 조회 반영만 실패했다면 해당 단계만 재시도하고
        분석·모델 호출을 반복하지 않는다.

        검증 실패·근거 부족·수동 거부를 재시도로 우회해 공개하지 않는다. 재시도 결과도 현재 검증·근거 연결·공개 조건을 충족해야 한다.

        늦은 이전 회차가 최신 공개 버전을 되돌리지 않으며 미반영 유효 결과는 현재 상태를 확인해 후속 반영 대상으로 검토한다. 오류별 허용
        범위·횟수·간격은 임의로 정하지 않는다.'
      처리 절차 및 분기: '1. 관리자가 실패 작업과 복구할 단계를 확인하고 재시도를 요청한다.

        2. 서버가 현재 권한·작업/실행 상태·기존 요청 처리 여부·보존 결과와 재시도 허용 조건을 확인한다.

        3. 처리 중·완료·중복 요청이면 기존 상태/결과를 반환한다. 상태가 불명확하거나 허용되지 않으면 실행하지 않는다.

        4. 확정된 허용 실패 단계만 복구하고 새 실행의 진행·검증·저장·실제 공개 반영 상태를 구분해 기록한다.

        5. 일부만 복구됐으면 남은 실패를 유지한다. 공개 가능한 결과만 두 화면의 공통 공개 전환 절차로 전달한다.'
      정상 결과: 허용된 실패 단계의 복구 결과와 남은 실패·보류 상태를 확인한다. 중복 실행·공개, 검증 우회, 최신 공개 버전의 되돌림이
        발생하지 않는다.
      예외 처리: '관리자 권한 없음·재시도 허용 기준 미확정 또는 불충족: 실행하지 않고 제한 사유를 안내한다.

        기존 작업 처리 중·이미 완료: 중복 실행하지 않고 현재 상태 또는 기존 결과를 제공한다.

        상태 확인 실패·이전 실행 종료 불명: 재실행하지 않고 상태 재확인을 안내한다.

        필요한 보존 결과·근거 없음: 복구 불가 또는 추가 검토로 표시하고 임의로 전체 분석을 재생성하지 않는다.

        재시도 후 실패·부분 복구: 실패 단계와 결과별 상태를 유지하고 전체 성공으로 표시하지 않는다. 무한 자동 재시도를 수행하지 않는다.

        더 최신 공개 버전 존재: 이전 회차로 덮지 않고 현재도 유효한 미반영 결과의 후속 반영을 검토한다.'
      수용 기준: '1. 처리 중·완료·동시/중복 요청에서 중복 실행·저장·공개가 발생하지 않는다.

        2. 권한 없음, 상태 조회 실패, 이전 실행 종료 불명, 재시도 허용 기준 불충족이면 실행하지 않는다.

        3. 저장·조회 반영만 실패한 작업의 복구로 분석·모델 호출 횟수가 늘지 않는다.

        4. 재시도해도 검증 실패·근거 부족·거부 결과가 공개되지 않으며 부분 복구를 전체 성공으로 표시하지 않는다.

        5. 늦은 이전 회차가 최신 공개 버전을 되돌리지 않고 유효한 미반영 결과가 후속 검토에서 유실되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 확정된 허용 실패 단계만 복구, 상태 불명 시 실행 차단, 저장/조회 반영만 복구할 때 모델 호출
        금지, 중복·공개 우회 방지.

        [확인 필요: 오류 유형별 재시도 허용 범위·재실행 단계·운영 권한과 최대 횟수·간격 결정 필요]

        [확인 필요: 보존 결과가 없거나 반복 실패한 경우의 수동 복구·종료 기준 결정 필요]'
