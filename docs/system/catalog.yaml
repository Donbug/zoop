- id: '70'
  group: 공통
  section: 데이터관리
  title: 신규 경제뉴스 정기 수집 및 이슈 분석
  description: 분석시스템은 한국 시간 기준 매시 05분과 35분에 신규 경제뉴스 수집을 시작해야 한다. 직전 성공한 수집의 기준 시점을
    바탕으로 미수집 뉴스를 확보하고 중복 기사를 제외해야 한다. 사건을 추출하여 기존 이슈에 연결하거나 신규 이슈를 생성하고, 관련 기업·영향
    경로·원문 근거를 분석해야 한다. 자동 검증 기준을 통과한 결과만 공개 대상으로 포함해야 한다.
  priority: P1
  status: 팀 검토 전
