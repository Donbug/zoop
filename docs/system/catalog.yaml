    fields:
      기능명: 회원 차단·차단 해제
      기능 설명: 관리자가 특정 회원의 차단 또는 차단 해제를 요청하면 시스템은 관리자 권한과 대상 회원을 확인하여 허용된 관리 조치를 적용한다.
      선행조건: 승인된 관리자가 대상 회원을 선택하고 차단 또는 차단 해제를 요청한다.
      입력값: 대상 회원 식별자, 검토한 현재 차단 상태, 차단 또는 차단 해제 선택, 조치 요청 식별 정보, 승인된 정책에서 요구하는 경우의
        사유·근거.
      입력·검증 규칙: '서버에서 현재 차단·해제 권한과 대상 범위를 확인하고 선택 회원·현재 상태를 대조한다. 저장 시점에 다른 관리자의 조치로
        상태가 바뀌면 이전 화면의 결정을 그대로 적용하지 않는다.

        조치를 적용할 회원과 선택 회원이 일치해야 하며 처리 결과도 해당 회원에 연결한다. 대상 변경 후 이전 응답을 현재 회원의 결과로 표시하지
        않는다.

        같은 요청의 재전송은 기존 처리 여부·확정 상태를 확인하여 중복 변경하지 않는다. 동일 요청 식별 정보에 다른 조치 내용이 오면 충돌로
        처리한다.

        차단·해제를 회원 삭제로 확대하지 않는다. 차단 범위·기간·기존 세션 처리와 별도의 반복 조치 정책은 미정으로 유지한다. 미확정 정책을
        임의 적용하지 않는다.

        차단·해제의 처리자·대상 회원·조치 시각·변경 전후 상태를 기록한다. 사유의 필수 여부와 이력 보존 기간은 별도 확정한다.'
      처리 절차 및 분기: '1. 관리자가 대상 회원·현재 상태와 선택 조치를 확인하고 요청한다.

        2. 서버가 현재 관리자 권한·대상 회원·상태와 요청의 기존 처리 여부를 확인한다.

        3. 권한·상태가 유효하고 승인된 정책에서 허용한 조치이면 적용한다. 같은 요청의 재전송이면 기존 처리 결과를 확인한다.

        4. 저장된 확정 상태와 처리자·대상·시각·변경 전후 상태 기록을 확인한 뒤 성공으로 표시한다. 상태 변경·처리 결과 불명은 재확인
        대상으로 구분한다.'
      정상 결과: 선택한 회원에 허용된 차단 또는 차단 해제가 적용되고 저장된 확정 상태를 확인한다. 조회·재전송만으로 별도의 반복 조치나 회원
        삭제가 발생하지 않는다.
      예외 처리: '관리자 권한 없음·허용 범위 밖: 변경을 거절한다.

        정상 조회로 대상 회원 없음 확인: 대상을 찾을 수 없음을 안내한다. 조회 장애를 회원 없음으로 단정하지 않는다.

        대상 상태가 검토 이후 변경됨: 오래된 결정을 적용하지 않고 현재 상태를 다시 확인한다.

        조치 저장 실패·응답 미수신: 성공으로 표시하지 않고 요청 처리 여부·현재 상태를 먼저 확인한다. 확인 실패를 미처리로 간주해 조치를
        반복하지 않는다.

        이미 같은 상태인 별도 신규 조치: 반복 조치 정책 확정 전에는 기간 연장 등 추가 효과를 임의 적용하지 않는다. 같은 요청 재전송은
        중복 처리하지 않는다.'
      수용 기준: '1. 선택 회원과 실제 변경 대상이 일치하고 현재 차단·해제 권한을 서버에서 검사한다.

        2. 동시 상태 변경 시 오래된 조치를 적용하지 않으며, 같은 요청 재전송으로 조치가 중복 적용되지 않는다.

        3. 저장 실패·응답 미수신을 성공으로 표시하지 않고 현재 처리 상태를 확인한다.

        4. 차단·해제가 회원 삭제로 처리되지 않으며 미확정 기간·세션·반복 효과가 임의 적용되지 않는다.

        5. 대상을 바꾼 뒤 이전 회원의 응답이 현재 회원의 상태를 덮지 않는다.

        6. 차단·해제의 처리자·대상 회원·조치 시각·변경 전후 상태가 기록된다. 신규 로그인·기존 세션·진행 중 작업·기존 결과 조회와 해제
        시 효과를 확정·검증하기 전에는 구현 완료로 인정하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 권한·대상/상태 확인, 저장 성공 후 확정, 통신 재전송 중복 방지와 결과 불명 시 재확인.

        [확인 필요: 차단 범위·기간 및 신규 로그인·기존 세션·진행 중 작업·기존 결과 조회·해제 시 효과 결정 필요. 조치 사유/근거의
        필수 여부와 이력 보존 기간은 미정]

        [확인 필요: 차단·해제 권한 배정·대상 범위 및 이미 같은 상태에 대한 별도 반복 조치의 허용 여부/효과 결정 필요]'
