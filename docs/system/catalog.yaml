        2. 값·변화율·관측 시각·출처를 저장한다.

        3. 정상·지연·미제공 상태로 구분해 표시한다.'
      정상 결과: KOSPI, KOSDAQ, 원/달러 환율의 값·변화·관측 시각·출처가 표시된다.
      예외 처리: 개별 지표 미제공 시 해당 카드에 자료 미제공 표시. 지연 시 마지막 정상 값·시각과 지연 표시. 한 지표 조회 실패 시 해당
        카드만 오류·재시도 상태로 표시한다. 세 지표 모두 실패해도 나머지 브리핑은 유지한다.
      수용 기준: '1. 세 지표의 값·변화·관측 시각을 확인할 수 있다.

        2. 지연·미제공을 정상값처럼 표시하지 않는다.

        3. 핵심 이슈·확인할 사항과 주요 시장 지표가 화면에서 구분된다.'
