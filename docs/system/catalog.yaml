        판정 규칙을, 백엔드 B는 문서 ID·버전·참조 저장 계약을 담당한다.
      선행조건: FS074에서 원문과 출처·식별 정보가 저장되어 있다.
      입력값: 원문 문서 ID·버전, 제목·본문·원문 주소, 출처·발행/수정 시각, 기존 문서의 정규화 주소·내용 해시, 정제 규칙 버전.
      입력·검증 규칙: '본문 잡음 제거 후에도 근거 인용의 원문 위치를 추적할 수 있게 한다. 정제 본문을 실제 원문으로 대체하지 않는다.

        같은 공급 문서 ID·주소와 같은 내용은 중복 처리한다. 같은 ID·주소의 변경 내용은 새 버전으로 보존한다.

        같은 사건을 보도한 다른 기사는 삭제하지 않는다. 본문 누락·파싱 실패는 분석 가능한 정상 문서로 표시하지 않는다.'
      처리 절차 및 분기: '1. 출처·문서 ID·시각을 검증하고 본문을 정제한다.

        2. 기존 문서와 ID·주소·내용을 비교한다.

        3. 중복이면 기존 참조를 재사용하고 수정이면 이전 버전과 연결한다.

        4. 정제 본문과 원문 위치 대응을 FS076에 전달한다.'
      정상 결과: 중복 없는 문서 버전과 원문 인용 위치가 확보되고, 별도 보도와 수정 이력이 유지된다.
      예외 처리: '본문 미확보·파싱 실패: 사유를 기록하고 분석을 보류한다.

        중복 여부 불명: 자동 삭제하지 않고 검토 후보로 유지한다.

        저장 실패: 기존 버전은 보존하고 해당 저장 단계만 재시도한다.'
      수용 기준: '1. 같은 문서 재수집은 중복 분석 대상을 만들지 않는다.

        2. 같은 주소의 수정 내용과 같은 사건의 다른 기사가 각각 보존된다.

        3. 정제 결과의 인용이 실제 원문 구간으로 연결된다.'
      확인 필요 사항: '주소 정규화·내용 중복 판정·문서 보존 정책은 실자료 검증 후 결정한다. FS056의 사건/문서 구분을 유지한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
- id: FS076
  title: AI 사건·이슈 추출 및 이슈 후보 생성
  section: 메인그래프 v2
  priority: 미정
  status: 추가 제안 · 검토 전
  requirementIds:
  - '68'
  - '70'
  - '76'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 106
    rowUnit: xlsx-row
  detailRange: A194:B206
  change: 파이프라인 상세 추가 · FS056·FS058·FS064 연계
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 196
      rowUnit: xlsx-row
    fields:
      기능명: AI 사건·이슈 추출 및 이슈 후보 생성
      기능 설명: 정제된 뉴스·공시에서 개별 사건과 이슈 후보를 AI로 추출한다. 사건은 발생 사실 단위, 이슈는 관련 사건을 묶는 분석 주제로
        구분한다. AI가 추출 모델·프롬프트·결과 검증을, 백엔드 B가 결과 계약·작업 상태 연계를 담당한다.
      선행조건: FS075 정제 문서와 사용 가능한 원문 근거가 있고 FS064의 유효한 분석 실행이 허용된다.
      입력값: 문서 ID·버전·본문·근거 구간, 작업/실행 ID, 모델·프롬프트·스키마 버전.
      입력·검증 규칙: '사건의 주체·행위·대상·발생 시각 및 정밀도와 이슈의 제목·요약·국내/국제 후보 속성을 추출한다.

        발생 시점 미상을 발행일로 채우지 않는다. 근거 없는 국내/국제 속성은 임의 생성하지 않고 공개 전 보완·보류한다.

        각 주장에 문서 버전·원문 구간을 연결하고 추출 신뢰도와 한계를 남긴다. 후보 생성은 공개 승인이 아니다.'
      처리 절차 및 분기: '1. FS064 계약으로 승인된 문서만 분석한다.

        2. 개별 사건과 이슈 후보를 구조화한다.

        3. 형식·문서 참조·인용 구간을 검증한다.

        4. 후보 ID와 근거를 FS077에 전달한다.'
      정상 결과: 사건·이슈 후보와 요약·속성·근거·분석 버전이 생성되고, 관련 없음은 정상 제외로 구분된다.
      예외 처리: '응답 형식 오류·근거 불일치: 실패/보류로 기록한다.

        시간초과·응답 미수신: 기존 실행 상태를 먼저 확인하고 중복 호출하지 않는다.

        유효 결과의 저장만 실패: 모델 재호출 없이 저장을 복구한다.'
      수용 기준: '1. 한 문서의 복수 사건과 한 사건을 다룬 복수 문서를 구분한다.

        2. 이슈 후보의 요약과 속성이 확보된 근거 범위를 벗어나지 않는다.

        3. 미상 시각·속성은 임의 값으로 채워지지 않으며 실패·보류 후보는 공개되지 않는다.'
      확인 필요 사항: '추출 모델·평가 표본·신뢰도 기준은 검증 후 확정한다. 수치 목표나 승인 상태를 임의 확정하지 않는다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
- id: FS077
  title: 기업·이슈 Entity Linking 및 동일성 판정
  section: 메인그래프 v2
  priority: 미정
  status: 추가 제안 · 검토 전
  requirementIds:
  - '68'
