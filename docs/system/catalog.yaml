    fields:
      기능명: 기업 패널에서 이슈 영향 경로 확인
      기능 설명: 사용자가 기업 노드를 선택한 뒤 기업 패널의 관련 이슈를 선택하면 해당 이슈와 기업의 직접·간접 영향 경로, 단계별 연결 이유와
        근거를 확인한다.
      선행조건: 선택 기업의 정보 패널에 관련 이슈가 제공되어 있다.
      입력값: 기업 식별자, 패널에서 선택한 이슈 식별자, 그래프 기준 시점, 직접·간접 경로와 단계별 근거.
      입력·검증 규칙: '기업 패널에서 관련 이슈를 선택하여 진입한다. 이슈-기업 간선은 표시만 하며 직접 클릭 대상으로 사용하지 않는다.

        기업 간 간선 클릭은 별도 관계 조회 기능으로 유지한다.

        직접 경로와 중간 기업·산업·제품을 거친 경로를 구분한다.

        확인된 사실·예상 영향·반대 근거·해석 한계를 구분한다. 현재 선택 기업·이슈·기준 시점의 최신 조회만 반영한다.'
      처리 절차 및 분기: '1. 사용자가 기업 노드를 선택하여 패널을 연다.

        2. 패널의 관련 이슈 중 하나를 선택한다.

        3. 시스템은 해당 기업·이슈의 유효한 경로와 단계별 근거를 조회한다.

        4. 경로와 연결 이유를 표시하고 근거 확인이 가능하게 한다.'
      정상 결과: 선택 기업과 이슈의 경로, 단계별 연결 이유, 근거 및 해석 한계를 확인할 수 있다.
      예외 처리: '유효 경로 없음: 경로 없음 안내를 표시하고 임의 관계선을 생성하지 않는다.

        근거 부족·상충: 확보된 근거와 한계를 함께 표시한다.

        조회 실패: 선택 대상을 유지하고 경로 영역의 다시 시도를 제공한다. 다른 이슈의 이전 경로를 현재 결과로 표시하지 않는다.'
      수용 기준: '1. 기업 노드와 패널의 관련 이슈 선택으로 경로를 확인한다.

        2. 이슈-기업 간선 클릭 없이 기능을 수행할 수 있다.

        3. 이슈를 바꾼 뒤 이전 응답이 와도 새 선택의 경로를 덮지 않는다.

        4. 확인되지 않은 인과관계를 사실로 단정하지 않는다.'
      확인 필요 사항: 이번 보완 항목의 추가 미정 없음. 신규 동작은 v1.2 제안 기준이며 원본의 승인·구현 상태를 변경한 것은 아니다.
