  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 107
    rowUnit: xlsx-row
  detailRange: A208:B220
  change: 파이프라인 상세 추가 · FS056·FS058 연계
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 210
      rowUnit: xlsx-row
    fields:
      기능명: 기업·이슈 Entity Linking 및 동일성 판정
      기능 설명: 추출된 기업 표기를 기업 마스터 ID에 연결하고 사건·이슈 후보를 기존 사건·이슈와 비교하여 연결·신규 생성·보류를 결정한다.
        AI는 동일성 판정을, 백엔드 B는 안정적인 ID와 참조 정합성을 담당한다.
      선행조건: FS076 후보·근거와 기업 마스터 및 기존 사건·이슈 식별 정보가 확보되어 있다.
      입력값: 기업명·티커·거래소·별칭·문맥, 기업 마스터 ID, 사건 주체·행위·대상·시점, 이슈 주제·범위·기존 ID, 동일성 근거·신뢰도.
      입력·검증 규칙: '동명이인 기업·동일 티커의 다른 시장·자회사와 모회사를 구분한다. 기업 마스터 미일치 시 임의 기업 ID를 확정하지
        않는다.

        사건의 주체·행위·대상·시점 일치 근거와 이슈의 주제·범위 일치 근거를 별도로 판단한다. 같은 날·같은 기업이라는 이유만으로 병합하지
        않는다.

        계약 체결·해지 같은 후속 사건은 별개로 유지한다. 자동 연결 불확실 사례는 보류하며 기존 ID를 조용히 교체하지 않는다.'
      처리 절차 및 분기: '1. 기업 후보를 마스터와 비교해 단일 ID로 연결하거나 보류한다.

        2. 사건 동일성을 검증해 기존 사건 연결 또는 신규 후보를 결정한다.

        3. 이슈 주제·범위를 비교해 기존 이슈에 사건을 연결하거나 신규 이슈 ID를 발급한다.

        4. 판정 근거·별칭·원래 후보 ID 대응을 저장하고 FS078에 전달한다.'
      정상 결과: 기업·사건·이슈의 정규 ID와 후보 매핑·판정 근거가 확보된다. 복수 근거와 후속 사건은 유지된다.
      예외 처리: '동명이인·마스터 미일치·판정 충돌: 보류하고 공개 관계를 생성하지 않는다.

        동시 신규 생성: 동일성 키/제약과 재조회로 중복 ID를 방지한다.

        잘못된 연결 발견: FS081에서 영향 범위를 추적해 정정한다.'
      수용 기준: '1. 별칭 기업이 올바른 마스터 ID에 연결되고 다른 기업은 합쳐지지 않는다.

        2. 동일 사건의 복수 보도는 연결되며 후속 사건·유사 이슈는 오병합되지 않는다.

        3. 재처리·동시 처리에서도 같은 정규 대상의 중복 노드가 생성되지 않는다.'
      확인 필요 사항: '동일 이슈 기준·복수 이슈 연결 허용 범위·병합 승인/취소 정책은 FS058의 미정 사항과 함께 확정한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
- id: FS078
  title: 기업–이슈·기업–기업 관계 추출
  section: 메인그래프 v2
  priority: 미정
  status: 추가 제안 · 검토 전
  requirementIds:
  - '67'
  - '70'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 108
    rowUnit: xlsx-row
  detailRange: A222:B234
  change: 파이프라인 상세 추가 · FS055·FS058 연계
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 224
      rowUnit: xlsx-row
    fields:
      기능명: 기업–이슈·기업–기업 관계 추출
      기능 설명: 정규화된 기업·이슈와 근거로 기업–이슈 영향 관계, 기업–기업 공급·고객·경쟁·투자 관계 후보를 추출한다. AI가 관계 의미·방향·설명을
        생성하고 백엔드 B가 간선 스키마와 식별·조회 계약을 담당한다.
      선행조건: FS077에서 관계 양끝 대상의 정규 ID와 근거 문서가 확인되어 있다.
      입력값: 기업·이슈 ID, 사건·문서 버전·근거 구간, 관계 유형·방향·사업/제품 범위, 관계 확인 시점·유효기간 근거, 분석 버전.
      입력·검증 규칙: '동시 언급만으로 관계를 확정하지 않는다. 관계마다 연결 이유·직접/간접 구분·단계별 근거를 갖는다.

        방향성이 있는 관계는 출발·도착을 구분하고 경쟁 등 대칭 관계는 정규화하여 중복을 막는다. 서로 다른 유형·사업 범위는 하나로 덮어쓰지
        않는다.

        유효 시작/종료는 근거에서 확인한 값만 사용한다. 미상은 별도 상태로 둔다.

        화면 그래프의 노드는 기존 FS017·FS018에 따라 기업·이슈만 사용한다. 사건·문서·산업·제품은 근거/경로 문맥으로 관리하며 새로운
        화면 노드 유형을 추가하지 않는다.'
      처리 절차 및 분기: '1. 정규 대상과 근거에서 관계 유형·방향·범위를 추출한다.

        2. 직접 관계와 간접 경로의 각 단계를 구분한다.

        3. 중복 후보를 정규화하고 관계 키·근거 참조를 구성한다.

        4. FS079의 영향·근거 검증으로 전달한다.'
      정상 결과: 관계 후보가 대상·유형·방향·범위·시점·근거와 함께 생성된다. 미검증 후보는 공개 간선이 아니다.
      예외 처리: '대상 불명·관계 유형 미지원·근거 미확보: 비공개 후보로 보류한다.

        상충 관계: 원문과 각각의 해석을 보존해 FS079로 전달한다.

        간접 경로 일부 근거 없음: 전체 경로를 검증 완료로 표시하지 않는다.'
      수용 기준: '1. 공급·투자 등 방향과 경쟁 관계 정규화가 올바르다.

        2. 동일 대상의 다른 관계 유형·사업 범위가 보존된다.

        3. 모든 공개 후보의 경로 단계에 근거가 있고 단순 동시 언급은 확정 관계가 되지 않는다.'
      확인 필요 사항: '지원 관계 유형·유형별 필수 속성·관계 키와 대칭성 규칙은 FS055와 공통 계약으로 확정한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
