  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      기능명: AI 답변·뉴스 요약·브리핑 평가 등록
      기능 설명: 로그인 회원이 제공받은 AI 답변·뉴스 요약·브리핑 결과에 좋아요 또는 싫어요를 등록·변경·취소한다. 평가를 결과 종류와 해당
        결과 버전에 연결한다.
      선행조건: 로그인 회원에게 조회 가능한 AI 결과가 표시되어 있다.
      입력값: 회원, 평가 대상 종류·결과 ID·버전, 평가 요청 식별 정보, 원하는 최종 평가 상태(좋아요·싫어요·없음).
      입력·검증 규칙: '현재 대상 결과를 볼 수 있는 로그인 회원만 평가할 수 있다. 비회원에게 로그인 필요를 안내한다. 개인화 결과는 본인에게
        허용된 결과인지 서버에서 확인한다.

        회원·결과 종류·결과 ID·버전별 현재 평가는 좋아요·싫어요·없음 중 하나이다. 새 결과 버전으로 이전 평가를 자동 이전하지 않는다.

        다른 평가를 누르면 변경하고 같은 평가를 다시 누르면 취소한다. UI는 원하는 최종 상태를 요청하여 동일 요청 재전송이 다시 토글되지
        않게 한다.

        권한·대상 버전과 요청 식별 정보를 검증한다. 동일 요청 재전송은 같은 변경으로 처리하고, 이후 확정된 다른 평가 변경을 이전 요청이
        덮어쓰지 않게 한다.

        저장 성공을 확인한 뒤 확정 상태를 표시한다. 답변·뉴스 요약·브리핑에 같은 규칙을 적용한다.'
      처리 절차 및 분기: '1. 회원이 평가를 선택하면 UI가 목표 평가 상태를 결정한다.

        2. 서버는 현재 조회 권한, 정확한 결과 종류·ID·버전, 요청의 중복·기존 처리 여부를 확인한다.

        3. 해당 회원·결과 버전의 평가를 목표 상태로 저장하고 확정 상태를 반환한다. 이미 처리한 요청이면 중복 변경 없이 현재 확정 상태를
        반환한다.

        4. 화면은 현재 확정 상태를 표시하고, 늦게 도착한 이전 응답으로 최신 상태를 되돌리지 않는다. 관리자는 기능·결과 종류별로 구분하여
        집계할 수 있다.'
      정상 결과: 각 회원의 한 결과 버전에 대한 현재 평가가 하나로 유지되며 변경·취소가 반영된다. 다른 결과 버전의 평가와 섞이지 않는다.
      예외 처리: '비회원·권한 없음: 등록하지 않고 로그인 필요 또는 접근 제한을 안내한다.

        대상 삭제·제공 중단·버전 확인 불가: 평가하지 않고 대상 이용 불가를 안내하며 다른 버전에 대신 저장하지 않는다.

        저장 실패: 기존 확정 상태를 유지한다. 재조회·동일 요청 재전송·저장 복구는 최초 요청의 평가 대상 종류·결과 ID·버전을 유지한다.
        응답 미수신이면 해당 버전의 현재 상태와 요청 처리 여부를 확인한 후 재요청하며 확인 실패를 미처리로 단정하지 않는다.

        중복·늦은 재전송: 평가 수를 늘리거나 다시 토글하지 않으며 이후 확정된 변경을 덮어쓰지 않는다. 같은 요청 식별 정보에 다른 내용이
        오면 충돌로 처리한다.'
      수용 기준: '1. 같은 평가 요청을 두 번 보내도 한 평가로 유지되고 마지막 유효 변경 시각이 재전송만으로 갱신되지 않는다.

        2. 좋아요에서 싫어요로 변경하면 현재 좋아요는 남지 않으며, 뒤늦은 이전 요청·응답이 변경된 상태를 되돌리지 않는다.

        3. 같은 버튼 재선택으로 취소하되 통신 재전송은 추가 취소·등록을 일으키지 않는다.

        4. 다른 회원의 개인화 결과나 현재 조회 권한이 없는 결과를 평가할 수 없다.

        5. 답변·뉴스 요약·브리핑의 평가가 정확한 결과 종류·ID·버전에 연결되고 새 버전에 자동 이전되지 않는다.

        6. 저장 실패·응답 미수신 후 재조회·재전송·저장 복구에서도 최초 평가 대상 종류·결과 ID·버전이 유지되고 다른 버전으로 이전되지
        않는다. 기존 확정 상태·요청 처리 여부를 확인하며 평가 완료를 임의로 표시하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 로그인 회원·결과 버전별 단일 현재 평가·변경·취소·목표 상태 저장. 기존 브리핑 평가와 AI
        평가를 통합하여 요구사항 37과 78을 함께 연결한다.

        [확인 필요: 브리핑 원본 우선순위 미기재와 AI 평가 원본 P2의 통합 개발 우선순위 결정 필요]

        [확인 필요: 평가 데이터의 보존·삭제 연계 및 소수 집계의 재식별 방지 등 익명성 세부 범위 결정 필요]'
