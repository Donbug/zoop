  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 163
      rowUnit: xlsx-row
    fields:
      기능명: 미발행 브리핑 회차 재처리
      기능 설명: 관리자가 지연 또는 실패한 미발행 브리핑 회차의 재처리를 요청하면 허용된 회차만 다시 처리한다. 중복 회차를 만들거나 이미
        발행한 본문을 덮어쓰지 않는다.
      선행조건: 권한 있는 관리자가 지연·실패한 회차의 상태를 확인하고 미발행 회차에 대한 재처리를 요청한다.
      입력값: 대상 회차 날짜·출근/퇴근 구분, 회차·결과 버전·현재 실행 식별 정보, 데이터 기준 시점과 보존된 원문/중간/검증 결과, 현재
        생성·검증·저장·발행 상태, 실패 단계·사유, 재처리 요청 식별 정보.
      입력·검증 규칙: '현재 관리자 재처리 권한·대상 범위와 회차의 현재 상태·이전 실행 종료·재처리 허용 여부를 확인한다. 상태 조회 실패·응답
        미수신·지연 표시만으로 실패 확정이나 재실행 허용으로 간주하지 않는다.

        허용된 미발행 회차는 완료·저장된 유효 결과를 유지하고 실패 단계부터 필요한 후속 단계를 처리한다. 생성·검증 결과가 보존되고 저장/발행
        반영만 실패했으면 해당 단계만 재시도하며 모델을 다시 호출하지 않는다.

        회차의 데이터 기준 시점과 근거·보존 결과의 유효성을 확인한다. 사용할 자료가 없거나 기준 변경이 필요하면 임의로 최신 자료·다른 회차로
        대체하지 않고 복구 정책 확인 대상으로 남긴다.

        처리 중·동시·같은 요청 재전송은 중복 실행·회차·발행을 만들지 않는다. 저장/발행 직전에도 현재 유효한 실행과 발행 상태를 확인하여
        늦은 이전 실행이 결과를 덮지 못하게 한다.

        이미 발행된 본문은 일반 재처리로 변경하지 않는다. 검증 실패·근거 부족은 재처리로 우회하지 않으며 공개 가능한 결과만 발행한다.

        필수 저장 실패 시 발행하지 않는다. 자료 일부 지연은 확보 범위와 지연을 표시하는 기존 기준을 따르며, 정상적인 적격 이슈 0개는
        요약·시장 변수만 발행할 수 있다.'
      처리 절차 및 분기: '1. 관리자가 대상 미발행 회차와 실패 단계를 확인해 재처리를 요청한다.

        2. 서버가 현재 권한·회차/실행 상태·기존 요청 처리 여부·보존 결과·재처리 허용 조건을 확인한다.

        3. 처리 중·중복 요청이면 기존 상태를 확인하고, 이미 발행된 회차면 일반 재처리를 적용하지 않는다.

        4. 완료된 유효 결과를 유지하며 허용된 실패 단계부터 필요한 후속 단계를 복구하고 검증·저장·발행 결과를 구분해 기록한다. 재처리
        접수만으로 성공·발행 완료로 표시하지 않는다.

        5. 같은 회차의 현재 유효한 실행 결과만 반영하고 진행·실패 사유를 운영 상태에서 확인할 수 있게 한다.'
      정상 결과: 허용된 미발행 회차의 실패 단계가 복구되고 실제 발행 여부를 따로 확인한다. 중복 회차·발행이나 기발행 원문 변경 없이 기존
        회차 이력을 유지한다.
      예외 처리: '관리자 권한 없음·재처리 허용 기준 불충족: 실행하지 않는다.

        이미 발행된 회차: 일반 재처리로 본문을 덮지 않고 현재 발행 상태를 안내한다.

        현재 처리 중·이전 실행 종료 불명: 새 실행을 시작하지 않고 현재 상태 재확인을 안내한다.

        기존 상태 조회 실패: 이번 재처리 요청을 상태 확인 실패·미실행으로 기록하고 추가 실행하지 않는다. 실제 발행 여부는 미확인으로 표시하며
        기존 회차의 저장된 발행 상태를 실패로 변경하지 않는다.

        재처리 가능한 실패인지 불명확: 허용 여부 확인 전에는 실행을 보류한다.

        재처리 불가 오류·지연 여부 불명확: 해당 조건을 표시하고 허용 기준 확정 전 실행하지 않는다.

        필요한 보존 결과 없음·기준 시점 변경 필요: 복구 가능 여부를 검토하며 임의 전체 재생성·자료 대체를 하지 않는다.

        재처리 후 실패: 실패 단계·원인을 유지하고 성공으로 표시하지 않는다. 저장/발행만 실패한 경우 보존 결과로 그 단계만 복구하며 무한
        자동 모델 호출을 수행하지 않는다.'
      수용 기준: '1. 처리 중·동시·중복 요청에서 중복 실행·회차·발행이 발생하지 않는다.

        2. 이미 발행된 회차의 원문은 일반 재처리로 변경되지 않고 늦은 이전 실행이 현재 결과를 덮지 않는다.

        3. 권한 없음·상태 조회 실패·이전 실행 종료 불명·허용 기준 불충족이면 실행하지 않는다. 상태 조회 실패는 이번 요청의 확인 실패·미실행으로
        기록되고 기존 회차의 발행 상태를 바꾸지 않으며 실제 발행 여부는 미확인으로 표시된다.

        4. 저장/발행만 복구할 때 모델 호출이 늘지 않으며, 검증 실패·근거 부족을 우회해 발행하지 않는다.

        5. 재처리 접수·완료·실제 발행이 구분되고 회차 기준 시점·자료가 임의 변경되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 미발행 상태와 실행/권한 확인, 완료 결과 유지·허용된 실패 단계부터 필요한 후속 단계 복구,
        저장/발행만 복구할 때 모델 호출 금지, 중복 및 기발행 원문 변경 방지.

        [확인 필요: 지연 판정 기준·재처리 가능한 오류/단계·운영 권한과 횟수/간격 결정 필요]

        [확인 필요: 보존 결과 소실·자료/기준 시점 변경이 필요한 경우의 복구 허용 범위와 재처리 종료 기준 결정 필요]

        [팀 협의 필요: 기존 생성/중복 발행 방지 명세의 상태 확인 불가 시 ‘발행 실패 처리’ 문구를 담당자와 정합화해야 한다. 이번 재처리
        요청의 확인 실패·미실행과 실제 회차의 발행 실패를 구분하며 조회 장애만으로 기존 발행 상태를 변경하지 않는다]'
