    fields:
      기능명: 영향 방향·근거 검증 및 공개 적격 판정
      기능 설명: 기업별 영향 방향과 지지·반대 근거를 분석하고 관계·경로의 참조와 공개 조건을 검증한다. AI는 영향 해석·품질 검증을, 백엔드
        B는 서버의 검증 상태·공개 제외 적용을 담당한다. FS021은 이 결과를 조회·표시한다.
      선행조건: FS078의 관계 후보와 문서 버전·인용 근거가 존재한다.
      입력값: 관계·기업·이슈 ID, 영향 방향 후보·이유, 지지/반대 근거, 신뢰도·분석 한계, 검증 정책 버전·현재 근거/공개 상태.
      입력·검증 규칙: '영향은 긍정·부정·혼재·판단 보류로 구분한다. 상반 근거는 혼재, 영향 근거 부족은 판단 보류로 표현하며 주가 등락
        확률로 변환하지 않는다.

        관계 자체의 근거 적격성과 영향 방향의 불확실성을 분리한다. 관계 근거가 충분한 경우에도 영향은 판단 보류일 수 있다.

        문서·대상·인용 구간·경로 단계·국내/국제 속성 등 필수 정보를 검증한다. 신뢰도 점수만으로 사실 또는 공개 가능을 확정하지 않는다.

        미검증·보류·거부 관계는 비공개로 유지한다. FS067-02 관리자 허용도 자동 검증을 우회하지 않는다.'
      처리 절차 및 분기: '1. 기업별 영향 방향·이유·반대 근거·한계를 분석한다.

        2. 출처·문서 버전·대상 ID·인용·경로 연결을 자동 검증한다.

        3. 검증 통과·보류·거부와 사유를 기록한다.

        4. 현재 공개 조건을 충족한 결과만 FS080에 공개 적격 결과로 전달한다.'
      정상 결과: 영향 해석과 관계 공개 적격 상태가 구분되고 검증 근거·정책·결과가 추적된다.
      예외 처리: '근거 부족·상충·소실·인용 오류: 해당 사유로 보류 또는 공개 제외한다.

        원문 링크만 실패: 확보한 인용·출처의 유효성을 별도로 확인하며 근거 소실로 단정하지 않는다.

        검증 실패 시 무제한 모델 재호출하지 않는다.'
      수용 기준: '1. 근거 부족 영향은 판단 보류, 상반 근거는 혼재로 처리된다.

        2. 허구 인용·대상 오류·불완전 경로가 공개 적격으로 통과하지 않는다.

        3. 관리자 허용·높은 신뢰도만으로 미검증 관계가 공개되지 않는다.

        4. FS021·FS022·FS024가 같은 영향·근거 버전을 사용한다.'
      확인 필요 사항: '자동 검증 세부 정책·신뢰도 활용 기준·품질 목표는 실제 표본으로 확정한다. 운영자 검수 UI는 기존 FS067을 사용한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
- id: FS080
  title: GraphDB 노드·간선 upsert 및 공개 버전 반영
  section: 메인그래프 v2
  priority: 미정
  status: 추가 제안 · 검토 전
  requirementIds:
  - '67'
  - '71'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 110
    rowUnit: xlsx-row
  detailRange: A250:B262
  change: 파이프라인 상세 추가 · FS055·FS059 연계
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 252
      rowUnit: xlsx-row
    fields:
      기능명: GraphDB 노드·간선 upsert 및 공개 버전 반영
      기능 설명: 기업·이슈 노드와 기업–기업·기업–이슈 간선을 GraphDB에 멱등 upsert하고 근거·분석 버전·검증 상태를 연결한다.
        백엔드 B가 저장·트랜잭션·조회 반영을, AI가 분석 결과 계약과 검증 결과 제공을 담당한다.
      선행조건: FS077 정규 ID, FS078 관계 계약, FS079 검증 결과와 FS059의 공통 공개 버전 정책이 확보되어 있다.
      입력값: 기업·이슈 ID와 속성, 관계 키·방향·범위, 문서/사건·근거 참조, 영향·신뢰도, 분석/검증 버전, 작업 멱등 키·회차·기대
        기존 버전.
      입력·검증 규칙: '기업·이슈의 안정적 ID와 관계 정규 키에 유일성을 적용해 기존 대상은 갱신하고 없는 대상만 생성한다. 동일 요청 재실행은
        노드·간선·버전을 늘리지 않는다.

        필수 노드·간선·근거 참조의 저장 일관성을 보장하고 부분 저장 결과를 공개하지 않는다. 미검증 후보의 저장과 사용자 공개 버전을 구분한다.

        늦은 결과가 최신 버전을 덮지 않도록 기대 버전을 검사한다. 관계 내용·상태 변경 이력과 근거 버전을 보존한다.

        FS059에 따라 메인 그래프·기업 상세의 공통 공개 버전과 캐시를 전환한다. 저장 성공은 조회 반영 완료가 아니다.'
      처리 절차 및 분기: '1. 입력 계약·참조·현재 버전·멱등 키를 확인한다.

        2. 기업·이슈 노드와 관계·근거 참조를 일관된 저장 단위로 upsert한다.

        3. 검증된 의존 관계가 완결된 결과의 두 조회 경로를 준비한다.

        4. FS059 공통 공개 버전을 전환하고 두 경로의 동일 버전 조회를 확인한다.'
      정상 결과: 중복 없는 GraphDB 노드·간선과 이력이 저장되고 두 화면이 같은 공개 버전을 조회한다. 저장·조회 반영 상태를 각각 확인할
        수 있다.
      예외 처리: 'DB/트랜잭션 실패: 부분 공개 없이 실패 저장 단계를 복구한다. 보존된 결과의 저장 재시도는 모델을 호출하지 않는다.

        버전 충돌·지연 결과: 최신 버전을 유지하고 유효한 미반영 결과는 후속 반영 대상으로 남긴다.

        캐시/조회 반영 실패: 두 경로를 공통의 기존 유효 버전으로 유지하며 미완료를 기록한다. 공개 제외 항목은 이전 버전에서도 숨긴다.'
      수용 기준: '1. 같은 입력을 반복·동시 처리해도 동일 기업·이슈·간선이 중복 생성되지 않는다.

        2. 실패를 주입해도 고아 간선·부분 공개가 발생하지 않는다.

        3. 두 화면이 동일 공개 버전·근거를 반환하고 DB 저장만으로 완료 처리하지 않는다.

        4. 저장 재시도에 모델 호출이 추가되지 않고 늦은 버전이 최신 값을 덮지 않는다.'
      확인 필요 사항: 'GraphDB 제품·물리 스키마·유일성 제약·트랜잭션/공개 전환 방식은 구현 시 검증한다. Neo4j 선택 시 MERGE
        등 동등한 멱등 동작을 적용한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
- id: FS081
  title: 그래프 증분 갱신·관계 비활성화 및 실패 단계 복구
  section: 메인그래프 v2
  priority: 미정
  status: 추가 제안 · 검토 전
  requirementIds:
  - '67'
  - '70'
  - '71'
  - '79'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 111
    rowUnit: xlsx-row
  detailRange: A264:B276
  change: 파이프라인 상세 추가 · FS055·FS058·FS059·FS067-03 연계
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 266
      rowUnit: xlsx-row
    fields:
      기능명: 그래프 증분 갱신·관계 비활성화 및 실패 단계 복구
      기능 설명: 신규·수정·철회 문서나 잘못된 연결이 확인되면 영향을 받는 이슈·관계를 선별 갱신한다. 백엔드 B는 의존 추적·비활성화·저장/공개
        복구를, AI는 영향 대상의 재추출·재연결·재검증을 담당한다.
      선행조건: 기존 문서·분석·GraphDB 버전과 의존 참조가 존재하고, 변경 유입 또는 기존 FS067-03의 허용된 재처리가 발생한다.
      입력값: 변경 전후 문서 버전, 영향 대상 ID·의존 관계, 정정/철회 사유, 관계 유효 시점·상태, 실패 단계·보존 중간 결과, 작업
        ID·재처리 정책.
      입력·검증 규칙: '변경 근거를 참조한 결과만 선별 재검증하며 무관한 전체 그래프를 재분석하지 않는다.

        근거 무효·오연결이 확인된 관계는 공개 제외하고 이력·사유를 보존한다. 확인되지 않은 만료일을 생성하지 않는다.

        기존 이슈 갱신·동일성 정정은 ID 대응과 이전 참조를 추적한다. 병합 불확실 사례를 자동으로 합치지 않는다.

        실패 단계와 결과 보존 여부를 확인해 수집·분석·저장·조회 반영을 구분 복구한다. 저장/반영 실패는 모델 재호출 없이 복구하고 재시도
        한도를 적용한다.'
      처리 절차 및 분기: '1. 수정·철회 문서와 기존 근거의 의존 관계를 추적한다.

        2. 무효 관계를 공개 제외하고 AI에 필요한 재분석·재검증 대상만 전달한다.

        3. FS077~FS080으로 정정된 노드·간선·근거를 갱신한다.

        4. 직접 조회·캐시·이전 버전의 제외 상태와 두 화면 공통 버전을 확인한다.

        5. 단계별 완료·실패·보류 및 재처리 결과를 기존 운영 상태에 기록한다.'
      정상 결과: 유효한 신규 근거가 기존 이슈에 반영되고 잘못된 관계는 사용자 조회에서 제외된다. 이력·실패 범위·복구 상태가 남는다.
      예외 처리: '영향 범위 불명·중간 결과 소실: 보류/복구 불가를 기록하며 전체 재생성을 자동 실행하지 않는다.

        부분 성공: 항목별 상태를 유지하고 실패 항목에 의존하는 결과는 공개하지 않는다.

        정상 신규 0건과 검증 탈락/실패 0건을 구분한다. 응답 미수신 시 기존 작업 상태부터 확인한다.'
      수용 기준: '1. 수정 전 근거에 의존한 결과만 갱신되고 무관한 결과는 보존된다.

        2. 비활성 관계가 직접 조회·캐시·이전 버전에서 재노출되지 않는다.

        3. 반복 재처리로 노드·간선·이력이 중복되거나 최신 버전이 되돌아가지 않는다.

        4. 저장/조회 복구가 모델을 재호출하지 않으며 부분 실패가 전체 성공으로 표시되지 않는다.'
      확인 필요 사항: '재처리 허용 범위·횟수·간격·이력 보존·병합 취소 정책은 기존 운영 정책과 함께 확정한다. FS058/FS059의 05·35분
        시작, 10·40분 반영 기준은 유지한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
