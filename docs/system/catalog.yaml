      기능 설명: 관리자가 AI 답변·뉴스 요약·브리핑별로 현재 유효한 좋아요·싫어요 건수와 좋아요 비율을 조회한다. 결과는 평가에 참여한 회원의
        해당 결과 버전별 선호도이며, 전체 이용자의 의견이나 모델의 사실 정확도·성능을 직접 나타내는 수치로 해석하지 않는다.
      선행조건: 승인된 관리자가 AI 기능의 평가 및 선호도 정보를 조회한다.
      입력값: 관리자 조회 조건과 기간, 평가 대상 기능·결과 종류·ID·버전, 회원·결과 버전별 현재 좋아요·싫어요 및 마지막 유효 변경 시각,
        집계 기준 시점.
      입력·검증 규칙: '관리자 조회 권한을 확인하고 평가를 원래 기능·결과 종류·ID·버전에 연결한다.

        집계 단위는 회원·결과 버전별 현재 유효 평가 한 건이다. 같은 회원이 다른 결과에 한 평가는 각각 포함하므로 평가 건수는 고유 회원
        수와 다르다. 동일 요청 재전송을 중복 집계하거나 유효 변경 시각을 갱신하지 않는다.

        조회 기간은 평가의 마지막 유효 변경 시각을 한국 시간으로 필터한다. 기본은 전체 보관 기간이며 관리자가 시작·종료일을 지정할 수 있다.
        기간 경계를 명확히 표시하고 적용한다.

        현재 좋아요·싫어요 건수를 각각 제공한다. 취소·미평가는 유효 건수와 비율의 분모에서 제외하며 싫어요나 0점으로 처리하지 않는다. 좋아요
        비율(%) = 좋아요 수 ÷ (좋아요 수 + 싫어요 수) × 100.

        기간 필터는 현재 유효 평가 중 마지막 변경 시각이 해당 기간인 평가를 고르는 기준이다. 과거 시점 당시의 평가 상태를 복원하는 통계로
        해석하지 않는다.

        조회 조건과 기준 시점이 같은 집계에서 건수·비율을 산출한다. 선호도를 객관적 모델 품질 점수로 대체하지 않는다.

        선호도는 집계 결과로 제공하고 개별 평가자의 식별 정보나 보호된 결과 원문을 함께 노출하지 않는다. 통계 조회 권한이 대화록·개인화
        결과의 원문 열람 권한을 뜻하지 않는다.'
      처리 절차 및 분기: '1. 관리자가 조회 기간과 평가 대상 기능을 선택한다.

        2. 권한과 기간 조건을 확인하고 같은 집계 기준 시점의 현재 유효 평가를 조건에 맞춰 집계한다.

        3. 좋아요·싫어요·전체 유효 평가 건수·좋아요 비율을 표시한다. 회원·결과 버전별 평가 단위와 집계 기준 시점을 표시하고, 조회 기간은
        현재 유효 평가의 마지막 유효 변경 시각을 한국 시간으로 필터한 범위이며 과거 상태 복원이 아님을 안내한다.'
      정상 결과: 관리자가 기능별·결과 종류별 현재 유효 평가 건수 기준의 좋아요 비율을 확인한다. 조회 기간은 현재 유효 평가의 마지막 유효
        변경 시각으로 필터한 범위이며, 고유 응답자 비율·과거 상태·미평가자의 의견·모델 정확도로 해석하지 않는다.
      예외 처리: '권한 없음: 결과를 반환하지 않는다.

        평가 0건: 건수는 0, 비율은 평가 없음으로 표시한다. 미평가·취소를 부정 평가로 바꾸지 않는다.

        잘못된 기간 조건: 조건을 안내하고 다시 선택하게 한다.

        집계 실패·필수 평가 자료 누락: 집계 불가와 다시 조회를 표시하고 0건·0%로 대체하지 않는다.'
      수용 기준: '1. 변경·취소·재전송 후에도 회원·결과 버전별 현재 유효 평가만 집계된다. 같은 회원의 다른 결과 평가는 구분한다.

        2. 기간 경계·한국 시간·마지막 유효 변경 시각·집계 기준 시점이 표시되고, 기간 경계의 평가가 정의한 조건에 맞게 포함·제외된다.

        3. 분모가 0이면 비율을 평가 없음으로 표시하며, 자료 누락·집계 실패를 정상 0건으로 표시하지 않는다.

        4. 미평가·취소는 분모에서 제외되고 좋아요/싫어요 변경이 현재 건수와 비율에 일관되게 반영된다.

        5. 선호도는 평가 참여자의 결과 버전별 응답임이 안내되며 과거 상태 복원·전체 이용자 의견·모델 정확도로 표시되지 않는다.

        6. 선호도 통계에서 평가자 식별 정보·보호된 결과 원문이 노출되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 유효 평가 집계·마지막 유효 변경 시각 필터·좋아요 비율 산식·미평가/취소 제외. 기본 조회
        범위인 전체 보관 기간은 보존 기간 자체를 정하는 정책이 아니다.

        [확인 필요: 조회 시작·종료일의 포함 경계 확정 필요]

        [확인 필요: 평가 이력 보존·삭제 연계와 소수 집계의 재식별 방지 등 익명성 세부 범위 승인 필요]'
