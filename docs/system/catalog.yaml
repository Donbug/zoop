  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 205
      rowUnit: xlsx-row
    fields:
      기능명: 대시보드
      기능 설명: 관리자는 대시보드를 통해 시스템의 전체 상황, 통계 등에 대한 요약을 확인할 수 있어야 하며, 각 관리 기능에 빠르게 접근할
        수 있어야 한다.
      선행조건: 승인된 관리자가 관리자 대시보드에 진입한다.
      입력값: 현재 관리자 권한과 허용 범위, 요약할 운영 상태·통계 및 원천 조회 조건(기간·대상·단위·집계 정의/기준 시점), 영역별 조회
        결과·최근 성공 확인 시각, 상세 관리 기능의 이동 대상.
      입력·검증 규칙: '현재 관리자 권한·허용 범위 안의 요약과 기능 진입점만 제공한다. 상세 조회·관리 조치에서도 서버가 현재 권한을 다시
        확인하며 메뉴 숨김만으로 접근을 통제하지 않는다.

        요약과 상세는 같은 기간·대상·단위·집계 정의·기준 시점에서 같은 수치를 제공한다. 기준 시점이 다르면 차이를 표시하고 같은 수치인
        것처럼 비교하지 않는다.

        영역별 정상 0·분모 없음·기준 미정·자료 미확보·조회/집계 실패·이전 값 유지 상태를 구분한다. 실패 값을 0으로 바꾸거나 일부 정상
        영역을 전체 정상으로 표시하지 않는다.

        이전 값을 표시할 경우 원래 기준 시점·최근 성공 확인 시각과 갱신 실패/지연을 명시하고 현재 값으로 표시하지 않는다. 현재 권한이
        없어진 정보는 이전 값으로도 제공하지 않는다.

        대시보드는 기존 관리 기능으로 이동하는 진입점이다. 요약 조회·이동만으로 차단·재처리·검수·발행 조치를 실행하지 않으며 보호된 원문
        조회를 우회하지 않는다.'
      처리 절차 및 분기: '1. 현재 관리자 권한에 맞는 운영 요약·상세 기능을 선택한다.

        2. 각 영역의 원천 상태·통계를 조회하고 조건·집계 기준 시점을 함께 확인한다.

        3. 정상 결과와 영역별 미확보·실패·이전 값 상태를 구분해 표시한다.

        4. 상세 화면으로 이동할 때 해당 조건을 전달하되 상세 기능에서도 현재 권한과 대상을 다시 확인한다.'
      정상 결과: 관리자가 허용된 운영 요약과 상세 기능 진입점을 확인한다. 영역별 기준 시점·실패/미확보 상태가 구분되고 동일 조건에서 상세
        수치와 일치한다.
      예외 처리: '관리자 권한 없음·인증 만료: 접근을 제한하고 인증·권한 안내를 제공한다. 이전 화면 값으로 보호 정보를 계속 제공하지 않는다.

        일부 통계·상태 조회 실패: 해당 영역을 조회 불가·재조회로 표시하고 다른 정상 영역과 구분한다.

        이전 값 제공: 승인된 범위에서만 원래 기준 시점·확인 시각·갱신 실패를 표시한다. 이전 값 허용 정책이 없으면 임의로 현재 값처럼
        제공하지 않는다.

        요약·상세의 조건/시점 불일치: 차이를 안내하고 동일 조건으로 다시 확인한다.

        대상·권한 변경 후 이전 응답 도착: 현재 화면에 반영하지 않는다.'
      수용 기준: '1. 같은 기간·대상·단위·집계 정의·기준 시점에서 요약과 상세 수치가 일치하고 이동 조건이 유지된다.

        2. 정상 0·분모 없음·기준 미정·미확보·부분 실패·이전 값이 구분되며 일부 정상 값을 전체 정상으로 표시하지 않는다.

        3. 이전 값에는 실제 기준 시점·최근 성공 확인 시각·갱신 실패가 표시된다.

        4. 권한 없는 메뉴·직접 상세 요청·이전 응답/값으로 보호 정보나 관리 조치에 접근할 수 없다.

        5. 대시보드 조회·이동만으로 차단·재처리·검수·발행 등의 변경 조치가 실행되지 않는다.

        6. 필수 대시보드 항목과 항목별 집계·갱신·상태 표시 기준을 확정하고 적용을 검증하기 전에는 구현 완료로 인정하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 요약/상세 동일 조건 대조, 현재 권한 확인, 영역별 정상 0·미확보·실패·이전 값 구분과 기준
        시점 표시.

        [확인 필요: 대시보드 항목·관리자별 허용 범위·갱신 주기·지연/장애 표시 기준 결정 필요]

        [확인 필요: 영역별 이전 값 허용 여부/범위·재조회 방식과 상세 이동 조건의 세부 구성 결정 필요]'
