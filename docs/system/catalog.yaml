  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 149
      rowUnit: xlsx-row
    fields:
      기능명: 브리핑 회차별 생성·검증·발행 상태 조회
      기능 설명: 관리자가 출근·퇴근 브리핑의 회차·결과 버전별 데이터 기준 시점, 생성·검증·저장·실제 발행 상태 및 실패 사유를 구분해 확인한다.
        상태 조회는 재처리나 발행을 수행하지 않는다.
      선행조건: 권한 있는 관리자가 브리핑의 회차별 운영 상태를 조회한다.
      입력값: 회차 날짜·출근/퇴근 구분과 회차/결과 버전·실행 식별 정보, 데이터 기준 시점, 생성·검증·저장·발행 상태와 해당 시각, 실제
        제공 중인 버전·제공 중단 상태, 실패 사유, 상태 갱신·조회 확인 시각.
      입력·검증 규칙: '현재 관리자 조회 권한·대상 범위를 확인한다. 선택 날짜·출근/퇴근 구분·회차와 결과 버전에 맞는 저장 상태를 조회하며
        다른 회차의 성공을 대신 표시하지 않는다.

        생성·검증·저장·발행을 구분한다. 생성 또는 저장 성공만으로 사용자에게 발행됐다고 간주하지 않는다. 실제 제공 중인 버전과 정정·제공
        중단 상태를 구분해 확인한다.

        데이터 기준 시점, 단계별 처리 시각, 관제 확인 시각을 구분해 표시한다. 출근 07:40·퇴근 18:10은 생성 시작 시각이며 발행
        완료 기한으로 해석하지 않는다. 지연·실패를 구분하되 지연 판정 기준은 임의로 확정하지 않는다.

        상태 조회 불가를 회차 없음·미발행·실패·지연·정상 완료로 단정하지 않는다. 조회·재조회만으로 미발행 회차를 재처리하지 않는다.'
      처리 절차 및 분기: '1. 관리자가 날짜·출근/퇴근 회차를 선택한다.

        2. 서버가 현재 권한·대상 범위를 확인하고 같은 회차·버전의 단계별 상태를 조회한다.

        3. 데이터 기준 시점·생성/검증/저장/실제 발행 상태·현재 제공 버전·실패 사유와 확인 시각을 표시한다.

        4. 확정된 기준으로만 지연·실패를 표시한다. 조회하지 못한 항목은 미확인으로 구분하고 이전 회차의 늦은 응답이 현재 선택을 덮지 않게
        한다.'
      정상 결과: 관리자가 선택한 회차·버전의 단계별 진행과 실제 발행/제공 상태, 데이터 기준 시점·실패 원인을 확인하며 미확인 상태를 구분한다.
      예외 처리: '관리자 권한 없음: 조회를 허용하지 않는다.

        정상 조회에서 대상 회차 없음: 회차 없음으로 안내하고 조회 실패와 구분한다.

        지연 기준 미확정·판정 정보 부족: 지연 여부 미확정으로 표시하며 임의로 실패 처리하지 않는다.

        일부 상태·실패 사유 조회 실패: 확인된 범위와 시점을 표시하고 해당 항목은 조회 불가·재조회로 안내한다. 원천 처리 상태를 바꾸지
        않는다.

        대상 회차 변경 후 이전 응답 도착: 현재 선택 회차의 상태로 표시하지 않는다.

        적격 핵심 이슈가 실제로 없음: 요약·시장 변수만 발행 가능한 정상 경우와 자료/상태 조회 실패를 구분한다. 일부 자료 지연은 확보
        범위·기준 시점·지연 표시로 구분한다.'
      수용 기준: '1. 선택 날짜·출근/퇴근 회차·결과 버전의 생성·검증·저장·실제 발행 상태가 원천 기록과 일치한다.

        2. 데이터 기준 시점·처리 시각·확인 시각이 구분되고 저장 성공만으로 발행 완료를 표시하지 않는다.

        3. 회차 없음·조회 불가·판정 기준 미확정이 구분되며, 제공 중단된 회차를 현재 제공 중인 것으로 표시하지 않는다.

        4. 권한 없는 요청에는 상태를 제공하지 않고 이전 회차의 늦은 응답이 현재 결과를 덮지 않는다.

        5. 조회·재조회만으로 재처리·발행이 시작되지 않는다.

        6. 정상적인 적격 이슈 0개와 자료/상태 조회 실패를 구분하고, 생성 시작 시각을 임의의 발행 마감으로 사용하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 회차·버전별 생성/검증/저장/실제 발행 및 확인 시각 구분, 조회 실패를 원천 상태로 오인하지
        않음.

        [확인 필요: 기존 회차 일정에 대한 지연 판정 기준·운영 조회 권한/대상 범위 결정 필요]

        [확인 필요: 상태 갱신 주기·오래된 상태 표시와 재조회 방식의 세부 정책 결정 필요]

        [확인 필요: 기존 생성 시각의 시간대·회차별 데이터 마감 시점과 지연 판정의 연결 기준 명료화 필요]'
