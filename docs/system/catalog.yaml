- id: FS053
  title: AI 결과 회수와 재시도
  section: AI 챗봇
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '53'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 65
    rowUnit: xlsx-row
  detailRange: A147:B159
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/07-AI-챗봇.csv
      row: 149
      rowUnit: xlsx-row
    fields:
      기능명: AI 결과 회수와 재시도
      기능 설명: 응답을 받지 못하면 새 답변 생성 전에 기존 질문 작업의 상태를 확인해야 한다. 완료 작업은 저장된 결과를 받고, 처리 중이면
        대기하며, 서버가 확인한 실패만 허용된 방식으로 재실행해야 한다. 상태 조회 장애를 작업 미등록으로 취급하지 않고 같은 작업 재시도는
        원래 질문 맥락을 유지해야 한다.
      선행조건: 클라이언트가 질문 응답을 받지 못했거나 사용자가 다시 시도를 선택한다.
      입력값: 기존 대화·작업 식별자, 최초 질문 내용과 고정 맥락·대상·기간·근거, 서버 상태, 현재 유효한 실행 정보, 보존된 검증 결과
        여부.
      입력·검증 규칙: '클라이언트의 응답 미수신과 서버 작업 실패를 구분한다.

        새 생성 전에 서버의 기존 작업 상태를 확인한다.

        완료 결과 회수 시에도 현재 접근 권한을 확인한다.

        같은 작업의 재시도에는 최초 요청 내용과 맥락을 유지한다.

        저장만 재시도하는 경우와 AI를 다시 실행하는 경우를 오류 유형별 정책에 따라 구분한다.

        늦게 끝난 이전 실행이 현재 유효한 결과를 덮어쓰지 못하게 한다.'
      처리 절차 및 분기: '1. 현재 권한으로 기존 작업의 서버 상태를 확인한다.

        2. 완료이면 저장 결과를 반환한다. 처리 중이면 새 작업을 만들지 않고 상태 확인을 이어 간다.

        3. 상태 확인 후 완료가 되면 저장 결과를 회수한다. 패널 닫힘·오프라인 동안 화면 확인은 멈출 수 있지만 서버 작업을 취소한 것으로
        보지 않는다.

        4. 확정된 일시적 조회·모델 호출 장애는 이전 실행 종료와 실행 권한을 확인한 뒤 사용자의 재시도로 같은 작업·최초 맥락을 재실행한다.

        5. 저장 실패는 보존된 검증 결과가 있을 때 저장만 다시 시도한다. 검증 실패·결과 소실·권한 오류는 동일 작업 재생성을 허용하지
        않는다.

        6. 서버가 작업 저장소를 정상 조회하여 미등록을 확인한 경우에만 기존 작업 ID와 최초 요청으로 다시 접수한다.'
      정상 결과: 완료 작업의 저장 결과를 회수하거나 처리 중 상태를 확인한다. 허용된 실패 재시도 또는 미등록 재접수는 동일 작업의 원래 조건으로
        진행된다.
      예외 처리: '상태 조회 실패·시간초과: 미등록·실패로 단정하지 않고 다시 확인을 안내한다.

        서버 처리 중: 기존 작업 상태를 확인하고 추가 생성하지 않는다.

        완료 안내 결과: 되묻기·설정 안내·판단 보류도 저장된 결과로 반환한다.

        중단 여부 불명확: 이전 실행 종료를 확인하기 전에는 재실행하지 않는다.

        권한 오류·입력 오류·검증 실패: 동일 작업 재실행을 제한한다.

        이전 실행의 늦은 저장: 유효 실행 확인을 통과하지 못하면 반영하지 않는다.'
      수용 기준: '1. 최초 연결이 끊긴 뒤 처리 중 안내를 받아도 후속 상태 확인으로 완료 결과를 회수한다.

        2. 상태 조회 실패만으로 미등록 접수·새 생성이 일어나지 않는다.

        3. 같은 작업 재실행은 원래 질문·대상·기간·근거를 유지한다.

        4. 보존 결과의 저장 복구에는 추가 모델 호출이 없다.

        5. 검증 실패는 같은 작업으로 재생성하지 않고 이전 실행이 현재 결과를 덮지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 오류별 복구 경로·상태 확인 종료 조건·일시 장애의 사용자 재시도.

        [확인 필요: 상태 확인 간격·일시 장애별 최대 재시도·서버 중단 판정 시간과 실행 권한 만료값은 측정 후 결정 필요]'
  scopeClass: existing
- id: FS054
  title: 사용자와 모의 보유
  section: 데이터 관리
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '66'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 66
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/09-데이터-관리.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 사용자와 모의 보유
      기능 설명: 사용자별로 초기 설정, 관심종목, 모의 보유 정보의 현재 상태를 저장해야 한다. 보유 종목·수량·평균 매입가는 고정 Mock
        데이터에서 가져오며, 서비스 내 매수·매도나 보유 수량·평균 매입가 변경은 제공하지 않는다. 보유 비중은 동일 기준 시점의 주가로 산출한
        종목별 평가금액을 기준으로 서비스에서 계산하며, 계산 기준 시점을 함께 관리한다. Mock 정보 기준 시점과 계산 기준 시점은 구분한다.
        정보가 없는 경우와 값이 0인 경우는 구분해야 한다. 주기적 보유 갱신·매매 이력·과거 비교·일별 이력은 요구하지 않는다.
      선행조건: 회원의 초기 설정·관심종목을 생성·변경하거나 고정 Mock 보유 정보를 최초로 로드한다. 평가금액·비중 재계산 시점은 별도로
        확정한다.
      입력값: 대상 회원, 초기 설정값, 관심 기업, 고정 Mock 데이터의 보유 종목·수량·평균 매입가와 정보 기준 시점, 동일 계산 기준
        시점의 종목별 현재 주가. 평가금액과 비중은 서비스가 산출한다.
      입력·검증 규칙: '저장·조회 대상 회원을 구분하고 본인의 정보에만 접근하도록 한다.

        보유 종목·수량·평균 매입가는 고정 Mock 데이터에서 가져오며 서비스에서 변경하지 않는다. 수치 검증은 최초 Mock 로드 시 데이터
        유효성을 확인하는 범위로 한다.

        종목 평가금액 = 보유 수량 × 동일 계산 기준 시점의 현재 주가.

        보유 비중(%) = 해당 종목 평가금액 ÷ 전체 보유 주식 평가금액 합계 × 100. 초기에는 현금을 제외한다.

        Mock 정보 기준 시점과 비중 계산 기준 시점을 구분하여 함께 관리한다.

        미제공 값과 실제 값 0을 구분한다.'
      처리 절차 및 분기: '1. 회원별 설정·관심 정보를 저장·조회한다. 최초 Mock 로드 시 보유 종목·수량·평균 매입가의 유효성을 확인하여
        고정 보유 정보로 저장·조회하고 현재 상태를 관리한다.

        2. 동일 기준 시점의 현재 주가로 종목별 평가금액과 현금을 제외한 전체 보유 주식 평가금액 합계를 계산한다.

        3. 합계로 각 종목의 평가금액을 나누어 비중을 산출하고 Mock 정보 기준 시점·계산 기준 시점과 함께 관리한다. 평가금액·비중 재계산은
        고정 보유 종목·수량·평균 매입가를 변경하지 않는다.

        4. 비중 산출에 필요한 주가가 없거나 평가금액 합계가 0이면 계산 불가로 구분하며 임의로 0을 넣지 않는다.'
      정상 결과: 회원별 설정·관심·모의 보유 정보가 저장된다. 산출 가능한 경우 종목별 평가금액·비중을 확인할 수 있고 Mock 정보 기준
        시점과 계산 기준 시점이 구분된다. 다시 조회해도 값의 의미가 유지된다.
      예외 처리: '다른 회원 정보 접근: 허용하지 않는다.

        값 미제공: 임의로 0으로 저장하지 않는다.

        비중 산출에 필요한 주가 미제공: 비중을 계산 불가로 표시하며 주가·평가금액·비중을 임의로 0으로 대체하지 않는다.

        전체 보유 주식 평가금액 합계가 0: 0으로 나누지 않고 비중을 계산 불가로 표시한다.

        저장·조회 실패: [확인 필요: 오류 안내와 재시도·기존 값 유지 방식 결정 필요]'
      수용 기준: '1. 동일 기업을 가진 서로 다른 회원의 값이 분리된다.

        2. 누락 값과 0이 저장·조회 후에도 구분된다.

        3. 보유 종목·수량·평균 매입가는 고정 Mock 값과 일치하며, 비중은 동일 기준 시점의 현재 주가를 이용한 평가금액 비율과 일치한다.
        현금은 분모에서 제외된다.

        4. 필요한 주가가 없거나 평가금액 합계가 0이면 비중을 계산 불가로 표시하고 임의의 0으로 대체하지 않는다.

        5. Mock 정보 기준 시점과 비중 계산 기준 시점을 구분하여 확인할 수 있다.

        6. 평가금액·비중을 다시 계산해도 Mock 보유 종목·수량·평균 매입가는 바뀌지 않는다.'
      확인 필요 사항: '[확인 필요: 평가금액·비중 재계산 시점 결정 필요]

        [확인 필요: 최초 Mock 로드 시 보유 수량·매입가 등 수치의 유효성 검증에 필요한 허용 범위 결정 필요]

        [확인 필요: 오류 안내와 재시도·기존 값 유지 방식 결정 필요]

        [확인 필요: 현재 설정·관심·모의 보유 정보의 보존·삭제를 회원 데이터 보존·삭제 정책과 연계하는 방식 결정 필요]'
