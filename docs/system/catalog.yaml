- id: FS016
  title: 튜토리얼 완료와 건너뛰기
  section: 온보딩·튜토리얼
  priority: P1
  status: 미기재
  requirementIds:
  - '16'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 26
    rowUnit: xlsx-row
  detailRange: A133:B145
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/02-온보딩-튜토리얼.csv
      row: 135
      rowUnit: xlsx-row
    fields:
      기능명: 튜토리얼 완료와 건너뛰기
      기능 설명: 사용자는 튜토리얼을 끝까지 완료하거나 진행 중 건너뛰어 메인 그래프로 이동할 수 있어야 한다. 회원의 경우 튜토리얼 처리 상태를
        계정에 저장하여 이후 자동 노출 여부 판단에 사용한다. 비회원의 경우 튜토리얼 완료, 건너뛰기 및 진행 상태를 저장하지 않는다. 회원과
        비회원 모두 메인 그래프의 튜토리얼 다시 보기 기능을 통해 튜토리얼을 다시 실행할 수 있다.
      선행조건: 회원 또는 비회원이 튜토리얼을 진행 중이다.
      입력값: 완료 또는 건너뛰기 선택, 회원인 경우 해당 회원의 튜토리얼 완료 상태.
      입력·검증 규칙: '① 완료와 건너뛰기 모두 메인 그래프 진입을 허용한다.

        ② 회원이 마지막 단계까지 완료하면 튜토리얼 상태를 COMPLETED로 저장한다.

        ③ 회원이 중간에 건너뛰면 SKIPPED 상태로 저장한다. SKIPPED는 완료로 간주하지 않는다.

        ④ COMPLETED와 SKIPPED 회원 모두 이후 일반 로그인 시 튜토리얼을 자동으로 다시 표시하지 않는다.

        ⑤ 회원은 상태와 관계없이 튜토리얼 다시 보기를 선택할 수 있다.

        ⑥ 튜토리얼 다시 보기를 실행하는 것만으로 기존 COMPLETED 또는 SKIPPED 상태를 변경하지 않는다.

        ⑦ 비회원의 튜토리얼 완료, 건너뛰기 및 현재 단계는 저장하지 않는다.

        ⑧ 비회원은 다시 방문했을 때 이전 튜토리얼 상태를 복원하지 않는다.

        ⑨ 초기 설정 완료 여부와 튜토리얼 상태는 서로 독립적으로 관리한다.'
      처리 절차 및 분기: '① 사용자가 튜토리얼 마지막 단계에서 완료를 선택한 경우 로그인 여부를 확인한다.

        ② 회원이면 COMPLETED 상태를 회원 계정에 저장한 후 메인 그래프로 이동한다.

        ③ 비회원이면 상태 저장 없이 메인 그래프로 이동한다.

        ④ 사용자가 진행 중 건너뛰기를 선택한 경우 회원이면 SKIPPED 상태를 저장한 후 메인 그래프로 이동한다.

        ⑤ 비회원이 건너뛰기를 선택하면 상태 저장 없이 메인 그래프로 이동한다.

        ⑥ 메인 그래프에서 튜토리얼 다시 보기를 선택하면 회원·비회원 모두 첫 단계부터 튜토리얼을 다시 실행한다.

        ⑦ 다시 보기 종료 후 회원은 완료 또는 건너뛰기 결과에 따라 상태를 갱신할 수 있으며, 비회원은 어떠한 진행 상태도 저장하지 않는다.'
      정상 결과: 완료 또는 건너뛰기 이후 메인 그래프에 진입할 수 있다. 회원은 COMPLETED 또는 SKIPPED 상태가 계정에 저장되며,
        비회원은 튜토리얼 상태가 저장되지 않는다. 회원과 비회원 모두 필요할 때 튜토리얼을 다시 실행할 수 있다.
      예외 처리: '회원 완료·건너뛰기 상태 저장 실패: 메인 그래프 이동 자체는 차단하지 않는다. 서버에서 저장을 재시도하거나 다음 회원 상태
        조회 시 미저장 상태를 확인할 수 있도록 오류를 기록한다. 저장되지 않은 상태를 성공적으로 저장된 것으로 응답하지 않는다.

        비회원 완료·건너뛰기: 별도의 저장 요청을 수행하지 않고 즉시 메인 그래프로 이동한다.

        비회원 재방문: 이전 진행 상태를 복원하지 않으며 일반 비회원 시작 정책에 따라 튜토리얼을 제공한다.

        튜토리얼 다시 보기 실패: 기존 메인 그래프 상태를 유지하고 오류 안내와 재시도 기능을 제공한다.

        회원 재시청 중 중단: 기존 저장 상태를 임의로 삭제하거나 초기화하지 않는다.'
      수용 기준: '① 회원·비회원 모두 완료 또는 건너뛰기로 메인 그래프에 진입할 수 있다.

        ② 회원이 튜토리얼을 완료하면 COMPLETED 상태가 저장된다.

        ③ 회원이 튜토리얼을 건너뛰면 SKIPPED 상태가 저장되고 완료로 처리되지 않는다.

        ④ COMPLETED 또는 SKIPPED 회원에게 일반적인 다음 로그인에서 튜토리얼을 자동 재노출하지 않는다.

        ⑤ 비회원의 완료·건너뛰기·진행 상태는 저장되지 않는다.

        ⑥ 비회원 재방문 시 이전 튜토리얼 진행 위치가 복원되지 않는다.

        ⑦ 회원과 비회원 모두 튜토리얼 다시 보기를 이용할 수 있다.

        ⑧ 튜토리얼 다시 보기는 첫 단계부터 시작한다.

        ⑨ 다른 회원의 튜토리얼 상태를 사용하지 않는다.

        ⑩ 초기 설정 완료 여부와 튜토리얼 상태는 서로 영향을 주지 않는다.'
