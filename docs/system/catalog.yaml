- id: NFS002
  title: 응답과 화면 정합성
  section: 비기능 상세
  priority: P1
  status: 확정
  requirementIds:
  - '55'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 93
    rowUnit: xlsx-row
  detailRange: A21:B33
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      요구사항명: 응답과 화면 정합성
      요구사항 설명: 차트, 재무, 뉴스 등 각 영역에는 현재 기업과 조회 조건에 맞는 최신 결과만 반영해야 한다. 이전 요청의 늦은 결과가
        해당 영역의 현재 내용을 덮어써서는 안 된다. AI 답변은 해당 대화와 질문에만 연결해야 한다.
      적용 대상·범위: 기업 상세의 개요·차트·타임라인·재무·뉴스·보유 영역, 메인 그래프의 모드·선택 대상, AI 대화와 질문별 답변 표시.
      적용 조건·검증 입력: '현재 기업, 기간 등 영역별 조회 조건, 최신 조회 식별자, 선택 이슈·노드.

        현재 활성 대화와 질문 작업 식별자.

        순서가 뒤바뀐 정상 응답과 오류 응답.'
      품질 목표·준수 규칙: '1. 현재 조건과 일치하는 최신 결과만 반영한다.

        2. 이전 요청의 늦은 응답이 최신 화면을 덮지 않고 AI 답변은 해당 대화·질문에만 연결한다.

        3. 정상 데이터뿐 아니라 오류 안내도 현재 조건과 최신 조회에 속하는지 확인한 뒤 표시한다.

        4. 이전 대화의 답변은 현재 대화가 아닌 해당 질문 작업에 연결한다.

        v1.2 제안: 기업·영역 조건·최신 조회 식별 정보로 정상·오류 응답을 판정한다. 차트 기간과 재무 기간을 별도로 관리한다. 상세
        이탈은 전체 상세 조회, 기간 변경은 차트·타임라인·이슈 상세, 이슈 변경은 이슈 상세를 무효화한다.'
      정상 상태: 현재 선택한 기업·조건에 맞는 결과만 해당 영역에 표시되고, AI 답변은 원래 요청한 대화·질문에 연결된다.
      미충족·예외 처리: '이전 기업·기간·그래프 모드의 응답 또는 오류: 현재 화면을 변경하지 않는다.

        새 대화 전환 뒤 이전 답변 도착: 새 대화에 붙이지 않는다.

        화면에서 응답을 무시하는 동작은 서버 기록 삭제나 기존 작업 취소를 의미하지 않는다.'
      검증 방법: '1. 기업 A 조회 뒤 B로 변경하고 B 응답을 먼저, A 응답을 나중에 도착시킨다.

        2. 기간과 그래프 모드를 연속 변경하고 정상·오류 응답의 도착 순서를 역전한다.

        3. 현재 조건의 성공 결과가 표시된 뒤 이전 요청의 오류를 도착시킨다.

        4. 질문을 전송한 뒤 새 대화를 시작하고 이전 질문의 답변이 도착하는 경우를 확인한다.

        1개월 조회 후 1년으로 변경하고 1개월 응답·오류를 늦게 도착시킨다.

        A 이슈 선택 후 발생 날짜 미상 B를 선택하여 A 상세·차트 강조가 정리되는지 확인한다.

        차트·재무 기간을 다르게 설정하고 그래프 왕복·AI 패널 닫기·재열기를 실행한다.'
      수용 기준: '1. 기업·기간을 빠르게 바꾸고 응답 순서를 역전해도 최종 조건만 표시된다.

        2. 새 대화에 이전 답변이 표시되지 않는다.

        3. 이전 요청의 오류가 현재 정상 결과를 지우거나 오류 상태로 바꾸지 않는다.

        4. 다른 영역의 독립 조회 결과를 무조건 함께 폐기하지 않고 각 영역의 현재 조건으로 표시 여부를 판단한다.

        최종 기간의 두 영역이 이전 응답으로 되돌아가지 않는다.

        범위 안 선택 이슈은 새 상세 조회로 이어지고 범위 밖 선택은 해제된다.

        패널 닫기와 화면 왕복 후 각 독립 기간·선택이 지정 규칙대로 유지된다.'
      확인 필요 사항: 'v1.2 제안 기준: 영역별 무효화와 화면 복원 규칙을 기능 명세에 반영했다.

        조회 식별자의 내부 형식은 구현에서 정하되 조건 일치 검증은 생략할 수 없다.'
