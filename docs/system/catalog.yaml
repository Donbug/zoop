specs:
- id: FS001
  title: 서비스 시작 방식 선택
  section: 회원가입·로그인
  priority: P1
  status: 확정
  requirementIds:
  - '1'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 10
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/01-회원가입-로그인.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 서비스 시작 방식 선택
      기능 설명: 사용자가 서비스 시작 화면에서 이메일 로그인, 이메일 회원가입, 소셜 로그인, 비회원 시작 중 원하는 이용 방식을 선택한다.
        선택한 방식에 해당하는 화면 또는 절차로 연결한다.
      선행조건: 사용자가 서비스 시작 화면에 진입한 상태여야 한다.
      입력값: '사용자가 선택한 시작 방식: 이메일 로그인 / 이메일 회원가입 / 소셜 로그인 / 비회원 시작.'
      입력·검증 규칙: '제공하는 네 가지 시작 방식을 구분하여 처리한다.

        비회원 시작을 선택한 사용자에게 계좌 연결이나 관심종목 설정을 필수로 요구하지 않는다.

        이미 로그인한 사용자가 시작 화면에 접근했을 때의 처리 방식은 [확인 필요]이다.'
      처리 절차 및 분기: '① 시작 화면에 네 가지 이용 방식을 표시한다.

        ② 이메일 로그인 선택: 이메일 로그인 화면으로 이동한다.

        ③ 이메일 회원가입 선택: 가입 정보를 입력하고 약관에 동의하는 회원가입 화면으로 이동한다.

        ④ 소셜 로그인 선택: 소셜 계정을 이용한 인증 절차로 연결한다.

        ⑤ 비회원 시작 선택: 로그인 없이 이용할 수 없는 기능을 안내하고 메인 그래프 화면으로 이동한다. 이후 그래프 튜토리얼을 제공한다.'
      정상 결과: 사용자가 선택한 이용 방식에 해당하는 화면 또는 절차가 열린다. 비회원은 가입이나 개인 종목 설정 없이 메인 그래프에 진입한다.
      예외 처리: '이미 인증된 사용자가 시작 화면 URL에 접근하면 로그인 화면을 표시하지 않고 FS006의 로그인 후 화면 이동 규칙을 적용한다.

        화면 전환 실패 시 현재 화면을 유지하고 “화면을 불러오지 못했습니다. 다시 시도해 주세요.”를 표시하며 재시도 기능을 제공.

        반복 실패 시 서비스 시작 화면으로 복귀. 소셜 인증을 시작한 이후 발생하는 실패·취소는 소셜 로그인 기능에서 처리한다.'
      수용 기준: '① 네 가지 시작 방식을 각각 선택할 수 있다.

        ② 선택한 방식에 맞는 화면 또는 절차로 연결된다.

        ③ 비회원 시작 시 회원가입·계좌 연결·관심종목 설정을 완료해야만 진입할 수 있도록 막지 않는다.'
      확인 필요 사항: '-'
  scopeClass: existing
- id: FS002
  title: 이메일 로그인
  section: 회원가입·로그인
  priority: P1
  status: 확정
  requirementIds:
  - '2'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 11
    rowUnit: xlsx-row
  detailRange: A21:B33
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/01-회원가입-로그인.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      기능명: 이메일 로그인
      기능 설명: 사용자가 이메일과 비밀번호를 입력하여 로그인한다. 인증에 성공하면 초기 설정 완료 여부에 따라 초기 설정 화면 또는 메인 화면으로
        이동한다.
      선행조건: 사용자가 이메일 로그인 화면에 진입한 상태여야 한다. 로그인에 성공하려면 입력한 정보로 인증할 수 있는 계정이 존재해야 한다.
      입력값: 이메일, 비밀번호.
      입력·검증 규칙: '① 이메일과 비밀번호의 필수 입력 여부를 확인한다.

        ② 입력된 정보로 계정 인증을 수행한다.

        ③ 입력 누락 또는 인증 실패 상태에서는 로그인 성공으로 처리하지 않는다.

        ④ 이메일 형식 검사 방식, 공백 처리, 비밀번호 입력 제한 등 세부 규칙은 앞뒤 공백 제거, 일반적인 이메일 형식 검증, 최대 254자,DB
        조회용 이메일은 서비스 정책상 소문자로 정규화, 빈 문자열 금지다.'
      처리 절차 및 분기: '① 사용자가 이메일과 비밀번호를 입력하고 로그인을 요청한다.

        ② 필수 입력 누락: 누락 오류를 안내하고 다시 입력할 수 있도록 한다.

        ③ 필수 입력 충족: 입력된 정보로 인증을 수행한다.

        ④ 인증 실패: 오류를 안내하고 재입력을 허용한다.

        ⑤ 인증 성공: 회원의 인증 상태를 설정하고 초기 설정 완료 여부를 확인한다.

        ⑥ 초기 설정 미완료: 초기 설정 화면으로 이동한다.

        ⑦ 초기 설정 완료: 기존 보유종목과 관심종목을 기준으로 메인 화면에 진입한다.'
      정상 결과: 유효한 계정 정보로 로그인되며, 초기 설정 완료 여부에 맞는 화면이 표시된다.
      예외 처리: '입력 누락: 필요한 입력이 누락되었음을 안내하고 재입력을 허용한다.

        인증 실패: 로그인 실패를 안내하고 재입력을 허용한다.

        반복 인증 실패: 제한 여부와 처리 기준은 Rate Limiting / Throttling이다.'
      수용 기준: '① 이메일 또는 비밀번호가 누락되면 로그인이 완료되지 않고 오류가 안내된다.

        ② 잘못된 인증 정보로는 로그인되지 않는다.

        ③ 오류 안내 후 다시 입력하여 로그인을 시도할 수 있다.

        ④ 인증 성공 후 초기 설정 미완료 사용자는 초기 설정 화면으로 이동한다.

        ⑤ 초기 설정 완료 사용자는 기존 보유·관심종목을 기준으로 메인 화면에 진입한다.'
      확인 필요 사항: '-'
  scopeClass: existing
- id: FS003
  title: 이메일 회원가입
  section: 회원가입·로그인
  priority: P1
  status: 확정
  requirementIds:
  - '3'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 12
    rowUnit: xlsx-row
  detailRange: A35:B47
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/01-회원가입-로그인.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 이메일 회원가입
      기능 설명: 사용자가 가입 정보를 입력하고 필수 약관에 동의하여 계정을 생성한다. 필수 입력, 입력 형식, 필수 약관 동의, 이메일 중복
        여부를 회원가입 기능 내부에서 검증한다.
      선행조건: 사용자가 이메일 회원가입 화면에 진입한 상태여야 한다.
      입력값: '이메일을 포함한 가입 정보, 필수 약관별 동의 여부.

        이메일 외의 구체적인 가입 필드와 필수·선택 구분은 [확인 필요]이다.'
      입력·검증 규칙: '① 필수 가입 정보가 모두 입력되었는지 확인한다.

        ② 각 입력값이 해당 항목의 형식에 맞는지 확인한다.

        ③ 필수 약관에 동의했는지 확인한다.

        ④ 가입하려는 이메일이 기존 계정과 중복되는지 확인한다.

        ⑤ 검증에 실패한 항목을 사용자에게 안내한다.

        ⑥ 검증을 통과하지 못한 상태에서는 계정을 생성하지 않는다.

        필드별 형식·길이·허용 문자와 이메일 중복 판정의 세부 기준은 앞뒤 공백 제거, 이메일을 서비스 내부에서 소문자로 정규화, DB UNIQUE
        Constraint, Application에서도 사전 중복 검사이다.'
      처리 절차 및 분기: '① 사용자가 가입 정보와 약관 동의 여부를 입력하고 회원가입을 요청한다.

        ② 필수 입력·입력 형식·필수 약관 동의·이메일 중복 여부를 검증한다.

        ③ 검증 실패: 잘못되거나 누락된 항목을 안내하고 사용자가 수정할 수 있도록 한다.

        ④ 수정 후 재요청: 변경된 입력값으로 검증을 다시 수행한다.

        ⑤ 검증 통과: 계정을 생성한다.

        ⑥ 계정 생성 이후: 자동 로그인 가능하며 다음 화면은 온보딩 및 튜토리얼 화면이다.'
      정상 결과: 검증을 통과한 가입 정보로 계정이 생성된다. 가입 직후의 인증 상태와 이동 화면은 결정된 정책에 따라야 하며, 현재 문서에서는
        미확정이다.
      예외 처리: '필수 입력 누락·형식 오류: 해당 항목을 안내하고 수정할 수 있도록 한다.

        필수 약관 미동의: 가입을 완료하지 않고 동의가 필요함을 안내한다.

        이메일 중복: 해당 이메일로 계정을 생성하지 않고 중복 사실을 안내한다.'
      수용 기준: '① 필수 입력 누락 상태에서는 계정이 생성되지 않는다.

        ② 확정된 입력 형식에 맞지 않는 값은 거절되고 수정할 항목이 안내된다.

        ③ 필수 약관 미동의 상태에서는 계정이 생성되지 않는다.

        ④ 중복 이메일로 추가 계정이 생성되지 않는다.

        ⑤ 오류를 수정한 뒤 다시 가입을 요청할 수 있다.

        ⑥ 모든 검증을 통과한 가입 정보로 계정이 생성된다.'
      확인 필요 사항: '[확인 필요] 가입 필드 목록과 필수·선택 구분.

