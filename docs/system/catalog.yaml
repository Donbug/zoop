      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 가상계좌 연결 재시도와 건너뛰기
      기능 설명: 회원은 가상계좌 연결을 건너뛰고 관심종목을 선택할 수 있어야 한다. 연결 실패 시에는 실패 안내와 함께 다시 시도하거나 관심종목
        선택으로 진행할 수 있어야 한다.
      선행조건: 회원이 가상계좌 연결 단계에 있거나 연결 실패 안내를 보고 있다.
      입력값: 다시 시도 또는 건너뛰기 선택, 기존 연결 상태, 선택했던 가상계좌 프로필.
      입력·검증 규칙: '① 재시도 전에 현재 서버 연결 상태를 확인한다.

        ② 이미 동일 프로필 연결이 완료된 경우 다시 연결하지 않고 성공 상태를 사용한다.

        ③ 건너뛰기를 가상계좌 연결 성공으로 기록하지 않는다.

        ④ 건너뛰어도 초기 설정을 계속할 수 있다.

        ⑤ 동일 요청을 반복해도 연결 레코드가 중복 생성되지 않아야 한다.

        ⑥ 처리 중에는 동일 연결 버튼의 연속 실행을 방지한다.'
      처리 절차 및 분기: '① 연결 실패 시 다시 시도와 건너뛰기를 표시한다.

        ② 다시 시도 선택 시 서버에서 현재 연결 상태를 먼저 조회한다.

        ③ 이미 연결 완료 상태이면 해당 상태를 사용하여 다음 단계로 진행한다.

        ④ 미연결 상태이면 직전에 선택한 프로필 연결을 다시 수행한다.

        ⑤ 재시도 성공 시 보유종목을 표시하고 다음 단계로 진행한다.

        ⑥ 건너뛰기를 선택하면 가상계좌 연결 상태를 미연결로 유지하고 관심종목 선택 화면으로 이동한다.'
      정상 결과: '재시도가 성공하면 연결된 프로필의 보유종목을 확인할 수 있다.

        건너뛰면 관심종목 선택 화면으로 이동한다.'
      예외 처리: '재시도 실패: 실패 안내를 유지하고 다시 시도 또는 건너뛰기를 다시 선택할 수 있도록 한다.

        연결 상태 조회 실패: 새로운 연결 요청을 바로 수행하지 않고 연결 상태를 확인하지 못했습니다.를 표시한다. 상태 조회를 다시 시도하거나
        관심종목 선택으로 건너뛸 수 있도록 한다.

        처리 중 중복 클릭: 최초 요청 처리 중 추가 요청을 무시하고 버튼을 일시 비활성화한다.

        응답 지연: 10초를 기준으로 응답 지연 안내를 제공하고 상태 확인 후 재시도를 허용한다.

        기존 연결이 발견됨: 추가 연결 작업을 수행하지 않고 기존 연결 상태를 정상 결과로 사용한다.'
      수용 기준: '1. 연결 실패 후 재시도와 건너뛰기가 동작한다.

        2. 반복 요청이 연결 상태를 중복 변경하지 않는다.'
      확인 필요 사항: '[확인 필요: 재시도 허용 횟수·대기 시간·실패 시 연결 상태 정리 방식 결정 필요]

        [확인 필요: 재시도 접수 및 상태 확인 방식 결정 필요]'
  scopeClass: existing
