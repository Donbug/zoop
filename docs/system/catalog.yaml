  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 76
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 기업 및 사용자 통계 조사 및 확인
      기능 설명: 관리자는 인증된 별도 관리자 패널에서 관심 종목, 고정 Mock 보유 종목, 자주 확인한 노드 등을 요약 및 기업별 통계로
        확인한다. 온보딩 완료율, 그래프 노드·간선 클릭률, 브리핑 조회율 및 관심도, AI 질문 이용률을 포함하되 지표별 집계 정의가 확정되고
        필요한 원천 자료가 확보된 범위에서 제공한다. 통계에 사용자의 실명 등 개인 식별 정보를 포함하지 않는다.
      선행조건: 승인된 관리자가 관리자 통계 화면에 접근한다.
      입력값: 관심·고정 Mock 보유 종목의 현재 상태와 기준 시점, 노드·간선 및 온보딩·브리핑·AI 이용 기록, 선택 기업·조회 기간·집계
        기준 시점, 지표별 집계 단위·분자·분모·기간 기준.
      입력·검증 규칙: '관리자 권한을 확인하고 통계에서 실명 등 개인 식별 정보를 제외한다.

        지표별로 건수·중복 제외 사용자 수 등 집계 단위, 분자·분모, 기간에 사용하는 시각과 시간대·시작/종료 경계를 정의한다. 미확정 지표는
        임의로 산출하지 않고 기준 미정으로 구분한다.

        관심·고정 Mock 보유 종목의 현재 상태 통계와 기간 내 이용 이벤트 통계를 구분하고 각각의 기준 시점을 표시한다. Mock 보유
        통계를 실제 자산·거래 통계로 해석하지 않는다.

        요약과 기업별 상세는 같은 집계 정의와 원천 자료 범위를 적용한다. 같은 이용 이벤트의 중복 수집은 제외하되 실제 반복 이용과 구분한다.

        제거된 이슈-기업 간선 클릭을 실제 이용 이벤트로 집계하지 않는다. 간선 클릭 대상은 기업-기업 간선이며, 이슈-기업 간선은 표시 전용이다.
        클릭률의 분자·분모 정의는 별도 확정이 필요하다.'
      처리 절차 및 분기: '1. 관리자 권한과 조회 조건을 확인한다.

        2. 지표별 정의와 원천 자료의 수집·집계 가능 여부를 확인한다.

        3. 같은 기준으로 요약 및 기업별 통계를 산출하고 집계 단위·기간·기준 시점을 함께 표시한다.

        4. 정상 0건, 분모 없음, 기준 미정, 수집·집계 실패를 구분하여 표시한다. 개인 식별 정보는 제공하지 않는다.'
      정상 결과: 관리자가 정의·자료가 확보된 관심·고정 Mock 보유 및 이용 지표의 요약·기업별 상세를 집계 기준과 함께 확인한다. 산출하지
        못한 지표는 사유를 구분해 확인한다.
      예외 처리: '관리자 권한 없음: 통계를 제공하지 않는다.

        자료 수집·집계가 정상 완료되고 대상이 없음: 건수를 0으로 표시한다.

        분모가 0이거나 확보되지 않음: 비율을 계산 불가로 표시하며 0%로 대체하지 않는다.

        수집·집계 실패 또는 필요한 자료 누락: 영향을 받는 지표를 집계 불가로 표시하고 정상 0건과 구분한다.

        집계 정의 미확정: 해당 지표는 기준 미정으로 표시한다.'
      수용 기준: '1. 확정된 지표별 집계 단위·분자·분모·기간 기준으로 원천 자료와 요약·기업별 수치를 대조한다.

        2. 동일 이벤트 재수집은 중복 집계되지 않고 실제 반복 이용은 정의한 단위에 따라 처리된다.

        3. 정상 0건, 분모 0, 자료 누락·수집/집계 실패, 기준 미정이 구분되며 계산 불가 비율을 0%로 표시하지 않는다.

        4. 현재 상태와 기간형 이용 통계의 기준 시점이 표시되고 Mock 보유 통계가 실제 자산 통계로 표시되지 않는다.

        5. 권한 없는 사용자가 통계를 조회할 수 없고 사용자 실명 등 개인 식별 정보가 통계에 포함되지 않는다.

        6. 이미 명시된 필수 지표를 임의로 제외하지 않고 지표별 집계 정의를 확정·검증해야 한다. 기준 미정 표시만으로 해당 기능의 구현
        완료를 인정하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 정의가 확정된 지표만 산출하고 정상 0건·분모 없음·기준 미정·집계 불가를 구분한다.

        [확인 필요: 지표별 집계 목적·기간·시간대·기준 시각·경계, 집계 단위·중복 사용자 기준·분자·분모 결정 필요]

        [확인 필요: 통계 원천 기록의 허용 수집 범위·보존/삭제 연계와 소수 집계의 재식별 방지 등 익명성 범위 결정 필요]'
