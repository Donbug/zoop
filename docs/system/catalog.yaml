  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 219
      rowUnit: xlsx-row
    fields:
      기능명: 관리자 인증 및 접근 제어
      기능 설명: 서버에서 유효한 인증과 현재 승인된 관리자 권한을 확인한 계정만 허용된 관리자 화면·조회·변경 기능에 접근한다. 인증 만료
        또는 현재 권한 상실이 확인되면 보호 정보와 관리 조치를 차단한다. 실제 지원할 인증 방식·권한 등급은 별도 확정한다.
      선행조건: 사용자가 관리자 화면 또는 관리 기능에 접근하려 한다.
      입력값: 지원이 확정된 방식의 인증 정보/검증 결과 또는 현재 인증 상태, 서버에서 확인한 승인 관리자 여부·허용 기능/대상 범위, 접근하려는
        관리자 기능.
      입력·검증 규칙: '서버에서 인증의 유효성과 현재 승인된 관리자 여부·기능/대상 범위를 각각 확인한다. 일반 회원 로그인이나 인증 제공자의
        로그인 성공만으로 관리자 권한을 부여하지 않는다.

        클라이언트가 보낸 관리자 표시나 메뉴 노출 여부를 권한 근거로 사용하지 않는다. 관리자 화면 진입뿐 아니라 직접 조회·변경 요청에서도
        서버가 권한을 확인한다. 대화록의 별도 열람 권한·마스킹·필수 열람 기록 등 보호 기능의 추가 조건을 로그인 성공으로 우회하지 않는다.

        인증 만료·권한 회수가 확인되면 보호 정보 제공과 관리 조치를 거절한다. 이전 화면·응답·캐시로 권한을 우회하지 않으며 재로그인 후에도
        현재 승인 권한을 다시 확인한다.

        인증/권한 확인 장애·결과 불명은 승인으로 간주하지 않는다. 비밀번호·인증 토큰 등 비밀 인증정보를 오류 안내나 운영 기록에 노출하지
        않는다.

        SSO·ID/PW 등의 실제 지원 방식은 아직 확정되지 않았다. 지원 방식·권한 배정/회수·세션 반영 세부 정책은 미정으로 유지한다.'
      처리 절차 및 분기: '1. 사용자가 관리자 기능에 접근하면 서버가 현재 인증 상태를 확인한다.

        2. 미로그인·만료이면 인증을 요구하고 관리 기능을 실행하지 않는다. 지원이 확정된 방식으로 인증한다.

        3. 인증 성공 후 현재 승인 관리자 여부와 요청 기능·대상 범위를 확인한다.

        4. 확인된 허용 범위만 제공하고 상세 조회·변경에서도 권한을 검사한다. 재로그인만으로 이전에 거절된 변경 조치를 자동 재실행하지 않는다.'
      정상 결과: 유효한 인증과 현재 승인 권한이 확인된 관리자만 허용 범위의 화면·조회·변경 기능에 접근한다. 권한 없는 사용자에게 보호 결과나
        관리 조치가 제공되지 않는다.
      예외 처리: '미로그인·인증 만료: 인증을 요구하며 보호 정보와 관리 기능을 제공하지 않는다.

        일반 회원·미승인 관리자·권한 회수 또는 허용 범위 밖: 접근/실행을 거절한다. 재로그인 성공만으로 관리자 권한을 복원하지 않는다.

        인증 실패: 로그인을 완료하지 않고 인증 실패를 안내한다.

        인증 서비스·권한 조회 장애 또는 결과 불명: 확인 불가와 재확인을 안내하고 접근을 허용하지 않는다. 장애를 비밀번호 오류나 계정 없음으로
        단정하지 않는다.

        만료·현재 권한 상실 확인 후 이전 응답 도착: 보호 결과를 현재 화면에 표시하거나 이전 권한으로 변경을 실행하지 않는다.'
      수용 기준: '1. 일반 회원·미로그인·만료 인증·미승인/회수된 관리자 권한의 요청을 거절하고 유효한 승인 관리자만 허용 범위에 접근한다.

        2. 직접 관리자 요청이나 클라이언트의 관리자 표시를 바꿔도 서버 권한 검사를 우회하지 못한다.

        3. 인증 성공과 관리자 승인 확인이 구분되고 인증/권한 조회 실패를 승인으로 처리하지 않는다.

        4. 만료·현재 권한 상실 확인 후 이전 응답/캐시로 보호 정보가 노출되지 않으며 재로그인 후 현재 권한을 다시 검사한다.

        5. 비밀번호·인증 토큰이 오류/운영 기록에 노출되지 않고 재로그인만으로 이전 변경 조치가 자동 재실행되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 인증과 관리자 승인/기능 권한의 서버 검증, 만료·권한 상실·확인 장애 시 차단, 직접 요청/이전
        응답 우회 방지.

        [확인 필요: SSO·ID/PW 실제 지원 방식과 인증 제공자, 권한 등급·배정/회수 절차·세션 반영 방식 결정 필요]

        [확인 필요: 관리자 인증·권한 확인의 감사 기록 범위/보존 정책과 오류 안내·재확인 방식 결정 필요]'
