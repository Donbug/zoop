    rowUnit: xlsx-row
  detailRange: A49:B61
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 51
      rowUnit: xlsx-row
    fields:
      요구사항명: 부분 실패 내성
      요구사항 설명: 기업 상세, 관계 그래프, 브리핑 등 여러 영역으로 구성된 화면에서 한 영역의 조회가 실패하더라도 정상적으로 조회된 다른
        영역은 유지해야 한다. 실패 영역에는 오류 안내와 재시도 기능을 제공해야 하며, 재시도 시 해당 영역만 다시 조회해야 한다.
      적용 대상·범위: 기업 상세·관계 그래프·브리핑 등 여러 조회 영역으로 구성된 화면. 각 영역의 최초 조회, 실패 표시 및 재시도에 적용한다.
      적용 조건·검증 입력: '영역별 조회 결과·오류·현재 기업과 기간 등의 조건·최신 조회 식별자.

        정상 영역과 실패 영역이 함께 있는 화면 상태.'
      품질 목표·준수 규칙: '1. 한 영역의 실패가 정상 영역을 초기화하거나 숨기지 않아야 한다.

        2. 실패 영역만 오류와 재시도를 제공한다.

        3. 영역별 결과가 준비되는 대로 표시하되 실패한 영역의 재시도 때문에 정상 영역을 초기화하지 않는다.

        4. 재시도 결과도 해당 영역의 현재 조건과 일치할 때만 반영한다.

        v1.2 제안: 일시 조회 장애는 해당 영역 재조회, 자료 없음은 빈 상태, 권한 오류는 접근 제한으로 구분한다. 데이터 쓰기·AI
        생성 재시도는 단순 조회 재시도와 분리한다.'
      정상 상태: 정상 조회된 영역은 계속 사용할 수 있고, 실패한 영역에는 구분된 오류와 재시도 수단이 표시된다.
      미충족·예외 처리: '한 영역만 실패: 해당 영역에 오류를 표시하고 다른 정상 영역은 유지한다.

        재시도 중 조건 변경: 이전 조건의 재시도 응답을 현재 화면에 반영하지 않는다.

        이전 오류가 뒤늦게 도착: 새로 성공한 결과를 지우지 않는다.

        재시도 불가능한 오류(일시적 오류, 데이터 없음, 권한/요청 오류)의 안내·버튼 상태는 별도 정책으로 결정한다.'
      검증 방법: '1. 기업 상세에서 재무 조회만 실패시키고 개요·차트가 유지되는지 확인한다.

        2. 재무 재시도를 요청하여 실제로 재무 영역만 다시 조회되는지 확인한다.

        3. 재시도 중 기업·기간을 바꾸고 이전 응답의 반영 여부를 확인한다.

        4. 오류 응답을 지연시켜 성공 응답 이후에 도착하도록 한다.

        추천 조회만 실패시키고 검색을 수행한다. 관심 저장 성공 후 그래프 조회만 실패시켜 그래프 재조회가 관심 저장을 반복하지 않는지 확인한다.'
      수용 기준: '1. 재무만 실패시키면 개요·차트가 유지되고 재무 재시도만 발생한다.

        2. 오래된 실패 응답이 새 성공 결과를 지우지 않는다.

        3. 실패 영역 재시도 중에도 정상 영역과 사용자가 현재 선택한 조건이 유지된다.

        4. 재시도 결과가 현재 조건과 불일치하면 화면을 덮어쓰지 않는다.

        독립 조회 영역 장애가 다른 정상 영역과 편집 입력을 초기화하지 않는다. 조회 재시도가 저장·AI 생성을 다시 실행하지 않는다.'
      확인 필요 사항: '-'
