  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/05-출퇴근-브리핑.csv
      row: 121
      rowUnit: xlsx-row
    fields:
      기능명: 개인화 브리핑 조회
      기능 설명: 사용자는 선택한 출근·퇴근 회차에서 자신의 보유 종목과 관심 종목을 기준으로 개인화 브리핑을 요청할 수 있어야 한다.보유 비중이
        확보된 경우 분석에 활용하고, 어떤 종목과 기준 시점으로 작성된 결과인지 표시해야 한다. 보유 종목이 없으면 관심 종목을 기준으로 제공하며,
        둘 다 없으면 종목 설정 또는 공통 브리핑 조회를 안내해야 한다.
      선행조건: 로그인 회원이 출근·퇴근 회차를 선택하여 개인화 브리핑을 요청한다.
      입력값: 선택 회차와 데이터 기준 시점, 본인의 보유종목·관심종목, 확보된 보유 비중, 관련 이슈·영향 경로·근거.
      입력·검증 규칙: '본인의 보유·관심종목과 허용된 개인화 정보만 사용한다.

        보유 비중은 확보된 경우 활용하며 누락 값을 임의로 채우지 않는다.

        보유가 없으면 관심종목을 기준으로 제공한다.

        분석한 종목과 기준 시점을 결과에 표시한다.'
      처리 절차 및 분기: '1. 보유·관심종목을 기준으로 영향 내용을 구성한다.

        2. 보유 비중이 있으면 활용하고 없으면 임의로 채우지 않는다.

        3. 보유가 없으면 관심종목을 사용한다.'
      정상 결과: 선택 회차에서 본인 종목 중심의 개인화 브리핑과 분석 대상·기준 시점을 확인할 수 있다.
      예외 처리: '보유종목 없음·관심종목 있음: 관심종목 기준으로 제공한다.

        보유·관심종목 모두 없음: 종목 설정 또는 공통 브리핑 조회를 안내한다.

        보유 비중 없음: 임의 비중을 넣지 않는다.

        대상 회차 미발행·자료 부족·분석 장애: 발행 실패를 안내한다.'
      수용 기준: '1. 보유만·관심만·둘 다·둘 다 없음에서 요구된 분기가 동작한다.

        2. 다른 회원의 보유 정보가 포함되지 않는다.'
