      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 핵심 이슈 선정 및 제공
      기능 설명: 시스템은 각 브리핑에 핵심 이슈를 최대 3개 제공한다. 정해진 선정 기준에 따라 이슈 제목, 요약, 중요하게 선정한 이유와
        관련 기업을 표시해야 한다. 선정 기준을 충족하는 이슈가 부족하면 개수를 억지로 채우지 않아야 한다.
      선행조건: 출근 또는 퇴근 브리핑을 작성하고 있으며 이슈 후보를 확보했다.
      입력값: 이슈 후보, 영향 기업·제품 관계, 근거 문서, 발행·처리 시각
      입력·검증 규칙: '선정 기준을 충족한 이슈만 제공한다.

        회차당 최대 3개이며 적격 후보가 적으면 그 수만 제공한다.

        선정 이유는 실제 선정 근거와 연결되어야 한다.'
      처리 절차 및 분기: 동일 사건 후보를 통합하고, 중요도 점수 및 동점 규칙으로 최대 3개를 선정한다. 제목, 한 줄 요약, 선정 이유,
        관련 기업을 함께 구성한다. 이슈별로 후속 확인이 필요한 사실 조건이 있으면 확인할 사항을 최대 2개 생성한다.
      정상 결과: 이슈별 제목·유형·요약·선정 이유·관련 기업·근거 문서 ID·확인할 사항(0~2개)
      예외 처리: '적격 후보 0개: 이슈 없음 상태. 근거 문서 없음 또는 시점 불일치: 후보 제외.'
      수용 기준: '1. 적격 이슈가 1개이면 1개만, 4개 이상이면 최대 3개만 제공한다.

        2. 선정 이유가 실제 선정 근거와 연결된다.'
