        ⑨ 선택한 필터에 기준 종목이 없으면 해당 상태를 안내하고 다른 필터로 전환할 수 있도록 한다.① 회원의 보유종목과 관심종목을 조회한다.

        ② 기본 진입 시 전체 필터를 적용한다.

