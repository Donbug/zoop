        참조, 조건 확정 여부, 작업·검증·저장 상태, 답변 또는 안내 결과와 결과 종류, 실패 단계·사유.
      입력·검증 규칙: '대화 소유자와 작업의 연결을 확인하고, 기록 조회·결과 회수 시에도 현재 로그인·대화 소유권·근거 접근 권한을 검사한다.

        질문 작업 ID는 통신 추적 ID와 구분한다. 동일 작업 ID의 요청은 최초 내용과 일치해야 하며 새 질문·후속 질문·되묻기 보충 입력은
        새 작업으로 기록한다.

