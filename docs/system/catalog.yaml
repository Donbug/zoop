    fields:
      기능명: 같은 대화에서 후속 질문 전송
      기능 설명: 회원이 기존 답변에 이어 질문하면 같은 대화에 새 질문 작업을 생성한다. 최초 작업의 상태 조회·결과 회수와 구분한다.
      선행조건: 회원에게 현재 대화가 있고 후속 질문을 전송하려 한다.
      입력값: 현재 대화 ID, 후속 질문, 새로운 작업 ID, 질문 시점의 대상·기간·근거 참조와 대화 맥락.
      입력·검증 규칙: '빈 입력과 권한 없는 요청을 받지 않는다.

        같은 대화에 처리 중 작업이 있으면 다른 작업 ID의 질문도 서버에서 접수를 거절한다.

        후속 질문은 새 작업 ID를 사용하고 질문 시점의 맥락을 고정한다. 질문에 명시된 대상·기간이 기존 맥락보다 우선한다.

        기존 작업 ID의 재전송은 새 후속 질문으로 만들지 않고 기존 상태·결과 조회로 처리한다.'
      처리 절차 및 분기: '1. 회원이 후속 질문을 작성하고 전송한다.

        2. 서버가 권한과 동일 대화의 처리 중 작업을 확인한다.

        3. 접수 가능하면 같은 대화의 새 작업으로 등록하여 질문 시점의 맥락을 고정한다.

        4. 답변 또는 정상 종료 안내를 원래 질문 작업에 연결하고 실제 적용 조건을 표시한다.'
      정상 결과: 같은 대화 안에 별개의 질문·답변 작업이 순서대로 연결된다.
      예외 처리: '동일 대화 처리 중: 기존 작업의 진행 상태를 안내하고 입력 내용을 유지한다.

        응답 미수신: 해당 작업 상태를 확인하며 새 질문으로 복제하지 않는다.

        새 대상이 불명확: 확인 질문을 저장하여 완료하고 보충 입력은 새 작업으로 받는다.'
      수용 기준: '1. 같은 대화로 서로 다른 작업 ID를 동시에 보내도 신규 작업 하나만 접수된다.

        2. 후속 질문마다 새 작업 ID가 있고 기존 작업 재요청으로 질문 수가 증가하지 않는다.

        3. 이후 대화 대상이 바뀌어도 과거 작업 재시도의 원래 조건이 유지된다.'
      확인 필요 사항: 이번 보완 항목의 추가 미정 없음. 신규 동작은 v1.2 제안 기준이며 원본의 승인·구현 상태를 변경한 것은 아니다.
