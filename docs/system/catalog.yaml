- id: NFS007
  title: 성능 측정 기준
  section: 비기능 상세
  priority: P2
  status: 추가 제안 · 검토 전
  requirementIds:
  - '60'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 98
    rowUnit: xlsx-row
  detailRange: A91:B103
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 93
      rowUnit: xlsx-row
    fields:
      요구사항명: 성능 측정 기준
      요구사항 설명: 시스템은 동일한 네트워크 및 테스트 환경에서 화면 초기 표시, 일반 영역 조회, AI 질문 및 브리핑 생성 시간을 측정할
        수 있어야 한다. 백분위 응답시간을 기준으로 측정하며, 측정 환경과 표본 수를 함께 기록해야 한다.
      적용 대상·범위: 초기 화면 표시, 일반 영역 조회, AI 질문 처리, 출퇴근 브리핑 생성의 처리 시간 측정. 지원 환경이나 데이터 갱신
        기한 자체와는 별개의 측정 기준이다.
      적용 조건·검증 입력: '시험 네트워크·실행 환경, 데이터 규모, 동시 요청 조건, 기능별 시작·종료 이벤트, 개별 소요 시간과 표본 수.

        백분위 수준은 아래 v1.2 측정안을 적용하며 목표 응답시간은 미정이다.

        v1.2 측정안: 화면 진입부터 첫 유효 영역 표시까지, 영역 요청부터 현재 조건의 결과 표시까지, 질문 접수부터 검증·저장된 답변
        표시까지, 브리핑 회차 시작부터 발행 가능 저장 완료까지 각각 측정한다.'
      품질 목표·준수 규칙: '1. 백분위 응답시간으로 측정하고 환경·표본 수를 함께 기록한다.

        2. 기능별 시작/종료 이벤트를 구분해 비교 가능하게 한다.

        3. 서로 다른 측정 조건의 결과를 같은 기준의 성능 결과처럼 비교하지 않는다.

        4. 측정 구간·환경·표본을 기록하여 결과를 다시 확인할 수 있게 한다.

        5. 목표값이 정해지기 전에는 임의의 수치를 합격 기준으로 적용하지 않는다.

        성공 표본의 중앙값·95백분위·최댓값과 성공/실패/시간초과 건수를 함께 기록한다. 실패·시간초과를 빠른 성공 표본으로 치환하지 않고
        별도 집계한다. 시험 환경·동시 요청·데이터 규모·표본 수를 결과에 함께 명시한다.'
      정상 상태: 기능별 측정 구간·실제 측정값·환경·표본 수를 확인할 수 있고 같은 조건으로 측정을 반복할 수 있다.
      미충족·예외 처리: '목표값 미정: 측정 결과만 기록하고 성능 목표 달성을 선언하지 않는다.

        표본 누락·실패·시간초과: 성공 측정값으로 임의 대체하지 않는다. 실패·시간초과는 성공 소요시간 통계와 별도 건수로 기록한다. 누락
        표본은 측정 불완전으로 표시한다.

        시험 환경 변경: 기존 측정과 조건이 다름을 구분해 기록한다.'
      검증 방법: '1. 각 기능의 시작·종료 지점을 정한 뒤 동일한 환경에서 반복 실행한다.

        2. 기록된 구간별 시간과 표본 수를 원래 실행 기록과 대조한다.

        3. 정해진 백분위 수준으로 산출한 값이 같은 표본으로 재현되는지 확인한다.

        4. 목표값 미입력 상태에서 성능 합격으로 처리되지 않는지 확인한다.

        동일 실행 기록으로 성공 표본 통계와 실패·시간초과 건수를 다시 계산하여 측정 결과와 대조한다.'
      수용 기준: '1. 동일 조건으로 반복 측정하여 각 구간의 시간과 표본 수를 재현할 수 있는지 확인한다.

        2. 측정 조건·구간·표본 수와 구간별 시간을 확인할 수 있으면 측정 가능성의 기준을 충족한다.

        3. 응답시간 목표의 최종 합격 여부는 부하 조건·목표값 확정 전에는 판단하지 않는다.'
      확인 필요 사항: '[확인 필요: 목표 응답시간·동시 요청 수·데이터 규모·표본 수는 실제 서비스 측정 후 승인 필요]

        측정 방법 정의는 성능 목표 통과를 의미하지 않는다.'
