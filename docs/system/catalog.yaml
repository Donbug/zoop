    fields:
      기능명: 중복 발행 방지
      기능 설명: 시스템은 발행일과 출근·퇴근 구분을 기준으로 공통 브리핑의 회차를 식별하고, 같은 회차를 중복 발행하지 않아야 한다. 동일
        회차의 생성 요청이 반복되거나 실패 후 재시도하더라도 중복 발행하지 않아야 하며, 이미 발행된 브리핑을 재실행 결과로 임의 교체해서는
        안 된다.
      선행조건: 공통 브리핑 생성 요청이 도착하거나 동일 회차에 재요청·실패 재시도가 발생한다.
      입력값: 발행일, 출근·퇴근 구분, 기존 회차의 생성·발행 상태와 결과.
      입력·검증 규칙: '발행일과 출근·퇴근 구분으로 동일 회차 여부를 판단한다.

        동일 회차의 반복·동시 요청과 실패 재시도에서도 유효 발행 결과를 중복 생성하지 않는다.

        이미 발행된 본문은 재실행 결과로 임의 교체하지 않는다.'
      처리 절차 및 분기: '1. 발행일과 출근·퇴근 구분으로 회차를 식별한다.

        2. 기존 상태를 확인해 같은 회차를 중복 발행하지 않는다.

        3. 이미 발행된 내용을 재실행 결과로 임의 교체하지 않는다.'
      정상 결과: 한 회차에 하나의 유효한 발행 결과가 유지되고 정정은 원래 발행 이력과 구분된다.
      예외 처리: '동일 회차 요청 반복·동시 요청: 기존 상태를 확인하고 중복 발행을 방지한다.

        발행 완료 회차 재실행: 기존 발행 내용을 임의 교체하지 않는다.

        기존 상태를 확인할 수 없거나 재처리 가능한 실패인지 불명확: 발행 실패 처리. 재시도하지 않는다.'
      수용 기준: '1. 동시 요청·반복 요청·실패 재시도에도 중복 발행이 없다.

        2. 이미 발행된 본문이 재실행으로 덮이지 않는다.

        3. 출근 회차와 퇴근 회차는 같은 날짜라도 별개 회차로 유지된다.'
