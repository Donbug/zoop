- id: FS026
  title: 사이드바 기업 선택
  section: 메인 그래프
  priority: P1
  status: 확정
  requirementIds:
  - '26'
  source: &id010
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 36
    rowUnit: xlsx-row
  detailRange: A133:B145
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/03-메인-그래프.csv
      row: 135
      rowUnit: xlsx-row
    fields:
      기능명: 사이드바 기업 선택
      기능 설명: 사용자는 사이드바에서 선택한 기업을 중심으로 그래프를 확대 및 이동 시킬 수 있다.
      선행조건: 사용자가 메인 그래프와 사이드바를 보고 있다.
      입력값: 사이드바에서 선택한 기업 식별자, 현재 그래프 표시 범위와 탐색 위치.
      입력·검증 규칙: '사이드바 선택 기업과 그래프 이동·확대의 중심 기업이 일치해야 한다.

        현재 표시되지 않는 기업의 추가 조회 여부와 확대 수준은 임의로 확정하지 않는다.'
      처리 절차 및 분기: 1. 선택 기업을 중심으로 그래프의 확대와 위치 이동을 수행한다.
      정상 결과: 선택 기업을 중심으로 그래프가 확대·이동하여 탐색 대상이 된다.
      예외 처리: '기업 노드가 현재 표시 범위에 없음: [확인 필요: 추가 조회·필터 변경·안내 방식 결정 필요].

        선택 기업이 더 이상 유효하지 않거나 이동 처리 실패: [확인 필요: 오류 안내 방식 결정 필요]'
      수용 기준: 1. 사이드바 선택 기업과 그래프의 중심 대상이 일치한다.
      확인 필요 사항: '[확인 필요: 현재 그래프 범위 밖 기업 선택 시 추가 조회 여부와 확대 수준 결정 필요]

        [확인 필요: 추가 조회·필터 변경·안내 방식 결정 필요]

        [확인 필요: 오류 안내 방식 결정 필요]'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 139
      rowUnit: xlsx-row
    fields:
      기능명: 사이드바 기업 선택
      기능 설명: 사용자는 메인 화면의 사이드바에서 보유종목 및 관심종목 목록을 확인하고 기업을 선택할 수 있다. 선택한 기업이 현재 그래프에
        존재하면 해당 노드를 중심으로 이동·확대한다.
      선행조건: 사용자가 메인 그래프와 사이드바를 보고 있다.
      입력값: 선택 기업 식별자, 기업의 보유·관심 상태, 현재 그래프 상태.
      입력·검증 규칙: '① 사이드바에서 보유종목과 관심종목을 구분하여 표시한다.

        ② 보유종목도 관심종목으로 동시에 등록할 수 있다.

        ③ 동일 기업이 보유·관심 양쪽에 있는 경우 두 상태를 모두 확인할 수 있어야 한다.

        ④ 사이드바에서 선택한 기업과 그래프의 중심 기업이 일치해야 한다.'
      처리 절차 및 분기: '① 사이드바에서 기업을 선택한다.

        ② 현재 그래프에 해당 기업 노드가 있으면 해당 기업을 중앙으로 이동한다.

        ③ 선택 노드가 식별되도록 적정 수준으로 확대한다.

        ④ 그래프에 없는 경우 현재 필터 때문에 제외된 것인지 확인한다.

        ⑤ 필터상 표시 가능한 기업이면 필요한 그래프 데이터를 다시 조회한다.'
      정상 결과: 사이드바에서 선택한 기업이 그래프의 중심 탐색 대상이 된다.
      예외 처리: '현재 필터로 인해 제외된 기업: 해당 사실을 안내하고 관련 필터 전환을 제안한다.

        기업 정보가 더 이상 유효하지 않음: 오류 안내 후 기존 그래프를 유지한다.

        이동·조회 실패: 기존 그래프를 유지하고 재시도를 제공한다.'
      수용 기준: '사이드바의 선택 기업과 그래프의 중심 대상이 일치한다.

        보유·관심 상태가 사이드바와 그래프에서 일치한다.

        보유종목도 관심종목으로 동시에 표시될 수 있다.'
      확인 필요 사항: '확정: 사이드바는 보유종목 / 관심종목을 구분하여 표시한다.

        확정: 보유종목이면서 관심종목인 상태를 허용한다.

        확정: 현재 개인화 필터에서 제외된 기업을 선택하면 필터를 자동 변경하지 않고 사용자에게 필터 변경을 안내한다.

        확정: 그래프 이동 실패 시 기존 화면을 유지하고 재시도를 제공한다.

        확정: 확대 배율은 고정 숫자가 아니라 선택 기업과 직접 연결 관계가 식별 가능한 범위로 자동 계산한다.'
