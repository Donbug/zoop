    fields:
      기능명: 선택한 노드로 AI 질문
      기능 설명: 시스템은 그래프에서 선택한 노드에서 AI 질문을 선택하면 선택 대상, 적용 기간 및 근거 자료 정보를 질문에 연결하고, 사용자가
        연결된 대상을 확인한 뒤 질문을 보낼 수 있어야 한다.  관계 탐색, 자료 요약 및 허용된 개인화 질문에 공통 챗봇 규칙을 적용해야
        한다. 개인화 정보는 사용자의 조회 권한 범위에서만 활용해야 한다.
      선행조건: 로그인 회원이 그래프에서 노드를 선택한 뒤 AI 질문을 선택한다.
      입력값: 선택 대상 식별자, 적용 기간, 근거 참조, 사용자가 입력한 질문 및 대화·작업 식별 정보.
      입력·검증 규칙: '대상·기간·근거 참조를 질문창에 표시하고 실제 질문 작업에도 전달한다.

        사용자가 연결된 대상을 확인한 뒤 질문을 전송한다.

        서버에서 본인 대화와 대상·근거·개인화 정보 접근 권한을 확인한다.

        비회원의 질문 전송과 빈 입력, 같은 대화의 처리 중 추가 질문을 제한한다.'
      처리 절차 및 분기: '1. 선택 대상·기간·근거 참조를 질문 맥락에 연결한다.

        2. 사용자가 적용 대상을 확인하고 질문을 전송하도록 한다.

