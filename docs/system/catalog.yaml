  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 177
      rowUnit: xlsx-row
    fields:
      기능명: 발행 브리핑 정정 등록
      기능 설명: 관리자가 발행된 브리핑의 오류에 대해 정정을 등록하면 원래 발행 내용과 정정 내용·사유·시점을 구분하여 보존한다.
      선행조건: 발행된 브리핑에 오류가 확인되어 권한 있는 관리자가 정정을 요청한다.
      입력값: 대상 브리핑의 발행일·출근/퇴근 회차와 검토한 발행/정정 버전, 현재 제공 상태, 정정 내용·사유와 근거, 조치 시점, 정정 요청
        식별 정보.
      입력·검증 규칙: '서버에서 현재 정정 권한·대상 범위와 정확한 회차·버전·제공 상태를 확인한다. 검토 후 다른 정정·중단 조치가 반영됐으면
        오래된 요청을 그대로 적용하지 않고 현재 상태를 다시 확인한다.

        원래 발행 본문·근거·데이터 기준 시점/사용 자료 범위와 정정 내용·근거·사유·시점을 구분해 보존하고 정정이 어느 버전에서 이어졌는지
        연결한다. 이력 없는 원본 덮어쓰기를 허용하지 않는다.

        정정 내용에도 필수 근거·대상 연결과 검증 조건을 적용하며 관리자 입력만으로 미검증 내용을 공개하지 않는다. 정정 저장 성공과 사용자
        조회 반영 성공을 구분한다.

        같은 요청 재전송은 중복 정정을 만들지 않으며 저장된 처리 결과를 확인한다. 동일 요청 식별 정보에 다른 내용이 오면 충돌로 처리한다.

        정정 등록은 제공 중단·제공 재개와 별개다. 이미 중단된 회차의 정정만으로 공개를 재개하지 않는다. 원본 발행 버전과 이를 참조한 파생
        개인화 결과 버전의 의존 관계를 추적한다. 이후 개인화 결과 조회에서 원본의 현재 정정·중단 상태를 확인할 수 있도록 연계 조건을 담당자와
        확정한다. 구체적인 안내·차단·재생성 방식은 별도 정책을 따른다.'
      처리 절차 및 분기: '1. 관리자가 대상 회차·버전의 정정 내용·사유·근거를 입력한다.

        2. 서버가 현재 권한·대상 버전/상태·기존 요청 처리 여부와 정정 내용의 검증 조건을 확인한다.

        3. 원래 발행본을 유지하고 정정 버전·근거·사유·시점과 연결 이력을 저장한다.

        4. 저장된 정정 결과와 사용자 조회 반영 상태를 구분해 확인한다. 화면 표현은 승인된 정책을 따르고 중단된 회차는 정정만으로 공개하지
        않는다.'
      정상 결과: 원래 발행본과 정정 버전·근거·사유·시점이 구분되어 보존된다. 관리자는 정정 저장과 사용자 조회 반영 여부를 별도로 확인한다.
      예외 처리: '권한 없음·대상 범위 밖: 정정을 허용하지 않는다.

        정상 조회에서 대상 회차 없음: 대상 없음으로 안내한다. 대상/버전 확인 실패는 없음으로 단정하지 않는다.

        동시 정정·제공 상태 변경: 오래된 요청을 적용하지 않고 현재 버전·상태를 다시 확인한다.

        근거 부족·검증 실패: 정정 내용을 공개하지 않고 사유를 안내한다.

        정정 저장 실패·응답 미수신: 완료로 표시하지 않고 기존 요청 처리 여부·확정 버전을 확인한 뒤 재시도 여부를 판단한다. 저장 실패를
        이유로 정정 내용을 새로 생성하지 않는다.

        저장 성공 후 조회 반영 실패: 반영 미완료로 표시하고 보존된 정정 결과의 반영 단계만 복구한다. 중단 상태를 우회하지 않는다.'
      수용 기준: '1. 정정 후에도 원래 발행 본문·근거가 유지되고 정정 버전·내용·근거·사유·시점의 연결을 확인할 수 있다.

        2. 권한 없는 요청이나 검토 이후 상태/버전이 바뀐 오래된 요청이 정정을 적용하지 못한다.

        3. 같은 요청 재전송이 중복 정정을 만들지 않으며 저장/조회 반영 실패를 완료로 표시하지 않는다.

        4. 미검증 정정을 공개하거나 정정 등록만으로 중단된 회차를 재개하지 않는다.

        5. 저장된 정정과 실제 사용자 조회 반영 상태가 구분되며 기존 개인화 결과를 임의로 덮어쓰지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 회차/버전 확인, 원본·정정 이력 보존, 검증 및 중복 방지, 저장/조회 반영 구분과 중단
        상태 유지.

        [팀 협의 필요: 정정의 사용자 표시·승인 권한/단계, 원본 버전↔파생 개인화 결과의 영향 추적 및 이후 조회의 정정/중단 상태 확인
        연계를 담당자와 확정·검증해야 구현 완료로 인정한다. 구체적인 안내·차단·재생성 방식은 미정]

        [확인 필요: 정정 이력 보존·삭제 정책 및 반영 실패 복구 방식의 세부 운영 기준 결정 필요]'
