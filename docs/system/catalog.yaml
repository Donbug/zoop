      기능명: 새 대화 시작
      기능 설명: 사용자가 이전 대화와 독립된 주제로 질문할 수 있도록 ‘새 대화’ 기능을 제공해야 한다. 새 대화를 시작하면 별도의 대화 ID를
        부여하고 이전 대화의 질문·답변 및 선택 조건을 자동으로 이어받지 않아야 한다. 기존 대화 기록은 유지하며, 이전 대화에서 처리 중이던
        답변이 새 대화 화면에 표시되지 않아야 한다.
      선행조건: 로그인 회원이 AI 질문창에서 새 대화를 선택한다.
      입력값: 새 대화 시작 요청, 기존 대화와 진행 중 작업 상태.
      입력·검증 규칙: '기존 대화와 다른 별도 대화 식별자를 부여한다.

        이전 질문·답변·선택 조건을 자동 승계하지 않는다.

        기존 대화 기록은 유지하며 새 대화 시작을 삭제로 취급하지 않는다.

        이전 작업의 늦은 응답이 새 대화 화면에 표시되지 않도록 한다.'
      처리 절차 및 분기: '1. 별도의 대화 ID를 생성한다.

        2. 이전 질문·답변·선택 조건을 자동 승계하지 않는다.

        3. 이전 기록은 유지하되 이전 대화의 늦은 응답은 새 대화 화면에 표시하지 않는다.'
      정상 결과: 기존 맥락과 독립된 새 대화가 열리고 이전 대화 기록은 유지된다.
      예외 처리: '이전 대화의 지연 응답: 원래 작업에만 연결하고 새 대화 화면에 표시하지 않는다.

        새 대화 생성 실패: 기존 대화와 입력을 유지하며 오류·다시 시도를 안내한다.

        새 대화 요청 응답 미수신: 생성 결과를 먼저 확인하고 중복 대화를 만들지 않는다.

        이전 작업 처리 중: 새 대화 시작만으로 취소하거나 기록을 삭제하지 않는다.'
      수용 기준: '1. 새 대화 조건이 비어 있고 이전 기록은 유지된다.

        2. 이전 작업 완료가 새 대화에 붙지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 새 대화 실패 시 기존 대화 유지·응답 미수신 결과 확인.

        [확인 필요: 대화 보존 기간과 이전 대화 목록 제공 범위 결정 필요]'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/08-AI-챗봇-v2.csv
      row: 94
      rowUnit: xlsx-row
    fields:
      기능명: AI 패널 상태 유지와 결과 재조회
      기능 설명: 사용자가 AI 패널을 닫았다가 다시 열거나 네트워크 응답을 받지 못해도, 기존 질문 작업의 상태와 저장된 결과를 재조회할 수
        있다. 패널 닫기·재열기는 질문 취소나 새 AI 생성으로 처리하지 않는다.
      선행조건: 로그인 회원에게 기존 대화 또는 질문 작업이 있다.
      입력값: 대화 ID, 질문 작업 ID, 현재 사용자 권한, 작업 상태
      입력·검증 규칙: 패널 닫기는 상세 화면·대화·서버 작업을 삭제하거나 취소하지 않는다. 재열기와 응답 미수신 후 복구는 기존 작업 상태
        조회로 처리한다. 완료 작업은 저장된 답변을 반환하고, 처리 중 작업은 상태만 표시한다. 같은 작업을 중복 생성하지 않는다. 권한이
        바뀌면 보호된 대화·개인화 정보를 표시하지 않는다.
      처리 절차 및 분기: 1. 패널 재열기 또는 응답 미수신 시 기존 작업 상태를 조회한다.2. 완료면 저장 답변을 반환하고, 처리 중이면
        진행 상태를 표시한다.3. 서버가 실패를 확정한 경우에만 사용자가 같은 질문을 다시 전송할 수 있게 한다.4. 상세 기업이 바뀌어도
        기존 대화의 적용 맥락은 자동으로 바꾸지 않는다.
      정상 결과: 패널을 닫거나 일시적으로 연결이 끊겨도 기존 질문의 진행 상태 또는 저장 답변을 확인할 수 있다.
      예외 처리: '상태 조회 실패: 미등록·실패로 단정하지 않고 다시 확인 안내. 권한 변경: 대화 내용 숨김 및 로그인·권한 안내. 서버
        실패 확정: 실패 사유와 새 질문 또는 재시도 안내.'
      수용 기준: 1. 패널을 닫은 동안 완료된 질문은 재열기 시 저장 답변으로 확인된다.2. 응답 미수신 후 상태 조회만으로 중복 모델 호출이
        발생하지 않는다.3. 상세 기업 변경이 기존 대화의 적용 대상·기간을 자동 변경하지 않는다.
      확인 필요 사항: 처리 상태 자동 확인 간격과 최대 대기 시간은 구현 환경에서 측정 후 결정한다.
