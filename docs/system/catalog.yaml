- specId: FS017
  status: 구현
  detail: '내 종목 모드 안에 `전체 · 보유 N · 관심 M` 필터(9/30 팀 결정, 10-03 `04-메인그래프-v2` 9–19행).
    전체 = BFF 개인화 응답 그대로, 보유·관심 = 기준 기업 + 직접 이어진 사건 + 그 사건의 관련 기업 + 앞뒤 사건(프로토타입 가정:
    깊이 1단계, 화면에서 걸러 늦은 응답 없음). 둘 다인 기업은 두 필터에 한 노드로. 기본 전체, 같은 탭 세션 동안 유지, 새 탭·로그인·로그아웃이면
    전체. 고른 범위가 0개·관계 0건이면 빈 상태 + 다른 범위 전환(오류 아님), 종목 수를 못 받으면 불러오지 못함으로 구분. 이슈 국내/국제
    속성은 데이터가 없어 만들지 않음. 검증: `prototype/web/tests/personal-filter.test.ts`, 캡처 `docs/design/v7/graph-filter-*`'
  source:
    path: docs/evidence/spec-v1.2-gap.md
    row: 86
    rowUnit: text-line
