- specId: FS020
  status: 부분
  detail: 기본정보 → 시세/지표·모의 보유 → 이슈 → 관련 기업 → 뉴스 순서로 상세 요약을 추가했다(10-03 `04-메인그래프-v2`
    53행). 작은 1개월 가격 추이·받은 지표·현재가/등락·기준 시각/출처를 상세와 같은 조회 키로 읽는다. 시세 503 가로채기에서도 나머지
    영역 유지, 패널→상세에서 기업·시세·지표·가격·문서 성공 응답 각각 1건을 브라우저로 확인했다. 문서×기업 sentiment는 null이면
    숨기며 사건 자체 판정을 만들지 않는다. 생산자 없는 재무·AI 요약은 여전히 미제공. 캡처 `docs/design/v8/company-panel-*`
  source:
    path: docs/evidence/spec-v1.2-gap.md
    row: 103
    rowUnit: text-line
  codeLocations: []
  evidenceKind: 문서 판정 인용(이번 생성기의 실행 검증 아님)
- specId: FS021
  status: 부분
  detail: 10-06 회의 결정에 따라 공개 사건으로 연결된 문서×기업 단위 판정 모듈·공개 `sentiment` 필드를 추가했다. `positive/negative/mixed/undetermined`는
    기업의 사업·재무·평판에 대한 기사 사실의 성격이며 주가 전망이 아니다. 원문 부분 문자열 검사·응답 스키마·금지 표현 검사 실패는 폐기해
    공개 null, 같은 입력은 실패까지 캐시한다. 실제 모델 호출은 실행하지 않았고 데모에는 판정값을 넣지 않았다. 라벨 표기(FS021의 긍정/부정/혼재/판단
    보류 vs AI v1.3 가능 표현)는 팀 확인 필요. [설계](../design/sentiment.md), BFF 검증 `tests/test_sentiment.py`
  source:
