  detail: 'KOSPI·KOSDAQ·원/달러 3개(10-02 스크럼 확정, 10-03 `05-출퇴근-브리핑` 51행)를 회차를 만들 때 Yahoo
    차트(키 없음·비공식)에서 지표마다 독립으로 받아 발행본에 고정. 값·직전 거래일 대비 변화·등락률·**실제 관측 시각**·출처·상태(정상·지연·미제공·실패)를
    저장해 화면에 보인다. 출근 = 전 거래일 종가(전전 거래일 종가 대비)와 07:40 이전 최근 환율, 퇴근 = 당일 종가와 **18:05
    이전** 최근 환율(56행). 환율 변화 기준은 직전 평일 15:30 KST 값(프로토타입 가정). 한 지표의 실패·지연·미제공은 다른 지표와
    회차를 막지 않고 `불러오지 못했어요`와 `아직 없어요`를 글자로 구분(59행). 과거 날짜 회차는 그 기준 시각 **이전** 값만 쓰고(출처
    창 끝을 믿지 않고 BFF가 거름), 정확한 18:05 값이 없으면 실제 쓴 값의 시각을 적는다. **남은 것(팀 확인)**: 지연 판정 수치(환율
    30분, 지수는 양 지수 세션 날짜 불일치)는 프로토타입 가정이고 휴장일 달력은 두지 않았다. 59행의 `해당 카드 재시도`는 발행 뒤 값을
    바꾸지 않는다는 FS035와 충돌해 두지 않았다. 환율 `종가`의 정의(서울 외환 마감 15:30 vs 일봉)도 미정. 검증: `tests/test_briefing_market.py`,
    `prototype/web/tests/briefing-market.test.tsx`, 캡처 `docs/design/v7/briefing-*`'
