        미확정으로 남긴다.

        같은 대화에는 새 질문과 과거 실패 작업의 재실행을 포함해 동시에 유효한 실행 하나만 허용한다. 다른 작업이 처리 중이면 신규 접수·과거
        작업 재실행을 시작하지 않는다. 기존 상태 확인·저장 결과 회수는 허용하며 동일 작업 재전송을 새 실행으로 복제하지 않는다.

        현재 유효한 실행만 결과를 저장·갱신할 수 있고, 과거 실행의 늦은 완료가 최신 결과를 덮어쓰지 못하게 한다.

        답변뿐 아니라 되묻기·설정 안내·근거 부족에 따른 판단 보류도 저장 성공 후 완료 결과로 구분한다. 검증 실패·저장 실패를 정상 완료로
