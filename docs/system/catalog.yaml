  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/05-출퇴근-브리핑.csv
      row: 79
      rowUnit: xlsx-row
    fields:
      기능명: 공통 브리핑 조회
      기능 설명: 사용자는 날짜와 출근·퇴근 구분을 선택하여 해당 회차의 공통 시장 브리핑을 조회할 수 있어야 한다. 같은 회차를 조회한 사용자에게는
        동일하게 발행된 시장 요약, 주요 지표, 핵심 이슈, 관련 기업 및 주요 변수를 제공해야 한다. 화면에는 발행일, 출근·퇴근 구분과
        데이터 기준 시점을 표시해야 한다. 해당 회차가 아직 준비되지 않았거나 생성에 실패한 경우에는 그 상태를 안내해야 한다.
      선행조건: 사용자가 공통 시장 브리핑 화면에서 출근/퇴근 회차를 선택한다.
      입력값: 조회 날짜, 출근 또는 퇴근 구분.
      입력·검증 규칙: "모든 사용자에게 같은 발행본을 반환한다. \n비회원도 공통 브리핑은 조회할 수 있다. \n발행일·회차·생성 시각·데이터\
        \ 기준 시점을 항상 표시한다."
      처리 절차 및 분기: '1. 선택 회차에 발행된 공통 브리핑을 조회한다.

        2. 같은 회차에는 동일 발행 내용을 반환한다.'
      정상 결과: 선택 회차의 시장 요약·핵심 이슈·관련 기업·주요 변수가 회차 및 기준 시점과 함께 표시된다.
      예외 처리: '해당 회차가 아직 준비되지 않음: 준비 상태를 안내한다.

        생성 실패: 실패 상태를 안내한다.

        제공 중단된 회차: 정상 발행 상태로 노출하지 않는다. 제공 중단됨을 안내한다.

        조회 가능한 기간 밖의 요청: 조회할 수 없음을 안내한다.'
      수용 기준: '1. 서로 다른 사용자에게 같은 회차의 동일 본문이 제공된다.

        2. 날짜·회차 변경과 준비 중·실패 상태가 구분된다.'
