- id: FS009
  title: 가상계좌 프로필 연결
  section: 온보딩·튜토리얼
  priority: P1
  status: 보류
  requirementIds:
  - '9'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 18
    rowUnit: xlsx-row
  detailRange: A21:B33
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/02-온보딩-튜토리얼.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      기능명: 가상계좌 프로필 연결
      기능 설명: 회원은 서비스에서 미리 준비한 가상계좌 프로필 중 하나를 선택하여 자신의 초기 설정에 연결할 수 있다. 시스템은 해당 데이터가
        실제 증권계좌가 아닌 서비스 시연·체험용 모의 데이터임을 명확히 안내한다. 연결이 완료되면 해당 가상계좌의 보유종목을 개인화 그래프
        구성에 사용할 수 있다.
      선행조건: 로그인 회원이 가상계좌 연결 단계에서 준비된 프로필을 선택한다. 해당 기능은 원본에서 보류 상태이다.
      입력값: 선택한 가상계좌 프로필 식별자, 해당 프로필의 모의 계좌·보유종목 정보.
      입력·검증 규칙: '실제 증권계좌가 아닌 모의 데이터임을 안내한다.

        선택 프로필과 조회되는 계좌·보유종목이 일치해야 한다.

        실제 증권사 비밀번호나 인증서 등 자격 증명을 요구하지 않는다.

        연결 실패를 성공한 연결 정보로 저장하지 않는다.'
      처리 절차 및 분기: '① 화면에 실제 증권계좌가 아닌 서비스 체험용 모의 데이터입니다.라는 안내를 표시한다.

        ② 사용 가능한 가상계좌 프로필 목록을 조회한다.

        ③ 회원이 하나의 프로필을 선택한다.

        ④ 서버에서 해당 프로필의 유효성을 확인하고 모의 계좌·보유종목 정보를 조회한다.

        ⑤ 유효한 경우 현재 회원의 활성 가상계좌 프로필로 저장한다.

        ⑥ 연결된 프로필의 보유종목을 표시한다.

        ⑦ 이후 다른 프로필을 선택하면 기존 연결을 새 프로필로 교체한다.

        ⑧ 연결 해제를 선택한 경우 활성 가상계좌 연결을 제거하되 회원의 다른 초기 설정은 삭제하지 않는다.'
      정상 결과: 선택한 모의 프로필이 회원 연결 정보에 반영되고 해당 프로필의 보유종목이 표시된다.
      예외 처리: '존재하지 않거나 비활성화된 프로필: 연결하지 않고 최신 프로필 목록을 다시 조회하도록 안내한다.

        프로필 조회 실패: 현재 선택을 유지하고 재시도 또는 관심종목 선택으로 건너뛰기를 제공한다.

        빈 가상계좌: 유효한 프로필로 취급하되 현재 보유종목이 없습니다.를 표시한다. 연결 자체는 성공으로 처리한다.

        저장 실패: 이전 연결 상태를 유지하고 신규 선택을 연결 성공으로 표시하지 않는다.

        프로필 교체 실패: 기존 정상 연결을 유지하며 새 프로필로 변경하지 않는다.

        중복 요청: 동일 회원·동일 프로필의 연결 요청은 하나의 연결 상태로 처리한다.'
      수용 기준: '1. 프로필과 보유종목이 일치하고 모의 데이터 안내가 있다.

        ② 실제 증권사 인증정보를 요구하지 않는다.

        ③ 선택한 프로필과 표시되는 계좌·보유종목 정보가 일치한다.

        ④ 빈 프로필도 오류로 처리하지 않고 보유종목 없음으로 표시할 수 있다.

        ⑤ 다른 프로필로 변경하면 활성 프로필이 새 프로필로 교체된다.

        ⑥ 연결 실패 시 이전 정상 상태가 훼손되지 않는다.'
      확인 필요 사항: '가상계좌 연결은 원본 보류 상태를 유지한다.

        [확인 필요: 모의 데이터 제공 방식·프로필 구성 및 교체·해제·빈 계좌 처리·평가 산식·연결 완료 판단과 재연결 정책 결정 필요]

        [확인 필요: 선택 해제·재선택·빈 보유 정보 표시 방식 결정 필요]'
