- id: FS004
  title: 소셜 로그인과 회원가입
  section: 회원가입·로그인
  priority: P1
  status: 확정
  requirementIds:
  - '4'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 13
    rowUnit: xlsx-row
  detailRange: A49:B61
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/01-회원가입-로그인.csv
      row: 51
      rowUnit: xlsx-row
    fields:
      기능명: 소셜 로그인과 회원가입
      기능 설명: 이미 연동된 소셜 계정이면 해당 회원 계정으로 로그인한다. 처음 이용하는 소셜 계정인 경우 소셜 제공자로부터 수집한 이메일을
        기준으로 기존 회원 계정을 확인한다. 동일한 이메일로 가입된 기존 계정이 존재하면 신규 계정을 생성하지 않고 해당 기존 계정에 소셜
        계정 정보를 추가하여 연동한 후 로그인한다. 동일 이메일의 기존 계정이 없으면 새로운 회원 계정을 생성하고 소셜 계정을 연결한다. 서로
        다른 이메일을 사용하는 경우 동일 사용자라 하더라도 별도 계정으로 가입할 수 있다.
      선행조건: 사용자가 소셜 로그인 경로를 선택한 상태여야 한다. 서비스에서 지원하는 소셜 계정으로 인증할 수 있어야 한다. 소셜 계정 신규
        연동 또는 가입 처리를 위해 제공자로부터 서비스 정책상 필요한 사용자 식별 정보와 이메일을 수신할 수 있어야 한다.
      입력값: 선택한 소셜 제공자, 소셜 제공자가 반환하는 인증 결과, 소셜 제공자 사용자 식별값, 이메일 및 서비스에서 사용하는 추가 사용자
        정보.
      입력·검증 규칙: '① 서버에서 소셜 제공자의 인증 결과가 유효한지 검증한다.

        ② 소셜 제공자와 제공자 사용자 식별값을 기준으로 이미 연동된 소셜 계정인지 확인한다.

        ③ 이미 연동된 소셜 계정이면 연결된 기존 회원 계정으로 로그인한다.

        ④ 연동되지 않은 소셜 계정이면 소셜 제공자로부터 수신한 이메일을 기준으로 기존 회원 계정을 조회한다.

        ⑤ 동일 이메일의 기존 회원 계정이 존재하면 신규 회원 계정을 생성하지 않고 해당 회원 계정에 현재 소셜 계정 정보를 추가하여 연동한다.

        ⑥ 동일 이메일의 기존 회원 계정이 존재하지 않으면 신규 회원 계정을 생성하고 현재 소셜 계정 정보를 연결한다.

        ⑦ 동일한 소셜 계정의 반복 접속을 신규 가입으로 처리하여 회원 계정 또는 소셜 연동 정보가 중복 생성되지 않도록 한다.

        ⑧ 서로 다른 이메일은 동일 사용자 여부와 관계없이 별도 회원 계정으로 생성할 수 있다.

        ⑨ 인증 실패 또는 사용자 취소는 인증 성공으로 처리하지 않는다.

        ⑩ 이메일 비교 시 적용할 정규화 기준은 이메일 회원가입 기능의 이메일 중복 판정 기준과 동일하게 적용한다.'
      처리 절차 및 분기: '① 사용자가 지원하는 소셜 로그인 방식을 선택한다.

        ② 선택한 소셜 제공자의 인증 절차를 진행한다.

        ③ 사용자가 인증을 취소하거나 인증이 실패한 경우 로그인 또는 회원가입을 수행하지 않고 서비스 시작 화면에서 이용 방식을 다시 선택할
        수 있도록 한다.

        ④ 인증 결과를 수신하면 서버에서 인증 결과를 검증하고 소셜 제공자 사용자 식별값 및 이메일을 확인한다.

        ⑤ 소셜 제공자 + 제공자 사용자 식별값이 이미 기존 회원 계정에 연동되어 있는 경우 해당 회원 계정으로 로그인한다.

        ⑥ 기존 소셜 연동 정보가 없는 경우 소셜 제공자로부터 수신한 이메일과 동일한 이메일의 회원 계정이 존재하는지 확인한다.

        ⑦ 동일 이메일의 기존 계정이 존재하는 경우 해당 기존 계정에 현재 소셜 제공자 및 소셜 사용자 식별정보를 추가하여 연동하고 해당 계정으로
        로그인한다.

        ⑧ 동일 이메일의 기존 계정이 존재하지 않는 경우 신규 회원 계정을 생성하고 현재 소셜 계정 정보를 연결한 후 로그인한다.

        ⑨ 로그인 완료 후 초기 설정 완료 여부를 확인한다.

        ⑩ 초기 설정 미완료 사용자는 초기 설정 화면으로 이동한다.

        ⑪ 초기 설정 완료 사용자는 기존 보유종목과 관심종목을 기준으로 메인 화면에 진입한다.'
      정상 결과: 이미 연동된 소셜 계정은 기존 회원 계정으로 로그인된다. 처음 사용하는 소셜 계정이라도 동일한 이메일의 기존 회원 계정이 존재하면
        신규 계정을 생성하지 않고 기존 계정에 소셜 인증 정보가 추가되어 연동된 후 로그인된다. 동일 이메일의 기존 회원 계정이 존재하지 않으면
        신규 회원 계정을 생성하고 소셜 계정을 연결한 후 로그인된다.
      예외 처리: '인증 취소·실패: 시작 화면에서 다시 선택할 수 있도록 한다.

        인증 결과 검증 실패: 로그인 또는 가입 성공으로 처리하지 않는다.

        기존 동일 이메일 계정 존재: 해당 기존 계정에 현재 소셜 인증정보를 추가 연동하고 신규 계정을 생성하지 않는다.

        소셜 이메일 미제공: 기존 계정과의 이메일 기반 연동 여부를 판단할 수 없으므로 신규 계정 생성 또는 기존 계정 자동 연동을 수행하지
        않는다. 이메일 제공 동의를 다시 요청하거나 다른 로그인 방법을 안내한다.'
      수용 기준: '① 유효한 인증 결과의 기존 소셜 회원은 기존 계정으로 로그인된다.

        ② 유효한 인증 결과의 최초 사용자는 계정이 생성된다.

        ③ 같은 소셜 계정으로 반복 접속해도 계정이 중복 생성되지 않는다.

        ④ 인증 실패·취소 시 로그인 또는 가입이 완료된 것으로 처리되지 않는다.

        ⑤ 실패·취소 후 시작 화면에서 다른 이용 방식을 다시 선택할 수 있다.

        ⑥ 동일한 소셜 계정으로 반복 로그인해도 회원 계정 또는 소셜 연동정보가 중복 생성되지 않는다.

        ⑦ 서로 다른 이메일을 사용하는 경우 동일 사용자 여부와 관계없이 별도 회원 계정을 생성할 수 있다.

        ⑧ 인증 실패 또는 사용자 취소 시 로그인이나 회원가입이 완료된 것으로 처리되지 않는다.

        ⑨ 소셜 제공자로부터 이메일을 받을 수 없거나 기존 계정 연동에 사용할 수 없는 이메일인 경우 임의로 기존 계정에 연동하지 않는다.

        ⑩ 로그인 완료 후 초기 설정 미완료 사용자는 초기 설정 화면으로, 완료 사용자는 메인 화면으로 이동한다.'
      확인 필요 사항: '-'
