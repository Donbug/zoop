      수용 기준: '1. 같은 작업 재시도에서 원래 대상·기간·근거가 바뀌지 않는다.

        2. 되묻기 결과는 저장된 정상 종료 결과로 회수된다.'
      확인 필요 사항: 'v1.2 제안 기준: 한국 시간·작년의 달력 연도·최근 1개월 기본 해석. 응답마다 실제 적용 기간을 표시한다.'
