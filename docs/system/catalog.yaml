  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 51
      rowUnit: xlsx-row
    fields:
      기능명: 마스킹된 AI 대화록 조회
      기능 설명: 별도 대화록 열람 권한을 가진 관리자가 허용된 목적·대상 범위 안에서 개인정보를 마스킹한 AI 대화록을 확인한다.
      선행조건: 승인된 관리자가 열람 목적과 대상 대화록을 선택한다. 실제 열람에는 별도 권한·허용 목적/범위·마스킹 기준이 승인되어 적용되어
        있어야 하며, 세부 정책은 미정이다.
      입력값: 조회 대상 대화록·질문 작업·결과 버전의 식별 정보, 관리자 조회 조건과 열람 목적, 현재 열람 권한·허용 범위, 마스킹 기준과
        대상 대화 내용.
      입력·검증 규칙: '일반 관리자 역할과 별도로 현재 대화록 열람 권한, 허용 목적·대상 범위를 서버에서 확인한다. 통계 조회 권한만으로
        대화록 열람을 허용하지 않는다.

        확인된 대상·결과 버전에 승인된 마스킹 기준을 적용하고 성공한 허용 범위만 제공한다. 기준 미확정·마스킹 실패를 원문 제공으로 대체하지
        않는다.

        열람자·대상 식별 정보·시각·목적·처리 결과의 필수 열람 기록을 저장한 뒤 내용을 제공한다. 권한 확인·마스킹·필수 기록 저장 중 하나라도
        확인되지 않으면 보호 내용을 제공하지 않는다.

        화면 응답·오류 안내·운영/열람 기록에 마스킹 전 원문 개인정보를 중복 노출하지 않는다. 재조회에서도 현재 권한과 허용 범위를 다시
        확인한다.'
      처리 절차 및 분기: '1. 관리자가 대상 대화록과 열람 목적을 지정한다.

        2. 서버가 현재 열람 권한·허용 목적/범위와 정확한 대화록·결과 버전을 확인한다.

        3. 허용된 내용에 마스킹을 적용하고 필수 열람 기록을 저장한다.

        4. 모든 확인이 성공하면 마스킹된 내용을 제공한다. 실패하면 보호 내용을 차단하고 원문을 포함하지 않는 오류와 재조회 안내를 제공한다.'
      정상 결과: 관리자가 허용된 목적·범위 안의 마스킹된 대화록을 확인하고 열람 기록이 남는다. 결과 원문이나 허용 범위 밖의 대화는 함께
        제공되지 않는다.
      예외 처리: '권한 없음·허용 목적/범위 밖: 보호 내용을 제공하지 않는다.

        대상 삭제·버전 확인 불가: 이용 불가를 안내하고 다른 대화록이나 최신 버전으로 임의 대체하지 않는다.

        마스킹 기준 미확정·마스킹 실패: 열람을 차단하고 원문 개인정보가 없는 실패 사유를 기록한다.

        필수 열람 기록 저장 실패·완료 여부 불명: 내용을 제공하지 않는다.

        조회 장애: 정상 빈 대화록으로 표시하지 않고 오류·재조회를 제공한다. 이전 원문·캐시로 우회하지 않으며 재조회도 권한·마스킹·기록
        조건을 충족해야 한다.'
      수용 기준: '1. 일반 사용자, 별도 열람 권한이 없는 관리자, 허용 목적/범위 밖의 요청은 보호 내용을 받지 못한다.

        2. 정해진 마스킹 대상 시험용 개인정보가 제공된 대화록·오류·운영/열람 기록에 그대로 노출되지 않는다.

        3. 마스킹 또는 필수 기록 저장 실패·결과 불명 시 내용을 차단하며 원문·이전 캐시로 대체하지 않는다.

        4. 재조회 시 권한 회수와 대상 버전 변경·삭제를 확인하고, 조회 실패를 빈 대화록으로 표시하지 않는다.

        5. 정상 열람의 열람자·대상·시각·목적·처리 결과가 기록된다.

        6. 열람 권한·허용 목적/대상 범위와 대화 본문·인용을 포함한 필드별 마스킹 범위를 확정하고 적용을 검증하기 전에는 구현 완료로 인정하지
        않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 별도 현재 열람 권한·목적/범위 확인, 마스킹 및 필수 기록 저장 실패 시 차단, 원문 유출 방지.

        [확인 필요: 실제 권한 배정·허용 열람 목적·대상 범위·필드별 마스킹 목록 승인 필요]

        [확인 필요: 대화록과 열람/운영 기록의 보존·삭제 정책 및 필요한 승인 절차 결정 필요]'
