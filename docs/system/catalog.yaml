  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 79
      rowUnit: xlsx-row
    fields:
      기능명: 보류 이슈 검수 및 허용·거부
      기능 설명: 검수 권한이 있는 관리자가 보류 이슈의 근거와 사유를 확인하여 허용 또는 거부한다. 허용은 재검증 대상 전환이며 자동 검증과
        필수 근거 확인을 통과한 경우에만 공개 후보가 된다.
      선행조건: 검수 권한이 있는 관리자가 현재 보류 상태인 이슈와 관련 기업 관계의 결과 버전·보류 사유·근거를 확인한다.
      입력값: 보류 이슈·관련 기업 관계 및 검수 대상 결과 버전, 검토 당시 상태·근거 버전, 허용 또는 거부 선택과 사유, 검수 요청 식별
        정보.
      입력·검증 규칙: '현재 검수 권한·대상 범위를 가진 관리자만 결정한다. 저장 전에 대상 결과 버전·현재 보류 상태·검토한 근거가 유효한지
        확인한다. 확인 이후 저장 시점에 상태나 버전이 달라지면 결정을 적용하지 않는다.

        허용·거부의 대상/버전·사유·처리자·시각·이전 상태를 기록하며 결정과 필수 변경 이력의 저장을 확인한 뒤 성공으로 표시한다.

        같은 요청의 재전송은 중복 결정·재검증을 만들지 않는다. 다른 관리자의 결정이나 대상·근거 버전 변경이 먼저 반영됐으면 이전 화면의
        결정을 적용하지 않고 다시 검토한다.

        허용은 저장된 해당 결과의 재검증 대상 전환이다. 자동 검증을 통과하고 필수 근거·연결이 완결된 경우에만 공개 후보로 전환한다.

        수동 허용으로 검증 실패·근거 누락을 덮지 않는다. 실제 공개 완료는 저장 및 그래프·기업 상세의 공통 공개 버전 전환을 별도로 확인한다.
        거부된 대상 결과는 공개에서 제외한다.'
      처리 절차 및 분기: '1. 관리자가 정확한 대상 결과 버전의 보류 사유와 근거를 확인하고 허용·거부 및 사유를 선택한다.

        2. 서버가 현재 권한, 대상·근거 버전과 보류 상태, 요청의 기존 처리 여부를 확인한다.

        3. 검수 결정과 필수 변경 이력을 저장하고 확정 결과를 반환한다. 중복 요청이면 기존 처리 결과와 현재 상태를 반환한다.

        4. 허용이면 해당 결과를 재검증하고 통과한 결과만 공개 반영 절차로 전달한다. 검증 실패·근거 부족은 공개하지 않고 사유를 유지한다.

        5. 거부이면 해당 결과를 공개 제외 상태로 유지한다. 결정 저장·재검증·실제 공개 반영 상태는 따로 표시한다.'
      정상 결과: 관리자가 대상 결과 버전의 확정된 검수 결정과 이력을 확인하며 재검증 및 실제 공개 반영 여부를 별도로 확인한다.
      예외 처리: '권한 없음·대상/근거 버전 변경·동시 결정으로 상태 변경: 이전 화면의 결정을 적용하지 않고 현재 상태와 근거를 다시 확인한다.

        결정 또는 필수 이력 저장 실패·응답 미수신: 성공으로 표시하지 않고 요청 처리 여부와 현재 상태부터 확인한다. 확인 실패를 미처리로
        단정해 재전송하지 않는다.

        중복 요청: 기존 처리 결과를 반환하고 검수 결정·재검증을 중복 실행하지 않는다. 같은 요청 식별 정보에 다른 내용이 오면 충돌로 처리한다.

        허용 후 재검증 실패·근거 부족: 공개하지 않고 실패 사유를 표시한다. 결정 저장 재시도만으로 분석을 새로 생성하지 않는다.

        재검증 통과 후 공개 반영 실패: 공개 완료로 표시하지 않고 실패 단계를 구분한다. 거부된 결과는 이전 공개 버전 조회에서도 노출하지
        않는다.'
      수용 기준: '1. 허용·거부가 검토한 현재 보류 결과 버전에만 적용되며 권한 없는 요청은 상태를 바꾸지 못한다.

        2. 검토 후 대상/근거 버전 또는 상태가 바뀌면 오래된 결정을 적용하지 않는다. 동시·중복 요청이 상충 결정이나 중복 재검증을 만들지
        않는다.

        3. 결정과 필수 이력 저장 확인 전에는 성공으로 표시하지 않고, 응답 미수신 시 기존 처리 여부를 확인한다.

        4. 허용해도 검증 실패·근거 누락이면 공개하지 않으며, 재검증 통과·저장·두 화면 공개 반영이 구분된다.

        5. 거부된 결과는 이전 버전 조회를 포함해 공개에서 제외되고 결정 저장 재시도가 새 분석을 생성하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 대상·근거 버전 확인 후 결정/이력 저장, 중복·동시 결정 방지, 허용 후 재검증과 공개
        우회 금지.

        [확인 필요: 검수 관리자 권한 배정·대상 범위와 필요한 승인 단계 결정 필요]

        [확인 필요: 검수 사유·변경 이력의 보존·삭제 연계 정책 승인 필요]'
