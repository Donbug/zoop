    row: 45
    rowUnit: xlsx-row
  detailRange: A105:B117
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/05-출퇴근-브리핑.csv
      row: 107
      rowUnit: xlsx-row
    fields:
      기능명: 브리핑 회차 저장 및 이력 보존
      기능 설명: 시스템은 출근·퇴근 브리핑의 회차별 내용·시간 정보·사용 이슈와 근거를 저장한다. 발행 이후 새 뉴스나 시장 데이터가 수집되어도
        과거 발행 내용과 근거 참조를 자동으로 덮어쓰지 않고 보존한다.
      선행조건: 출근·퇴근 브리핑의 생성·발행 결과를 저장하거나 과거 회차의 내용과 근거를 조회한다.
      입력값: 회차 날짜·발행일·출근/퇴근 구분, 생성 시각, 데이터 기준 시점, 사용 자료 기간, 본문, 핵심 이슈, 관련 기업·영향 경로,
        주요 변수, 근거 자료 참조.
      입력·검증 규칙: '본문과 시간 정보·사용 이슈·근거를 같은 회차에 연결한다.

        서로 다른 회차의 이슈·근거를 혼합하지 않는다.

        발행 시점 내용을 보존하고 후속 뉴스나 시장 값으로 자동 변경하지 않는다.

        정정이 있으면 원래 내용과 정정 내용을 구분한다.

        동일 회차 재저장·재발행으로 중복 발행이나 원본 덮어쓰기가 발생하지 않게 한다.'
      처리 절차 및 분기: '1. 시스템은 생성·발행 대상 회차의 날짜·종류·생성 시각·기준 시점·사용 자료 기간을 내용과 연결한다.

        2. 본문·핵심 이슈·관련 기업·영향 경로·주요 변수·근거 참조를 회차별로 저장한다.

        3. 저장된 회차의 내용과 작성에 사용된 자료 범위를 다시 조회할 수 있게 한다.

        4. 신규 자료가 수집되어도 과거 발행 내용과 근거 참조를 자동으로 덮어쓰지 않는다.

        5. 정정 시에는 원래 내용과 정정 내용을 구분해 보존한다.'
      정상 결과: '한 회차당 하나의 발행본, 상태 이력, 발행 시점의 본문·근거·그래프 스냅샷 보존

        회차별 브리핑 내용·이슈·영향 경로·변수·근거와 생성 시각·데이터 기준 시점·사용 자료 기간을 다시 조회하고 추적할 수 있다.'
      예외 처리: '신규 뉴스·시장 값 변경: 과거 본문과 근거 참조를 덮어쓰지 않는다.

        동일 회차 재저장·재발행 요청: 중복 발행과 원본 덮어쓰기를 방지한다.

        외부 근거 원문 접근 불가: 저장된 참조와 확보된 메타데이터를 유지하고 접근 불가를 안내한다.

        저장 실패: 성공한 이력으로 표시하지 않는다. 발행하지 않는다.'
      수용 기준: '1. 저장 후 회차·본문·사용 자료 기간·생성 시각·기준 시점·이슈·근거를 다시 조회할 수 있다.

        2. 신규 뉴스 수집 전후에 기존 발행 본문과 근거 참조가 보존된다.

        3. 서로 다른 회차의 이슈·근거가 혼합되지 않는다.

        4. 외부 원문을 열 수 없어도 확보된 참조와 메타데이터가 유지된다.

        5. 저장 실패가 정상 저장 완료로 표시되지 않는다.'
  scopeClass: existing
