  detailRange: A161:B173
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 163
      rowUnit: xlsx-row
    fields:
      요구사항명: 정기 갱신 반영 시간 보장
      요구사항 설명: 정상 운영 시 시스템은 한국 시간 기준 매시 05분에 시작한 회차의 공개 대상 결과를 해당 시각 10분까지, 매시 35분에
        시작한 회차의 결과를 해당 시각 40분까지 조회 가능하게 해야 한다. 완료 여부는 저장소 반영만이 아니라, 메인 그래프와 기업 상세페이지
        조회에서 해당 새 결과를 확인할 수 있는지를 기준으로 판단해야 한다.
      적용 대상·범위: 정상 운영 중 한국 시간 매시 05분·35분에 시작하는 경제뉴스 수집·분석 회차의 공개 대상 결과. 메인 그래프와 기업
        상세페이지의 조회 반영을 모두 포함한다.
      적용 조건·검증 입력: '한국 시간 기준 예정 시작·실제 시작 시각, 회차 식별자, 공개 대상 결과·공개 버전과 처리 상태, 두 화면의
        기업·기간·선택 조건, 각 조회 경로의 확인 시각.

        신규 공개 결과가 0건이면 정상 제외·검증 탈락·보류·실패 사유를 구분한다. 표시 데이터의 기준 시점과 이번 회차 확인 시점을 별도로
        기록한다.

        회차별 기사·문서 수, 문서 길이의 단위와 분포, 분석 대상 수, 동시 처리 조건 및 시험환경을 기록한다. 실제 시험 처리량과 승인할
        예상 운영범위를 구분한다.'
      품질 목표·준수 규칙: '1. 한국 시간 매시 05분 예정 회차는 10분까지, 35분 예정 회차는 40분까지 공개 대상 새 결과를 메인
        그래프와 기업 상세의 새 조회에서 확인할 수 있어야 한다. 시작이 늦어져도 기한을 임의 연장하지 않는다.

        2. 저장 완료만으로 달성 판정하지 않는다. 두 조회 경로의 준비를 확인한 공통 공개 버전을 사용하며 각 화면의 기업·기간·선택 조건에
        맞는 결과를 확인한다.

        3. 기한을 맞추기 위해 처리 중·검증 실패·보류 결과를 공개하지 않는다. 부분 성공을 회차 전체 성공으로 표시하지 않는다.

        4. 신규 자료 없음·관련성 없음 등 정상 제외로 완료된 0건 회차는 기존 유효 결과와 공개 버전을 유지하고 회차 확인 시점을 기록한다.
        검증 탈락·보류·실패에 따른 0건과 구분한다.

        5. 장애·시작 지연은 예정·실제 시작과 영향을 기록하며 정상 기한 준수로 섞지 않는다. 기한 내 확인 기록이 없으면 달성으로 추정하지
        않는다.

        6. 이 기준은 두 화면의 새 조회 반영 기한이다. 이미 열린 화면의 동시 자동 새로고침이나 브리핑 생성 시각을 뜻하지 않는다.'
      정상 상태: 공개할 새 결과가 있으면 기한 이내 두 화면의 새 조회에서 공통 공개 버전과 해당 회차 결과를 확인한다. 정상 0건 회차는
        기존 유효 결과를 유지하면서 기한 내 0건 완료와 회차 확인 시점을 확인한다.
      미충족·예외 처리: '저장소에만 반영·캐시 미갱신·한쪽 조회 준비 실패: 반영 완료로 판정하지 않고 두 경로에 공통의 기존 유효 버전을
        유지한다. 현재 공개 제외된 항목은 이전 버전에서도 제공하지 않는다.

        신규 자료 없음·정상 제외로 0건: 0건 사유·완료·회차 확인 시점을 기록한다. 기존 데이터 시점을 새 데이터 시점으로 바꾸거나 0건만으로
        갱신 지연을 표시하지 않는다.

        검증 탈락·보류·처리 실패로 0건: 실제 상태와 원인을 기록하고 정상 0건 완료로 바꾸지 않는다.

        기한 초과·시작 지연·장애: 실제 지연과 미완료 상태를 기록한다. 필요한 저장·조회 반영 단계만 복구하며 기한 달성을 위해 AI 분석이나
        미검증 결과 공개를 반복하지 않는다.

        관측 누락: 기한 내 반영 여부는 확인 불가로 표시한다. 늦게 확인된 결과를 기한 내 완료로 소급하지 않는다.'
      검증 방법: '1. 예상 운영범위의 기사·문서 수, 문서 길이, 분석 대상 수와 동시 처리 조건으로 시험한다. 시험환경·실제 처리량, 05분·35분
        회차의 예정·실제 시작과 마감, 공개 대상·공개 버전을 기록한다.

        2. 대상 결과가 조회되는 기업·기간 조건으로 메인 그래프와 기업 상세를 새로 조회하여 각 확인 시각·회차·공개 버전을 대조한다.

        3. 저장 성공 후 캐시 미갱신, 한쪽 준비 실패, 이전 회차의 늦은 완료를 발생시켜 잘못된 완료·공개 버전 되돌림이 없는지 확인한다.

        4. 신규 자료 없음·정상 제외 0건과 검증 탈락·보류·처리 실패 0건을 각각 시험한다. 기존 유효 결과·회차 확인 시점과 실패 원인이
        구분되는지 확인한다.

        5. 시작 지연·기한 초과·관측 누락을 각각 시험하여 임의 기한 연장이나 소급 완료가 없는지 확인한다. 부분 성공을 전체 성공으로 기록하거나
        미검증 결과를 공개하지 않는지도 확인한다.'
      수용 기준: '1. 예: 09:05 예정 회차는 09:10까지, 09:35 예정 회차는 09:40까지 두 새 조회 경로에서 공통 공개 버전의
        해당 회차 결과가 확인된다.

        2. 저장만 성공하거나 한 화면이 이전 결과를 반환하면 반영 미완료다. 이전 회차의 늦은 완료가 최신 공개 버전을 되돌리지 않는다.

        3. 정상 0건 회차는 기한 내 두 조회 경로의 정상 상태·기존 유효 결과·공개 버전 유지·0건 사유와 회차 완료를 확인한다. 데이터
        기준 시점과 회차 확인 시점은 구분된다.

        4. 검증 탈락·보류·실패로 인한 0건, 부분 성공, 장애·지연은 각각 실제 상태로 기록되고 정상 전체 완료로 합쳐지지 않는다.

        5. 기한 내 관측 기록이 없으면 기한 달성으로 판정하지 않는다. 미검증 결과 공개나 불필요한 AI 재호출로 기한 미달을 숨기지 않는다.

        6. 승인된 예상 운영범위와 시험환경에서 위 기한을 검증하고 회차별 처리량을 결과와 함께 남긴다. 범위 미정·미시험이면 전체 운영범위의
        기한 보장 검증을 완료로 선언하지 않는다.'
      확인 필요 사항: '[확인 필요: 예상 운영 처리량 범위(기사·문서 수·문서 길이·분석 대상 수·동시 처리)와 대표 시험환경을 최종 완료
        검증 조건으로 확정 필요. 처리량 수치를 임의로 정하거나 기한을 완화하지 않는다]

        [확인 필요: 실제 확인 간격·대상 표본 범위·회차별 공개 대상 확정 시점·장애 분류·경보 및 복구 운영 기준 검증 필요]'
