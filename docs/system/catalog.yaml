      기능 설명: 시스템은 로그인 성공 후 초기 설정 완료 여부를 확인해야 한다. 미완료 사용자는 초기 설정 화면으로, 완료 사용자는 기존 보유종목과
        관심종목을 기준으로 메인 화면에 진입시켜야 한다.
      선행조건: 이메일 또는 소셜 인증에 성공한 회원의 서비스 진입을 처리하는 상태이다.
      입력값: 인증된 회원의 식별 정보, 해당 회원의 초기 설정 완료 여부, 저장된 보유종목·관심종목.
      입력·검증 규칙: '초기 설정과 종목 정보는 로그인한 본인 계정의 정보로 확인한다.

        미완료와 완료를 구분하며, 다른 회원의 설정으로 진입 화면을 결정하지 않는다.'
      처리 절차 및 분기: '1. 초기 설정이 미완료이면 초기 설정 화면으로 이동한다.

        2. 완료이면 저장된 보유·관심종목을 기준으로 메인 화면을 연다.'
      정상 결과: '초기 설정 미완료 회원은 초기 설정 화면으로 이동한다.

        완료 회원은 저장된 보유·관심종목을 기준으로 메인 화면에 진입한다.'
      예외 처리: '저장된 종목이 모두 없는 경우: 초기 메인 진입에서는 전체 시장 그래프를 제공한다. 이후 개인화 모드를 직접 선택하면 종목
        설정을 안내한다.

        초기 설정 상태 조회 실패: [확인 필요: 실패 안내와 재조회·이동 방식 결정 필요]'
      수용 기준: '1. 완료·미완료 계정의 진입 화면이 구분된다.

        2. 다른 회원의 설정이 적용되지 않는다.'
      확인 필요 사항: '[확인 필요: 초기 설정 완료 판정 시점과 중간 단계 재개 방식 결정 필요]

        종목 없음 분기는 기존 초기 그래프 제공 및 개인화 그래프 규칙을 함께 적용한다.

        [확인 필요: 실패 안내와 재조회·이동 방식 결정 필요]'
  scopeClass: existing
- id: FS007
  title: 로그아웃
  section: 회원가입·로그인
  priority: P1
  status: 확정
  requirementIds:
  - '7'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 16
    rowUnit: xlsx-row
  detailRange: A91:B103
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/01-회원가입-로그인.csv
      row: 93
      rowUnit: xlsx-row
    fields:
      기능명: 로그아웃
      기능 설명: 사용자는 로그아웃할 수 있어야 한다. 로그아웃이 완료되면 현재 인증 상태를 해제하고 이전 회원의 보유종목, 관심종목, 대화
        등 개인화 정보가 화면에 표시되지 않도록 해야 한다. 로그아웃 완료 후에는 이메일 로그인, 소셜 로그인 등 로그인을 다시 수행할 수
        있는 로그인 화면으로 이동한다.
      선행조건: 회원이 로그인한 상태에서 로그아웃을 선택한다.
      입력값: 로그아웃 요청, 현재 인증 상태, 현재 화면에 표시된 개인화 정보와 진행 중 조회 상태.
      입력·검증 규칙: '① 로그아웃 요청은 현재 인증된 회원의 인증 상태를 대상으로 처리한다.

        ② 로그아웃 완료 후 이전 회원의 보유종목, 관심종목, 대화 등 개인 정보가 현재 화면에 표시되지 않아야 한다.

        ③ 로그아웃 이후 도착한 이전 회원의 비동기 조회 결과나 AI 응답을 화면에 반영하지 않는다.

        ④ 로그아웃을 기존 대화 기록이나 회원 데이터의 영구 삭제로 처리하지 않는다.

        ⑤ 로그아웃 완료 후 로그인 화면으로 이동해야 한다.

        ⑥ 로그인 화면으로 이동한 이후 인증이 필요한 이전 화면 또는 API에 접근할 경우 미인증 사용자로 처리한다.'
      처리 절차 및 분기: '① 사용자가 로그아웃을 요청한다.

        ② 서버의 현재 인증 세션 또는 인증 토큰을 무효화한다.

        ③ 클라이언트에 보관된 현재 회원의 인증 정보와 개인화 상태를 제거한다.

        ④ 진행 중인 개인화 조회나 AI 질의가 있는 경우 해당 요청 결과가 이후 화면에 반영되지 않도록 현재 회원 세션과 분리한다.

        ⑤ 화면에 표시 중인 보유종목, 관심종목, 대화 등 이전 회원의 개인 정보를 제거한다.

        ⑥ 로그아웃 처리가 정상 완료되면 로그인 화면으로 이동한다.

        ⑦ 로그인 화면에서는 사용자가 다시 이메일 로그인 또는 소셜 로그인 등 지원되는 로그인 방식을 선택할 수 있다.'
      정상 결과: 현재 회원의 인증 상태가 해제되고 이전 회원의 개인화 정보가 화면에서 제거된다. 이후 로그인 화면으로 이동하며, 보호된 기능은
        다시 로그인하기 전까지 이용할 수 없다.
      예외 처리: '로그아웃 이후 이전 회원의 지연 응답 도착: 현재 인증 세션 또는 요청 소유자와 일치하지 않는 응답은 화면에 반영하지 않고
        폐기한다.로그아웃 서버 처리 실패: 현재 화면에서 로그아웃 실패를 안내하고 재시도를 제공한다. 서버의 인증 상태를 확인할 수 없는 상태에서
        임의로 로그아웃 성공으로 표시하지 않는다.

        서버 응답 미수신 또는 시간 초과: 인증 상태를 재확인한다. 서버에서 이미 인증이 해제된 것으로 확인되면 로컬 인증정보를 정리하고 로그인
        화면으로 이동한다. 인증 상태를 확인할 수 없으면 오류 안내와 재시도를 제공한다.로그아웃 성공 후 로그인 화면 이동 실패: 인증 상태는
        로그아웃 상태로 유지하며 이전 회원 정보를 다시 표시하지 않는다. 로그인 화면 이동을 재시도하고 실패 시 서비스 시작 화면 또는 로그인
        진입 경로를 제공한다.'
      수용 기준: '① 로그아웃 성공 시 현재 인증 상태가 해제된다.

        ② 로그아웃 직후 이전 회원의 보유종목, 관심종목, 대화 등 개인 정보가 화면에 남지 않는다.

        ③ 로그아웃 이후 도착한 이전 회원의 지연 응답도 화면에 표시되지 않는다.

        ④ 로그아웃 완료 후 로그인 화면으로 이동한다.

        ⑤ 로그인 화면으로 이동한 뒤 보호된 기능을 호출하면 미인증 사용자로 처리된다.

        ⑥ 로그아웃을 수행해도 기존 회원의 대화 기록이나 저장 데이터 자체가 삭제되지 않는다.

        ⑦ 로그아웃 후 다른 회원이 로그인하더라도 이전 회원의 개인화 정보가 새 회원 화면에 표시되지 않는다.'
      확인 필요 사항: '-'
  scopeClass: existing
- id: FS008
  title: 투자 여부 선택
  section: 온보딩·튜토리얼
  priority: P1
  status: 확정
  requirementIds:
  - '8'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 17
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/02-온보딩-튜토리얼.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 투자 여부 선택
      기능 설명: 처음 이용하는 회원은 현재 주식 투자 여부를 선택할 수 있어야 한다. 시스템은 선택 결과를 저장하고, 투자자는 가상계좌 연결
        화면으로, 비투자자는 관심종목 선택 화면으로 안내해야 한다.
      선행조건: 최초 이용 회원이 초기 설정을 진행 중이다.
      입력값: 현재 주식 투자 여부에 대한 사용자의 선택.
      입력·검증 규칙: '선택값을 해당 회원의 설정으로 저장한다.

        저장에 실패한 선택을 초기 설정 완료로 처리하지 않는다.

        투자 여부에 따라 가상계좌 연결과 관심종목 선택 경로를 구분한다.'
      처리 절차 및 분기: '1. 선택 결과를 회원 설정으로 저장한다.

        2. 투자자는 가상계좌 연결, 비투자자는 관심종목 선택으로 안내한다.'
      정상 결과: 투자 여부가 저장된다. 투자자는 가상계좌 연결 화면으로, 비투자자는 관심종목 선택 화면으로 안내된다.
      예외 처리: '선택 저장 실패: 완료로 처리하지 않는다. 구체적인 재시도 화면은 [확인 필요: 저장 실패 안내 및 재시도 방식 결정 필요].

        선택하지 않고 진행하려는 경우: [확인 필요: 선택 필수 여부와 미선택 진행 규칙 결정 필요].

        가상계좌 경로: 연결 기능의 원본 보류 상태를 유지한다.'
      수용 기준: '1. 투자 여부가 저장되고 두 경로가 구분된다.

        2. 실패한 저장을 완료 상태로 오인하지 않는다.'
      확인 필요 사항: '가상계좌 연결은 원본 보류 상태를 유지한다.

        [확인 필요: 저장 실패 안내 및 재시도 방식 결정 필요]

        [확인 필요: 선택 필수 여부와 미선택 진행 규칙 결정 필요]'
