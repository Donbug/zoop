  priority: P1
  status: ''
  requirementIds: []
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 47
    rowUnit: xlsx-row
  detailRange: ''
  change: ''
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 종목 목록·검색 및 상세 진입
      기능 설명: 사용자는 상단 메뉴의 종목을 선택해 MVP 분석 대상 종목 목록을 확인할 수 있어야 한다. 사용자는 기업명 또는 티커로 종목을
        검색하고, 목록 또는 검색 결과에서 종목을 선택해 해당 기업 상세 페이지로 이동할 수 있어야 한다. 관심 종목 추가·해제를 할 수 있다.
      선행조건: 사용자가 상단 메뉴에서 종목을 선택하고, 시스템에 공개 가능한 MVP 대상 종목 정보가 존재한다.
      입력값: 검색어(기업명·영문명·티커), 선택 종목 식별자, 현재 종목 목록·검색 조회 식별 정보
      입력·검증 규칙: '검색은 기업명, 영문명, 티커를 대상으로 수행한다.

        검색어가 비어 있으면 기본 종목 목록을 표시한다.

        목록·검색 결과에는 기업명, 티커, 시장 구분, 최신 시세·등락률, 최신 핵심 이슈 여부를 표시한다.

        현재 검색어·조회 조건과 맞지 않는 이전 목록 또는 검색 응답은 반영하지 않는다.

        비회원도 종목 목록과 기업 상세 조회는 가능하지만, 관심 종목 추가·보유 정보는 로그인 후 제공한다.'
      처리 절차 및 분기: '1. 사용자가 상단 메뉴에서 종목을 선택하면 기본 종목 목록을 조회한다.

        2. 사용자가 검색어를 입력하면 기업명·영문명·티커 기준으로 목록을 조회한다.

        3. 사용자가 목록 또는 검색 결과의 종목을 선택하면 해당 기업 ID로 상세 페이지로 이동한다.

        4. 사용자가 상세 페이지 상단 검색에서 다른 종목을 선택하면 현재 상세 페이지의 기업 ID를 새 선택 종목으로 변경한다.'
      정상 결과: 사용자는 종목 목록 또는 검색 결과에서 기업을 선택하고, 선택한 기업의 상세 페이지로 이동할 수 있다.
      예외 처리: '검색 결과 없음: 검색 결과 없음을 안내한다.

        종목 목록 조회 실패: 오류 안내와 다시 시도를 제공한다.

        개별 종목의 시세 또는 이슈 정보 미제공: 해당 항목만 미제공으로 표시하고 종목 선택은 허용한다.

        유효하지 않거나 공개되지 않은 종목 선택: 조회 불가를 안내한다.

        이전 검색어 또는 목록의 지연 응답: 현재 목록에 반영하지 않는다.'
      수용 기준: '1. 상단 메뉴 종목 선택 시 MVP 대상 종목 목록이 표시된다.

        2. 기업명 또는 티커 검색 결과에서 종목을 선택하면 FS038 기업 상세 페이지로 이동한다.

        3. 검색 결과가 없을 때 빈 목록 대신 안내 문구가 표시된다.

        4. 목록 조회 중 검색어를 변경해도 이전 검색 결과가 현재 결과를 덮어쓰지 않는다.

        5. 비회원도 목록과 상세는 조회할 수 있지만, 개인화 기능은 로그인 안내가 표시된다.'
  scopeClass: existing
- id: FS038
  title: 기업 상세 조회
  section: 기업 상세·타임라인
  priority: P1
  status: 확정
  requirementIds:
  - '38'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 48
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      기능명: 기업 상세 조회
      기능 설명: 시스템은 메뉴의 종목 목록에서 선택하거나, 그래프 기업 노드의 패널에서 `상세 페이지 이동`을 선택하거나, 직접 URL로 진입한
        기업의 상세를 표시한다. 기업 개요, 시세·차트, 이슈 타임라인, 시점 기반 관계 그래프, 핵심 재무, 뉴스·공시, 가상 보유 정보를
        독립 영역으로 표시한다.
      선행조건: 사용자가 종목 목록에서 기업을 선택하거나 그래프 패널의 상세 페이지 이동을 선택하거나 유효한 기업 상세 주소로 직접 진입한다.
      입력값: 기업 식별자, 상세 영역별 조회 조건과 최신 조회 식별 정보.
      입력·검증 규칙: "개요·시세, 차트·타임라인, 시점 기반 관계 그래프, 재무, 문서, 보유 영역은 독립적으로 조회한다. \n한 영역의\
        \ 실패가 다른 정상 영역을 막지 않는다. \n개인 보유 정보는 본인 권한이 확인된 경우에만 조회한다. \n현재 기업·기간·기준 시점과\
        \ 일치하는 최신 응답만 반영한다."
      처리 절차 및 분기: '1. 사용자가 요청한 기업을 확인한다.

        2. 개요·시세, 차트·타임라인, 시점 기반 관계 그래프, 재무, 뉴스·공시, 보유 정보를 독립 요청한다.

        3. 각 영역은 현재 기업·조건과 일치하는 결과부터 표시한다.

        4. 실패 영역만 오류와 다시 시도를 표시하고 다른 정상 영역은 유지한다.'
      정상 결과: 선택 기업의 개요, 차트·타임라인, 핵심 재무, 문서, 보유 정보를 각 영역에서 확인할 수 있다.
      예외 처리: '유효하지 않은 기업: 조회 불가를 안내한다.

        일시 조회 장애: 해당 영역만 다시 시도할 수 있게 한다.

        자료 없음: 빈 결과 안내를 표시하며 장애로 취급하지 않는다.

        권한 없음: 보호 내용을 숨기고 로그인 필요 또는 접근 제한을 안내한다.

        이전 기업의 응답·오류: 현재 화면에 반영하지 않는다.'
      수용 기준: '1. 종목 목록 선택, 그래프 패널의 상세 페이지 이동, 직접 URL은 모두 같은 기업을 연다.

        2. 재무·관계 그래프 영역이 실패해도 개요·차트·문서 영역은 유지된다.

        3. 다른 기업으로 이동한 뒤 이전 기업 응답이 현재 화면을 덮어쓰지 않는다.'
  scopeClass: existing
- id: FS039
  title: 가상 보유 정보 표시
  section: 기업 상세·타임라인
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '39'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 49
    rowUnit: xlsx-row
  detailRange: A21:B33
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 가상 보유 정보 표시
      기능 설명: 가상 계좌를 연결한 로그인 회원에게만 선택 기업의 모의 보유 수량, 평균 매입가, 평가 금액, 자산 비중을 제공한다. 이는
        실제 계좌 정보가 아닌 프로젝트용 모의 데이터임을 표시한다.
      선행조건: 로그인 회원이 기업 상세를 열고, 연결된 가상 계좌에 선택 기업 보유 정보가 존재한다.
      입력값: 사용자 ID, 기업 ID, 모의 보유 수량·평균 매입가·평가 금액·자산 비중·기준 시점
      입력·검증 규칙: "본인에게 연결된 가상 계좌의 선택 기업 정보만 제공한다. \n관심 종목 포함 여부와 무관하게 실제 모의 보유가 있으면\
        \ 표시한다. \n계좌 미연결·미보유와 조회 실패를 구분한다. \n평가 금액·비중은 기준 시점의 최신 제공 가격을 사용하며 기준 시점을\
        \ 표시한다."
      처리 절차 및 분기: '1. 본인 권한·가상계좌 연결 상태를 확인한다.

        2. 연결된 경우 선택 기업의 모의 보유를 조회한다.

        3. 보유가 있으면 모의 수량·평균 매입가·평가 금액·자산 비중과 기준 시점을 표시한다.

        4. 미연결·미보유이면 영역을 숨기고 조회 실패이면 별도의 오류 상태와 다시 시도를 표시한다.'
      정상 결과: 본인 보유 기업의 수량·평균 매입가·평가 금액·자산 비중을 모의 정보로 확인할 수 있다.
      예외 처리: '비회원·타인 정보: 보호 데이터를 제공하지 않는다.

        연결 없음·보유 없음: 보유 영역을 숨긴다.

        조회 실패: 보유 정보 확인 실패로 표시하며 다른 기업의 이전 보유 수치를 보여 주지 않는다.

        수치 누락: 미제공으로 표시한다.'
      수용 기준: '1. 보유·관심에 동시에 포함된 기업도 본인의 모의 보유가 표시된다.

        2. 관심만 있고 보유가 없으면 보유 영역이 표시되지 않는다.

        3. 계좌 조회 실패가 미보유 또는 값 0으로 표시되지 않는다.

        4. 타인 수치나 다른 기업의 지연 응답이 표시되지 않는다.'
  scopeClass: existing
- id: FS040
  title: 차트와 타임라인 기간 조회
  section: 기업 상세·타임라인
  priority: P1
  status: 검토 중
  requirementIds:
  - '40'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 50
    rowUnit: xlsx-row
  detailRange: A35:B47
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 51
      rowUnit: xlsx-row
    fields:
      기능명: 차트와 타임라인 기간 조회
      기능 설명: 시스템은 기업별 1일, 1주, 1개월, 1년 기간을 제공한다. 사용자가 차트 또는 타임라인에서 기준 시점을 선택하면 해당 시점까지
        공개·유효한 이슈를 함께 표시한다. 기본 기간은 1개월, 기본 기준 시점은 최신 제공 시점이다.
      선행조건: 기업 상세의 차트·타임라인 영역에 진입하거나 사용자가 기간 또는 기준 시점을 선택한다.
      입력값: 기업 ID, 기간(1D, 1W, 1M, 1Y), 선택 기준 시점(asOf), 거래소 시간대, 차트·타임라인 조회 식별자, 선택
        이슈 ID(선택)
      입력·검증 규칙: "기간별 해상도는 1Y: 월/주, 1M: 일, 1W: 시간, 1D: 5분으로 제한한다. \n1일은 해당 기업이 상장된\
        \ 거래소의 당일 거래 시간, 1주·1개월·1년은 거래일 기준 데이터를 사용한다. \n기준 시점 이전에 시스템이 확보한 문서·이슈만\
        \ 타임라인에 표시한다. \n휴장 구간의 가격·이슈를 임의 생성하지 않는다.\n기업·기간·기준 시점·영역이 일치하는 최신 응답만 반영한다.\n\
        기간 변경 시 기간 밖 이슈 선택·강조는 해제한다."
      처리 절차 및 분기: '1. 기간 또는 기준 시점 변경 시 차트와 타임라인 요청을 새로 시작한다.

        2. 현재 기간에 맞는 해상도로 가격·이슈 버킷을 조회한다.

        3. 선택 기준 시점 이전에 공개된 이슈만 표시한다.

        4. 선택 이슈가 새 조건에도 포함되면 선택을 유지하고, 없으면 선택·강조를 해제한다.'
      정상 결과: 선택한 기간·기준 시점의 주가 차트와 이슈 타임라인이 같은 범위와 시간 기준으로 표시된다.
      예외 처리: "차트만 실패: 타임라인 유지 및 차트 재시도. \n타임라인만 실패: 차트 유지 및 타임라인 재시도. \n가격 또는 사건 0건:\
        \ 빈 상태 표시. \n1일 장중 시세 미제공: 당일 차트 미제공 표시하고 1일 버튼을 비활성화한다. \n선택 시점의 이슈 0건: 차트\
        \ 기준 시점은 유지하고 해당 시점의 새 이슈 없음을 표시한다."
      수용 기준: '1. 기본 기간은 1개월이며 1일·1주·1개월·1년을 선택할 수 있다.

        2. 기간별 해상도보다 촘촘한 임의 분 단위 조회를 허용하지 않는다.

        3. 기준 시점을 과거로 옮기면 그 이후 공개된 이슈는 보이지 않는다.

        4. 1개월에서 1년으로 변경한 뒤 늦게 도착한 1개월 응답이 현재 결과를 덮지 않는다.'
      확인 필요 사항: 시세 공급사의 거래소별 장중 5분 시세 제공 여부를 구현 전 확인한다. 미지원 시장은 1일 버튼을 비활성화하고 사유를
        안내한다.
  scopeClass: existing
- id: FS041
  title: 동일 날짜 사건 구분
  section: 기업 상세·타임라인
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '41'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 51
    rowUnit: xlsx-row
  detailRange: A49:B61
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 65
      rowUnit: xlsx-row
    fields:
      기능명: 동일 시점 이슈 구분
      기능 설명: 같은 시간 버킷에 여러 이슈가 있으면 이슈 수를 표시하고, 사용자가 버킷을 선택했을 때 이슈별 카드를 펼쳐 선택할 수 있게
        한다. 시간 버킷은 FS040에서 선택한 기간의 해상도를 따른다.
      선행조건: 기업 타임라인의 시간 버킷에 하나 이상의 이슈가 표시되어 있고 사용자가 버킷 또는 이슈 카드를 선택한다.
      입력값: 선택 시간 버킷 또는 이슈 ID, 해당 버킷의 이슈 목록·개수, 이슈별 사건 발생 시각·문서 공개 시각·근거 문서·영향 경로
      입력·검증 규칙: "문서 수가 아니라 이슈 수를 표시한다. \n같은 시간 버킷의 서로 다른 이슈를 통합하지 않는다. \n이슈가 1개면 자동\
        \ 선택하고, 2개 이상이면 이슈 카드를 펼쳐 사용자가 선택한다. \n사건 발생 시각과 문서 공개 시각을 구분하며, 문서 공개 전에는\
        \ 해당 이슈를 과거 시점 화면에 표시하지 않는다. \n같은 시간대의 주가 변동만으로 인과관계를 단정하지 않는다."
      처리 절차 및 분기: '1. 시간 버킷 선택 시 해당 버킷의 이슈 수를 확인한다.

        2. 0개면 사건 없음, 1개면 상세를 자동 조회, 2개 이상이면 카드 목록을 표시한다.

        3. 사용자가 이슈를 선택하면 해당 이슈의 상세·근거·영향 경로를 표시하고 차트의 시간 버킷을 강조한다.'
      정상 결과: 같은 시간 버킷의 이슈를 각각 구분해 확인하고 선택한 이슈의 상세·근거·경로를 볼 수 있다.
      예외 처리: "이슈 상세 조회 실패: 선택 이슈와 오류·재시도 표시. \n영향 경로·근거 없음: 없는 항목만 안내하고 이슈 기본 정보 유지.\
        \ \n발생 시각 미상: 차트 시간 버킷 강조 없이 발생 시각 미상 목록에 표시."
      수용 기준: '1. 같은 시간 버킷의 카드 수는 이슈 수와 일치한다.

        2. 문서 여러 건이 이슈 수를 늘리지 않는다.

        3. 복수 이슈에서 사용자가 선택하기 전 특정 이슈의 상세를 자동 확정하지 않는다.

        4. 문서 공개 전 시점을 선택하면 해당 문서로 생성된 이슈가 표시되지 않는다.'
  scopeClass: existing
- id: FS042
  title: 재무와 실적 조회
  section: 기업 상세·타임라인
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '42'
  source: &id012
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 52
    rowUnit: xlsx-row
  detailRange: A63:B75
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 79
      rowUnit: xlsx-row
    fields:
      기능명: 시점 기반 관계 그래프 조회
      기능 설명: 시스템은 기업 상세에서 선택한 기준 시점의 기업 관계 그래프를 제공한다. 기업의 비교적 고정적인 구조 관계와, 해당 시점까지
        공개되어 유효한 이슈 기반 관계를 구분하여 함께 표시한다.
      선행조건: 사용자가 기업 상세의 관계 그래프 영역을 열거나 차트·타임라인에서 기간 또는 기준 시점을 변경한다.
      입력값: 중심 기업 ID, 선택 기준 시점(asOf), 기간, 선택 이슈 ID(선택), 최대 탐색 깊이, 그래프 조회 식별자
      입력·검증 규칙: 그래프는 중심 기업에서 최대 2-hop의 공개·검증 완료 관계만 조회한다. 구조 관계는 기준 시점에 유효한 관계만, 이슈
        기반 관계는 공개 시각 ≤ asOf 및 관계 유효 시작 ≤ asOf < 관계 유효 종료 조건을 만족할 때만 표시한다. 관계마다 유형·방향
        가능성·근거 문서 참조·기준 시점을 제공한다. 근거가 없는 관계, 후보 상태 관계, 주가 인과를 확정하는 표현은 표시하지 않는다.
      처리 절차 및 분기: '1. 중심 기업과 기준 시점을 확인한다.

        2. GraphDB에서 기준 시점에 유효한 구조 관계와 이슈 기반 관계를 조회한다.

        3. 관계별 근거 문서 참조와 공개 시각을 확인한다.

        4. 이전 기준 시점과 비교해 새로 나타난·사라진 노드와 간선이 있을 때만 변화 애니메이션을 적용한다.

        5. 관계가 없으면 중심 기업과 빈 상태를 표시한다.'
      정상 결과: 사용자는 기준 시점에 해당 기업과 연결된 기업·이슈·제품 및 근거 있는 관계를 그래프로 확인할 수 있다. 기준 시점 변경 시
        같은 화면에서 이슈와 관계 그래프가 함께 갱신된다.
      예외 처리: '관계 조회 실패: 관계 그래프 영역만 오류·재시도. 기준 시점 이후 데이터 없음: 가장 가까운 이전 제공 시점을 안내하고
        임의 관계를 생성하지 않음. 근거 문서 접근 실패: 관계는 유지하되 근거 문서 접근 실패를 표시. 관계 0건: 중심 기업과 표시할 검증
        관계 없음을 표시.'
      수용 기준: '1. 과거 기준 시점에는 그 이후 공개된 이슈 노드·이슈 관계가 표시되지 않는다.

        2. 기준 시점 변경 시 차트·타임라인·관계 그래프가 같은 기준 시점을 사용한다.

        3. 구조 관계와 이슈 기반 관계를 사용자가 구분할 수 있다.

        4. 그래프는 중심 기업 기준 최대 2-hop을 넘지 않는다.'
      확인 필요 사항: 구조 관계의 유효 시작·종료 시각을 초기 데이터 구축 시 입력한다. 이슈 관계의 유효 종료 시각을 아직 알 수 없으면
        유효 종료 미정으로 유지하며, 새 이슈가 생겼다고 기존 관계를 자동 삭제하지 않는다.
  scopeClass: existing
- id: FS043
  title: 뉴스와 공시 조회
  section: 기업 상세·타임라인
  priority: P1
  status: 확정
  requirementIds:
  - '43'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 53
    rowUnit: xlsx-row
  detailRange: A77:B89
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 93
      rowUnit: xlsx-row
    fields:
      기능명: 뉴스와 공시 조회
      기능 설명: 시스템은 각 이슈에 연결된 근거 문서의 개수를 표시해야 한다. 사용자가 근거를 선택하면 문서 제목, 출처, 발행 시각, 관련
        설명 및 원문 링크를 제공해야 한다. 원문 링크가 없는 경우 ‘원문을 제공하지 않는 자료입니다’라는 안내를 표시해야 한다.
      선행조건: 사용자가 이슈 또는 기업 상세에서 연결된 근거 문서를 선택한다.
      입력값: 이슈·문서 식별 정보, 연결 문서 개수, 문서 제목·출처·발행 시각·관련 설명·원문 링크.
      입력·검증 규칙: '문서 수는 해당 이슈에 실제 연결된 중복 없는 문서 개수이다.

        일반 기업 문서 목록은 현재 상세 조회 기간의 문서 발행일을 기준으로 최신순 표시한다. 같은 발행 시각은 문서 식별자 순으로 고정한다.

        이슈의 근거 목록은 선택 이슈에 연결된 문서를 보여 준다. 일반 목록 기간 밖의 문서는 발행 시각을 표시하고 근거에서 조용히 제외하지
        않는다.

        더보기는 같은 조회 조건의 다음 목록을 추가하며 이미 표시된 문서를 중복 추가하지 않는다.

        앱 안에는 확보된 메타데이터·관련 설명·인용만 제공하고 원문은 제공된 링크로 연다. 원문 미확보 내용을 생성하지 않는다.'
      처리 절차 및 분기: '1. 기업·기간 또는 선택 이슈의 근거 목록을 조회한다.

        2. 문서 수와 제목·출처·발행 시각을 표시한다.

        3. 문서 선택 시 관련 설명·확보된 인용·원문 링크를 제공한다.

        4. 더보기 실패 시 기존 목록을 유지하고 실패한 추가 조회만 다시 시도한다.'
      정상 결과: 선택 문서의 제목·출처·발행 시각·관련 설명을 확인하고 제공된 원문 링크로 이동할 수 있다.
      예외 처리: '원문 링크 없음: “원문을 제공하지 않는 자료입니다”라고 안내한다.

        원문 접근 실패: 확보된 정보를 유지하고 접근 실패를 안내한다.

        목록 0건: 연결된 자료 없음으로 표시한다. 삭제·비공개 문서는 제공 불가로 표시한다.

        조회 실패: 오류와 다시 시도를 제공한다. 이전 기업·기간의 응답은 반영하지 않는다.'
      수용 기준: '1. 문서 수가 연결된 문서와 일치한다.

        2. 링크 미제공 안내가 나오며 링크 접근 실패에도 확보된 정보는 유지된다.'
  scopeClass: existing
- id: FS044
  title: 기업 상세와 관계 그래프 이동·상태 복원
  section: 기업 상세·타임라인
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '44'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 54
    rowUnit: xlsx-row
  detailRange: A91:B103
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/06-기업-상세-타임라인.csv
      row: 107
      rowUnit: xlsx-row
    fields:
      기능명: 기업 상세와 관계 그래프 이동·상태 복원
      기능 설명: 사용자가 기업 상세와 관계 그래프를 오갈 때 선택 기업, 차트 기간, 기준 시점, 선택 탭, 선택 이슈를 유지한다. 사건에서
        그래프로 이동하면 해당 기업·이슈의 실제 영향 경로만 강조한다.
      선행조건: 사용자가 기업 상세에서 관계 그래프를 열거나 브라우저 뒤로가기로 직전 화면으로 돌아온다.
      입력값: 기업 ID, 차트 기간, 선택 기준 시점, 선택 탭, 선택 이슈 ID, 그래프 모드·초점 기업·초점 이슈
      입력·검증 규칙: "상세에서 그래프로 이동할 때 기업·기준 시점·선택 이슈를 전달한다. \n그래프는 해당 기준 시점에 존재하는 공개 경로만\
        \ 강조한다. \n브라우저 뒤로가기는 실제 이전 방문 화면을 따른다. \n직접 URL 진입 후 그래프로 이동하면 전체 시장 그래프에서\
        \ 해당 기업을 중심으로 표시한다."
      처리 절차 및 분기: '1. 이동 전 기업 ID·차트 기간·기준 시점·탭·선택 이슈를 라우트 상태에 저장한다.

        2. 그래프 이동 시 기업·기준 시점·이슈를 전달하고 관련 공개 경로를 강조한다.

        3. 복귀 시 저장된 기업·기간·기준 시점·탭·선택 이슈를 복원한다.

        4. 선택 이슈가 현재 결과에 없으면 선택만 해제하고 안내한다.'
      정상 결과: 기업 상세와 관계 그래프를 왕복해도 유효한 기업·기간·기준 시점·탭·선택 이슈가 유지된다.
      예외 처리: "직접 URL 진입 후 그래프 이동: 전체 시장 그래프에 기업 초점 적용. \n저장된 이슈·탭 없음: 기본 개요로 이동 또는\
        \ 선택 해제. \n복귀 조회 실패: 복원 조건을 유지하고 실패 영역만 재시도."
      수용 기준: '1. 차트 기간·기준 시점·탭·이슈를 선택한 후 그래프 왕복 시 같은 조건이 복원된다.

        2. 존재하지 않는 경로는 강조하지 않는다.

        3. 직접 URL 진입 후에도 기업 중심 그래프 이동이 가능하다.'
  scopeClass: existing
- id: FS045
  title: AI 질문 진입과 전송
  section: AI 챗봇
