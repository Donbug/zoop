    fields:
      기능명: 전체 관계 그래프
      기능 설명: 시스템은 사용자의 종목 보유 여부와 관계없이 전체 시장 관계 그래프를 제공해야 한다.
      선행조건: 사용자가 전체 시장 관계 그래프 조회를 선택한다.
      입력값: 전체 그래프 조회 요청, 공개 대상 시장 관계 데이터.
      입력·검증 규칙: '비회원·미보유 회원·보유 회원 모두 조회할 수 있다.

        종목 보유 여부를 전체 그래프 이용 조건으로 두지 않는다.

        개인 보유 정보나 비공개 분석 결과를 전체 시장 그래프에 섞지 않는다.'
      처리 절차 및 분기: 1. 사용자의 종목 보유 여부와 무관하게 공개 대상인 시장 전체 관계 데이터를 조회한다.
      정상 결과: 공개 대상인 전체 시장 관계 그래프가 표시된다.
      예외 처리: '공개 데이터 없음: [확인 필요: 빈 그래프 안내 방식 결정 필요].

        조회 실패: [확인 필요: 기존 화면 유지 및 재시도 방식 결정 필요].

        처리 중·검증 실패 등 비공개 결과: 공개 조회에서 제외한다.'
      수용 기준: '1. 비회원·미보유 회원·보유 회원 모두 전체 그래프를 조회할 수 있다.

        2. 비공개 분석 결과는 노출되지 않는다.'
      확인 필요 사항: '[확인 필요: 전체 그래프의 범위·대표 이슈 및 기업 선정·초기 노드 수·관계 깊이·정렬 기준 결정 필요]

        [확인 필요: 빈 그래프 안내 방식 결정 필요]

        [확인 필요: 기존 화면 유지 및 재시도 방식 결정 필요]'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 23
      rowUnit: xlsx-row
    fields:
