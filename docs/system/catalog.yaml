- id: NFS011
  title: 웹 접근성
  section: 비기능 상세
  priority: P2
  status: 추가 제안 · 검토 전
  requirementIds:
  - '64'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 102
    rowUnit: xlsx-row
  detailRange: A147:B159
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 149
      rowUnit: xlsx-row
    fields:
      요구사항명: 웹 접근성
      요구사항 설명: 현재 초점 위치가 시각적으로 표시되어야 하며, 색상만으로 긍정·부정·오류 상태를 구분해서는 안 된다. 버튼, 링크, 차트
        및 상태 메시지에는 스크린리더가 인식할 수 있는 대체 이름과 설명을 제공해야 한다.
      적용 대상·범위: 버튼·링크·차트·상태 메시지와 긍정·부정·오류 표시. 주요 기능의 초점 위치와 보조기술용 이름·설명에 적용한다.
      적용 조건·검증 입력: '현재 초점 요소, 상태를 표현하는 색상·텍스트·기호, 버튼·링크·차트·상태 메시지의 대체 이름과 설명.

        점검에 사용할 보조기술·환경 조합은 미정이다.'
      품질 목표·준수 규칙: '1. 마우스로 주요 조작 요소에 이동하고 실행할 수 있으며 현재 초점이 시각적으로 보여야 한다.

        2. 긍정·부정·오류는 색상 외의 텍스트나 기호로도 구분한다. 기호의 의미는 보조기술로도 확인할 수 있어야 한다.

        3. 버튼·링크·그래프·차트에는 동작과 표시 의미를 이해할 수 있는 이름·설명을 제공한다. 선택한 대상과 핵심 관계·수치의 의미를 시각
        정보만으로 전달하지 않는다. 그래프의 핵심 대상 선택과 해당 관계·근거 확인을 마우스와 보조기술로 수행할 수 있어야 한다. 기존 목록·패널
        등 가능한 수단을 활용하며 새 목록 화면이나 모든 노드의 일괄 읽기를 필수로 요구하지 않는다.

        4. AI 패널을 닫으면 진입 요소로 초점을 돌린다. 해당 요소가 사라졌다면 현재 화면에서 이어서 조작할 수 있는 요소로 옮기며 초점이
        사라지지 않게 한다.

        5. 로딩·오류·평가 변경 상태를 보조기술로 확인할 수 있어야 하며 상태 갱신만으로 사용자의 초점을 임의 이동하지 않는다.'
      정상 상태: 현재 초점 위치가 보이고 색상을 구분하지 못해도 상태를 알 수 있다. 스크린리더로 주요 요소의 이름·설명을 확인할 수 있다.
      미충족·예외 처리: '마우스 이동·실행 불가, 초점 소실, 색상만의 구분, 이름·설명 누락 또는 화면과 보조기술의 의미 불일치: 해당 환경·요소·실패
        동작을 기록하고 수정 후 같은 경로를 다시 점검한다.

        보조기술 또는 점검 범위 미확정: 전체 접근성 충족이나 인증 획득으로 판단하지 않는다.'
      검증 방법: '1. 마우스로 종목 검색·추천 선택·그래프와 이슈 선택·AI 질문·패널 열기/닫기/재열기·평가 변경/취소를 수행하고 초점
        위치를 확인한다.

        2. 색상을 구분하지 않는 조건에서 긍정·부정·오류 의미가 전달되는지 확인한다.

        3. 마우스와 정해진 보조기술로 그래프의 핵심 대상을 선택하고 관계·근거를 확인하는 경로를 끝까지 수행한다. 버튼·링크의 동작, 선택
        대상·관계, 차트 핵심 정보와 상태 설명을 화면 의미와 대조한다.

        4. 패널을 닫아 진입 요소로 초점이 돌아오는지 확인한다. 진입 요소가 사라진 경우에도 현재 화면에서 조작을 이어 갈 수 있는지 확인한다.

        5. 상태가 갱신될 때 초점이 임의 이동하지 않는지 확인하고 환경별 결과를 기록한다.'
      수용 기준: '1. 확정된 점검 범위의 주요 동작을 마우스로 완료할 수 있고 현재 초점이 보인다.

        2. 상태의 의미가 색상만으로 전달되지 않으며 보조기술의 이름·설명이 실제 동작·선택 대상·핵심 정보와 일치한다.

        3. 패널을 닫은 뒤 초점을 잃지 않고 조작을 이어 갈 수 있다. 로딩·오류·평가 상태를 확인할 수 있으며 상태 갱신만으로 초점이 바뀌지
        않는다.

        4. 점검 환경·범위·실패 및 재검증 결과가 기록된다. 미정·미검증 범위를 포함해 최종 합격을 선언하지 않는다.'
      확인 필요 사항: '[확인 필요: 실제 지원 환경·보조기술 조합·접근성 세부 점검표 승인 필요]

        '
