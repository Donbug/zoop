- id: NFS003
  title: 작업 일관성과 복구
  section: 비기능 상세
  priority: P1
  status: 확정
  requirementIds:
  - '56'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 94
    rowUnit: xlsx-row
  detailRange: A35:B47
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      요구사항명: 작업 일관성과 복구
      요구사항 설명: 관심 종목 등록, 계좌 연결, AI 답변 생성, 브리핑 생성 등 상태를 변경하거나 결과를 생성하는 요청에는 중복 실행 방지
        기준을 적용해야 한다. 동일한 작업 식별자로 요청을 재전송한 경우 결과를 중복 생성하거나 상태를 중복 변경해서는 안 된다. 네트워크
        또는 서버 오류 이후 재시도할 때 기존 작업의 처리 상태를 먼저 확인해야 한다.
      적용 대상·범위: 관심종목 등록, 가상계좌 연결, AI 답변 생성, 브리핑 생성 등 상태 변경 또는 결과 생성 작업의 중복 요청과 재시도.
      적용 조건·검증 입력: '작업 식별자, 최초 요청 내용, 기존 작업의 서버 처리 상태, 저장된 결과, 현재 유효한 실행 정보.

        AI 질문은 대화 식별자와 해당 대화의 처리 중 작업도 확인한다.'
      품질 목표·준수 규칙: '1. 동일 작업을 재전송해도 중복 상태 변경·중복 결과 생성이 없어야 한다.

        2. 오류 이후 새 실행 전 기존 처리 상태를 확인한다.

        3. 클라이언트의 응답 미수신을 서버 실패나 작업 미등록으로 단정하지 않는다.

        4. AI 질문은 서로 다른 작업 ID로 동시에 접수되어도 같은 대화에 하나의 신규 작업만 접수한다. 기존 작업의 상태 확인·결과 회수는
        추가 질문과 구분한다.

        5. AI 작업 재시도는 최초 질문 맥락·대상·기간·근거를 유지한다.

        v1.2 제안: AI 결과 평가 변경은 원하는 최종 상태를 저장한다. 동일 요청 재전송은 한 평가 상태를 유지하며 반복 토글하지 않는다.'
      정상 상태: 같은 작업을 반복 요청해도 유효한 상태 변경 또는 결과가 하나로 유지된다. 이미 완료된 작업은 기존 결과를 회수할 수 있다.
      미충족·예외 처리: '완료 작업: 기존 결과를 회수한다. 처리 중 작업: 대기 또는 상태 확인을 수행한다.

        서버가 확인한 실패: 오류 유형별로 허용된 복구만 수행한다.

        같은 작업 ID에 다른 내용: 충돌로 처리하며 동일 작업인 것처럼 실행하지 않는다.

        상태 조회 실패·응답 지연: 새 결과 생성을 시작하지 않는다.

        AI 작업의 미등록을 서버가 확인한 경우에만 기존 작업 ID와 최초 요청 내용으로 접수를 다시 시도한다.'
      검증 방법: '1. 동일 작업과 동일 내용을 동시에 재전송하고 상태 변경·결과 생성 횟수를 확인한다.

        2. 같은 작업 ID의 내용을 변경한 요청이 충돌로 처리되는지 확인한다.

        3. 처리 중 통신을 끊은 뒤 재요청하여 기존 상태·결과가 회수되는지 확인한다.

        4. AI 질문은 서로 다른 작업 ID를 같은 대화에 동시에 전송한다.

        5. 저장 실패와 이전 실행의 지연 완료를 발생시켜 현재 유효한 결과가 유지되는지 확인한다.

        동일 좋아요 요청·취소 요청을 중복 전송하고 현재 평가 건수와 상태를 비교한다. 패널 재열기 동안 처리 중 작업이 완료되는 경우 저장된
        결과 회수까지 확인한다.'
      수용 기준: '1. 동시 요청·네트워크 단절·저장 실패·과거 실행 지연을 시험해 유효한 결과 하나만 유지됨을 확인한다.

        2. 같은 대화에 서로 다른 질문 작업을 동시에 전송해도 하나의 신규 AI 작업만 접수된다.

        3. 상태 조회 장애나 응답 지연만으로 추가 생성이 시작되지 않는다.

        4. 동일 작업 ID의 내용 변경은 거절되고, 늦게 완료된 이전 실행이 현재 유효한 결과를 덮어쓰지 않는다.

        평가 재전송은 중복 등록·역토글을 일으키지 않는다. 패널 재열기는 새 질문 작업이나 추가 AI 생성을 만들지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 목표 평가 상태와 질문 작업을 구분한다. 같은 대화 신규 질문 1개 접수 원칙 유지.

        미등록은 작업 저장소 정상 조회로 기록 없음을 확인한 경우이다. 상태 조회 장애는 해당하지 않는다.

        [확인 필요: 작업 식별자 보관 유효 기간·중단 판정값은 운영 승인 필요]'
