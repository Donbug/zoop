- id: NFS008
  title: 운영 추적
  section: 비기능 상세
  priority: P1
  status: 보완 제안 · 검토 전
  requirementIds:
  - '61'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 99
    rowUnit: xlsx-row
  detailRange: A105:B117
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 107
      rowUnit: xlsx-row
    fields:
      요구사항명: 운영 추적
      요구사항 설명: 시스템은 AI 답변 및 브리핑 생성 작업마다 작업 식별자를 부여하고, 대기·실행 중·완료·실패·취소 상태를 기록해야 한다.
        시작 시각, 종료 시각, 재시도 횟수 및 오류 코드를 확인할 수 있어야 한다. 운영 로그에는 인증정보와 불필요한 개인정보를 기록해서는
        안 된다.
      적용 대상·범위: AI 답변 및 브리핑 생성 작업의 실행 상태와 이력 조회. 접수 이후 상태 변경·완료·실패·재시도 추적을 포함한다.
      적용 조건·검증 입력: '작업 식별자, 대기·실행 중·완료·실패·취소 상태, 시작·종료 시각, 재시도 횟수, 오류 코드.

        로그에서 제외할 인증정보와 불필요한 개인정보.'
      품질 목표·준수 규칙: '1. 작업 식별자로 대기·실행 중·완료·실패·취소 상태와 시작/종료 시각·재시도 횟수·오류 코드를 추적한다.

        2. 인증정보와 불필요한 개인정보를 로그에 남기지 않는다.

        3. 같은 작업의 상태·시간·재시도·오류 기록을 작업 식별자로 연결한다.

        4. 취소 상태를 기록한다는 요구만으로 사용자 취소 버튼을 새로 추가하지 않는다.

        5. 운영 기록에도 인증정보와 불필요한 개인정보를 포함하지 않는다.

        6. 상태 기록에는 재실행과 결과 회수·저장만 복구를 구분한다. 완료는 결과와 완료 상태가 저장된 후에 기록한다. 관찰하지 못한 종료
        시각은 알 수 없음으로 남긴다.

        7. AI 작업 식별자 외에 요청 흐름을 연결할 수 있는 correlation/trace 식별자를 기록한다.'
      정상 상태: 운영자가 작업 식별자로 처리 상태와 시작·종료 시각·재시도 횟수·오류를 확인할 수 있다.
      미충족·예외 처리: '작업 실패: 실패 상태와 오류를 확인할 수 있어야 한다.

        취소: 취소가 허용되는 상태 전이 조건은 별도 결정한다.

        기록 저장 실패 또는 실행 종료 시각을 확인할 수 없음: 임의 완료 기록을 만들지 않으며 복구·안내 방식은 별도 결정한다.'
      검증 방법: '1. 정상 완료·실패·재시도 시험 작업을 실행하고 각각의 식별자로 상태·시각·횟수·오류를 조회한다.

        2. 각 기록을 실제 실행 결과와 대조한다.

        3. 취소 전이 정책이 정해진 경우 해당 경로를 추가 점검한다.

        4. 시험용 토큰과 개인정보가 로그에 포함되지 않는지 확인한다.

        검증 실패·저장 실패·상태 조회 실패를 각각 발생시켜 동일 오류 코드나 완료 상태로 합쳐지지 않는지 점검한다.'
      수용 기준: '1. 시험 작업의 상태·시간·횟수·오류를 식별자로 조회할 수 있다.

        2. 로그에 시험용 토큰·불필요 개인정보가 없다.

        3. 서로 다른 작업의 상태·오류 이력이 섞이지 않고 같은 작업의 재시도를 구분해 추적할 수 있다.

        4. 취소 동작의 합격 여부는 취소 전이 정책 확정 후 확인한다.

        작업 로그에서 재실행·저장 복구·완료 결과 회수가 구분되며 확인되지 않은 완료를 기록하지 않는다.'
      확인 필요 사항: '[확인 필요: 로그 보존 기간·열람 권한·기록 장애 복구 방식과 취소 전이 조건 승인 필요]'
