  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/09-데이터-관리.csv
      row: 23
      rowUnit: xlsx-row
    fields:
      기능명: 관계와 근거 연결
      기능 설명: 기업·이슈 간 관계와 이를 뒷받침하는 뉴스·공시를 연결해 저장한다. 관계 유형별 필수 정보, 근거 확보 상태, 검증·공개 상태와
        변경 버전을 함께 관리한다. 근거 미확보 관계는 비공개 검토 후보로 보관할 수 있으며, 필수 근거와 자동 검증·공개 조건을 통과한 결과만
        기존 공개 조회에 반영한다.
      선행조건: 기업·이슈 간 관계의 분석 결과를 저장하거나, 관계의 내용·근거·검증 상태가 변경된다.
      입력값: 관계 식별자, 출발·도착 대상 식별자, 관계 유형과 유형별 속성, 근거 확보 상태·미확보 사유 또는 확보된 문서 참조, 관계 확인·데이터
        기준 시점, 검증·공개 상태, 관계 버전·이전 버전 참조. 근거에서 확인된 경우 유효 시작·종료 시점도 입력한다.
      입력·검증 규칙: '관계 식별자·출발/도착 ID·유형·근거 확보 상태·검증/공개 상태·기준 시점·버전을 관리하고, 대상과 유형이 원래 분석
        결과와 일치하는지 확인한다.

        확보한 근거는 해당 관계를 뒷받침하는 문서 참조와 연결한다. 근거 미확보 후보는 참조 없이 저장할 수 있으나 미확보 상태와 사유가 필수이며
        공개하지 않는다.

        기업 간 관계는 공급·고객·경쟁·투자 등 확인된 관계 유형, 관계의 방향, 관련 사업·제품 범위, 현재 상태와 확인 시점을 관리한다.
        이슈 영향 경로는 대상 기업·이슈의 식별자, 직접 영향인지 중간 기업·산업·제품을 거친 간접 영향인지의 구분, 단계별 연결 이유와 근거를
        관리한다. 미확정 속성을 임의로 채우지 않는다.

        유효 시작·종료 시점은 근거에서 확인된 값만 저장하며 미상은 별도 상태로 둔다. 일률적 만료기한을 만들지 않고, 유효기간 미상을 현재도
        유효하다는 뜻으로 사용하지 않는다. 관계 확인 시점·데이터 기준 시점·문서 발행 시점은 구분한다.

        관계 내용·근거·상태 변경 시 새 버전으로 기록하고 이전 버전의 대상·유형·근거 참조와 변경 사유·시점을 추적할 수 있게 한다.

        저장 성공은 공개 승인이 아니다. 필수 속성·근거의 연결이 완결되고 자동 검증을 통과한 결과만 메인 그래프·기업 상세의 공개 조회 반영
        대상으로 전달한다. 두 화면은 동일한 공개 버전을 사용하며, 저장 완료와 사용자 조회 반영 완료를 구분한다. 관리자가 허용해도 다시
        자동 검증을 통과하기 전에는 공개하지 않는다. AI 답변 문장만으로 관계선을 만들지 않는다.'
      처리 절차 및 분기: '1. 관계 대상·유형·유형별 속성과 근거 확보 상태를 확인한다. 대상 불일치·참조 오류·필수 속성 미확정을 정상
        관계로 처리하지 않는다.

        2. 확인된 시점과 근거를 연결하고, 변경이면 이전 버전과 변경 사유·시점을 함께 기록한다. 근거가 없으면 비공개 검토 후보로 준비한다.

        3. 관계·근거 연결·버전·상태의 저장 완료를 확인한다. 동일 저장 요청을 재전송해도 관계나 버전을 중복 생성하지 않는다.

        4. 저장된 결과 중 필수 근거·자동 검증·공개 조건을 충족한 결과만 기존 공개 반영 절차로 전달하고, 비공개 후보는 일반 사용자 조회와
        그래프 관계선에서 제외한다.'
      정상 결과: 저장된 관계의 대상·유형·해당 속성·근거 상태·기준 시점·버전을 구분하여 조회할 수 있다. 공개 조회에는 기존 공개 조건을
        통과한 관계만 제공된다. 근거 미확보 후보와 변경 이력은 확정 관계 또는 현재 공개 버전으로 오인되지 않는다.
      예외 처리: '대상 또는 근거 참조 불일치·필수 속성 미확정: 정상 연결이나 공개 대상으로 처리하지 않고 해당 항목과 사유를 기록한다.

        근거 미확보: 미확보 상태·사유를 가진 비공개 검토 후보로 보관하고 공개하지 않는다.

        근거 삭제·소실: 남은 근거로 관계를 검증할 수 없으면 공개 조회에서 제외하고 재검토 상태와 사유를 남긴다. 삭제되었거나 조회 권한이
        없는 근거 내용은 반환하지 않는다.

        외부 원문 접근 실패만 발생: 이미 확보한 출처·인용을 유지하고 접근 실패 상태를 구분한다. 접근 실패만으로 근거 전체가 소실된 것으로
        처리하지 않는다.

        저장 실패: 기존 정상 저장 버전과 연결을 유지하고 실패 대상·단계·사유를 기록한다. 결과와 현재 버전의 유효성을 확인한 뒤 저장 단계만
        재시도하며 모델을 자동 재호출하지 않는다. 결과가 소실되면 복구 불가를 기록한다.

        이미 완료된 요청·더 최신 버전 존재: 중복 생성하거나 최신 값을 이전 결과로 덮어쓰지 않는다. 공개 제외된 관계를 이전 버전 유지라는
        이유로 다시 공개하지 않는다.'
      수용 기준: '1. 관계 대상·유형·해당 필수 속성이 저장 전후 일치하며, 근거를 선택하면 해당 관계의 문서로 연결된다.

        2. 근거 없는 후보는 미확보 상태·사유로 저장되지만 일반 사용자 조회와 그래프 관계선에 노출되지 않는다.

        3. 근거 없는 유효기간을 생성하지 않으며, 미상·관계 확인 시점·문서 발행 시점을 구분한다.

        4. 관계 변경 후 이전 버전의 대상·유형·근거 참조와 변경 사유·시점을 추적할 수 있다.

        5. 근거 소실로 검증 불가인 관계는 공개에서 제외되며, 외부 링크만 실패한 경우 확보된 출처·인용은 유지된다.

        6. 저장 실패 재시도는 모델 호출·관계/버전 중복 생성 없이 수행되고, 최신 버전이나 다른 관계의 근거를 덮어쓰지 않는다.

        7. 저장 완료·관리자 허용만으로 미검증 관계가 공개되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 관계별 필수 정보·근거 상태·시점·버전 관리, 비공개 후보 보관, 검증 불가 근거의 공개 제외,
        저장 단계 복구. 원본의 팀 검토 전 상태를 유지하며 구현·시험 완료를 뜻하지 않는다.

        [확인 필요: 지원할 관계 유형의 최종 목록과 위에 명시한 기업 간 관계 정보·이슈 영향 경로 정보 외 유형별 추가 필수 속성 결정
        필요]

        [확인 필요: 근거 미확보 관계를 그래프의 별도 섹션에 표시할지 결정 필요. 표시하는 경우 확정된 관계와 구분하고 미검증 상태·근거
        부족을 안내하는 방식 및 공개 기준과의 정합성 검토 필요]

        별도 섹션의 일반 사용자 공개는 근거 연결·자동 검증을 통과하지 않은 관계를 공개하지 않는 현재 기준의 변경 여부와 함께 팀이 결정한다.
        결정 전에는 비공개 후보로만 보관하며 새 관리자 화면을 요구하지 않는다.'
