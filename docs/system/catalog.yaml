  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/10-외부-연동.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 뉴스와 시장 데이터 연동
      기능 설명: 기업·기간에 맞는 시세·재무·뉴스·공시와 근거를 실제 제공 범위와 접근 권한이 확인된 공급원에서 조회한다. 출처·자료 기준
        시점·미제공·지연·오류 상태를 구분해 전달한다. 원본의 토스 API·뉴스 크롤링은 연동 후보이며 실제 이용 가능성이 확인된 것으로 간주하지
        않는다.
      선행조건: 기업·기간별 시세·재무·뉴스·공시·근거 자료 조회가 필요하고 데이터 공급 방식이 확보되어 있다.
      입력값: 기업 또는 자료 식별자, 조회 기간, 필요한 자료 종류와 지원이 확인된 가격 종류·수정주가 적용 여부/재무 기준, 현재 조회 조건을
        구분할 요청 정보. 공급원별 실제 기업·문서 식별자와 요청 가능 범위는 연동 검증을 통해 확인한다.
      입력·검증 규칙: '응답의 기업·자료 종류·기간이 요청 조건과 일치하는지 확인한다. 다른 기업·과거 조회 조건의 응답을 현재 결과로 연결하지
        않는다.

        가격은 출처·가격 종류·수정주가 적용 여부·기준 시각·통화/단위를, 재무는 출처·실적 대상 기간·연결/별도·단독 기간/누적 기간 기준·기준일·단위를
        함께 전달한다. 서로 다른 기준의 값을 같은 값처럼 혼합하지 않으며 필요한 기준이 미확인이면 임의 변환·대체하지 않는다. 공급원에서
        지원이 확인된 종류만 사용하고 데이터 기준 시각과 조회 시각을 구분한다.

        문서는 공급 문서 ID·원문 주소·출처·발행 시각·서비스 관측 시점과 공급원이 제공하는 등록/수정 시각·변경 식별 정보를 구분해 관리한다.
        같은 문서의 중복, 같은 사건의 서로 다른 기사, 동일 주소의 수정 내용을 구분하여 다른 기사나 변경 내용을 조용히 버리지 않는다.

        지연 등록·수정 문서의 발견에 사용할 등록/수정 시각·변경 커서 또는 변경 목록의 제공 여부와 의미를 확인한다. 관측 시점 저장만으로
        미발견 문서를 찾을 수 있다고 보지 않으며 발행 시각만의 필터로 누락 없음을 보장하지 않는다. 공급원의 조회 범위·페이지와 처리 완료
        여부, 과거 구간을 겹쳐 다시 조회할 수 있는 범위를 확인한다.

        자료 없음·미제공·지연·접근 불가·조회 실패를 구분하며 없는 가격·재무 수치·원문을 생성하지 않는다. 공급원 명칭만으로 계약·권한을
        확보했다고 간주하지 않는다.'
      처리 절차 및 분기: '1. 기업·기간·자료 종류와 이용 가능한 공급원 범위를 확인해 요청한다.

        2. 반환된 대상·시간·기간·단위·문서 식별 정보를 확인하고 필요한 형식으로 전달한다.

        3. 정상 자료·정상 빈 결과와 누락·지연·접근 불가·오류를 구분해 해당 내부 조회 기능에 전달한다.

        4. 문서의 중복·수정·지연 유입을 식별할 정보와 수집 범위 완료 여부를 함께 전달한다.'
      정상 결과: 현재 조회 조건에 맞는 자료가 출처·기준 시점·단위와 함께 전달되거나, 정상 자료 없음과 미제공·지연·접근 불가·조회 실패가
        명확히 구분되어 반환된다.
      예외 처리: '자료 누락: 실제 0·정상 빈 목록과 구분한다. 계산에 필요한 주가가 없으면 임의의 0을 넣지 않고 가격 미제공 상태를 전달한다.

        자료 지연·휴장 구간: 제공된 기준 시점을 유지하고 최신 가격이나 임의 거래일 값으로 바꾸지 않는다.

        원문 접근 불가: 확보된 제목·출처·인용 등과 접근 실패 상태를 구분하며 없는 원문을 생성하지 않는다.

        같은 ID·주소의 수정 문서: 이전 내용과 변경 내용을 구분하며 단순 재수집 중복으로 버리지 않는다.

        공급자 장애·조회 범위 일부 실패: 정상 0건이나 전체 조회 완료로 처리하지 않는다. 재시도는 정해진 정책을 따르며 기존 자료를 제공하는
        경우 그 기준 시점과 조회 실패·지연 상태를 명시한다.'
      수용 기준: '1. 공급자의 실제 기업·자료 필드와 반환 대상·값·기간·단위가 일치한다.

        2. 데이터 기준 시각과 조회 시각이 구분되고 누락된 주가가 0 또는 최신 가격으로 대체되지 않는다.

        3. 정상 0건·누락·지연·접근 불가·일부 또는 전체 조회 실패를 구분한다.

        4. 같은 사건의 별도 기사와 수정된 문서가 보존되며 재수집한 동일 내용은 중복으로 전달되지 않는다.

        5. 외부 원문을 열지 못해도 확보된 출처·인용과 접근 실패 상태가 구분된다.

        가격 종류·수정주가 적용 여부와 재무의 연결/별도·단독/누적 기준이 보존되며 서로 다른 기준 또는 미확인 기준을 섞어 사용하지 않는다.'
      확인 필요 사항: '[확인 필요: 토스 API의 실제 제공 항목·접근 권한·이용 가능성, 실제 뉴스 수집처와 크롤링 이용 조건 확인 필요]

        [확인 필요: 지원 가격 종류·수정주가 적용 여부·시간 단위·지연/휴장 표시·동일 기준 시점 제공 여부, 재무 기간·연결/별도·단독/누적
        기준·단위 및 필드 대응은 공급원 검증 필요]

        [확인 필요: 공급 문서 ID·등록/수정 시각·변경 커서/목록·페이지 조회·겹치는 과거 구간 재조회 지원과 주소/내용 중복·수정 판정
        상세는 실연동 검증 필요]

        [확인 필요: 변경 정보가 없는 공급원의 재조회 범위·한계와 재조회 범위 밖 오래된 수정의 발견 가능성 검증 필요. 지원이 확인되지
        않은 지연 등록·수정까지 누락 없이 발견한다고 보장하지 않는다]

        [확인 필요: 재시도 횟수·간격·제한 및 장애 시 기존 자료 제공 범위 결정 필요]'
