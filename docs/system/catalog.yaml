      입력·검증 규칙: 질문에 직접 적힌 기업·이슈·기간 조건을 화면 맥락보다 우선한다. 이 회사, 이 이슈는 현재 선택 맥락 또는 직전 답변의
        명시 대상을 우선 참조한다. 여러 기업·기간으로 해석 가능한 경우 추정하지 않는다. 최근은 답변에 실제 적용 기간을 표시한다. 과거
        기준 시점(asOf) 질문은 그 시점 이후 공개된 문서를 사용하지 않는다.
      처리 절차 및 분기: '1. 질문의 기업·이슈·관계·기간 조건을 추출한다.

        2. 질문 조건과 전달 맥락을 비교해 분석 범위를 확정한다.

        3. 범위가 불명확하면 선택지를 포함한 확인 질문을 반환한다.

        4. 범위가 확정되면 근거 조회 단계로 전달한다.'
      정상 결과: 실제 적용 대상·기간·기준 시점이 확정되거나 확인 질문이 제공된다.
      예외 처리: '대상·기간 불명확: 확인 질문 제공. 해석 처리 장애: 분석 준비 중 오류와 재시도 안내를 제공하며 근거 부족으로 위장하지
        않는다. 과거 기준 시점 이전 자료 없음: 자료 없음 안내를 제공한다.'
      수용 기준: '1. 명시한 기업·기간은 화면 맥락보다 우선한다.

        2. 불명확한 질문은 임의 대상 분석 대신 확인 질문을 제공한다.

