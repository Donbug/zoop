        2. 작업 진행·검증·저장 상태와 실패 사유를 해당 실행에 연결한다. 유효한 실행의 결과를 저장한 뒤 완료로 기록한다.

        3. 동일 작업 재전송은 기존 상태를 조회하고 완료이면 현재 권한을 확인하여 저장 결과를 반환한다. 요청 내용이 달라지면 기존 작업을
        바꾸지 않고 충돌로 처리한다.

        4. 허용된 일시 장애의 사용자 재시도는 이전 실행 종료와 같은 대화의 다른 처리 중 작업이 없음을 확인한 뒤 같은 작업·최초 조건으로
        수행한다. 저장 실패는 보존된 검증 결과의 저장만 복구한다.'
      정상 결과: 질문별 서버 상태와 저장 결과를 조회·회수할 수 있고 과거 작업 재시도에도 원래 조건이 유지된다.
      예외 처리: '후속 대화에서 기업·기간이 변경됨: 과거 작업의 고정 조건을 최신 맥락으로 바꾸지 않는다.

        권한 상실·다른 회원의 기록: 보호된 대화·결과·근거를 반환하지 않는다. 지정 근거 버전이 삭제되거나 사용 불가이면 그 상태를 안내하고
        최신 자료로 조용히 대체하지 않는다.

        동일 작업 ID에 다른 요청 내용: 충돌로 거절하고 최초 기록을 유지한다. 상태 조회 실패는 작업 미등록이나 실패 확정으로 간주하지
        않는다.

        저장 실패: 완료로 표시하지 않는다. 검증 결과가 보존돼 있으면 현재 권한·자료·실행의 유효성을 확인한 뒤 모델 호출 없이 저장만 재시도한다.

        검증 실패·결과 소실 또는 보존 여부 불명확: 동일 작업 재생성을 허용하지 않고 실패·복구 가능 여부를 기록한다. 재분석은 사용자의
        명시적 새 질문으로 구분한다.

        이전 실행·다른 대화의 늦은 결과: 최신 결과나 새 대화 기록을 덮어쓰지 않는다.

        같은 대화의 다른 작업이 처리 중: 과거 실패 작업의 재실행을 시작하지 않고 처리 중임을 안내한다. 현재 권한을 충족하는 기존 상태
        조회·저장 결과 회수는 계속 허용한다.'
      수용 기준: '1. 최초 질문 시각·맥락·실제 기간·근거 버전과 상태가 저장 후 유지되고 과거 작업 재시도에도 변경되지 않는다.

        2. 동일 작업 재전송은 중복 실행·기록을 만들지 않으며, 같은 ID의 다른 내용은 최초 기록을 덮어쓰지 않는다.

        3. 새 질문·보충 입력은 새 작업이고, 완료 답변·되묻기·설정 안내·판단 보류의 회수는 기존 저장 결과를 사용한다.

        4. 현재 소유권·근거 접근 권한이 없으면 보호 결과를 반환하지 않고, 사용 불가 근거 버전을 임의 대체하지 않는다.

        5. 늦은 이전 실행이 현재 결과를 덮어쓰지 않으며 패널 닫기·새 대화 시작만으로 기존 기록이 삭제되지 않는다.

        6. 보존된 검증 결과의 저장 복구는 모델 호출 없이 수행되고 저장 성공 전에는 완료로 노출되지 않는다.

        7. 같은 대화에서 다른 질문이 처리 중일 때 과거 실패 작업 재실행은 시작되지 않으며, 상태 조회·완료 결과 회수는 계속 가능하다.
        신규 질문과 실패 재실행이 동시에 요청돼도 유효한 실행은 하나만 시작된다.'
