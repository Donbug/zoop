    row: 55
    rowUnit: xlsx-row
  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/07-AI-챗봇.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: AI 질문 진입과 전송
      기능 설명: 전역 AI 질문창 또는 그래프·기업 상세에서 전달받은 기업·이슈·관계·문서를 기준으로 질문할 수 있어야 한다. 전달받은 선택
        대상·기간·근거를 질문에 포함하고 대화 및 질문 작업과 연결해야 한다. 빈 입력과 같은 대화에서 작업 처리 중인 추가 전송은 제한해야
        한다. 비회원은 질문 자체를 제한한다.
      선행조건: 로그인 회원이 전역 질문창 또는 그래프·기업 상세에서 AI 질문창을 연다.
      입력값: 질문 본문, 대화 식별자, 작업 식별자, 선택 대상 식별자·기간·근거 참조. 선택 맥락 없이 시작하는 전역 질문도 포함한다.
      입력·검증 규칙: '전달받은 대상·기간·근거를 화면에 표시하고 실제 질문 요청에도 포함한다.

        빈 입력과 같은 대화에서 작업 처리 중인 추가 질문 전송을 제한한다.

        비회원은 질문 자체를 전송할 수 없다.

        질문 길이나 전체 사용량 제한 수치는 미정이다.'
      처리 절차 및 분기: '1. 전달받은 맥락을 사용자에게 표시하고 질문에 포함한다.

        2. 빈 입력을 차단한다.

        3. 같은 대화에서 작업이 처리 중이면 추가 전송을 제한한다.'
      정상 결과: 질문과 적용 맥락이 대화 및 질문 작업에 연결되어 처리된다.
      예외 처리: '빈 입력: 질문 전송을 차단한다.

        비회원: 질문 전송을 제한하고 로그인 안내를 제공한다.

        같은 대화에서 작업 처리 중: 새로운 질문 전송을 제한한다.

        전송 후 응답 미수신: 새 생성을 시작하기 전에 기존 작업 상태를 확인하는 결과 회수 절차를 적용한다.'
      수용 기준: '1. 근거 참조가 서버 작업까지 전달된다.

        2. 빈 입력·비회원·동일 대화 처리 중 추가 질문이 차단된다.'
      확인 필요 사항: '[확인 필요: 질문 유형·길이·전체 이용 한도 결정 필요]'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/08-AI-챗봇-v2.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: AI 질문 진입과 맥락 전달
      기능 설명: 시스템은 전역 AI 패널과 기업·이슈·관계 패널의 AI에게 질문하기에서 질문을 시작할 수 있게 한다. 선택한 기업, 이슈,
        관계, 기준 시점, 근거 문서는 질문 맥락으로 함께 전달한다. 전역 질문은 선택 맥락 없이도 시작할 수 있다.
      선행조건: 로그인 회원이 AI 패널 또는 AI 질문 버튼을 연다.
      입력값: 질문 본문, 대화 ID, 선택 기업·이슈·관계 ID(선택), 기준 시점(asOf, 선택), 근거 문서 ID(선택)
      입력·검증 규칙: 선택 맥락은 질문 입력창 상단에 표시하고 실제 요청에도 포함한다. 사용자가 질문에서 다른 기업·기간을 명시하면 질문의
        명시 조건을 우선한다. 빈 입력은 전송하지 않는다. 같은 대화에서 답변 생성 중이면 추가 전송 버튼을 비활성화한다. 비회원은 AI 질문
        전송이 불가하며 로그인 안내를 제공한다.
      처리 절차 및 분기: '1. 진입 위치의 선택 맥락을 수집하여 표시한다.

        2. 사용자가 질문을 작성·전송한다.

        3. 빈 입력·로그인 상태·동일 대화 처리 중 여부를 확인한다.

        4. 통과하면 질문과 맥락을 해당 대화에 저장하고 해석 단계로 전달한다.'
      정상 결과: 질문과 적용 맥락이 대화 및 질문 작업에 연결되어 처리된다.
      예외 처리: "빈 입력: 전송 차단. 비회원: 로그인 안내. \n처리 중: 입력을 유지하고 기존 답변 생성 중 안내. \n전송 결과 미수신:\
        \ 새 질문을 만들지 않고 기존 요청 상태를 확인한다."
      수용 기준: '1. 기업·이슈·관계에서 시작한 질문은 해당 맥락을 표시하고 서버 요청에도 포함한다.

        2. 전역 질문은 선택 맥락 없이도 전송된다.

        3. 빈 입력·비회원·동일 대화 처리 중 추가 전송이 차단된다.'
      확인 필요 사항: 질문 글자 수와 사용자별 일일 이용 한도는 운영 정책 확정 후 적용한다.
