        ④ 동일 기업을 하나의 기업 노드로 통합하고 보유·관심 상태를 표시한다.

        ⑤ 기준 기업과 연결된 관련 기업·이슈·제품 및 관계 정보를 조회한다.

        ⑥ 이슈 노드는 국내·국제 속성과 함께 표시한다.

        ⑦ 사용자가 보유 또는 관심 필터를 선택하면 해당 기준 종목으로 그래프를 다시 구성한다.

        ⑧ 필터 변경 중 이전 요청의 응답이 늦게 도착하면 폐기한다.

        ⑨ 선택한 필터에 기준 종목이 없으면 해당 상태를 안내하고 다른 필터로 전환할 수 있도록 한다.'
      정상 결과: 현재 선택한 전체 / 보유 / 관심 필터에 맞는 개인화 그래프가 표시되고, 기준 종목과 연결된 기업·이슈·제품 및 관계를 탐색할
        수 있다.
      예외 처리: '전체 기준 종목 없음: 보유종목 또는 관심종목이 없습니다.를 표시하고 관심종목 추가 기능을 안내한다.

        보유 필터 결과 없음: 보유종목이 없습니다.를 표시하고 전체 또는 관심 필터로 전환할 수 있도록 한다.

        관심 필터 결과 없음: 관심종목이 없습니다.를 표시하고 관심종목 추가 또는 전체·보유 필터로 전환할 수 있도록 한다.

        관계 0건: 해당 기준 기업은 유지하고 현재 확인된 관련 관계가 없습니다.를 표시한다.

        조회 실패: 현재 선택 필터와 직전 정상 그래프를 유지하고 다시 시도를 제공한다.

        지연 응답: 현재 필터 또는 조회 식별자와 일치하지 않는 응답은 화면에 반영하지 않는다.

        비회원 접근: 개인화 데이터를 반환하지 않고 로그인 필요 안내를 제공한다.'
      수용 기준: '① 전체 필터는 보유·관심종목의 합집합과 일치한다.

        ② 보유 필터는 보유종목만 기준으로 그래프를 구성한다.

        ③ 관심 필터는 관심종목만 기준으로 그래프를 구성한다.

        ④ 보유·관심 양쪽에 존재하는 동일 종목은 하나의 기업 노드로 표시되고 두 상태가 모두 표시된다.

        ⑤ 선택 종목과 연결된 이슈·제품·관련 기업은 필터 변경 후에도 해당 기준 종목과의 관계를 기준으로 표시된다.

        ⑥ 빠르게 필터를 변경해도 마지막으로 선택한 필터와 결과가 일치한다.

        ⑦ 비회원은 개인화 그래프를 조회할 수 없다.'
