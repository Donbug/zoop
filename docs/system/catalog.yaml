  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 135
      rowUnit: xlsx-row
    fields:
      요구사항명: 지원 환경
      요구사항 설명: 시스템은 팀이 지정한 데스크톱 브라우저와 최소 화면 크기에서 주요 기능을 정상적으로 제공해야 한다. 지원 대상 브라우저,
        최소 버전, 해상도 및 모바일 지원 여부를 문서에 명시해야 한다.
      적용 대상·범위: 팀이 승인할 데스크톱 브라우저·버전·최소 화면 크기에서의 주요 사용자 기능과 실제 제공하는 관리자 화면의 로그인·이슈
        검수·브리핑 정정 동선. 모바일 지원 범위는 아직 확정하지 않는다.
      적용 조건·검증 입력: '승인할 운영체제·브라우저·버전 조합, 최소 화면 크기, 브라우저 확대율과 실제 콘텐츠 표시영역의 크기, 모바일
        지원 여부.

        화면 해상도와 브라우저 안에서 콘텐츠가 표시되는 영역의 크기를 구분해 기록한다. 각 환경에서 인증·그래프·브리핑·기업 상세·AI 패널
        점검 시나리오를 사용한다.'
      품질 목표·준수 규칙: '1. 승인된 이용 환경에서 주요 기능을 정상 제공해야 한다.

        2. 지원 브라우저·최소 버전·해상도·모바일 지원 여부를 문서화한다.

        3. 지원 대상으로 문서화된 환경과 실제 점검 환경을 일치시킨다.

        4. 명시되지 않은 브라우저·모바일 환경까지 지원 완료라고 확대 해석하지 않는다.

        5. 각 환경에서 주요 기능의 표시뿐 아니라 실제 조작·결과 표시도 확인한다.'
      정상 상태: 승인된 환경 조합에서 주요 기능을 이용할 수 있고 환경별 점검 결과를 확인할 수 있다.
      미충족·예외 처리: '지원 목록 미확정: 호환성 최종 합격을 판정하지 않는다.

        미지원 환경: 지원 완료로 표시하지 않는다.

        특정 환경에서 오류·레이아웃 잘림·조작 불가 발생: 해당 환경과 영향을 받는 기능을 기록한다. 사용자 안내·차단 방식은 별도 결정한다.'
      검증 방법: '1. 승인된 운영체제·브라우저·버전·최소 화면 크기 조합을 준비하고 실제 표시영역과 확대율을 기록한다.

        2. 각 환경에서 로그인, 그래프 선택·전환, 브리핑 조회, 기업 상세 탐색, AI 패널 열기·질문·닫기·재열기를 수행한다. 관리자
        화면을 제공하는 환경에서는 관리자 로그인·이슈 검수·브리핑 정정의 입력·확인·결과 조회도 시험한다.

        3. 최소 표시 크기에서 핵심 정보·버튼의 잘림, 화면 겹침, 조작 불가를 확인한다. 문제의 환경·기능·재현 절차와 수정 후 재검증
        결과를 남긴다.

        4. 통과·실패·미검증을 환경별로 구분한다. 모바일은 승인된 범위만 지원 합격 대상에 포함한다.'
      수용 기준: '1. 승인된 모든 환경 조합에서 인증·그래프·브리핑·기업 상세·AI 패널과 제공되는 관리자 로그인·검수·정정 동선의 주요
        정보·조작 요소를 이용할 수 있다.

        2. 환경별 실제 브라우저 버전·표시영역·확대율, 실행한 시나리오와 통과·실패·미검증 결과가 기록된다.

        3. 지원 목록이 미정이거나 미검증·미해결 실패가 남은 환경은 지원 완료로 판단하지 않는다.'
      확인 필요 사항: '[확인 필요: 지원 운영체제·브라우저명·최소 버전·최소 화면 크기의 측정 기준·기준 확대율·모바일 지원 여부 결정 필요]

        [확인 필요: 미지원 환경의 안내·진입 제한 여부 결정 필요]

        브라우저명·버전·화면 크기 수치를 임의로 정하지 않는다.'
