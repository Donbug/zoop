  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 191
      rowUnit: xlsx-row
    fields:
      기능명: 발행 브리핑 제공 중단
      기능 설명: 관리자가 발행된 브리핑의 제공 중단을 요청하면 해당 회차의 중단 상태를 사용자 조회에 반영하고 기존 발행 이력을 보존한다.
      선행조건: 발행된 브리핑에 오류가 확인되어 권한 있는 관리자가 제공 중단을 요청한다.
      입력값: 대상 브리핑의 발행일·출근/퇴근 회차와 검토한 제공 버전/상태, 제공 중단 선택, 조치 사유·시점, 중단 요청 식별 정보.
      입력·검증 규칙: '서버에서 현재 제공 중단 권한·대상 범위와 회차·버전·현재 상태를 확인한다. 다른 정정·중단 조치가 먼저 반영됐으면
        오래된 화면의 요청을 그대로 적용하지 않는다.

        중단 상태 저장과 사용자 조회 반영을 구분한다. 중단이 확인된 회차는 공통 브리핑 조회·직접 접근·캐시/이전 버전 제공에서도 현재 중단
        상태를 확인해 중단된 본문·근거를 제공하지 않고 중단 상태를 안내한다.

        원래 발행 내용·근거와 조치 사유·시점을 보존하며 이력 조회도 현재 관리자 권한·허용 범위 안에서만 제공한다. 제공 중단을 이력 삭제나
        제공 재개로 확대하지 않으며 재처리·정정만으로 중단을 해제하지 않는다.

        같은 요청 재전송은 처리 여부와 현재 상태를 확인하고 중복 변경하지 않는다. 이미 중단된 상태에 대한 별도 반복 조치의 사유/이력 처리
        정책은 미정으로 유지한다.

        원본 발행 버전과 이를 참조한 파생 개인화 결과 버전의 의존 관계를 추적하고, 이후 개인화 결과 조회에서 원본의 현재 정정·중단 상태를
        확인하는 연계 조건을 담당자와 확정한다. 구체적인 안내·차단·재생성 및 이미 열린 화면의 처리 범위는 미정이며 확인하지 않은 경로까지
        반영 완료로 표시하지 않는다.'
      처리 절차 및 분기: '1. 관리자가 정확한 대상 회차·버전과 중단 사유를 확인해 요청한다.

        2. 서버가 현재 권한·대상/상태와 요청의 기존 처리 여부를 확인한다.

        3. 중단 상태와 조치 정보를 저장하고 해당 회차의 사용자 조회 경로에 반영한다.

        4. 저장 성공·조회 반영 상태를 각각 확인한다. 기존 발행 이력은 유지하고 실패한 반영 경로는 미완료로 표시한다.'
      정상 결과: 대상 회차가 확인된 공통 브리핑 조회 경로에서 정상 발행 상태로 제공되지 않으며 원래 발행 이력과 조치 정보가 유지된다. 중단
        저장과 조회 반영의 완료 여부를 구분할 수 있다.
      예외 처리: '권한 없음·대상 범위 밖: 제공 중단을 허용하지 않는다.

        이미 중단된 회차: 현재 중단 상태를 유지한다. 같은 요청 재전송은 중복 변경하지 않으며 별도 반복 조치의 추가 효과는 임의 적용하지
        않는다.

        대상 회차 없음·상태/버전 조회 실패: 없음과 조회 불가를 구분하고 확인하지 못한 대상에 조치를 적용하지 않는다.

        동시 정정·상태 변경: 오래된 요청을 적용하지 않고 현재 상태를 재확인한다.

        중단 저장 실패·응답 미수신: 완료로 표시하지 않고 기존 요청 처리 여부·현재 상태를 먼저 확인한다.

        저장 성공 후 조회/캐시 반영 실패: 반영 미완료와 실패 경로를 표시하고 저장된 중단 상태로 해당 단계만 복구한다. 중단이 확인된 회차의
        이전 본문을 정상 결과로 대체 제공하지 않는다.'
      수용 기준: '1. 중단이 확인된 회차가 공통 브리핑 조회·직접 접근·캐시/이전 버전 제공에서 본문·근거가 우회 노출되지 않고 중단 상태로
        안내된다.

        2. 원래 발행 내용·근거·조치 이력이 유지되고 정정·재처리만으로 중단 상태가 해제되지 않는다.

        3. 권한 없는 요청과 오래된 대상/상태의 요청은 조치를 적용하지 못한다.

        4. 같은 요청 재전송은 중복 변경을 만들지 않으며 저장·조회 반영 실패를 전체 완료로 표시하지 않는다.

        5. 승인된 반영 범위와 확인한 경로가 표시되며 기존 개인화 결과·이미 열린 화면의 처리 범위를 임의로 확대하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 회차·상태 확인, 중단 저장/조회 반영 구분, 공통 조회의 직접·캐시·이전 버전 경로 우회
        방지, 이력 보존.

        [팀 협의 필요: 중단의 사용자 표시·승인 권한/단계, 원본 버전↔파생 개인화 결과의 영향 추적 및 이후 조회의 정정/중단 상태 확인
        연계를 담당자와 확정·검증해야 구현 완료로 인정한다. 구체적인 안내·차단·재생성 및 이미 열린 화면의 처리 범위는 미정]

        [확인 필요: 별도 반복 중단 요청의 사유·이력 처리 및 조치 정보 보존·삭제 정책 결정 필요]

        [확인 필요: 저장/조회 반영 실패의 재확인·복구 운영 기준 결정 필요]'
