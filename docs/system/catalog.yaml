  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/03-메인-그래프.csv
      row: 107
      rowUnit: xlsx-row
    fields:
      기능명: 관계 근거 확인
      기능 설명: 사용자가 그래프의 연결과 설명을 직접 확인할 수 있도록 기업·이슈·관계에 연결된 근거 자료를 제공한다. 근거 뉴스·공시의 제목,
        출처, 발행 시각, 확보된 원문 구간과 원문 링크를 표시해야 한다. 원문 접근이 불가능하거나 근거가 충분하지 않은 경우 해당 상태를
        안내하고, 문서 발행 시각과 관계 확인 시점을 구분해야 한다.
      선행조건: 사용자가 기업·이슈·관계 설명에서 근거 보기를 선택한다.
      입력값: 선택 대상, 연결된 뉴스·공시 참조, 제목·출처·발행 시각·확보된 원문 구간·원문 링크·관계 확인 시점.
      입력·검증 규칙: '선택 설명을 뒷받침하는 문서와 참조가 일치해야 한다.

        확보된 원문 구간만 인용하며 없는 원문을 생성하지 않는다.

        문서 발행 시각과 관계 확인 시점을 구분한다.'
      처리 절차 및 분기: '1. 참조에 연결된 뉴스·공시의 제목·출처·발행 시각·확보된 원문 구간·원문 링크를 조회한다.

        2. 관계 확인 시점은 따로 표시한다.'
      정상 결과: 연결된 근거 자료의 정보와 확보된 인용을 확인하고 제공된 링크로 원문에 접근할 수 있다.
      예외 처리: '원문 접근 불가: 접근 불가 상태를 안내하고 확보된 메타데이터는 유지한다.

        근거 부족: 부족 상태를 안내하며 충분한 근거인 것처럼 표시하지 않는다.

        근거 조회 장애: [확인 필요: 장애 안내와 재시도 방식 결정 필요]'
      수용 기준: '1. 참조 대상과 문서가 일치한다.

        2. 원문이 없는데 인용을 생성하지 않고 접근 실패 안내가 나온다.'
      확인 필요 사항: '[확인 필요: 장애 안내와 재시도 방식 결정 필요]'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 112
      rowUnit: xlsx-row
    fields:
      기능명: 관계 근거 확인
      기능 설명: 기업·이슈·관계 설명에 사용된 뉴스·공시 근거를 제공하고 사용자가 요약 내용의 근거 원문을 직접 확인할 수 있도록 한다.
      입력값: 선택 기업/이슈/관계 식별자, 뉴스·공시 참조, 제목, 출처, 발행시각, 요약, 확보된 원문 구간, 원문 링크.
      입력·검증 규칙: '① 요약과 근거 문서가 실제로 연결되어 있어야 한다.

        ② 확보하지 않은 원문 내용을 생성하지 않는다.

        ③ 동일 원문은 문서 식별자 또는 URL 기준으로 중복 제거한다.

        ④ 뉴스·공시의 원문 발행시각과 시스템이 관계를 확인한 시점을 구분한다.

        ⑤ 근거 목록은 관련도 높은 순을 기본으로 한다.'
      처리 절차 및 분기: '① 선택한 설명과 연결된 근거 목록을 조회한다.

        ② 뉴스·공시 제목, 출처, 발행시각, 원문 구간을 표시한다.

        ③ 제공 가능한 경우 원문 링크를 제공한다.

        ④ 원문 접근 불가 시 확보된 메타데이터와 요약은 유지한다.'
      정상 결과: 사용자가 그래프 또는 패널의 설명과 연결된 뉴스·공시의 원문 근거를 확인할 수 있다.
      예외 처리: '원문 접근 불가: 제목·출처·발행시각은 유지하고 원문 접근 불가를 표시한다.

        근거 부족: 충분한 근거가 있는 것처럼 표시하지 않는다.

        조회 장애: 기존 그래프/패널을 유지하고 근거 영역에서만 다시 시도를 제공한다.'
      수용 기준: '설명과 근거가 일치한다.

        원문이 없는데 임의 인용을 생성하지 않는다.

        일부 근거 실패가 전체 목록을 제거하지 않는다.'
      확인 필요 사항: '확정: 근거 조회 실패 시 메인 그래프와 정보 패널은 유지한다.

        확정: 근거 영역만 독립적으로 다시 조회한다.

        확정: 정상 조회된 일부 근거는 그대로 표시하고 실패 항목만 오류 상태로 표시한다.

        확정: 뉴스·공시의 정렬 기본값은 관련도 순이며 동률이면 최신순으로 한다.'
