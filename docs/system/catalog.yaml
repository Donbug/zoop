    fields:
      기능명: 가상계좌 데이터 연동
      기능 설명: 프로젝트용 고정 Mock 데이터에서 모의 프로필·계좌 식별자·예수금·보유종목을 조회한다. 각 프로필의 보유 종목·수량·평균
        매입가는 변경하지 않으며 매수·매도나 실계좌 연동을 제공하지 않는다. 실제 증권사 비밀번호·인증서 등 자격 증명을 요구하지 않는다.
      선행조건: 가상계좌 기능 범위가 결정되고 회원이 준비된 모의 프로필·보유 정보를 조회하거나 연결한다. 연결 기능의 원본 보류 상태는 유지한다.
      입력값: 현재 회원, 선택한 모의 프로필 식별자, 해당 프로필의 모의 계좌 식별자·예수금·보유 종목·수량·평균 매입가, Mock 정보 기준
        시점. 연결 기능을 사용하는 경우 현재 저장된 회원·프로필 연결 상태.
      입력·검증 규칙: '응답이 프로젝트용 모의 데이터임을 구분하고 실제 증권계좌 자격 증명을 받지 않는다.

        선택한 프로필과 계좌·예수금·보유종목의 대응 및 현재 회원의 조회·연결 대상을 확인한다.

        최초 Mock 로드 시 값의 유효성을 검사하고, 각 프로필의 종목·수량·평균 매입가는 고정한다. 거래·값 편집·주기적 보유 갱신을 추가하지
        않는다.

        정상 빈 보유목록, 실제 값 0, 미제공 값과 조회 실패를 구분한다.

        가격에 따른 평가금액·비중은 서비스에서 별도로 계산하며 Mock 원본 값을 덮어쓰지 않는다. Mock 정보 기준 시점과 가격·계산 기준
        시점은 구분한다.

        조회 성공과 회원·프로필 연결 저장 성공을 구분한다. 연결 기능이 채택된 경우에만 저장 결과를 확인해 연결 완료로 처리한다.'
      처리 절차 및 분기: '1. 선택 프로필의 존재·유효성과 조회 대상을 확인한다.

        2. 모의 계좌·예수금·고정 보유종목 및 정보 기준 시점을 조회하고 누락·빈 목록·오류 상태를 구분해 전달한다.

        3. 연결 기능을 사용하는 경우 현재 회원·프로필 연결 상태를 먼저 확인하고 필요한 연결만 저장한다. 이미 같은 프로필로 완료된 요청은
        현재 상태를 반환한다.

        4. 저장 성공을 확인한 뒤 연결 완료를 알리며 같은 요청으로 연결을 중복 생성하지 않는다.'
      정상 결과: 선택한 Mock 프로필에 대응하는 모의 계좌·예수금·고정 보유정보와 기준 시점을 확인한다. 연결 기능을 사용하는 경우 조회
        결과와 실제 저장된 연결 상태를 구분하여 확인한다.
      예외 처리: '존재하지 않거나 유효하지 않은 프로필: 정상 조회·연결로 처리하지 않고 선택 대상을 다시 확인하도록 안내한다.

        정상 빈 보유목록: 보유종목 없음으로 반환하며 실패로 바꾸지 않는다. 값 미제공은 임의의 0으로 채우지 않는다.

        조회 실패: 선택 조건을 유지하고 조회 오류·다시 조회를 제공한다.

        연결 저장 실패: 이전 정상 연결을 유지하고 새 선택을 연결 성공으로 표시하지 않는다.

        응답 미수신·상태 조회 실패: 연결 결과를 확인하기 전 중복 요청을 시작하거나 성공·미연결로 단정하지 않는다.'
      수용 기준: '1. 실제 증권사 비밀번호·인증서를 요구하지 않으며 모의 데이터임을 구분한다.

        2. 선택 프로필과 계좌·예수금·보유정보가 일치하고 가격 재계산으로 Mock 종목·수량·평균 매입가가 변경되지 않는다.

        3. 빈 보유목록·실제 0·미제공·조회 실패가 구분된다.

        4. 연결을 사용하는 경우 반복 요청이 중복 연결을 만들지 않고 저장 실패 시 이전 정상 상태가 유지된다.'
