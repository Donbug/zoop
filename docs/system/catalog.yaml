  description: 시스템은 수집·분석된 뉴스, 이슈, 기업 관계, 사건 시각 및 근거 정보를 서로 연결하여 저장해야 한다. 저장된 공개 대상
    결과는 메인 그래프와 기업 상세페이지에서 각 화면의 기업·기간·선택 조건에 맞게 조회할 수 있어야 한다. 처리 중이거나 검증에 실패한 결과는
