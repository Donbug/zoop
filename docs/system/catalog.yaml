  detailRange: A119:B131
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/11-AI-평가-관리자.csv
      row: 121
      rowUnit: xlsx-row
    fields:
      기능명: 회원 활동 조회
      기능 설명: 관리자가 승인된 목적·대상·표시 항목 범위에서 선택한 회원의 활동 통계를 조회한다. 통계 조회만으로 회원 상태를 변경하거나
        보호된 대화·개인화 결과 원문을 열람하지 않는다.
      선행조건: 승인된 관리자가 대상 회원과 조회 조건을 선택한다. 실제 제공할 활동 항목·기간·목적 및 관리자 허용 범위는 확정된 정책에 따라야
        하며 세부 정책은 미정이다.
      입력값: 대상 회원 식별자, 활동 조회 기간·조건, 승인된 활동 통계 항목·조회 목적/대상 범위, 집계 기준 시점.
      입력·검증 규칙: '서버에서 현재 관리자 권한과 허용 목적·대상·표시 항목 범위를 확인한다. 정해지지 않은 항목을 임의 수집하거나 권한
        범위를 확대하지 않는다.

        대상 회원 식별자가 조회 결과와 일치해야 한다. 대상을 바꾼 뒤 늦게 도착한 이전 회원의 응답은 현재 화면에 반영하지 않는다.

        활동 통계의 단위·기간 기준·집계 기준 시점을 표시한다. 정상 활동 0건과 회원 없음·자료 누락·조회 실패를 구분한다.

        활동 조회는 차단·해제와 구분하며 조회·재조회만으로 회원 상태를 변경하지 않는다. 활동 통계 권한만으로 보호된 대화록·개인화 결과 원문을
        제공하지 않는다.'
      처리 절차 및 분기: '1. 관리자가 대상 회원과 조회 조건을 선택한다.

        2. 서버가 현재 관리자 권한·허용 범위와 대상 회원의 존재를 확인한다.

        3. 허용된 활동 통계만 조회하고 회원·기간·집계 기준 시점을 연결해 반환한다.

        4. 화면은 현재 선택한 회원의 응답만 표시하고 대상 없음·활동 0건·조회 불가를 구분한다.'
      정상 결과: 관리자가 선택한 회원의 허용된 활동 통계를 기간·집계 기준과 함께 확인한다. 조회로 회원 상태가 변경되거나 다른 회원의 결과가
        섞이지 않는다.
      예외 처리: '관리자 권한 없음·허용 범위 밖: 활동 결과를 제공하지 않는다.

        정상 조회로 대상 회원 없음 확인: 회원 없음으로 안내한다. 대상 조회 장애를 회원 없음으로 단정하지 않는다.

        회원은 존재하나 정상 집계에서 활동 없음: 활동 0건으로 표시한다.

        활동 자료 누락·조회/집계 실패: 조회 불가와 재조회를 안내하고 0건으로 대체하지 않는다.

        대상 변경·권한 상실 후 이전 응답 도착: 현재 화면에 반영하지 않는다. 재조회에도 현재 권한·대상을 다시 확인한다.'
      수용 기준: '1. 선택한 회원 식별자와 결과가 일치하고 대상 변경 후 이전 회원의 늦은 응답이 표시되지 않는다.

        2. 권한 없는 관리자·일반 사용자 또는 허용 범위 밖의 요청에는 활동 결과가 제공되지 않는다.

        3. 회원 없음·정상 활동 0건·조회/집계 실패가 구분된다.

        4. 기간·단위·집계 기준 시점과 허용된 항목만 표시되며 보호된 대화·개인화 원문이 우회 노출되지 않는다.

        5. 조회·재조회만으로 회원 차단·해제 등 상태가 변경되지 않는다.

        6. 제공할 활동 항목·기간·지표별 단위/기준 시점 및 허용 목적·대상 범위를 확정하고 적용을 검증하기 전에는 구현 완료로 인정하지
        않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 현재 권한·목적/대상/항목 범위 확인, 회원 없음·정상 0·조회 실패 구분, 늦은 이전 회원 응답
        방지.

        [확인 필요: 회원 활동 조회의 허용 목적·관리자 권한/대상 범위·표시 항목·조회 기간과 지표별 단위/기준 시점 결정 필요]

        [확인 필요: 허용된 활동 기록의 보존·삭제 연계와 조회 실패 재조회 방식의 세부 정책 결정 필요]'
