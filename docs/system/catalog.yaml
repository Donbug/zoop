      기능명: 새 대화와 후속 질문
      기능 설명: 사용자는 기존 답변에 이어 후속 질문을 하거나, 이전 맥락을 이어받지 않는 새 대화를 시작할 수 있다. 후속 질문은 동일 대화에
        새 질문으로 저장되며, 새 대화는 별도 대화 ID로 생성된다.
      선행조건: 로그인 회원이 AI 패널을 사용한다.
      입력값: 현재 대화 ID, 후속 질문 또는 새 대화 요청, 선택 맥락(선택)
      입력·검증 규칙: 후속 질문은 직전 대화의 확정 맥락을 참고할 수 있으나, 새 질문에 직접 적은 대상·기간이 우선한다. 새 대화는 이전
        질문·답변·선택 조건을 자동 승계하지 않는다. 새 대화 시작은 기존 대화를 삭제·취소하지 않는다. 같은 대화에서 처리 중인 질문이 있으면
        후속 질문 전송은 제한한다.
      처리 절차 및 분기: 1. 후속 질문 선택 시 현재 대화에 새 질문 작업을 추가한다.2. 새 대화 선택 시 새로운 대화 ID와 빈 맥락을
        생성한다.3. 새 질문은 FS046~FS049 절차로 처리한다.4. 이전 대화의 지연 응답은 원래 대화에만 저장한다.
      정상 결과: 사용자는 동일 주제를 이어 질문하거나, 독립된 새 주제로 대화를 시작할 수 있다.
      예외 처리: '새 대화 생성 실패: 기존 대화·입력 유지 및 재시도. 처리 중 후속 질문: 입력 유지 및 처리 중 안내. 이전 대화 지연
        응답: 새 대화 화면에 표시하지 않음.'
      수용 기준: 1. 새 대화에는 이전 질문·답변·선택 맥락이 자동 표시되지 않는다.2. 후속 질문은 같은 대화에 새 질문으로 저장된다.3.
        이전 대화의 늦은 답변이 새 대화에 표시되지 않는다.
      확인 필요 사항: 대화 목록·보존 기간·삭제 기능은 P2로 이동한다.
