    fields:
      기능명: 분석 결과 저장 및 조회 반영
      기능 설명: 시스템은 수집·분석된 뉴스, 이슈, 기업 관계, 사건 시각 및 근거 정보를 서로 연결하여 저장해야 한다. 저장된 공개 대상
        결과는 메인 그래프와 기업 상세페이지에서 각 화면의 기업·기간·선택 조건에 맞게 조회할 수 있어야 한다. 처리 중이거나 검증에 실패한
        결과는 공개 조회에서 제외해야 한다.
      선행조건: 뉴스·사건·이슈·기업 관계의 분석 및 검증 결과가 준비된다.
      입력값: 뉴스·사건·이슈·기업 관계와 근거 문서의 식별·연결 정보, 사건 시각, 검증·현재 공개 상태, 처리 회차·공개 버전, 각 화면의
        기업·기간·선택 조건과 반영 상태, 표시 데이터의 기준 시점, 해당 회차 확인 시점, 신규 결과 0건의 사유.
      입력·검증 규칙: '뉴스·사건·이슈·기업 관계·근거의 연결이 완결되고 자동 검증을 통과한 결과만 공개 후보가 된다. 회차 내 일부가 성공해도
        실패·미검증 결과에 의존하는 항목은 공개하지 않는다.

        관리자 허용은 검토 상태만 변경하며 자동 검증 실패를 우회하지 않는다. 재검증 통과 전에는 공개하지 않는다.

        메인 그래프와 기업 상세의 새 버전 조회 준비를 모두 확인한 뒤 두 화면에 공통 공개 버전을 적용한다. 한쪽 준비가 끝나지 않으면 서로
        다른 새·옛 버전으로 전환하지 않는다. 공통 공개 버전은 뉴스·사건·이슈·기업 관계·근거 분석 결과 묶음의 조회 기준이며 전환 후 새
        조회부터 적용한다. 이미 열린 화면을 동시에 새로고침하는 요구는 별도로 구분한다.

        늦게 끝난 이전 회차가 현재 공개 버전을 과거로 되돌리지 못하게 한다. 미반영된 유효 결과는 버리지 않고 현재 검증·공개 가능 상태와
        근거·중복·의존성을 확인해 후속 반영 대상으로 검토한다.

        이전 공개 버전을 제공하더라도 현재 공개 제외된 항목은 모든 조회 경로에서 숨긴다.

        저장 성공과 사용자 조회 반영 성공을 구분한다. 정상 운영에서는 한국 시간 매시 10분·40분까지 두 화면의 조회 반영을 완료하며,
        기한을 맞추기 위해 미검증 결과를 공개하지 않는다.

        표시 데이터의 기준 시점과 이번 회차를 확인한 시점을 구분한다. 정상적인 신규 0건 완료로 기존 데이터를 유지하는 것만으로 갱신 지연을
        표시하지 않는다.'
      처리 절차 및 분기: '1. 결과별로 근거·검증 상태·회차·버전·의존 관계를 연결해 저장한다. 성공·실패·보류를 각각 기록하고 부분 성공을
        회차 전체 성공으로 표시하지 않는다.

        2. 신규 공개 결과가 0건이면 원인을 확인한다. 신규 자료 없음 또는 관련성 없음 등 정상 제외로 처리가 완료된 경우에는 정상 0건
        완료를 기록하고 현재도 공개 가능한 기존 결과와 회차 확인 시점을 제공한다. 검증 탈락·보류·처리 실패는 해당 상태로 구분한다.

        3. 새 공개 결과 중 현재 검증과 의존 관계가 완결된 항목의 두 화면 조회 준비를 확인한 뒤 공통 버전으로 전환하고 필요한 조회·캐시를
        갱신한다. 더 최신 버전이 이미 공개됐다면 이전 회차 버전으로 덮지 않고 미반영 유효 결과를 후속 반영 대상으로 검토한다.

        4. 두 화면의 동일 기업·기간 조건에서 공통 버전과 반영 결과를 확인한다. 두 경로 확인이 끝나면 반영 완료로 기록한다. 정상 0건
        회차는 새 결과 생성 없이 0건 완료 상태와 기존 유효 결과의 일관성을 확인한다. 일부 결과를 공개했더라도 남은 실패·보류 상태는 유지한다.'
      정상 결과: 두 화면이 같은 공개 버전의 유효한 결과를 조건에 맞게 제공한다. 정상 신규 0건 회차도 완료로 확인할 수 있으며, 기존 데이터의
        기준 시점과 이번 회차 확인 시점이 구분된다.
      예외 처리: '저장 실패: 현재도 공개 가능한 이전 버전을 유지하고 실패 단계만 복구한다.

        일부 조회 경로 준비·반영 실패: 반영 미완료로 기록하고 두 화면을 공통의 기존 유효 버전으로 유지한다. 실패한 저장·조회 반영 단계만
        재시도하며 분석·모델 호출을 반복하지 않는다.

        기한 이후 미완료: 데이터 기준 시점과 갱신 지연을 표시하고 새 결과로 표시하지 않는다. 정상 0건 완료라는 이유만으로 지연 상태를
        표시하지 않는다.

        신규 자료 없음·관련성 없음 등 정상 제외로 새 결과 0건: 처리 완료와 0건 사유·회차 확인 시점을 기록하고 기존 유효 결과를 유지한다.

        검증 탈락·보류·처리 실패로 공개 결과 0건: 정상 0건 완료로 바꾸지 않고 실제 상태·원인을 기록한다.

        기존 항목이 공개 제외됨: 이전 버전·캐시·직접 조회에서도 해당 항목을 노출하지 않는다.

        늦은 이전 회차 완료: 최신 공개 버전은 유지한다. 아직 반영되지 않은 결과의 현재 검증·공개 가능 상태와 중복·근거 의존성을 검토해
        후속 반영하며 회차 전체를 버리거나 자동으로 전체 재분석하지 않는다.

        부분 성공·실패: 결과별 상태를 유지하고 검증·의존 관계가 완결된 성공 항목만 공개 후보로 삼는다. 실패 항목에 의존하는 결과는 제외하며
        일부 공개를 회차 전체 성공으로 표시하지 않는다.'
      수용 기준: '1. 메인 그래프와 기업 상세는 공통 공개 버전을 사용하며 한쪽 준비가 실패하면 새·옛 버전을 섞어 제공하지 않는다.

        2. 비공개·공개 제외 항목은 직접 조회와 이전 버전 제공 시에도 노출되지 않는다.

        3. 새 결과가 있는 회차는 두 화면 반영이 확인돼야 완료다. 저장 완료만으로 화면 반영 완료로 판정하지 않는다.

        4. 정상 신규 0건 회차는 새 결과가 없어도 0건 완료로 처리되며, 두 화면의 기존 유효 결과와 회차 확인 시점이 일치한다. 데이터
        기준 시점을 새 시점으로 바꾸거나 0건만을 이유로 지연을 표시하지 않는다.

        5. 정상 0건과 검증 탈락·보류·처리 실패로 인한 0건이 구분된다.

        6. 저장·조회 반영 단계 재시도로 분석·모델 호출 횟수가 늘어나지 않는다.

        7. 공통 버전 전환 후 새 조회가 전환된 분석 결과를 사용한다. 이미 열린 화면의 동시 새로고침 여부는 이 전환 수용 기준과 구분한다.

        8. 늦은 이전 회차가 최신 버전을 되돌리지 않으며 미반영 유효 결과가 후속 반영 검토 대상에서 유실되지 않는다.

        9. 일부 결과 성공·일부 실패 시 각각 상태가 남고, 성공으로 표시된 항목도 실패·미검증 결과에 의존하면 공개되지 않는다. 일부 공개로
        회차 전체를 성공 처리하지 않는다.'
