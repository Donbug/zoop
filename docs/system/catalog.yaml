  detailRange: A7:B19
  change: 유지
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/10-외부-연동.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      기능명: 소셜 인증 연동
      기능 설명: 시스템은 소셜 인증 결과를 서버에서 검증한 뒤 가입 또는 로그인을 처리한다. 이미 연결된 소셜 계정은 연결된 회원으로 로그인한다.
        처음 연결하는 계정은 사용 가능한 이메일로 기존 회원을 확인하고, 같은 이메일의 회원이 있으면 기존 서비스 계정의 본인 여부와 연결
        권한을 확인한 뒤 연결하고 없으면 가입한다.
      선행조건: 사용자가 서비스에서 지원하는 소셜 로그인 방식을 선택하고 인증을 요청한 상태이다. 처음 연결하거나 가입할 때는 계정 연결에 사용할
        수 있는 이메일을 제공자로부터 받아야 한다.
      입력값: 선택한 소셜 제공자, 현재 인증 요청에 대한 결과, 제공자 사용자 식별값, 제공자가 전달한 이메일과 동의한 범위의 사용자 정보.
      입력·검증 규칙: '① 서버에서 인증 결과의 유효성과 현재 인증 요청에 대한 결과인지 확인한다. 만료·변조되거나 다른 요청의 결과는 사용하지
        않는다.

        ② 소셜 제공자와 제공자 사용자 식별값을 함께 사용하여 기존 연결을 먼저 확인한다. 이메일·이름 변경만으로 다른 계정으로 연결하지 않는다.

        ③ 처음 연결할 때 제공자가 확인한 이메일인지 확인한다. 이메일은 앞뒤 공백을 제거하고 소문자로 비교한다. 이메일 소유 확인과 기존
        서비스 계정의 본인 여부·연결 권한 확인을 구분한다. 제공자의 이메일 확인 표시만으로 기존 계정 연결 권한이 입증됐다고 간주하지 않는다.
        같은 이메일의 기존 회원이 있으면 승인된 기준에 따라 해당 계정의 본인·연결 권한을 확인한 경우에만 연결·로그인을 완료한다. 해당 회원이
        없으면 신규 회원을 생성한다.

        ④ 반복 요청이나 같은 인증 결과의 중복 도착으로 회원·연결 정보·로그인 처리를 중복 생성하지 않는다.

        ⑤ 이메일이 없거나 계정 연결에 사용할 수 없으면 임의로 신규 가입하거나 기존 계정에 연결하지 않는다. 추가 사용자 정보는 제공자가
        전달하고 사용자가 동의한 범위만 사용한다.'
      처리 절차 및 분기: '① 서버에서 인증 결과를 검증하고 제공자 사용자 식별값을 확인한다.

        ② 기존 연결이 있으면 해당 회원으로 로그인한다.

        ③ 기존 연결이 없으면 사용 가능한 이메일로 회원을 조회한다. 같은 이메일의 기존 회원이 있고 해당 서비스 계정의 본인 여부·연결 권한
        확인을 통과하면 소셜 계정을 연결한다. 해당 회원이 없으면 신규 회원을 생성하여 연결한 뒤 로그인한다. 서로 다른 이메일은 같은 사람이더라도
        별도 회원으로 가입할 수 있다.

        ④ 검증과 계정 처리가 성공한 경우에만 해당 회원의 로그인 상태를 만든다.

        ⑤ 초기 설정 미완료 회원은 초기 설정 화면으로, 완료 회원은 본인의 보유·관심종목을 기준으로 메인 화면에 진입한다.'
      정상 결과: 검증된 소셜 계정이 올바른 회원 계정으로 연결되고 로그인된다. 기존 연결 또는 같은 이메일의 기존 회원이 있으면 신규 회원이
        중복 생성되지 않는다. 로그인한 본인의 초기 설정 상태에 맞는 화면으로 이동한다.
      예외 처리: '인증 취소·실패·검증 실패: 가입·연결·로그인을 성공으로 처리하지 않고 서비스 시작 화면에서 이용 방식을 다시 선택할 수
        있게 한다.

        제공자 장애 또는 사용자 식별값 누락: 로그인 상태를 만들지 않고 실패를 안내한다. 시작 화면에서 다시 시도하거나 다른 로그인 방식을
        선택할 수 있게 한다.

        처음 연결할 때 이메일 미제공 또는 사용 불가: 신규 가입·기존 계정 연결을 수행하지 않고 이메일 제공 동의를 다시 요청하거나 다른
        로그인 방법을 안내한다.

        처리 중 응답 미수신: 성공으로 단정하지 않는다. 다시 시도할 때 기존 회원·연결 정보를 확인하여 중복 처리하지 않는다.

        이메일 소유 확인 정보가 있더라도 기존 서비스 계정의 본인·연결 권한 근거가 부족함: 기존 계정 연결·로그인을 완료하지 않고 추가 확인이
        필요함을 안내한다. 구체적인 확인 절차는 확정이 필요하다.'
      수용 기준: '① 이미 연결된 소셜 계정은 이메일·이름이 바뀌어도 같은 회원으로 로그인된다.

        ② 처음 연결하는 계정은 기존 서비스 계정의 본인 여부·연결 권한 확인을 통과한 경우 같은 이메일의 기존 회원에 연결되고, 해당 회원이
        없으면 한 번만 가입된다.

        ③ 반복 요청·인증 결과 중복 도착으로 회원 또는 연결 정보가 중복 생성되지 않는다.

        ④ 만료·변조·다른 요청의 인증 결과와 실패·취소로 가입·연결·로그인이 완료되지 않는다.

        ⑤ 이메일이 없거나 연결에 사용할 수 없는 최초 계정은 임의 가입·연결되지 않으며 동의 재요청 또는 다른 로그인 방법이 안내된다.

        ⑥ 이메일이 같고 제공자가 이메일 소유를 확인했더라도 기존 서비스 계정의 본인·연결 권한 근거가 부족하면 연결·로그인을 완료하지 않는다.

        ⑦ 실패·취소 후 시작 화면에서 다시 선택할 수 있고, 성공 시 본인의 초기 설정 상태에 맞는 화면으로 이동한다.'
      확인 필요 사항: '[확인 필요] 지원할 소셜 제공자와 제공자별 필수·선택 동의 항목.

        [확인 필요] 제공자별 이메일 소유 확인 정보와 별도로 기존 서비스 계정의 본인 여부·연결 권한을 입증할 기준 및 추가 확인 절차.

        [팀 협의 필요] 기존 소셜 로그인·회원가입 명세는 동일 이메일 계정에 바로 연결하는 흐름으로 되어 있어, 연결 권한 확인을 요구하는
        이 기능의 안전 조건과 적용 조건을 맞춰야 한다. 해당 담당자와 확인 기준·실패 시 흐름을 합의하기 전에는 이메일 일치 또는 제공자의
        이메일 확인만으로 기존 계정 연결을 완료하지 않는다.'
