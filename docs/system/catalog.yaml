        관련 기업, 이슈, 제품 및 관계가 표시된다. 보유종목과 관심종목은 하나의 그래프에서 함께 표시할 수 있으며 각 기업 노드에는 보유·관심
        상태를 구분하여 표시한다. 사용자는 전체, 보유, 관심 필터를 통해 개인화 그래프의 기준 종목 범위를 변경할 수 있다.
      선행조건: 로그인 회원이 개인화 관계 그래프를 조회한다.
      입력값: 본인 보유종목 목록, 관심종목 목록, 해당 종목의 공개 관계 데이터.
      입력·검증 규칙: '① 회원 본인의 보유종목과 관심종목만 개인화 기준으로 사용한다.

        ② 동일 기업이 보유·관심 양쪽에 포함되어 있으면 기업 노드를 중복 생성하지 않고 하나의 노드에 두 상태를 함께 표시한다.

        ③ 개인화 필터는 전체 / 보유 / 관심 세 종류를 제공한다.

        ④ 전체는 보유종목과 관심종목의 합집합을 기준 종목으로 사용한다.

        ⑤ 보유는 보유종목만 기준 종목으로 사용한다.

        ⑥ 관심은 관심종목만 기준 종목으로 사용한다.

        ⑦ 선택한 기준 종목과 연결된 관련 기업·이슈·제품·관계는 기준 종목 필터와 별도로 관계 탐색 정보로 유지하여 표시한다.

        ⑧ 이슈 노드는 국내 / 국제 속성을 가진다.

        ⑨ 비회원에게 개인화 그래프 데이터를 제공하지 않는다.

        ⑩ 빠른 필터 변경 시 현재 선택한 필터의 최신 요청 결과만 화면에 반영한다.'
      처리 절차 및 분기: '① 회원의 보유종목과 관심종목을 조회한다.

        ② 기본 진입 시 전체 필터를 적용한다.

        ③ 필터 조건에 따라 그래프 기준 기업 목록을 구성한다.

        ④ 동일 기업을 하나의 기업 노드로 통합하고 보유·관심 상태를 표시한다.

        ⑤ 기준 기업과 연결된 관련 기업·이슈·제품 및 관계 정보를 조회한다.

        ⑥ 이슈 노드는 국내·국제 속성과 함께 표시한다.

        ⑦ 사용자가 보유 또는 관심 필터를 선택하면 해당 기준 종목으로 그래프를 다시 구성한다.

