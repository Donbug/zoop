      기능 설명: 서버는 로그인·접근 권한, 대화 소유자, 근거 문서 접근 권한과 같은 작업의 질문 내용 일치 여부를 확인해야 한다. 처리 중인
        질문 작업을 중복 실행하지 않고, 완료한 작업은 현재 권한을 확인해 저장된 결과를 반환해야 한다. 동시에 요청되어도 유효한 실행 하나만
        처리해야 한다.
      선행조건: 서버가 신규 질문 요청 또는 기존 작업의 재요청을 받았다.
      입력값: 현재 회원 인증 정보, 대화 식별자·소유자, 작업 식별자, 질문·대상·기간·근거 참조, 기존 작업 상태와 최초 요청 내용.
      입력·검증 규칙: '로그인·대화 소유권·대상 및 근거 접근 권한을 확인한다.

        동일 작업 식별자의 요청 내용이 최초 요청과 일치해야 한다.

        같은 대화의 처리 중 신규 작업은 하나만 허용하며 서로 다른 작업 ID의 동시 요청에도 이를 보장한다.

        기존 작업의 상태 확인·저장 결과 회수는 새로운 질문 접수와 구분한다.

        작업 식별자와 개별 통신 추적용 식별자를 혼동하지 않는다.'
      처리 절차 및 분기: '1. 서버는 로그인 상태, 대화 소유자, 대상·근거 접근 권한 및 동일 작업의 요청 내용 일치 여부를 확인한다.

        2. 기존 작업 ID의 재요청은 해당 작업의 상태를 반환하거나, 현재 권한을 확인한 뒤 저장 결과를 반환한다.

        3. 신규 작업인 경우 같은 대화에 처리 중인 작업이 있으면 접수를 거절한다.

        4. 서로 다른 작업 ID의 요청이 동시에 도착하더라도 같은 대화에는 하나의 신규 작업만 접수되도록 서버에서 통제한다.

        5. 동일 작업의 재요청으로 중복 실행이 발생하지 않도록 한다.'
      정상 결과: 접수 가능한 신규 작업 하나가 처리되거나, 기존 작업의 처리 상태 또는 권한이 확인된 저장 결과가 반환된다.
      예외 처리: '인증·소유권·근거 접근 권한 없음: 보호 데이터를 반환하지 않고 권한 오류로 안내한다.

        같은 대화의 다른 작업이 처리 중: 새 질문 접수를 거절하고 작성 입력을 유지하며 기존 작업 처리 중을 안내한다.

        같은 작업 ID에 다른 요청 내용: 충돌로 거절하고 원래 작업·질문을 유지한다. 질문 수정 후 전송은 처리 중 작업이 없을 때 새 작업으로
        수행한다.

        기존 작업 재요청: 완료 결과 또는 처리 상태를 반환한다. 상태 조회 실패를 미등록으로 취급하지 않는다.'
      수용 기준: '1. 동일 작업의 동시 재요청으로 중복 실행이 발생하지 않는다.

        2. 서로 다른 작업 ID로 같은 대화에 동시에 질문해도 하나의 작업만 접수된다.

        3. 기존 작업의 상태 확인과 결과 회수는 신규 질문 차단과 구분하여 처리한다.

        4. 타인의 대화·근거 요청과 동일 작업 ID의 요청 내용 변경은 거절된다.'
      확인 필요 사항: 'v1.2 제안 기준: 접수 거절·작업 내용 충돌의 입력 유지와 안내. 작업 ID는 통신 추적 ID와 구분한다.'
