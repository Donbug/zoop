- id: FS052-02
  title: AI 내부 패널 닫기·재열기와 대화 유지
  section: AI 챗봇
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '52'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 64
    rowUnit: xlsx-row
  detailRange: A133:B145
  change: 분리
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/07-AI-챗봇.csv
      row: 135
      rowUnit: xlsx-row
    fields:
      기능명: AI 내부 패널 닫기·재열기와 대화 유지
      기능 설명: 회원이 상세페이지의 AI 내부 패널을 닫아도 상세 상태·대화 기록·서버 작업을 유지한다. 새 대화로 바꾸지 않았다면 다시 열
        때 같은 대화의 상태와 완료 결과를 회수한다.
      선행조건: 로그인 회원이 기업 상세의 AI 내부 패널을 사용 중이거나 다시 연다.
      입력값: 현재 회원·대화 ID, 질문별 작업 ID·상태, 상세 기업·차트 기간·재무 기간·사건·탭·스크롤, 저장된 답변.
      입력·검증 규칙: '패널 닫기를 대화 삭제·질문 취소·상세 화면 이탈로 처리하지 않는다.

        닫혀 있는 동안에도 서버 작업 완료 결과를 해당 대화·질문에 연결한다.

        재열기는 기존 상태 조회이며 새 질문이나 새 AI 생성을 실행하지 않는다.

        기존 대화의 대상·기간을 패널에 표시한다. 상세 기업이 바뀌었다는 이유만으로 기존 대화 맥락을 덮어쓰지 않는다.

        다른 사용자·새 대화로 전환된 경우 이전 대화 응답을 현재 화면에 표시하지 않는다.'
      처리 절차 및 분기: '1. 패널 닫기 시 상세 탐색 상태를 그대로 유지한다.

        2. 재열기 시 현재 대화와 작업의 서버 상태를 조회한다.

        3. 완료는 저장된 결과를, 처리 중은 진행 상태를 표시한다. 처리 중에는 상태 확인을 이어 가고 같은 대화의 신규 전송을 제한한다.

        4. 상태 확인 후 작업이 완료되면 추가 질문 없이 결과를 회수한다.'
      정상 결과: 패널을 닫고 다시 열어도 같은 대화와 상세 탐색 상태를 이어 본다.
      예외 처리: '상태 조회 실패: 확인 실패와 다시 확인을 안내하며 미등록·실패 확정으로 간주하지 않는다.

        로그아웃·권한 변경: 개인 대화 내용을 숨기고 현재 권한을 다시 확인한다.

        새 대화 전환: 이전 답변은 원래 작업 기록에만 연결한다.'
      수용 기준: '1. 패널을 닫은 동안 작업이 완료되어도 재열기 시 추가 모델 호출 없이 저장 답변을 확인한다.

        2. 재열기 직후 처리 중이면 후속 상태 확인을 통해 완료 답변을 회수한다.

        3. 닫기·재열기가 상세 기업·차트 기간·재무 기간·사건·탭·스크롤을 바꾸지 않는다.

        4. 상세 기업만 변경해도 기존 대화의 적용 대상이 자동 변경되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 패널 상태와 질문 작업 분리·기업 변경 시 기존 대화 맥락 유지.

        [확인 필요: 상태 확인 주기·중단 판정 시간은 운영 환경 측정 후 결정 필요]'
