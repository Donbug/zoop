      기능 설명: 사용자의 보유·관심종목 여부와 관계없이 공개 시장 데이터를 기준으로 기업 노드와 이슈 노드로 구성된 전체 관계 그래프를 제공한다.
        이슈 노드는 국내 / 국제 속성을 가진다.
      선행조건: 사용자가 전체 관계 그래프를 조회한다.
      입력값: 공개 대상 기업, 공개 대상 이슈, 기업-기업 및 기업-이슈 관계 데이터.
      입력·검증 규칙: '① 비회원·회원 모두 조회할 수 있다.

        ② 그래프 노드는 기업과 이슈 두 종류만 사용한다.

        ③ 개인 보유·관심 여부는 전체 그래프의 조회 조건으로 사용하지 않는다.

        ④ 회원 개인 정보는 전체 그래프 데이터에 포함하지 않는다.

        ⑤ 이슈에는 국내·국제 속성을 적용한다.

        ⑥ 검증되지 않은 관계 및 비공개 분석 데이터는 표시하지 않는다.'
      처리 절차 및 분기: '① 공개 대상 기업·이슈·관계를 조회한다.

        ② 기업 노드와 이슈 노드를 구성한다.

        ③ 이슈에 국내·국제 속성을 적용한다.

        ④ 공개 관계를 기준으로 그래프를 구성한다.'
      정상 결과: 공개 기업·이슈 및 관계로 구성된 전체 관계 그래프가 표시된다.
      예외 처리: '공개 데이터 없음: 현재 표시할 수 있는 관계 데이터가 없습니다.를 표시한다.

        조회 실패: 기존 정상 그래프가 있으면 유지하고 다시 시도를 제공한다.

        최초 조회 실패: 빈 그래프 대신 오류 안내와 재시도를 표시한다.

        검증 실패 또는 비공개 데이터: 조회 결과에서 제외한다.'
      수용 기준: '① 비회원·회원 모두 전체 그래프를 조회할 수 있다.

        ② 기업과 이슈 두 종류 노드만 표시된다.

        ③ 이슈의 국내·국제 속성을 구분할 수 있다.

        ④ 개인 정보와 비공개 데이터가 노출되지 않는다.'
      확인 필요 사항: '확정: 전체 그래프 노드 종류는 기업 / 이슈로 제한한다.

        확정: 이슈 속성은 국내 / 국제로 한다.

        확정: 데이터가 없는 경우 빈 그래프가 아니라 안내 문구를 제공한다.

        확정: 재조회 실패 시 기존 정상 그래프가 있으면 유지한다.

        확정: 최초 화면에 표시할 기업·이슈는 서비스가 보유한 공개 관계 데이터 중 연결 관계가 존재하고 최근 유효성이 확인된 데이터를 우선
        사용한다.

        확정: 초기 노드 수 및 관계 깊이 등 성능 관련 수치는 실제 그래프 라이브러리 부하 테스트 결과에 따라 비기능명세에서 관리한다.'
