- id: NFS009
  title: 중단 작업 복구
  section: 비기능 상세
  priority: P1
  status: 추가 제안 · 검토 전
  requirementIds:
  - '62'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 100
    rowUnit: xlsx-row
  detailRange: A119:B131
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 121
      rowUnit: xlsx-row
    fields:
      요구사항명: 중단 작업 복구
      요구사항 설명: 작업이 중단되면 기존 작업 상태를 확인한 뒤 허용된 복구만 수행해야 한다. 복구로 AI 답변이나 브리핑이 중복 생성·발행되어서는
        안 된다. 복구할 수 없으면 실패 사유와 가능한 다음 조치를 안내하며, 재실행이 금지된 작업에 재실행을 안내하지 않는다.
      적용 대상·범위: 서버 종료·저장소 장애 등으로 중단된 결과 생성 작업. 특히 AI 답변과 브리핑의 복구 및 중복 방지에 적용한다.
      적용 조건·검증 입력: '기존 작업 식별자·최초 요청 내용, 서버 처리 상태, 현재 유효한 실행 정보, 오류 단계·유형, 저장 완료 여부와
        현재 접근·실행 권한.

        챗봇은 보존된 검증 결과와 원래 질문·대상·기간·근거를 확인한다. 브리핑은 날짜·출근/퇴근 구분과 생성·검증·발행 상태를 확인한다.'
      품질 목표·준수 규칙: '1. 기존 상태와 현재 권한을 확인한 뒤 허용된 복구만 수행한다. 상태 조회 실패나 응답 지연을 미등록·확정 실패로
        단정하지 않는다.

        2. 처리 중 상태가 계속되면 승인된 중단 판정 절차로 실행 상태를 확인한다. 시간초과만으로 종료를 확정하지 않는다. 이전 실행의 종료
        또는 실행 권한 회수·만료가 확인되고 늦은 결과의 저장·발행을 막은 뒤에만 오류 유형·권한·보존 결과에 따라 복구 가능/불가를 판단한다.
        확인 전에는 추가 실행하지 않으며, 판단하지 못한 작업은 검토 필요로 남긴다.

        3. 챗봇의 완료 작업은 저장 결과를 회수한다. 저장만 실패했고 AI 생성 및 후속 검증이 완료된 검증 결과가 보존되어 있으면 유효성을
        확인해 모델 호출 없이 저장만 재시도한다.

        4. 챗봇의 검증 실패·결과 소실·권한 오류는 동일 작업 재생성을 허용하지 않는다. 확정된 일시 조회·모델 장애만 이전 실행 종료와
        권한 확인 후 사용자의 재시도로 최초 질문·대상·기간·근거를 유지해 재실행한다.

        5. 브리핑은 같은 날짜·출근/퇴근 회차를 중복 생성·발행하지 않는다. 허용된 미발행 회차의 실패 단계만 복구하고 이미 발행된 본문은
        일반 재처리로 덮어쓰지 않는다.

        6. 복구 유형·실패 단계·결과를 기존 작업이나 회차에 연결해 기록한다. 복구 불가 시 사유와 허용된 다음 조치만 안내한다.'
      정상 상태: 복구 가능한 작업은 기존 상태·권한에 맞게 복구되고 유효한 답변·브리핑이 중복 생성·발행되지 않는다. 복구 불가 작업은 실패
        사유와 허용된 다음 조치를 확인할 수 있다.
      미충족·예외 처리: '완료 작업: 현재 조회 권한을 확인하고 저장 결과를 회수한다. 처리 중·종료 불명확: 새 실행 없이 상태를 다시 확인한다.

        챗봇 저장 실패: 보존된 검증 결과가 유효할 때 저장만 복구한다. 결과 소실·검증 실패·권한 오류이면 동일 작업을 재생성하지 않는다.

        상태 조회 장애: 이번 복구 요청은 실행하지 않는다. 기존 작업 상태를 실패·미등록으로 바꾸지 않고 조회 장애와 실제 처리·발행 여부
        미확인을 구분해 안내·기록한다.

        브리핑: 이미 발행된 회차는 원문을 유지한다. 재처리 허용 여부가 불명확하면 실행을 보류한다.

        복구 불가: 사유를 알리고 허용된 다음 조치가 없으면 재실행을 제시하지 않는다.'
      검증 방법: '1. 실행 중 서버 종료·저장소 장애·상태 조회 장애를 각각 발생시켜 추가 실행 여부와 복구 기록을 확인한다.

        2. 챗봇 검증 후 저장 실패를 발생시켜 보존 결과의 저장 복구에는 모델 호출이 늘지 않는지 확인한다. 검증 실패·결과 소실·권한 변경도
        각각 시험한다.

        3. 허용된 일시 장애 재시도에서 최초 질문·대상·기간·근거가 유지되는지 확인하고 이전 실행의 늦은 완료를 도착시킨다.

        4. 같은 브리핑 회차의 동시 복구와 이미 발행된 회차 재처리를 요청해 중복 발행·원문 덮어쓰기가 없는지 확인한다.

        5. 복구 불가 안내에 금지된 재실행이 포함되지 않는지 확인한다.

        6. 처리 중 상태가 계속되는 작업에 중단 판정·실행 권한 정리 절차를 적용한다. 시간초과만인 경우, 종료/권한 회수가 확인된 경우,
        판단 불가인 경우를 나누고 옛 실행의 늦은 저장·발행을 시험한다.'
      수용 기준: '1. 중단·저장 실패·동시 복구에도 유효한 결과와 브리핑 발행본이 중복되지 않고 이전 실행이 현재 결과를 덮지 않는다.

        2. 챗봇 보존 결과의 저장 복구에는 추가 모델 호출이 없다. 검증 실패·결과 소실·상태 불명확만으로 동일 작업 AI 재생성이 발생하지
        않는다.

        3. 허용된 챗봇 재실행은 최초 질문·대상·기간·근거와 현재 권한을 유지한다.

        4. 브리핑 복구는 같은 날짜·출근/퇴근 회차에 연결되고 이미 발행된 본문을 변경하지 않는다.

        5. 상태 확인 장애와 확정 실패, 결과 회수·저장 복구·재실행이 기록에서 구분된다. 복구 불가 안내에는 허용된 다음 조치만 표시된다.

        6. 장기 처리 중 작업이 승인된 절차에 따라 복구 가능·불가 또는 검토 필요로 구분된다. 종료/권한 정리와 늦은 결과 차단이 확인되기
        전에는 새 실행이 시작되지 않는다.'
      확인 필요 사항: '[확인 필요: 중단 판정 조건·확인 기한, 기존 실행 권한 회수/만료·늦은 결과 차단 방식, 복구 가능/불가 전환 조건,
        시스템·운영자의 담당 및 검토 종료 절차 확정 필요. 복구 횟수·간격·검증 결과 보존 방식·브리핑 오류별 허용 범위도 결정·검증 필요]

        [팀 협의 필요: 브리핑의 상태 확인 불가 시 ‘발행 실패’ 표기와 실제 발행 여부 미확인·조회 장애의 상태 매핑을 명료화한다. 조회
        장애만으로 실제 실행 실패를 확정하거나 재생성하지 않는다.]'
