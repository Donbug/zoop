  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 9
      rowUnit: xlsx-row
    fields:
      요구사항명: 접근 통제
      요구사항 설명: 회원의 개인 정보는 해당 회원에게만 제공해야 한다. 비회원은 로그인 하여야지만 관심종목 기능을 이용할 수 있어야 하며,
        다른 사용자의 정보에는 접근할 수 없어야 한다.
      적용 대상·범위: 관심종목·보유정보·대화·질문 작업·개인화 근거의 조회 및 변경. 로그인 상태 변경과 로그아웃 이후의 화면 표시까지 포함한다.
      적용 조건·검증 입력: '비회원, 정보 소유 회원, 다른 회원의 인증 상태.

        조회·변경하려는 회원·대화·작업·근거 식별자와 현재 접근 권한.

        로그아웃 직전에 시작되어 뒤늦게 도착하는 개인화 응답.'
      품질 목표·준수 규칙: '1. 회원의 개인 정보는 해당 회원에게만 제공한다.

        2. 비회원은 관심종목을 이용할 수 없으며 타인 정보 접근을 허용하지 않는다.

        3. 서버에서 인증 상태와 요청 대상의 소유권·접근 권한을 확인한다. 화면에서 버튼을 숨기는 것만으로 접근 통제를 충족한 것으로 보지
        않는다.

        4. 완료된 AI 결과를 다시 회수할 때도 현재 접근 권한을 확인한다. 평가 등록은 현재 결과 조회 권한이 있는 회원만 허용한다. 관리자
        대화록(AI 챗봇 대화기록)은 별도 열람 권한과 마스킹·필수 열람 기록이 모두 충족된 경우만 제공한다.'
      정상 상태: 본인은 허용된 개인 정보를 조회·변경할 수 있다. 비회원이나 다른 회원에게 보호된 정보가 전달되지 않으며 로그아웃 후 개인
        정보 표시가 해제된다.
      미충족·예외 처리: '인증·소유권·접근 권한 오류: 요청을 거절하고 보호된 내용을 반환하지 않는다.

        로그아웃 후 이전 개인화 응답 도착: 현재 화면에 반영하지 않는다.

        AI 챳봇 대화기록 열람: 일반 회원의 소유권 규칙과 구분하며 마스킹·승인된 열람 범위는 별도 결정한다.'
      검증 방법: '1. 동일한 개인화 대상에 대해 비회원·본인·타인으로 조회와 변경을 각각 요청한다.

        2. 대화·작업·근거 식별자를 다른 회원의 값으로 바꾸어 보호 데이터가 반환되는지 확인한다.

        3. 완료 결과를 저장한 뒤 권한이 달라진 상태에서 재회수를 요청한다.

        4. 개인화 응답을 지연시킨 뒤 로그아웃하고 해당 응답이 도착했을 때 화면을 확인한다.

        평가 대상·회원 식별자를 타인으로 바꾸어 요청한다. 마스킹 또는 열람 기록 저장을 실패시켜 원문이 반환되지 않는지 점검한다.'
      수용 기준: '1. 다른 회원의 대화·작업·근거 식별자로 요청해도 데이터를 받지 못한다.

        2. 로그아웃 후 늦은 응답을 화면에 반영하지 않는다.

        3. 본인의 유효 요청은 처리되고 비회원·타인의 보호 데이터 조회와 변경은 거절된다.

        4. 완료 결과 회수에서도 현재 권한이 없는 정보가 노출되지 않는다.

        타인의 개인화 결과 평가가 거절되고 마스킹·열람 기록 실패 시 대화록 내용이 제공되지 않는다.'
      확인 필요 사항: '-'
