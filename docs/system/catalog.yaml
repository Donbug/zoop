        2. 서버가 관리자 조회 권한·대상 범위를 확인한다.

        3. 같은 대상·회차·버전의 분석·검증·저장 상태와 실패 사유를 확인한다.

        4. 그래프·기업 상세의 실제 공개 버전·공개 제외 상태 및 확인 시각을 함께 표시한다.

        5. 조회하지 못한 항목은 개별 조회 불가로 표시한다. 다른 조건이나 이전 조회 응답이 현재 선택의 상태를 덮어쓰지 않게 한다.'
      정상 결과: 관리자가 동일 대상·회차·버전의 분석·검증·저장·실제 공개 상태와 실패 원인을 구분해 확인한다. 확인하지 못한 단계는 미확인으로
        남으며 조회만으로 작업 상태가 바뀌지 않는다.
      예외 처리: '관리자 권한 없음: 관제 결과를 반환하지 않는다.

        정상 조회 결과 대상 없음: 해당 조회 조건의 대상 없음으로 표시하며 조회 실패와 구분한다.

        일부 상태·로그 조회 장애: 확인된 항목만 기준 시점과 함께 제공하고 해당 실패 항목은 조회 불가·재조회로 표시한다. 로그 조회 실패를
        실패 로그 없음으로 표시하지 않는다.

        오래된 상태 또는 두 화면 공개 버전 불일치: 확인 시각·불일치를 안내하고 전체 공개 완료로 표시하지 않는다.

        회차의 신규 공개 대상이 0건인 경우에도 정상 수집 0건·정상 무관련 제외와 검증 탈락/보류·처리 실패를 구분한다. 0건만으로 성공·실패·갱신
        지연을 단정하지 않는다.'
      수용 기준: '1. 동일 대상·회차·버전의 분석·검증·GraphDB 저장·실제 사용자 공개 상태와 확인 시각이 구분된다.

        2. 수동 허용·저장 성공과 공개 완료가 구분되고, 두 화면 버전 불일치·공개 제외 상태를 확인할 수 있다.

        3. 정상 대상 없음, 일부 상태/로그 조회 실패, 신규 0건의 사유가 구분되며 조회 실패를 성공·실패 없음으로 표시하지 않는다.

        4. 대상을 바꾼 뒤 이전 응답이 현재 상태를 덮지 않으며, 관제 조회·재조회만으로 검수·분석 재실행·공개가 발생하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 대상·회차·버전별 단계 분리, 실제 두 화면 공개 상태 확인, 정상 0건·조회 불가 구분과 재조회.

        [확인 필요: 관제 갱신 방식·주기와 오래된 상태를 구분하는 운영 기준 결정 필요]

        [확인 필요: 운영 로그의 허용 노출 범위·보존 정책 및 재조회 방식의 세부 구현 결정 필요]'
