      입력값: 최초 질문 시각, 질문 본문, 그 시점의 대화 맥락·대상·기간·근거 참조, 보충 입력.
      입력·검증 규칙: '질문에 명시된 대상·기간 조건을 기존 맥락보다 우선한다.

        한국 시간의 최초 질문 시각을 기준으로 상대 날짜를 해석한다. 작년은 직전 달력 연도 전체, 최근은 기본 최근 1개월로 해석하고 실제
        적용 기간을 답변에 표시한다.

        하나의 표현이 여러 대상으로 해석되거나 기간을 확정할 수 없으면 추정하여 실행하지 않고 되묻는다.

        동일 작업 재시도에서는 최초 맥락과 확정 조건을 유지한다. 되묻기 보충 입력은 같은 대화의 새 작업이다.'
      처리 절차 및 분기: '1. 최초 질문 시점의 대화·대상·기간·근거를 작업에 고정한다.

        2. 최근·작년 등은 질문 시점을 기준으로 실제 기간으로 해석한다.

        3. 질문에 명시한 조건이 우선이다.

        4. 대상이 불명확하면 확인 질문을 저장한다.'
