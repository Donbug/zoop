  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
      row: 168
      rowUnit: xlsx-row
    fields:
      기능명: 뉴스·공시 수집 및 수집 회차 관리
      기능 설명: 메인 그래프 분석에 사용할 뉴스·공시의 신규·수정 문서를 수집한다. FS058의 회차 관리와 FS063의 공급원 연동을 재사용하며,
        별도 수집기를 중복 구현하지 않는다. AI는 공급원 연동·수집을, 백엔드 B는 후속 처리에 필요한 문서 계약·상태 연계를 담당한다.
      선행조건: 이용 권한과 제공 범위가 확인된 공급원이 있고, FS058의 한국 시간 매시 05분·35분 회차 또는 허용된 실패 회차 재처리가
        시작된다.
      입력값: 회차 ID, 공급원·문서 ID, 조회 범위·페이지·변경 커서, 직전 성공 기준, 원문 URL·제목·본문, 발행·등록/수정·관측
        시각.
      입력·검증 규칙: '조회 범위의 필수 페이지와 문서 저장이 모두 완료된 경우만 수집 성공으로 기록한다.

        문서 식별자·원문 주소·출처를 보존하고 발행 시각과 관측 시각을 구분한다. 등록/수정 정보 미지원 시 실제 검증된 재조회 범위와 탐지
        한계를 기록한다.

        수집 성공·정상 신규 0건·분석 성공은 구분하며 이용 권한 밖 원문을 수집·전달하지 않는다.'
      처리 절차 및 분기: '1. 기존 FS063 공급원 연동으로 신규·변경 문서를 조회한다.

        2. 공급원·페이지별 응답과 문서 저장을 확인한다.

        3. 완료 범위의 성공 기준·커서만 갱신한다.

        4. 저장 문서·회차를 FS075에 전달한다.'
      정상 결과: 수집 문서와 출처·버전·시각·회차가 추적되고 완료된 문서가 정제 대상으로 전달된다.
      예외 처리: '공급원 장애·일부 페이지 실패·저장 실패: 실패 범위의 성공 기준을 전진시키지 않고 미완료 상태를 남긴다.

        정상 신규 0건: 0건 완료로 기록한다. 접근 불가·실패를 0건으로 바꾸지 않는다.'
      수용 기준: '1. 신규·수정·지연 등록 문서를 지원이 확인된 범위에서 수집한다.

        2. 동일 회차 재시도 시 완료 문서가 중복되지 않고 미완료 범위만 복구된다.

        3. 정상 0건과 장애가 구분되고, 수집 완료가 분석·공개 완료로 표시되지 않는다.'
      확인 필요 사항: '공급처·이용 조건·페이지/커서 지원·겹침 재조회 범위는 기존 FS058·FS063의 미정 사항을 유지한다.

        추가 명세이며 구현·테스트 통과 또는 팀 승인 완료를 의미하지 않는다. 상세 일정·가중치는 기존 연계 업무와 중복 없이 산정한다.'
  scopeClass: proposal
