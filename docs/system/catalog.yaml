- id: NFS005
  title: 근거와 해석의 품질
  section: 비기능 상세
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '58'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 96
    rowUnit: xlsx-row
  detailRange: A63:B75
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 65
      rowUnit: xlsx-row
    fields:
      요구사항명: 근거와 해석의 품질
      요구사항 설명: 시스템은 확인된 사실, 시스템의 영향 해석 및 불확실한 정보를 구분하여 표시해야 한다. 사실 정보에는 출처, 발행 시각
        및 원문 링크를 제공해야 한다. 영향 분석은 ‘긍정 가능’, ‘부정 가능’, ‘판단 보류’ 등 가능성 표현을 사용해야 하며 확정적인
        투자 판단으로 표시해서는 안 된다. 이슈과 관련 없거나 시점이 일치하지 않는 자료는 근거로 사용해서는 안 된다.
      적용 대상·범위: '표시할 사실과 영향 해석, 이슈·기업·기간, 출처·발행 시각·원문 링크, 확보된 인용 구간, 반대 근거와 불확실성.

        검증 사례: 무관한 문서, 시점 불일치, 인용 오류, 상반된 근거, 근거 부족.'
      적용 조건·검증 입력: 관계 그래프의 영향 설명, 기업 상세·타임라인, 출퇴근 브리핑, AI 답변의 사실·영향 해석·근거 표시.
      품질 목표·준수 규칙: '1. 확인 사실, 영향 해석, 불확실 정보를 구분한다.

        2. 사실에는 출처·발행 시각·원문 링크를 제공한다.

        3. 영향은 가능성으로 표현하고 확정 투자 판단으로 표시하지 않는다.

        4. 이슈과 무관하거나 시점이 맞지 않는 자료를 근거로 사용하지 않는다.

        5. 원문을 확보하지 못한 경우 인용을 임의로 만들지 않는다.

        6. 긍정·부정 등의 분류를 주가 상승·하락 확률이나 확정된 인과관계로 바꾸어 제시하지 않는다.

        7. 근거의 반대 내용과 해석 한계를 누락해 확정 판단인 것처럼 표시하지 않는다.

        8. 이슈 발생일이 확인되지 않은 경우 문서 발행일을 이슈 발생일로 대체하지 않는다. 문서 발행일과 이슈 발생일은 별도 필드로 관리하며,
        발생일 미확정 상태를 명확하게 표시한다.'
      정상 상태: 확인된 사실과 시스템의 해석을 구분해 읽을 수 있고, 근거의 출처·시점 및 확인 가능한 원문으로 추적할 수 있다.
      미충족·예외 처리: '근거 부족: 부족 안내 또는 판단 보류로 표시한다.

        문서·시점·인용 검증 실패: 검증을 통과한 근거처럼 제시하지 않는다.

        원문 미제공·접근 실패: 임의 원문을 만들지 않고 확보된 출처·메타데이터와 미제공 상태를 구분한다.

        근거가 상충하는 경우: 확보된 반대 근거와 해석의 한계를 함께 표시한다.'
      검증 방법: '1. 이슈과 무관한 문서, 기간이 다른 문서, 원문에 없는 인용을 각각 넣어 근거로 잘못 노출되는지 확인한다.

        2. 사실·영향 해석·불확실한 정보의 표시가 구분되는지 확인한다.

        3. 근거가 충분한 경우와 부족한 경우, 상반된 근거가 함께 있는 경우의 결과를 비교한다.

        4. 원문 링크 미제공·접근 실패에서도 출처와 상태가 구분되는지 확인한다.

        한 이슈의 복수 문서와 같은 날 별개 이슈을 함께 제공한다. 발생 날짜 미상 이슈과 기사 발행일이 있는 자료를 주어 표기·차트 강조를
        확인한다.'
      수용 기준: '1. 무관 문서·잘못된 시점·인용 오류·상반된 근거를 넣어 제외/표시 규칙을 점검한다.

        2. 영향 분류를 주가 확률이나 확정 인과로 표시하지 않는다.

        3. 출처·발행 시각·원문 링크를 확인할 수 있으며 원문 미제공 상태가 정상 제공인 것처럼 표시되지 않는다.

        4. 확보되지 않은 인용을 생성하지 않고 근거 부족과 해석의 한계를 표시한다.

        문서 수와 이슈 수가 혼동되지 않고 문서 발행일이 확정 이슈 날짜로 저장·표시되지 않는다. 수동 허용만으로 검증 실패 결과가 공개되지
        않는다.'
      확인 필요 사항: '[확인 필요: 사실성·해석 품질의 정량 목표, 검증 표본 구성과 평가 기준 결정 필요]

        인용·형식·참조 검증 통과는 답변 전체의 사실 정확성을 보장하지 않는다.'
  scopeClass: existing
- id: NFS006
  title: 모델 전달 데이터 최소화
  section: 비기능 상세
  priority: P1
  status: 팀 검토 전
  requirementIds:
  - '59'
  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 97
    rowUnit: xlsx-row
  detailRange: A77:B89
  change: 검증 기준 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/12-비기능-상세.csv
      row: 79
      rowUnit: xlsx-row
    fields:
      요구사항명: 모델 전달 데이터 최소화
      요구사항 설명: AI 모델에는 답변 생성에 필요한 기업, 이슈, 관계 경로 및 허용된 근거만 전달해야 한다. 비밀번호, 인증토큰, 세션
        정보 및 불필요한 개인식별정보는 모델 입력과 로그에 포함해서는 안 된다. 보유 종목과 관심 종목 정보는 개인화 답변에 필요한 경우에만
        최소 범위로 전달해야 한다.
      적용 대상·범위: AI 분석 서비스로 보내는 실제 요청 내용과 운영 로그. 챗봇·브리핑·뉴스 분석의 모델 호출에 적용한다.
      적용 조건·검증 입력: '기업·이슈·관계 경로·허용된 근거와 필요한 개인화 정보.

        시험용 비밀번호·인증토큰·세션 정보·불필요한 개인식별정보. 실제 사용자 비밀정보는 검증 데이터로 사용하지 않는다.'
      품질 목표·준수 규칙: '1. 답변에 필요한 허용 데이터만 전달한다.

        2. 비밀번호·인증토큰·세션 정보·불필요한 개인식별정보를 모델 입력과 로그에 넣지 않는다.

        3. 개인 보유·관심은 필요한 경우에만 최소 범위로 사용한다.

        4. 모델 입력에 필요한 필드와 접근 가능한 자료를 확인한 뒤 전달한다.

        5. 화면에 숨겼더라도 모델 요청 본문이나 로그에 민감정보가 남아 있으면 충족으로 보지 않는다.

        6. 민감정보 제거 후 질문을 해석할 수 없으면 필요한 정보만 다시 묻는다. 제거한 비밀값을 사용자에게 다시 입력하도록 요구하거나 모델에
        전달하지 않는다.'
      정상 상태: 실제 모델 전송 내용과 운영 로그에는 필요한 허용 정보만 남으며 비밀번호·인증토큰·세션 정보·불필요한 개인식별정보는 포함되지
        않는다.
      미충족·예외 처리: '불필요하거나 금지된 민감값 발견: 모델 입력과 로그에서 차단 또는 제거한다.

        타인의 개인화 자료: 모델 전달 대상에서 제외한다.

        제거 후 질문 맥락이 부족하면 비밀정보를 다시 요구하지 않고 필요한 대상·기간 등만 되묻는다.'
      검증 방법: '1. 시험용 민감값을 포함한 정상·오류 요청을 준비한다.

        2. 모델에 실제 전송된 내용과 생성된 운영 로그에서 시험용 값의 포함 여부를 확인한다.

        3. 일반 질문과 개인화 질문을 비교해 개인 보유·관심 정보가 필요한 경우에만 전달되는지 확인한다.

        4. 오류·재시도 경로에서도 금지된 값이 새로 기록되지 않는지 확인한다.

        민감값 제거 뒤 맥락이 부족한 질문이 되묻기로 종료되고 제거한 값을 재요구하지 않는지 확인한다.'
      수용 기준: '1. 시험용 민감값을 넣은 요청을 처리한 후 모델 실제 전송 내용과 로그에 해당 값이 없는지 검사한다.

        2. 모델 호출 오류·재시도 로그에도 금지된 민감값이 기록되지 않는다.

        3. 개인화가 필요 없는 질문에 개인 보유·관심 정보가 불필요하게 포함되지 않는다.'
      확인 필요 사항: '[확인 필요: 모델별 허용·제거·마스킹 필드와 로그 보관 기간 승인 필요]'
