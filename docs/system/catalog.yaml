  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/03-메인-그래프.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 그래프 모드 전환
      기능 설명: 사용자는 전체 관계 그래프와 개인화 관계 그래프를 전환할 수 있어야 한다. 시스템은 현재 선택한 모드를 표시해야 한다.
      선행조건: 사용자가 메인 그래프 화면을 이용 중이다.
      입력값: '선택 모드: 전체 관계 그래프 또는 개인화 관계 그래프. 현재 조회 조건과 최신 조회 식별 정보.'
      입력·검증 규칙: '모드는 전체 관계 그래프와 회원의 통합 개인화 관계 그래프로 구분한다.

        전환 전 모드의 확대·탐색 위치·선택·필터를 같은 이용 세션에서 보관한다.

        새 모드가 정상 조회되기 전에는 이전 모드의 데이터에 새 모드 이름을 붙이지 않는다.

        비회원의 개인화 선택은 로그인 안내로 연결하고 개인화 데이터는 조회하지 않는다.'
      처리 절차 및 분기: '1. 현재 모드 상태를 보관하고 대상 모드 조회를 시작한다.

        2. 조회가 성공하면 대상 모드와 데이터를 함께 적용한다.

        3. 이전 방문 상태가 있으면 유효한 선택·필터·탐색 위치를 복원한다.

        4. 없어진 선택은 해제하고 그 사유를 표시한다.'
      정상 결과: 선택한 모드가 표시되고 해당 모드 기준의 그래프를 탐색할 수 있다.
      예외 처리: '대상 모드 조회 실패: 이전 모드와 화면을 유지하고 다시 시도를 제공한다.

        모드 전환 중 이전 응답 도착: 현재 모드 데이터로 반영하지 않는다.

        비회원 개인화 선택: 전체 그래프를 유지하고 로그인 필요를 안내한다.'
      수용 기준: '1. 두 모드 전환과 현재 모드 표시가 일치한다.

        2. 빠른 전환에도 이전 모드 데이터가 최종 화면에 남지 않는다.'
      확인 필요 사항: '이번 보완 항목의 추가 미정 없음. 신규 동작은 v1.2 제안 기준이며 원본의 승인·구현 상태를 변경한 것은 아니다.

        브라우저 새로고침·다른 기기까지 탐색 상태를 유지하는 정책은 이번 제안 범위에 포함하지 않는다.'
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/04-메인그래프-v2.csv
