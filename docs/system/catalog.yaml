    fields:
      기능명: 신규 경제뉴스 정기 수집 및 이슈 분석
      기능 설명: 분석시스템은 한국 시간 매시 05분과 35분에 신규 경제뉴스 수집을 시작한다. 공급원의 등록·수정 정보 등으로 신규·지연 등록·수정
        문서를 확인하고 동일 내용의 중복을 제외한다. 발견 가능한 범위는 실제 공급원의 지원과 검증된 조회 방식에 따른다. 뉴스·공시 같은
        문서에서 개별 사건을 추출하고 관련 이슈에 연결하거나 신규 이슈를 만든 뒤 기업·영향 경로·근거를 분석한다. 이슈는 관련 사건을 연결해
        관리하는 분석 주제이며 사건 하나부터 구성할 수 있다. 핵심 이슈는 이슈 중 중요하게 선정해 보여 주는 대상이며 별도의 사건 유형이
        아니다. 자동 검증을 통과한 결과만 공개 대상으로 지정한다.
      선행조건: 한국 시간 매시 05분과 35분의 정기 수집 회차가 시작된다.
      입력값: 수집 회차·시작 시각, 직전 성공 조회 기준과 제공되는 변경 커서, 조회 범위·페이지 정보, 문서·원문 근거·공급 문서 ID·원문
        주소, 발행 시각·공급원 등록/수정 시각·서비스 관측 시점, 문서 버전·이전 버전과 그 근거를 사용한 사건·이슈·기업 관계 참조, 단계별
        처리 상태.
      입력·검증 규칙: '한국 시간 매시 05분·35분 수집 시작을 유지하고 마지막 성공 조회 기준·공급원의 변경 커서를 관리한다.

        수집 성공은 해당 조회 범위의 응답·필수 페이지 처리·수집 문서 저장 확인이 끝난 경우다. 정상 신규 0건도 성공 기준과 제공되는 변경
        커서를 갱신한다. 수집 성공과 분석 성공은 별도 상태로 기록한다.

        공급 문서 ID 또는 정규화 원문 주소를 우선 비교하고 내용도 확인한다. 같은 사건의 서로 다른 기사는 보존한다. 같은 ID·주소라도
        내용이 수정되었으면 중복으로 버리지 않고 이전 내용과 변경 버전을 구분한다.

        지연 등록·수정 문서의 발견은 공급원이 제공하는 등록/수정 시각·변경 커서 또는 변경 목록을 우선 사용한다. 미지원 시 겹치는 과거
        구간 재조회가 가능한지 검증해 조회 범위·한계를 정한다. 발행 시각만의 필터나 관측 시점 저장만으로 누락 없는 발견을 보장하지 않는다.

        발행·공급원 등록/수정·서비스 관측 시점을 구분한다. 문서 버전별 근거 참조를 유지하여 변경 전 버전에 의존한 사건·이슈·기업 관계를
        추적할 수 있게 한다.

        자동 검증은 필요한 문서·출처의 확보, 기업·사건·이슈 식별자의 유효성, 발생 시점의 근거·정밀도·미상 표시, 관계·영향 경로와 근거
        참조의 연결을 확인한다. 발생 시점 미상은 별도 값으로 유지하며 발행일이나 임의 시각으로 대체하지 않는다.

        필수 근거·연결이 불완전하거나 검증에 실패한 결과, 처리 중·보류 결과는 공개하지 않는다. 자동 검증 통과를 분석 내용 전체의 사실
        정확성 보장으로 표현하지 않는다.'
      처리 절차 및 분기: '1. 확인된 공급원 등록/수정 기준·변경 커서/목록으로 신규·변경 문서를 찾는다. 미지원 시에는 실제 검증된 겹침
        재조회 범위에서 확인하고 발견 한계를 기록한다.

        2. 동일 내용의 중복과 수정 내용을 구분해 저장한다. 응답·필수 페이지·문서 저장이 완료된 범위만 수집 성공과 기준/커서에 반영하며
        분석 상태는 별도로 관리한다.

        3. 문서에서 개별 사건을 추출하고 복수 근거를 연결한 뒤 관련 분석 주제인 기존 이슈에 연결하거나 신규 이슈를 구성한다.

        4. 수정 문서가 있으면 이전 버전 근거에 연결된 사건·이슈·기업 관계 중 영향을 받는 결과를 찾아 변경된 근거로 선별 재검증한다.
        관련 없는 결과나 전체 AI 분석을 일괄 재실행하지 않는다.

        5. 필수 항목·참조 연결 검증을 통과한 결과만 공개 반영 대상으로 전달한다. 재검증에서 근거 무효가 확인된 결과는 공개 제외하고 사유를
        기록한다. 처리 중·보류·실패 상태 및 실제 화면 반영 완료는 분석 완료와 구분한다.'
      정상 결과: 수집 문서·개별 사건·이슈·기업 관계·근거가 연결되고 수집 상태와 분석·검증 상태가 구분되어 저장된다. 검증을 통과한 결과가
        공개 반영 대상이 된다.
      예외 처리: '수집·필수 페이지·수집 문서 저장 실패: 성공 기준·변경 커서를 전진시키지 않고 미완료 범위를 재처리한다.

        정상 신규 0건: 0건 완료를 기록한다. 요청 실패를 0건으로 기록하지 않는다.

        지연 등록·과거 문서 수정: 발행일이 이전이라는 이유만으로 제외하지 않는다. 발견 수단 미지원·미검증 또는 재조회 범위 밖 오래된 수정은
        발견 가능 한계를 명시하고 전체 누락 방지가 완료됐다고 판단하지 않는다.

        수정 문서의 영향 검증 실패: 해당 결과를 통과 결과로 제공하지 않는다. 근거 무효가 확인되면 관련 공개 결과를 제외하고 원인과 상태를
        남긴다.

        분석 실패: 수집 성공을 분석 성공으로 표시하지 않는다. 저장된 문서와 유효한 중간 결과를 사용해 허용된 실패 단계만 복구하며 완료된
        수집 범위를 불필요하게 다시 처리하지 않는다.

        분석 결과 저장만 실패: 보존된 결과의 유효성을 확인하고 저장만 재시도한다. 결과가 소실되면 복구 불가 상태를 남긴다.

        자동 검증 실패·검토 대기: 공개하지 않고 원인과 상태를 남긴다. 실패를 이유로 모델을 무제한 자동 재호출하지 않는다. 재처리는 허용
        범위·횟수가 정해진 정책에 따르고 중복 실행을 막는다.'
      수용 기준: '1. 한국 시간 매시 05분·35분에 수집을 시작한다.

        2. 수집 실패 시 성공 기준·변경 커서가 전진하지 않고 누락 범위를 다시 조회한다. 정상 신규 0건은 실패와 구분된다.

        3. 같은 문서 재수집은 중복되지 않으며 같은 사건의 다른 기사와 같은 주소의 수정 내용은 보존·구분된다.

        4. 사건 하나로도 이슈를 구성할 수 있고 문서·사건·이슈의 연결을 추적할 수 있다.

        5. 발생 시점 미상을 임의 시각으로 채우지 않으며 필수 근거·대상·연결 검증에 실패한 결과는 공개되지 않는다.

        6. 분석 실패와 수집 성공이 구분되고, 보존된 분석 결과의 저장 재시도는 모델 호출 없이 수행된다.

        7. 발행 시각은 이전 성공 경계보다 앞이지만 등록 시각은 뒤인 문서와 동일 주소의 과거 수정 문서를 시험하여, 검증된 등록/수정 조회
        또는 겹침 재조회 범위에서 발견되는지 확인한다. 범위 밖 사례는 지원 한계로 기록한다.

        8. 수정 전 문서 버전에 의존한 사건·이슈·기업 관계를 추적해 영향 결과만 재검증하고, 근거 무효 결과를 공개 제외한다. 무관한 결과의
        전체 재분석·무제한 모델 재호출은 발생하지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 문서·사건·이슈 구분, 수집/분석 상태 분리, 지연 등록·수정 발견 수단 구분, 이전 근거 버전의
        영향 추적·선별 재검증과 실패 단계 복구.

        [확인 필요: 실제 수집 공급처·접근 권한·이용 조건, 문서 ID·등록/수정 시각·변경 커서/목록의 제공과 의미는 실연동 검증 필요]

        [확인 필요: 변경 정보 미지원 시 겹침 재조회 범위·페이지 처리·지연 등록/과거 수정 탐지 한계 검증 필요. 임의 기간을 정하거나
        검증 전 누락 방지 완료를 선언하지 않는다]

        [확인 필요: 동일 이슈 판정 기준과 한 사건의 복수 이슈 연결 허용 범위 결정 필요]

        [확인 필요: 원문 주소 정규화·내용 중복/수정 판정 및 자동 검증 상세 기준·품질 목표는 실제 자료 검증 후 확정 필요]

        [확인 필요: 오류별 재처리 허용 범위·횟수·간격은 운영 정책으로 결정 필요]'
