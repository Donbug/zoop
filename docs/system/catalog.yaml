      기능명: 추천 종목·산업·테마 조회
      기능 설명: 로그인 회원이 초기 설정 또는 관심종목 수정 화면을 열면 검색어 없이 살펴볼 수 있는 추천 종목·산업·테마 목록을 제공한다.
