  source:
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 68
    rowUnit: xlsx-row
  detailRange: A35:B47
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/09-데이터-관리.csv
      row: 37
      rowUnit: xlsx-row
    fields:
      기능명: 사건과 문서 구분
      기능 설명: 사건과 그 사건을 다룬 뉴스·공시는 따로 관리해야 한다. 하나의 사건에 여러 문서를 연결할 수 있어야 하며, 사건이 일어난
        날짜와 기사가 나온 날짜를 구분해야 한다.
      선행조건: 수집·분석 결과에서 사건과 관련 뉴스·공시를 관리한다.
      입력값: 사건 식별자·발생 시각과 정밀도, 주체의 기업 식별자·행위·대상과 동일 사건 판단 근거, 문서 식별자·발행 시각, 사건과 문서의
        연결 정보.
      입력·검증 규칙: '사건과 문서를 별도로 관리하고 한 사건에 여러 문서를 연결한다.

        한 문서가 서로 다른 사건의 근거를 실제 포함하면 각 사건과 연결할 수 있다. 같은 사건 안의 동일 문서는 중복 연결하지 않는다.

        기업명 표기는 확인된 기업 ID로 정규화한다. 주체·행위·대상·발생 시점이 일치하여 동일 사건임을 뒷받침하는 근거가 검증된 경우만 기존
        사건에 자동 연결한다. 같은 날짜·같은 기업이라는 이유만으로 병합하지 않는다.

        계약 체결과 이후 계약 해지처럼 행위가 다른 후속 사건은 별개로 유지한다. 같은 사건을 보도한 서로 다른 기사는 삭제하지 않고 각각
        근거로 보존한다.

        발생 시각과 발행 시각을 구분한다. 날짜만 아는 사건은 날짜만 보존하고, 날짜도 미상이면 발생 시점 미상으로 둔다.'
      처리 절차 및 분기: '1. 사건과 문서를 별도 대상으로 관리하고 기업명 표기를 확인된 기업 ID로 정규화한다.

        2. 주체·행위·대상·발생 시점의 일치 근거를 검증해 동일 사건이면 기존 사건에 문서를 자동 연결하고, 정보 부족·충돌·불확실 또는
        다른 후속 사건이면 분리한다.

        3. 한 사건의 복수 문서를 보존하고 발생 시각과 문서 발행 시각을 구분하여 저장한다.'
      정상 결과: 사건별 관련 문서 목록을 조회할 수 있고 같은 날 발생한 서로 다른 사건이 유지된다.
      예외 처리: '정보 부족·발생 시점 등 판단 정보 충돌·동일 사건 여부 불명확: 자동 연결하지 않고 별개 사건 또는 검토 대상으로 유지한다.

        발생 날짜 미상: 근거 문서 발행일을 별도 값으로 보존하고 사건 시각에 대입하지 않는다.

        연결 저장 실패: 기존 연결을 유지하고 실패 대상을 기록한다. 재처리에서도 동일 사건·문서 연결을 중복 생성하지 않는다.'
      수용 기준: '1. 한 사건의 복수 문서 연결과 같은 날의 별개 사건이 유지된다.

        2. 사건 시각과 문서 발행 시각이 구분된다.

        3. 발생 시각 미상 사건에 문서 발행 시각을 사건의 확정 시각으로 자동 입력하지 않는다.

        4. 기업·행위·대상·발생 시점의 일치 근거가 검증된 복수 보도는 기존 사건에 자동 연결되며 각 문서는 보존된다.

        5. 계약 체결·해지 같은 후속 사건과 판단 정보가 부족하거나 충돌한 사건은 잘못 병합되지 않는다.'
      확인 필요 사항: 'v1.2 제안 기준: 기업 ID 정규화·검증된 동일 사건 자동 연결·불명확 사례 분리·복수 근거 보존·시각 미상 구분.

