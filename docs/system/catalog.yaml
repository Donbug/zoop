        않는 경우 오류 로그를 남긴다.

        튜토리얼 데이터 또는 UI 로딩 실패: 현재 메인 그래프 상태를 유지하고 다시 시도와 튜토리얼 종료를 제공한다.

        재시청 중 오류: 기존 회원의 완료·건너뛰기 상태를 변경하지 않고 메인 그래프로 복귀할 수 있도록 한다.'
      수용 기준: '① 설명 대상과 실제 조작 대상이 일치한다.

        ② 회원과 비회원 모두 메인 그래프에서 튜토리얼 다시 보기를 실행할 수 있다.

        ③ 다시 보기는 첫 단계부터 시작한다.

        ④ 비회원은 튜토리얼을 통해 회원 전용 기능을 우회하여 실행할 수 없다.

        ⑤ 비회원의 튜토리얼 진행 상태가 저장되지 않는다.

        ⑥ 회원이 튜토리얼을 다시 본다고 해서 기존 완료·건너뛰기 상태가 임의로 초기화되지 않는다.'
      확인 필요 사항: '[확인 필요: 초기 그래프의 노드 수·확장 깊이·대표 이슈 선정 기준 결정 필요]

        개인화 모드를 직접 선택했으나 종목이 없는 경우의 설정 안내와 초기 진입의 전체 그래프 제공을 구분한다.

        [확인 필요: 빈 그래프 안내 방식 결정 필요]'
