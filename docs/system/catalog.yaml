    fields:
      기능명: 답변 검증과 제공
      기능 설명: AI 답변의 형식, 인용이 가리키는 문서·원문 구간, 답변에 포함된 그래프 대상의 유효성을 확인해야 한다. 현재 유효한 실행의
        검증된 결과를 저장한 후 답변을 제공해야 한다. 실제 적용 기업·이슈·기간을 표시하고 검증 실패 시 답변을 자동으로 다시 생성하지 않아야
        한다.
      선행조건: 근거를 확보한 질문 작업에서 AI 답변 생성 결과가 도착했다.
      입력값: 생성 답변, 인용 문서·원문 구간, 그래프 대상 식별자, 실제 적용 기업·이슈·기간, 현재 유효한 실행 정보, 검증 결과·저장
        결과.
      입력·검증 규칙: '답변 형식, 인용 문서·원문 구간, 그래프 대상의 유효성을 확인한다.

        현재 유효한 실행의 검증된 결과만 저장하고 저장 성공 후에 답변을 제공한다.

        검증 실패와 저장 실패를 별도 오류로 구분한다.

        검증 실패 시 자동 재생성을 하지 않는다.

        검증 결과가 보존된 저장 실패는 모델 호출 없이 저장만 재시도할 수 있으며 유효한 실행인지 다시 확인한다.'
      처리 절차 및 분기: '1. 답변 형식, 인용 문서·원문 구간 및 그래프 대상의 유효성을 검사한다.

        2. 현재 유효한 실행의 검증된 결과를 저장한 뒤 답변을 제공한다.

        3. 검증 실패와 저장 실패를 구분해 기록한다.

        4. 검증 실패는 자동 재생성하지 않는다.

        5. 저장 실패 시 검증된 결과가 보존되어 있으면 현재 실행의 유효성을 확인하고 모델 호출 없이 저장만 재시도한다.

        6. 저장 실패만을 이유로 AI를 자동 재호출하지 않는다.'
      정상 결과: 검증과 저장을 완료한 답변이 실제 적용 기업·이슈·기간과 함께 제공된다.
      예외 처리: '답변 검증 실패: 실패 사유를 기록하고 자동 재생성·동일 작업의 수동 재생성을 허용하지 않는다. 필요하면 사용자가 내용을
        고쳐 새 질문으로 전송한다.

        저장 실패이며 검증 결과 보존: 현재 실행·권한·자료 유효성을 확인하고 모델 호출 없이 저장만 다시 시도한다.

        검증 결과 소실 또는 보존 여부 불명확: 자동 AI 재호출을 하지 않는다. 복구 가능 여부를 확인하고 복구 불가를 안내한다. 사용자의
        명시적 새 질문만 별도 작업으로 처리한다.

        이전 실행 지연 완료: 현재 유효한 결과를 덮어쓰지 않는다.'
      수용 기준: '1. 잘못된 인용·원문 구간·그래프 ID, 유효하지 않은 과거 실행 및 저장 실패 결과가 완료 답변으로 노출되지 않는다.

        2. 검증 실패 시 추가 모델 호출이 자동 발생하지 않는다.

        3. 검증 실패와 저장 실패를 구분해 확인할 수 있다.

        4. 검증된 결과가 보존된 상태에서 저장에 실패하면 모델 호출 횟수 증가 없이 저장만 재시도하며, 저장 성공 후에만 완료 답변으로 제공한다.'
      확인 필요 사항: 'v1.2 제안 기준: 검증 실패 동일 작업 재생성 금지·검증 결과 소실 시 자동 재호출 금지·저장 복구 우선.

        형식·인용·참조 검증 통과가 답변 전체의 사실 정확성을 보장하지 않는다.

