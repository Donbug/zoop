  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/10-외부-연동.csv
      row: 51
      rowUnit: xlsx-row
    fields:
      기능명: AI 분석 연동
      기능 설명: 호출 기능의 작업·유효 실행에 맞는 허용된 질문과 근거만 분석 서비스에 전달하고, 응답의 형식·인용·대상 참조를 검증한다.
        중복 요청·응답 미수신·호출 장애·근거 부족·검증 실패·결과 저장 실패를 구분하여 불필요한 재호출을 막는다.
      선행조건: 챗봇·브리핑·뉴스 분석 기능에서 AI 분석을 요청한다.
      입력값: 호출 기능, 작업 식별자와 현재 유효한 실행 정보, 질문·분석 대상·기간·고정 맥락·근거 문서와 버전 참조, 현재 접근 권한.
        작업·실행 연결 정보는 내부에서 관리하며 모델에는 전달 필드·목적·제공자별 처리 조건이 승인된 범위에서 필요한 최소 데이터만 전달한다.
      입력·검증 규칙: '챗봇 회원 요청은 로그인·대화 소유권과 대상·근거의 현재 접근 권한을 확인한다. 그 밖의 회원별 요청은 해당 회원·작업·대상/근거의
        권한을, 공통 브리핑·뉴스 분석 배치는 승인된 서비스 실행·자료 접근 권한을 확인하며 대화가 없는 요청에 대화 소유권을 요구하지 않는다.

        개인화 정보는 전달 필드·목적·제공자별 처리 조건이 승인된 범위에서만 사용한다. 분석에 필요하다는 이유만으로 미승인 정보를 전달하지
        않으며 민감정보와 권한 밖 정보는 모델에 전달하지 않는다.

        작업 식별자·실행 식별자·통신 추적 식별자를 구분한다. 동일 작업의 단순 재전송으로 추가 모델 실행을 만들지 않고 기존 상태·저장 결과를
        확인한다.

        응답이 원래 호출 기능·작업과 현재 유효한 실행에 해당하는지 확인하고 결과 형식·인용 문서와 원문 구간·대상 참조를 검증한다.

        챗봇 재시도는 최초 맥락·대상·기간·문서 버전을 유지한다. 지정 자료가 없거나 권한이 사라졌다고 최신 자료로 조용히 대체하지 않는다.

        호출 장애·상태 확인 불가와 근거 부족은 다른 상태다. 검증 통과를 분석 전체의 사실 정확성 보장으로 표현하지 않는다.'
      처리 절차 및 분기: '1. 호출 기능·작업·현재 실행과 필요한 데이터의 권한을 확인한다. 기존 작업의 단순 재요청이면 상태·저장 결과를
        우선 회수한다.

        2. 새 실행이 허용된 요청의 정보 중 승인된 필드·목적·제공자 처리 조건에 맞는 최소 정보만 분석 서비스로 전달한다.

        3. 응답의 작업 대응·실행 유효성·형식·인용·대상 참조를 검증한다.

        4. 검증된 결과 또는 구분된 오류·근거 부족 상태를 호출 기능에 전달한다. 결과 검증 성공과 저장 완료를 별도 상태로 관리한다.'
      정상 결과: 원래 호출 기능·작업·유효 실행에 대응하는 검증 결과 또는 명확히 구분된 호출 장애·검증 실패·근거 부족 상태가 전달된다.
        챗봇은 검증된 결과의 저장 성공을 확인한 뒤 사용자에게 완료 결과를 제공한다.
      예외 처리: '형식·인용·참조 오류: 정상 검증 결과로 전달하지 않는다. 모델 호출 장애를 근거 없음으로 바꾸어 안내하지 않는다.

        응답 미수신·시간초과·상태 조회 실패: 실패·미등록을 단정하거나 즉시 중복 재호출하지 않고 기존 작업 상태를 확인한다.

        근거 부족·지정 버전 사용 불가·권한 상실: 실제 상태와 확인 범위를 알리고 없는 근거나 권한 밖 자료로 대체하지 않는다.

        챗봇 검증 실패: 동일 작업의 자동·수동 재생성을 허용하지 않는다. 필요하면 사용자가 내용을 고쳐 새 질문으로 전송한다.

        챗봇 결과 저장만 실패: 검증 결과가 보존되어 있고 현재 실행·권한·자료가 유효할 때 모델 호출 없이 저장만 복구한다. 결과 소실·보존
        불명확을 이유로 동일 작업을 재생성하지 않는다.

        확정된 일시 장애의 챗봇 재시도: 이전 실행 종료와 실행 권한을 확인한 뒤 사용자 재시도로 원래 작업·조건을 유지한다. 브리핑·뉴스
        분석의 재처리는 기능별 허용 정책을 따르며 무제한 자동 재호출하지 않는다.

        늦은 이전 실행 응답: 현재 결과를 덮어쓰지 않는다.'
      수용 기준: '1. 원래 호출 기능·작업·유효 실행과 응답이 일치하고 형식·인용·대상 오류가 정상 결과로 전달되지 않는다.

        2. 호출 종류에 맞는 권한 검사가 적용되며 대화 없는 배치에 대화 소유권을 요구하지 않는다. 민감정보·권한 밖 자료·전달 조건이 승인되지
        않은 개인화 정보가 모델 입력에 전달되지 않는다.

        3. 중복 요청·응답 미수신·상태 조회 실패만으로 추가 모델 실행이 생기지 않으며 늦은 응답이 최신 결과를 덮지 않는다.

        4. 호출 장애와 근거 부족을 구분하고 지정 문서 버전을 몰래 대체하지 않는다.

        5. 챗봇의 검증 실패는 동일 작업 재생성으로 이어지지 않으며, 보존된 검증 결과의 저장 복구는 모델 호출 횟수를 늘리지 않는다.'
      확인 필요 사항: '[확인 필요: 모델·제공자·호출 제한·타임아웃·허용 재시도 횟수/간격은 실제 운영 환경에서 결정 필요]

        [확인 필요: 브리핑·뉴스 분석의 결과 형식·검증 상세 기준과 오류별 재처리 허용 범위 결정 필요]

        [확인 필요: 검증 결과 보존 범위·기간·저장 복구 시 실제 가용성 확인 필요]

        [확인 필요: 개인화 정보의 전달 허용 필드·사용 목적·제공자별 처리 조건 확정 필요. 미확정 항목은 필요성만으로 전달하지 않는다]'
