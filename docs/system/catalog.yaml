- id: FS027
  title: 관심 종목 수정
  section: 메인 그래프
  priority: P1
  status: 확정
  requirementIds:
  - '27'
  source: &id011
    path: docs/evidence/raw/functional-spec_2026-10-08/00-명세-목차.csv
    row: 37
    rowUnit: xlsx-row
  detailRange: A147:B159
  change: 동작 보완
  definitions:
  - source:
      path: docs/evidence/raw/functional-spec_2026-10-08/03-메인-그래프.csv
      row: 149
      rowUnit: xlsx-row
    fields:
      기능명: 관심 종목 수정
      기능 설명: 사용자는 사이드바 또는 기업 노드를 클릭하여 관심 종목을 선택 및 해제할 수 있다.
      선행조건: 로그인 회원이 사이드바 또는 기업 노드에서 관심종목 등록·해제를 선택한다.
      입력값: 본인 회원 식별 정보, 기업 식별자, 등록 또는 해제할 관심 상태.
      입력·검증 규칙: '해당 회원의 관심종목만 변경한다.

        반복 전송으로 동일 관심 정보가 중복 생성되지 않도록 한다.

        비회원은 관심종목을 선택·저장할 수 없다.

        원본의 관심종목 무제한 정책에 없는 개수 제한을 추가하지 않는다.'
      처리 절차 및 분기: '1. 회원이 추가·삭제할 종목을 편집한다.

        2. 저장을 요청하면 본인 권한과 종목 유효성·중복을 확인한다.

        3. 저장 성공 후 관심 상태와 통합 개인화 그래프를 새 목록으로 갱신한다.

        4. 관심에서 제거한 기업이 보유종목이면 보유 노드로 유지하고 관심 상태만 해제한다.'
      정상 결과: 변경한 관심 상태가 계정에 저장되고 재조회한 관심종목 목록에 반영된다.
      예외 처리: '저장 실패: 기존 저장 목록·그래프는 유지하고 편집 내용을 보관하여 재시도할 수 있게 한다.

        저장 성공 후 그래프 갱신 실패: 저장 성공과 그래프 조회 실패를 구분하고 그래프만 다시 조회한다. 관심 변경을 중복 저장하지 않는다.

        동일 종목 중복: 한 관심 항목으로 유지한다. 비회원은 변경을 허용하지 않는다.'
      수용 기준: '1. 저장 성공한 관심 변경만 실제 관심 상태에 반영된다.

        2. 보유·관심 기업을 관심에서 삭제해도 보유 노드는 유지된다.

        3. 그래프 조회 재시도가 이미 성공한 관심 변경을 반복 실행하지 않는다.'
      확인 필요 사항: 이번 보완 항목의 추가 미정 없음. 신규 동작은 v1.2 제안 기준이며 원본의 승인·구현 상태를 변경한 것은 아니다.
