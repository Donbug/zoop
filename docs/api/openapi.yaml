          pattern: "^[A-Za-z0-9._:/\\-]+$"
          description: "Selected graph node identifier; no label or user-entered text."
        viewId:
          type: "string"
          pattern: "^[A-Za-z0-9\\-]{8,40}$"
      required: ["type", "targetId", "viewId"]
    TelemetryGraphEdgeSelect:
