  "/api/v1/chat/sessions/{id}/jobs":
    post:
      tags:
        - "chat"
      summary: "질문 접수·맥락 고정·비동기 분석"
      description: "최초 접수에서 질문·시각·대화·작업 ID·기업/이슈/기업 간 관계·문서·기간·asOf·graphVersion을 고정한다. 같은 jobId/멱등성 키는 저장된 같은 작업을 반환하고 내용 불일치는 409다. 질문의 명시 조건을 화면 맥락보다 우선한다. 내부에서는 Q01~Q08 multi-label 분류, 최소 충분 읽기 도구 계획, 커버리지 검증, 근거 조회, 답변 생성과 출력 검증을 수행하지만 모델은 도구 실행 권한을 갖지 않는다. 검증과 저장이 완료된 결과만 completed다. 유효한 근거 없음을 기술 장애로 위장하지 않는다. 확인 질문에 답할 때는 resolves에 원 작업 ID와 선택지 ID(자유 입력이면 null)를 담는다. 서버는 원 작업이 같은 대화의 completed·clarification인지, choiceId가 그 결과의 choices에 있는지 검사하고(아니면 422 INVALID_REQUEST, 원 작업이 없거나 다른 회원 것이면 404), 원 질문·원 고정 문맥·선택을 합쳐 실행한다. resolves와 context를 함께 보내면 422다. 같은 확인 질문에 여러 번 답할 수 있으며 각 답은 별도 작업이다. 확인 질문 사슬은 루트 질문부터 최대 2회다. 확인 답에 대한 답(깊이 2) 작업도 대상·기간이 확정되면 정상 처리해 answered 등의 결과를 내고, 도구 장애는 failed다. 추가 확인이 필요할 때만 clarification 대신 대상·기간을 구체적으로 적은 새 질문을 안내하는 guidance로 끝난다. 확인 답은 루트 질문과 사슬의 답을 순서대로 합쳐 실행한다. Idempotency-Key 헤더는 본문 jobId와 같아야 하며 다르면 422 INVALID_REQUEST다. 선택한 근거 ID(contextIds·evidenceIds의 evidence)는 고정한 그래프 버전·asOf에서 공개 근거 조회(getEvidence)로 지금 읽을 수 있어야 하며(구조 관계 basis만 인용하는 근거 포함), 아니면 422 INVALID_REQUEST다."
      operationId: "submitQuestion"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_-]{8,64}$"
            description: "Conversation id made by the client"
