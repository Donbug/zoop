          type: "integer"
          description: "Executions started so far (a retry starts another)"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        finishedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
