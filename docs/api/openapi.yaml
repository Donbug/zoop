        - "activeUsers"
        - "nodeSelections"
        - "edgeSelections"
        - "briefingViews"
        - "aiQuestions"
    Dashboard:
      properties:
        generatedAt:
          type: "string"
          format: "date-time"
          description: "대시보드 집계 기준 시각. 모든 기간 집계는 이 시각을 기준으로 계산한다."
        metadata:
          "$ref": "#/components/schemas/Metadata"
          description: "이 대시보드 응답의 metadata.asOf는 generatedAt과 같고, 그래프 버전 자체를 조회 기준으로 사용하지 않으므로 graphVersion은 null이다."
        ledger:
          "$ref": "#/components/schemas/DashboardLedger"
        graph:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardGraph"
            -
              type: "null"
          description: "null when the graph version summary could not be read; subarea failures are listed individually in metadata.failures."
        candidates:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardCandidates"
            -
              type: "null"
          description: "null when candidate source is unavailable; an empty but successfully read source returns zero counts."
        jobs:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardJobs"
            -
              type: "null"
          description: "null when the job source is unavailable; a successfully read source with no jobs returns zero counts and an empty recent list."
        ai:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardAi"
            -
              type: "null"
          description: "null when user-request records are unavailable; model execution attempts are not substituted."
        briefings:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardBriefings"
            -
              type: "null"
          description: "null when the briefing-round source is unavailable; no rounds in an available source returns an empty latest list."
        members:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardMembers"
            -
              type: "null"
          description: "null when member/session counts could not be read."
        audit:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardAudit"
            -
              type: "null"
          description: "null when the 24-hour audit count could not be read."
      type: "object"
      required:
        - "generatedAt"
        - "metadata"
        - "ledger"
        - "graph"
        - "candidates"
        - "jobs"
        - "ai"
        - "briefings"
        - "members"
        - "audit"
    DashboardAi:
      properties:
        window:
          type: "string"
