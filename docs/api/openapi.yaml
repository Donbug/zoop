      required:
        - "authenticated"
        - "expired"
        - "expiredReason"
        - "admin"
        - "expiresAt"
        - "idleExpiresAt"
        - "idleTimeoutSeconds"
        - "absoluteTimeoutSeconds"
        - "csrfToken"
