              type: "string"
            -
              type: "null"
        idempotent:
          type: "boolean"
      type: "object"
      required:
        - "activeVersionId"
        - "previousActiveVersionId"
        - "idempotent"
    ActivationOut:
      properties:
        versionId:
          type: "string"
        previousVersionId:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        at:
          type: "string"
        adminEmail:
          type: "string"
        reason:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        action:
          type: "string"
          enum:
            - "publish"
            - "activate"
            - "seed"
      type: "object"
      required:
        - "versionId"
        - "previousVersionId"
        - "at"
        - "adminEmail"
        - "reason"
        - "action"
    AdminInfo:
      properties:
        id:
          type: "string"
        email:
          type: "string"
        displayName:
          type: "string"
        role:
          type: "string"
          const: "admin"
      type: "object"
      required:
        - "id"
        - "email"
        - "displayName"
        - "role"
