          enum:
            - "investment_advice"
            - "precondition_unmet"
            - "results_truncated"
            - "evidence_insufficient"
            - "out_of_scope"
          description: "investment_advice: 투자 판단 요청이라 제공하지 않음. precondition_unmet: 앞 단계 결과가 체크포인트 조건에 못 미쳐 의존 요구를 수행할 수 없음. results_truncated: 조회 상한에 걸려 일부 자료만 확인함. evidence_insufficient: 조회는 성공했으나 이 요구의 공개 근거가 부족함. out_of_scope: 지원하지 않는 하위 요구. 서버가 gate·체크포인트·도구 결과로 정하며 모델 자기평가로 정하지 않는다."
        label:
          type: "string"
          maxLength: 200
          description: "해당 요구를 회원 질문의 표현으로 나타낸 문구"
        message:
          type: "string"
          maxLength: 500
          description: "kind별 서버 템플릿으로 만든 안내 문장"
      type: "object"
      required:
        - "kind"
        - "label"
        - "message"
      description: "answered 결과에서 답하지 않은 요구 하나와 그 이유."
    ChatPeriod:
      properties:
        start:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Inclusive KST calendar day (ISO date)"
        end:
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      type: "object"
      required:
        - "start"
        - "end"
    ChatResult:
      properties:
        outcome:
          type: "string"
          enum:
            - "answered"
            - "clarification"
            - "guidance"
            - "insufficient_evidence"
        messageId:
          type: "string"
        answer:
          type: "string"
          maxLength: 12000
          description: "표시용 전체 본문. answered이면 서버가 sections의 text를 순서대로 이어 만들며, 이어 붙인 전체가 12000자를 넘으면 검증 실패다. 돌려줄 때 인용 근거를 지금 읽을 수 없으면 저장 결과와 달리 고정 안내 문장만 담고 sections·citations는 빈 배열이다(getQuestionJob)."
        sections:
          items:
            "$ref": "#/components/schemas/ChatAnswerSection"
          type: "array"
          maxItems: 12
          description: "answered 본문을 근거 수준별로 나눈 구간. answered가 아니면 빈 배열이다. 일반 개념과 근거 기반 사실을 한 구간에 섞지 않는다."
        answerBasis:
          type: "string"
          enum:
            - "general_knowledge"
            - "zoop_documented"
            - "evidence_grounded"
            - "mixed"
            - "none"
          description: "사용자 표시용 답변 근거 수준. 서버가 sections에서 계산한다: 구간 basis가 한 종류면 그 값(Q02 일반 개념 general_knowledge, 승인된 ZOOP 도움말·정책 zoop_documented, 공개 근거 기반 사실 evidence_grounded), 두 종류 이상이면 mixed, 구간이 없는 확인·안내·근거 부족은 none이다. 모델의 자기평가로 정하지 않는다."
        reason:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        sources:
          items:
            type: "string"
          type: "array"
          maxItems: 20
          uniqueItems: true
        citations:
          items:
            "$ref": "#/components/schemas/Citation"
          type: "array"
          maxItems: 20
        graphTargets:
          items:
            "$ref": "#/components/schemas/GraphTarget"
          type: "array"
          maxItems: 50
          description: "답변 본문이 실제로 가리키는 기업·이슈·관계로 지도에서 열 대상이다. 답변 생성에 쓴 그래프 context 전체(노드 50개·간선 50개 상한)가 아니라 그 부분집합이며, 모두 같은 graphVersion의 도구 결과에 있어야 한다."
        applied:
          "$ref": "#/components/schemas/ChatApplied"
        choices:
          items:
            "$ref": "#/components/schemas/ChatChoice"
          type: "array"
          maxItems: 6
          description: "clarification: 기업·기간·범위·스냅샷 중 회원이 고를 수 있는 선택지. 선택은 원 작업을 수정하지 않고 resolves.choiceId를 담은 새 질문으로 접수한다."
        action:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatAction"
            -
              type: "null"
          description: "guidance: what the member can do to meet the missing condition"
        limitations:
          items:
            "$ref": "#/components/schemas/ChatLimitation"
          type: "array"
          maxItems: 8
          description: "answered에서 답하지 않은 요구. 모든 필수 요구는 본문에서 근거와 함께 답했거나 이 배열의 항목 중 정확히 하나에 속한다. answered가 아니면 빈 배열이며 전체 이유는 reason을 쓴다. 도구 장애·timeout은 항목이 아니라 failed다."
        metadata:
          "$ref": "#/components/schemas/Metadata"
      type: "object"
      required:
        - "outcome"
        - "messageId"
        - "answer"
        - "sections"
        - "answerBasis"
        - "reason"
        - "sources"
        - "citations"
        - "graphTargets"
        - "applied"
        - "choices"
        - "action"
        - "limitations"
        - "metadata"
