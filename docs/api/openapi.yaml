      discriminator:
        propertyName: "type"
        mapping:
          screen_view: "#/components/schemas/TelemetryScreenView"
          graph_node_select: "#/components/schemas/TelemetryGraphNodeSelect"
          graph_edge_select: "#/components/schemas/TelemetryGraphEdgeSelect"
          briefing_view: "#/components/schemas/TelemetryBriefingView"
          briefing_issue_open: "#/components/schemas/TelemetryBriefingIssueOpen"
          ai_question: "#/components/schemas/TelemetryAiQuestion"
      description: "One allowed user action. Event-specific schemas reject unknown fields, including names, email addresses, and question text."
    TelemetryScreenView:
      type: "object"
      additionalProperties: false
      properties:
        type:
          type: "string"
          const: "screen_view"
        screen:
          type: "string"
          enum: ["main", "briefing", "ai"]
        viewId:
          type: "string"
          pattern: "^[A-Za-z0-9\\-]{8,40}$"
      required: ["type", "screen", "viewId"]
    TelemetryGraphNodeSelect:
