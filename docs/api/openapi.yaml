          type: "integer"
          description: "Distinct pseudonymous member or guest analytics principals with at least one accepted interaction event that day."
        nodeSelections:
          type: "integer"
          description: "Accepted graph_node_select events that day, deduplicated by idempotency key."
        edgeSelections:
          type: "integer"
          description: "Accepted graph_edge_select events that day, deduplicated by idempotency key."
        briefingViews:
          type: "integer"
          description: "Accepted briefing_view events that day, deduplicated by idempotency key."
        aiQuestions:
          type: ["integer", "null"]
          description: "AI question submission count; null until a source is integrated, zero when the source is available and has no events."
