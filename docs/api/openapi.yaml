        - "tutorialCompleted"
        - "completed"
        - "investor"
        - "version"
        - "metadata"
    SettingsUpdate:
      properties:
        version:
          type: "integer"
        mode:
          anyOf:
            -
              type: "string"
              enum:
                - "assets"
                - "watchlist"
            -
              type: "null"
          description: "assets/watchlist를 지정하면 방식을 선택한다. null 또는 생략은 현재 값을 변경하지 않는다."
        watchlistIds:
          anyOf:
            -
              items:
                type: "string"
              type: "array"
            -
              type: "null"
        tutorialCompleted:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
        completed:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          description: "Cannot be true unless investor has been answered and mode has been selected. Set false to clear completion."
        investor:
          anyOf:
            -
              type: "boolean"
            -
              type: "null"
          description: "Answer to 'do you invest in stocks now?'"
      type: "object"
      required:
        - "version"
      description: "Unset fields keep their stored value; null mode, watchlistIds, completed, and tutorialCompleted keep their stored value, while null investor clears the answer. completed cannot be true unless investor has been answered and mode has been selected. version must equal the stored version unless applying the patch changes nothing, in which case the current settings are returned. Changed settings increment version once."
    SetupState:
      properties:
        completed:
          type: "boolean"
        tutorialCompleted:
          type: "boolean"
      type: "object"
      required:
        - "completed"
        - "tutorialCompleted"
      description: "For members, these booleans reflect the current persisted state of the authenticated member. For guests, both are always false and tutorial progress, completion, and skip state are never persisted; the client can run or replay the tutorial locally. Anonymous sessions have no setup state and return setup=null."
    SignupRequest:
      properties:
        email:
          type: "string"
        password:
          type: "string"
          minLength: 8
          maxLength: 32
        displayName:
          type: "string"
        agreements:
          type: "array"
          description: "조회한 승인 약관의 ID·버전별 실제 동의 상태. 필요한 동의를 서버에서 다시 검증한다."
          items:
            type: "object"
            required: [id, version, accepted]
            properties:
              id:
                type: "string"
              version:
                type: "string"
              accepted:
                type: "boolean"
      type: "object"
      required: [email, password, agreements]
      description: "필수 입력·이메일 중복·필수 약관·승인 버전·실제 동의 여부는 서버에서 검증한다. 가입 성공 직후 새 회원 세션을 발급한다. 이름·비밀번호 정책은 x-zoop-common-rules.signupPolicy를 따른다. PR2는 이메일 소유 확인 메일을 보내지 않는다."
    SinceMorning:
      properties:
        status:
          type: "string"
          const: "available"
        morningRoundId:
          type: "string"
        morningPublishedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
        morningDataAsOf:
          type: "string"
        items:
          items:
            "$ref": "#/components/schemas/SinceMorningItem"
          type: "array"
      type: "object"
      required:
        - "status"
        - "morningRoundId"
        - "morningPublishedAt"
        - "morningDataAsOf"
        - "items"
      description: "Key issues of an evening round compared with the same day's published morning round, oldest first."
    SinceMorningItem:
      properties:
        title:
          type: "string"
        eventId:
          type: "string"
        eventTime:
          anyOf:
            -
              type: "string"
            -
              type: "null"
        timePrecision:
          type: "string"
          enum:
            - "year"
            - "month"
            - "day"
            - "datetime"
            - "unknown"
        reportedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
          description: "As on the key issue: KST time, only the date when the article has no time, null when not stored"
        companyNames:
          items:
            type: "string"
          type: "array"
          description: "Names of the companies linked to the issue when its round was published (from the stored key issue)"
        change:
          type: "string"
          enum:
            - "new"
            - "continuing"
            - "dropped"
          description: "new = not among the morning round's key issues; continuing = in both rounds (new evidence since the morning put it in this round's window); dropped = only in the morning round"
        rank:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Rank in this round; null when dropped"
        morningRank:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Rank in the morning round; null when new"
        evidenceCount:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Evidence in this round; null when dropped"
        morningEvidenceCount:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Evidence in the morning round; null when new"
      type: "object"
      required:
        - "title"
        - "eventId"
        - "eventTime"
        - "timePrecision"
        - "reportedAt"
        - "companyNames"
        - "change"
        - "rank"
        - "morningRank"
        - "evidenceCount"
        - "morningEvidenceCount"
    SocialProvidersResponse:
      type: "object"
