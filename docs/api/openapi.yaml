          type: "string"
          enum:
            - "queued"
            - "running"
            - "completed"
            - "failed"
            - "cancelled"
        outcome:
          anyOf:
            -
              type: "string"
              enum:
                - "answered"
                - "clarification"
                - "guidance"
                - "insufficient_evidence"
            -
              type: "null"
