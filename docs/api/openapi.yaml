            - "string"
            - "null"
          format: "date-time"
        idleExpiresAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
        idleTimeoutSeconds:
          type: "integer"
        absoluteTimeoutSeconds:
          type: "integer"
        csrfToken:
          type:
            - "string"
