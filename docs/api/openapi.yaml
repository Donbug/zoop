          const: "graph_edge_select"
        targetId:
          type: "string"
          minLength: 1
          pattern: "^[A-Za-z0-9._:/\\-]+$"
          description: "Selected graph edge identifier; no label or user-entered text."
        viewId:
          type: "string"
          pattern: "^[A-Za-z0-9\\-]{8,40}$"
      required: ["type", "targetId", "viewId"]
    TelemetryBriefingView:
      type: "object"
      additionalProperties: false
      properties:
        type:
          type: "string"
          const: "briefing_view"
        targetId:
          type: "string"
          minLength: 1
          pattern: "^[A-Za-z0-9._:/\\-]+$"
          description: "Briefing round identifier."
        viewId:
          type: "string"
          pattern: "^[A-Za-z0-9\\-]{8,40}$"
      required: ["type", "targetId", "viewId"]
    TelemetryBriefingIssueOpen:
