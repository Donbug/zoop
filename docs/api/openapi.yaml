      description: "기업 패널에서 여는 영향 경로다. 데이터에 없는 산업·제품 단계나 관계 유형을 만들지 않는다."
    ErrorCode:
      type: "string"
      enum:
        - "INVALID_REQUEST"
        - "INVALID_CREDENTIALS"
        - "AUTH_REQUIRED"
        - "MEMBER_REQUIRED"
        - "ACCESS_DENIED"
        - "MEMBER_BLOCKED"
        - "EMAIL_TAKEN"
        - "TERMS_REQUIRED"
        - "RESOURCE_NOT_FOUND"
        - "EVIDENCE_UNAVAILABLE"
        - "VERSION_UNAVAILABLE"
        - "REVISION_CONFLICT"
        - "IDEMPOTENCY_CONFLICT"
        - "JOB_IN_PROGRESS"
        - "JOB_NOT_RETRYABLE"
        - "ALREADY_PUBLISHED"
        - "VALIDATION_FAILED"
        - "SOCIAL_AUTH_CANCELLED"
        - "SOCIAL_AUTH_FAILED"
        - "SOCIAL_LINK_REQUIRED"
        - "SOCIAL_EMAIL_REQUIRED"
        - "INVALID_CURSOR"
        - "RATE_LIMITED"
        - "SOURCE_UNAVAILABLE"
        - "MODEL_UNAVAILABLE"
        - "AUDIT_UNAVAILABLE"
        - "MASKING_FAILED"
        - "INTERNAL_ERROR"
    MarketOutlookAnalysis:
      type: object
      properties:
        schemaVersion:
          type: string
          enum:
          - zoop-market-outlook-analysis-v1
        edition:
          type: string
          enum:
          - morning
          - evening
        cutoff:
          type: string
          format: date-time
        mode:
          type: string
          enum:
          - morning_update
          - evening_review
        scopeNote:
          type: string
        previousPublication:
          $ref: '#/components/schemas/MarketPreviousPublication'
        coverage:
          $ref: '#/components/schemas/MarketCoverage'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/MarketOutlookClaim'
          minItems: 2
          maxItems: 8
        forecasts:
          type: array
          items:
            $ref: '#/components/schemas/MarketForecast'
        forecastEvaluations:
          type: array
          items:
            $ref: '#/components/schemas/MarketForecastEvaluation'
      required:
      - schemaVersion
      - edition
      - cutoff
      - mode
      - scopeNote
      - previousPublication
      - coverage
      - claims
      - forecasts
      - forecastEvaluations
      description: 출근은 새 정보에 따른 오늘 전망 갱신, 퇴근은 아침 판단과 확인 가능한 실제 흐름 비교 및 다음 거래일 전망이다. 문장은 근거·지표·실제 직전 브리핑에 결속되고 검증을 통과한 경우에만 공개한다.
        과거 시뮬레이션을 당시 운영 발행이나 전체 시장 분석으로 표현하지 않는다.
    MarketPreviousPublication:
      type: object
      properties:
        status:
          type: string
          enum:
          - available
          - unavailable
        kind:
          type: string
          enum:
          - simulated_previous_output
        roundId:
          type:
          - string
          - 'null'
        date:
          type:
          - string
          - 'null'
          format: date
        edition:
          type:
          - string
          - 'null'
          enum:
          - morning
          - evening
          - null
        cutoff:
          type:
          - string
          - 'null'
          format: date-time
        resultVersion:
          type:
          - string
          - 'null'
        reason:
          type:
          - string
          - 'null'
      required:
      - status
      - kind
      description: 회차 창 시작과 일치하는 실제 직전 검증 결과. available이면 회차·시각·결과 버전이 제공되고, unavailable이면 이유를 제공한다. 이전 비공개 요청이나 문서 본문은 포함하지 않는다.
    MarketCoverage:
      type: object
      properties:
        documents:
          type: integer
          minimum: 0
        newDocuments:
          type: integer
          minimum: 0
        backgroundDocuments:
          type: integer
          minimum: 0
        companyNames:
          type: array
          items:
            type: string
        marketRepresentative:
          type: boolean
        sectorPriceFeedAvailable:
          type: boolean
      required:
      - documents
      - newDocuments
      - backgroundDocuments
      - companyNames
      - marketRepresentative
      - sectorPriceFeedAvailable
      description: 회차 마감까지 원 발행시각을 확인한 적격 자료 범위. documents=newDocuments+backgroundDocuments이며 해당 기업 목록이다. 전체 시장 대표성과 별도 업종 시세
        보유를 주장하지 않는다.
    MarketOutlookClaim:
      type: object
      properties:
        claimId:
          type: string
        kind:
          type: string
          enum:
          - fact
          - interpretation
          - forecast
          - forecast_update
          - result_comparison
        text:
          type: string
        evidenceIds:
          type: array
          items:
            type: string
        indicatorIds:
          type: array
          items:
            type: string
            enum:
            - kospi
            - kosdaq
            - usdkrw
        previousPublicationIds:
          type: array
          items:
            type: string
        previousForecastIds:
          type: array
          items:
            type: string
        evaluationIds:
          type: array
          items:
            type: string
        targetId:
          type:
          - string
          - 'null'
        direction:
          type:
          - string
          - 'null'
          enum:
          - up
          - down
          - flat
          - uncertain
          - null
        conditions:
          type: array
          items:
            type: string
        counterFactors:
          type: array
          items:
            type: string
        updateAction:
          type:
          - string
          - 'null'
          enum:
          - maintain
          - strengthen
          - weaken
          - withdraw
          - null
      required:
      - claimId
      - kind
      - text
      - evidenceIds
      - indicatorIds
      - previousPublicationIds
      - previousForecastIds
      - evaluationIds
      - targetId
      - direction
      - conditions
      - counterFactors
      - updateAction
      description: 원문 사실·해석·가격 전망·이전 전망 갱신·결과 비교를 구분한 검증 문장. forecast에는 실제 평가 대상과 반대 요인이 필요하다. forecast_update는 출근 회차의 실제 이전 전망과
        새 근거를 연결한다. result_comparison은 퇴근 회차에서만 제공한다. 가격 전망 이외에는 targetId/direction이 null이고 conditions/counterFactors는 빈 배열이다.
    MarketForecast:
      type: object
      properties:
        forecastId:
          type: string
        text:
          type: string
        direction:
          type: string
          enum:
          - up
          - down
          - flat
          - uncertain
        conditions:
          type: array
          items:
            type: string
        counterFactors:
          type: array
          items:
            type: string
          minItems: 1
        evidenceIds:
          type: array
          items:
            type: string
          minItems: 1
        indicatorIds:
          type: array
          items:
            type: string
            enum:
            - kospi
            - kosdaq
            - usdkrw
        target:
          $ref: '#/components/schemas/MarketForecastTarget'
      required:
      - forecastId
      - text
      - direction
      - conditions
      - counterFactors
      - evidenceIds
      - indicatorIds
      - target
      description: 검증된 forecast 문장과 동일한 내용의 불변 전망 원장. 조건과 반대 요인을 보존한다. 방향은 단정된 수익 약속이나 매수·매도 권유가 아니다.
    MarketForecastTarget:
      type: object
      properties:
        targetId:
          type: string
        indicatorId:
          type: string
          enum:
          - kospi
          - kosdaq
        valueKind:
          type: string
          enum:
          - close
        baselineDate:
          type: string
          format: date
        baselineValue:
          type: number
        targetDate:
          type: string
          format: date
        targetEnd:
          type: string
          format: date-time
        calendarRef:
          type: string
        rule:
          type: string
          enum:
          - close_vs_baseline_v1
      required:
      - targetId
      - indicatorId
      - valueKind
      - baselineDate
      - baselineValue
      - targetDate
      - targetEnd
      - calendarRef
      - rule
      description: 확인된 거래 세션과 회차 마감 전에 사용 가능한 종가로 고정한 가격 비교 대상. 출근은 당일, 퇴근은 다음 확인된 거래일 종가를 대상으로 하며 원/달러 은행 고시 환율을 주식 종가 대상으로 바꾸지
        않는다.
    MarketForecastEvaluation:
      type: object
      properties:
        evaluationId:
          type: string
        forecastId:
          type: string
        target:
          $ref: '#/components/schemas/MarketForecastTarget'
        rule:
          type: string
          enum:
          - close_vs_baseline_v1
        status:
          type: string
          enum:
          - evaluated
          - unavailable
        reason:
          type:
          - string
          - 'null'
        actualValue:
          type:
          - number
          - 'null'
        actualDirection:
          type:
          - string
          - 'null'
          enum:
          - up
          - down
          - flat
          - null
        directionMatched:
          type:
          - boolean
          - 'null'
      required:
      - evaluationId
      - forecastId
      - target
      - rule
      - status
      - reason
      - actualValue
      - actualDirection
      - directionMatched
      description: 실제 직전 전망 원장의 평가 대상·조건을 그대로 복원한다. 조건 충족을 관측하지 못했거나 대상 기간이 끝나지 않았거나 정확한 대상 종가가 없으면 unavailable과 이유를 제공하고 actualValue/actualDirection/directionMatched는
        null이다. 평가 가능한 경우에만 고정 기준값 대비 종가 방향을 비교하며 개별 뉴스의 인과관계나 투자 성과를 뜻하지 않는다.
  parameters:
    RequestId:
      name: "X-Request-ID"
      in: "header"
      required: false
      description: "전송별 추적 ID. 생략하면 서버가 생성한다."
      schema:
        type: "string"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "같은 주체·작업의 중복 실행 방지 키. 보존 기간은 팀 확인 필요다."
      schema:
        type: "string"
        minLength: 1
    CsrfToken:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      description: "현재 인증 세션에 결합된 CSRF 토큰. Origin도 검증한다."
      schema:
        type: "string"
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      description: "이전 페이지의 불투명 nextCursor. 조회 조건에 결합한다."
      schema:
        type: "string"
    Limit:
      name: "limit"
      in: "query"
      required: false
