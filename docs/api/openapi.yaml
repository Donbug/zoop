openapi: "3.1.0"
info:
  title: "줍 정식 서버 목표 API 계약"
  version: "0.1.0"
  description: "WBS 6.1.2 API 명세 최종 검토·구현 기준 확정 및 6.11.1 API·스키마 계약 통합 점검에 연결한 목표 계약. API 공통 규칙은 사용자 잠정 채택/시연 기준이며 정식 구현 완료는 아니다. 모든 명세/WBS 요구(FS074~081 포함)는 현재 사용자 결정에 따라 팀합의 설계대상이다. 원문 상태·충돌과 운영 미결정은 별도로 보존한다."
servers:
  -
    url: "/"
    description: "정식 배포의 동일 출처 API. 환경 호스트는 배포 시 지정한다."
x-zoop-common-rules:
  versioning: "모든 정식 HTTP 경로는 /api/v1로 시작한다. 호환되지 않는 변경은 새 경로 버전으로 분리한다. operationId는 문서·추적표의 안정된 식별자다."
  authentication: "회원과 관리자 세션은 별도 HttpOnly·Secure 쿠키(zoop_session, zoop_admin_session)로 구분한다. 세션 쿠키는 서버에서 검증한다. 개인 리소스는 매번 소유권을 검증한다. 비회원은 전체 그래프·공개 기업·공개 브리핑을 읽을 수 있지만 개인화·질문·평가는 불가하다. 쿠키 인증 쓰기는 Origin 검증과 세션에 결합된 X-CSRF-Token을 요구한다. POST 로그인·가입·비회원 시작·소셜 가입 완료·명시적 소셜 연결 시작에는 허용 Origin을 적용한다. 브라우저 탐색 GET인 소셜 authorize/callback은 Origin을 인증 근거로 사용하지 않고 state·브라우저 pending 쿠키·nonce·PKCE·등록 redirect URI로 보호한다. 회원/관리자 로그아웃에서 해당 활성 세션이 있으면 같은 쿠키·Origin·세션 결합 CSRF를 반드시 검증하며 실패는 403 ACCESS_DENIED다. CSRF가 없거나 틀렸다고 무세션 분기로 우회하지 않는다. 해당 세션이 없거나 무효/만료이면 다른 세션을 변경하지 않고 204와 해당 쿠키만 제거한다. OpenAPI의 선택 인증/선택 헤더는 이 조건부 런타임 검증을 자동 강제하지 않는다."
  sessionLifecycle: "로그아웃과 차단은 서버 세션을 폐기한다. 회원·비회원 세션은 절대 만료 12시간, 유휴 만료 없음이다. 둘 다 zoop_session 쿠키(Secure·HttpOnly·SameSite=Lax·Path=/api/v1·host-only·Max-Age=43200)를 사용하며 서버 만료가 최종 권위다. 회원·비회원 CSRF는 ERD v6의 세션 결합 HMAC-SHA256 형식으로 파생하고 키 유실 시 재인증한다. 관리자 유휴/절대 만료와 SSO 제공자는 별도 확인 대상이다. 세션 응답의 expiresAt 및 csrfToken으로 실제 적용값을 전달한다."
  signupPolicy: "2026-10-14 사용자 확정: 가입 직후 새 member 세션을 발급한다. PR2에서는 이메일 소유 확인 메일을 보내지 않으며 주소를 검증된 소유로 표시하지 않는다. 이메일만으로 계정 복구·기존 소셜 계정 연결을 허용하지 않는다. 이메일 비교키는 trim 후 Locale.ROOT 소문자(최대 254 ASCII 문자, 제공자별 별칭 통합 없음), 표시명은 생략 시 '회원'·명시 시 trim 후 1~40 Unicode code point/제어 문자 제외, 새 비밀번호는 15~128 Unicode code point·제어 문자 제외·trim 없음이다. 비밀번호 해시는 Argon2id(salt16,hash32,memory19MiB,t2,p1)로 저장한다. 상세 근거는 docs/development/signup-policy-2026-10-13.md."
  socialAuthPolicy: "이슈 #30 Task 1 구현 기준은 docs/development/social-auth-policy-2026-10-15.md. 이미 연결된 (provider, subject)는 이메일 변경과 무관하게 기존 회원으로 로그인한다. 최초 소셜 가입은 검증된 이메일과 서비스 필수 약관 동의 후 완료한다. 동일 이메일 기존 회원은 이메일 일치만으로 연결하지 않으며, 기존 계정 로그인 후 세션 결합 CSRF·Origin을 검증한 명시적 연결 OAuth 왕복에서만 연결한다. 일반 authorize/callback은 브라우저 탐색 GET이므로 Origin을 인증 근거로 사용하지 않고 state·pending 쿠키·nonce·PKCE·등록 redirect URI·만료·일회성 소비로 검증한다."
  authOriginAndRateLimit: "POST 가입·로그인·소셜 가입 완료·명시적 소셜 연결 시작과 쿠키 인증 쓰기는 정확한 허용 Origin을 요구하며 null/누락/불허 Origin은 403 ACCESS_DENIED다. 탐색 GET 소셜 authorize/callback은 Origin 필수 규칙의 예외이며 별도 OAuth 왕복 검증을 적용한다. 운영 목록은 환경별 HTTPS Origin으로 설정하고 자격증명 CORS 와일드카드는 허용하지 않는다. 이메일 가입은 IP 10회/1시간·email_key 5회/1시간의 모든 시도, 이메일 로그인은 IP 100회/15분의 모든 시도와 email_key 20회/15분의 실패를 공유 원장에서 원자적으로 제한한다. 성공한 이메일 로그인은 email_key 실패 카운터를 초기화한다. 소셜 시작은 IP 및 브라우저 결합 키 기준 한도를 별도 운영 설정으로 적용한다. 초과 시 429 RATE_LIMITED와 초 단위 Retry-After를 보낸다. 신뢰 IP는 지정 프록시에서만 취한다."
  errors: "오류는 application/json의 {error:{code,message,requestId,retryable,details?}}다. HTTP 상태와 안정된 대문자 오류 코드를 함께 사용한다. 빈 자료·근거 부족은 성공 결과이고 외부 장애와 구분한다. 보유량·분모 없음·시세 미제공을 0으로 대체하지 않는다."
  requestIds: "모든 요청은 선택 X-Request-ID를 받는다. 없으면 서버가 생성하고 모든 응답의 X-Request-ID에 실제 ID를 반환한다. 서로 다른 전송은 별도 요청 ID를 사용한다. 로그와 작업 ID를 연결하되 요청 ID를 멱등성 키로 사용하지 않는다."
  idempotency: "부작용을 발생시키는 POST는 필수 Idempotency-Key를 받는다(세션 생성·소셜 인증·회원/관리자 로그아웃은 제외). 로그아웃은 같은 세션의 반복 폐기가 같은 상태에 도달하는 자연 멱등 작업이며 추가 키 저장 계약 없이 반복 204를 반환한다. 같은 주체·메서드·경로·키·본문은 기존 저장 결과 또는 같은 진행 작업을 반환한다. 내용 불일치는 409 IDEMPOTENCY_CONFLICT다. PUT/DELETE는 목표 상태·리소스 ID로 멱등 처리하며 추가 키 없이 재전송할 수 있다. 키 보존 기간은 팀 확인 필요다. 응답 미수신은 기존 작업/상태 조회가 우선이며 새로운 키로 재실행하지 않는다."
  pagination: "목록은 cursor·limit와 nextCursor를 사용한다. nextCursor=null은 마지막 페이지다. 커서는 불투명하며 정렬 키·필터·주체·고정 버전에 결합한다. 필터/버전을 바꾸면 첫 페이지부터 읽는다. 검색은 사용자가 명시적으로 실행하며 코드 정확 일치→이름 정확 일치→부분 일치 정렬을 유지한다. 고정 페이지 크기·상한·보존 기간은 실측/팀 확인 전 확정하지 않는다. 사용자가 전체를 순회할 수 있으며 임의 결과 상한으로 검색 결과를 버리지 않는다."
  timeAndAsOf: "정확한 시각은 RFC 3339 date-time으로 UTC Z 또는 명시적 오프셋을 쓴다. 오프셋 없는 시각은 거절한다. 날짜는 YYYY-MM-DD이고 날짜 경계는 Asia/Seoul이다. asOf는 자료 기준 시점이며 응답 생성 시각과 다르다. 사건의 year/month/day/unknown 정밀도는 timePrecision과 함께 제공하고 미상 날짜를 정확한 시각으로 만들지 않는다. 차트와 타임라인에는 같은 from/to를 전달하고 재무 기간은 별도다."
  chartResolution: "가격 차트의 봉 해상도는 기간별로 고정한다: 1d=5m, 1w=1h, 1m=1d, 1y=1wk(주봉). PriceSeries.interval은 공급된 해상도를 그대로 담으며 목표 해상도를 제공하지 못하면 다른 해상도의 값을 이름만 바꾸거나 집계·보간해 채우지 않고 200 unavailable(no_data)로 정상 자료 부재를 표현한다. 공급자 인증·네트워크·형식 장애는 503 SOURCE_UNAVAILABLE이다. 이 값은 목표 계약이며 공급자 출력을 만들어내지 않는다. 기계 판독용 매핑은 x-zoop-approvals.chartResolution이다."
  publicationVersions: "그래프·사건·관계·근거 조회는 선택 graphVersion 또는 asOf를 받는다. 생략하면 한 요청 시작 시 활성 공개 버전을 고정하고 응답 metadata.graphVersion/asOf에 반환한다. 둘을 함께 지정하면 일치해야 한다. asOf는 그 시점 이전 공개 버전을 선택하며 이후 공개 자료는 사용하지 않는다. round는 발행 회차가 고정한 버전을 뜻한다. 고정 버전 부재는 VERSION_UNAVAILABLE이며 최신 자료로 대체하지 않는다. 브리핑은 그래프 버전·자료·시장 지표·긍부정을 발행 시 고정한다. 정정은 원문 밖에 덧붙인다."
  partialFailures: "영역별 API는 독립 조회한다. 집계 결과의 일부 영역만 실패하면 200과 metadata.partial=true/failures를 반환하고 성공 영역을 유지한다. 자료 미제공은 unavailable, 실제 장애는 failed 또는 failures로 표현한다. 요청 전체를 처리하지 못한 경우에만 비2xx 오류다. 재시도는 실패 조회만 하며 저장/분석 재실행을 암묵적으로 수행하지 않는다."
  aiJobs: "질문은 대화 ID·작업 ID·질문·대상·기간·asOf·graphVersion을 최초 접수 시 고정한다. 202는 접수, completed는 검증 및 결과 저장 완료다. queued/running/completed/failed/cancelled와 실패 종류·retryable·저장 결과를 회수한다. 되묻기·조건 부족·근거 부족은 기술 오류와 다르다. 생성 중 대화당 추가 질문을 거절한다. 검증 실패는 재생성하지 않고, 보존된 검증 결과의 저장 실패는 저장만 복구한다. 창 닫기는 취소가 아니다. AI v2 FS045~051이 현재 상세이며 옛 FS046(권한·중복 작업 통제)에는 대응하는 단일 신규 FS가 없다. 로그인·대화 소유·근거 접근 권한은 접수·상태 조회·결과 회수마다 재검증하고, 같은 작업 ID의 내용 불일치는 409로 거절하며, 서로 다른 작업 ID가 동시에 와도 같은 대화에는 처리 중 신규 작업을 하나만 접수한다. 상태 조회·결과 회수는 신규 접수와 구분한다(FS045·FS047·FS051·FS060과 NFS001/003의 공통 서버 의무)."
  sentiment: "DocumentSentiment는 문서×기업, BriefingOutlook은 발행 회차 판정이다. label은 positive/negative/mixed/undetermined(긍정/부정/혼재/판단 보류)이며 확률·점수를 제공하지 않는다. null은 아직 판정하지 않음이고 undetermined와 다르다. 원문 인용과 이유·판정 시각·모델·프롬프트 버전을 보존한다. 브리핑의 documentSentiments/outlook은 발행 시점에 고정한다. 이슈 자체의 종합 방향이나 투자 수익률로 확장하지 않는다."
  approvalBoundary: "명세/WBS의 모든 내용은 현재 사용자 결정에 따라 팀합의요구/설계대상이며 FS074~081도 포함한다. 원문의 검토 전 표기는 갱신되지 않은 상태로 보존한다. 요구 범위 포함과 구현 완료·유료 모델 실행 승인·본개발 채택은 별개다. API 공통 규칙은 기존 잠정 채택/시연 기준이고 원본 충돌·운영 수치·정식 배포 인증 선택은 teamQuestions와 추적표에 보존한다."
  scopeExceptions: "2026-10-10 사용자 결정으로 추천 종목·산업·테마(FS011-02)는 활성 사용자 기능에서 제외하되 GET /me/recommendations 계약은 유보한다. 삭제·무동작·가짜 응답으로 바꾸지 않으며 제외는 활성 사용 허용이 아님을 뜻한다. 요구 42의 재무·실적은 폐기되지 않았고 전용 FS/WBS 없이 getCompanyFinancials로만 출처 한정 연결한다. 정본은 docs/system/links.yaml authority.implementationScope.exceptions다."
  modelConfiguration: "LLM 모델·추론 수준은 .env에서 stage별로 명시 설정한다. 문서 판정은 ZOOP_AI_DOCUMENT_SENTIMENT_MODEL/ZOOP_AI_DOCUMENT_SENTIMENT_REASONING_EFFORT, 회차 판정은 ZOOP_AI_BRIEFING_OUTLOOK_MODEL/ZOOP_AI_BRIEFING_OUTLOOK_REASONING_EFFORT를 사용한다. 요약은 ZOOP_AI_DOCUMENT_SUMMARY_*, 의미 검증은 ZOOP_AI_VERIFY_*로 분리한다. docs/design/ai-system.md의 설정 이행을 따르며 옛 ZOOP_SENTIMENT_* 런타임 alias는 없다. 설정 위치 결정과 실제 모델/공급자 선택·실행 승인은 구분하며 예산은 미정이다. 외부 PoC의 미지원 추론 전송 경계를 구분하고 공개 API에서 비밀 설정값을 반환하지 않는다."
  conflictPermission: "프로토타입은 전권 범위로 끝까지 완성하며 본개발 채택은 담당자가 선택한다. 원본 충돌은 근거 있는 작업자 안과 정정 요청을 남겨 팀이 정정한다. 확정 일정은 WBS이며 옛 Notion 일정은 비권위다. 갱신된 Notion 회의·API 결정은 사례별 증거로만 쓴다. 원문 날짜·우선순위·승인 상태를 덮어쓰지 않는다."
x-zoop-approvals:
  apiCommon: {status: "잠정채택/시연기준", authority: "사용자", teamFinalApproval: false}
  impactLabels: {status: "명칭 결정 완료", labels: ["긍정", "부정", "혼재", "판단 보류"]}
  modelConfiguration: {location: ".env", executionApproval: "별도", budget: "미정"}
  implementationScope:
    authorityRef: "docs/system/links.yaml#authority"
    decisionId: "user-2026-10-10-feedback"
    source: "docs/share/day-work-2026-10-10.md"
  chartResolution: {"1d": "5m", "1w": "1h", "1m": "1d", "1y": "1wk"}
  conflicts: {permission: "작업자 가결정→시연→팀 최종 결정", rawCorrections: "정정 요청 보존"}
x-zoop-error-codes:
  -
    code: "INVALID_REQUEST"
    httpStatus: 422
    meaning: "필수 입력·형식·범위 오류"
    recovery: "필드 오류를 수정한다"
  -
    code: "INVALID_CREDENTIALS"
    httpStatus: 401
    meaning: "로그인 인증 실패"
    recovery: "입력을 다시 확인한다"
  -
    code: "AUTH_REQUIRED"
    httpStatus: 401
    meaning: "유효 세션 없음"
    recovery: "로그인한다"
  -
    code: "MEMBER_REQUIRED"
    httpStatus: 403
    meaning: "회원 전용 기능에 비회원 접근"
    recovery: "회원 로그인 후 요청한다"
  -
    code: "ACCESS_DENIED"
    httpStatus: 403
    meaning: "소유권·관리자 권한 없음 또는 Origin/CSRF 검증 실패"
    recovery: "보호 내용 없이 거절한다"
  -
    code: "MEMBER_BLOCKED"
    httpStatus: 403
    meaning: "차단 회원"
    recovery: "차단 상태를 안내한다"
  -
    code: "EMAIL_TAKEN"
    httpStatus: 409
    meaning: "이미 등록된 이메일"
    recovery: "다른 이메일 또는 로그인 선택"
  -
    code: "TERMS_REQUIRED"
    httpStatus: 422
    meaning: "필수 약관 미동의"
    recovery: "동의 항목을 확인한다"
  -
    code: "RESOURCE_NOT_FOUND"
    httpStatus: 404
    meaning: "존재하지 않는 리소스"
    recovery: "미등록 작업과 조회 장애를 구분한다"
  -
    code: "EVIDENCE_UNAVAILABLE"
    httpStatus: 404
    meaning: "삭제·비공개 근거"
    recovery: "원문 내용을 반환하지 않는다"
  -
    code: "VERSION_UNAVAILABLE"
    httpStatus: 409
    meaning: "고정 그래프 버전을 조회할 수 없음"
    recovery: "최신 버전으로 조용히 대체하지 않는다"
  -
    code: "REVISION_CONFLICT"
    httpStatus: 409
    meaning: "낙관적 동시성 버전 충돌"
    recovery: "현재 상태 조회 후 사용자 판단으로 변경한다"
  -
    code: "IDEMPOTENCY_CONFLICT"
    httpStatus: 409
    meaning: "같은 키에 다른 요청 내용"
    recovery: "기존 작업을 조회한다"
  -
    code: "JOB_IN_PROGRESS"
    httpStatus: 409
    meaning: "동일 대화 또는 대상의 진행 중 작업"
    recovery: "기존 작업을 조회한다"
  -
    code: "JOB_NOT_RETRYABLE"
    httpStatus: 409
    meaning: "재실행이 허용되지 않는 실패"
    recovery: "새 질문 또는 운영자 확인"
  -
    code: "ALREADY_PUBLISHED"
    httpStatus: 409
    meaning: "이미 발행한 회차 변경 시도"
    recovery: "정정으로 별도 등록한다"
  -
    code: "VALIDATION_FAILED"
    httpStatus: 422
    meaning: "자동 검증 또는 필수 근거 검증 실패"
    recovery: "공개하지 않는다"
  -
    code: "SOCIAL_AUTH_CANCELLED"
    httpStatus: 400
    meaning: "소셜 인증 취소"
    recovery: "시작 화면에서 다시 선택한다"
  -
    code: "SOCIAL_AUTH_FAILED"
    httpStatus: 401
    meaning: "소셜 인증 state·코드 검증 실패"
    recovery: "기존 세션 성공으로 처리하지 않는다"
  -
    code: "SOCIAL_LINK_REQUIRED"
    httpStatus: 409
    meaning: "같은 이메일의 기존 회원이 있으나 기존 서비스 계정의 연결 권한이 확인되지 않음"
    recovery: "기존 계정으로 로그인한 후 명시적 연결 OAuth를 시작한다"
  -
    code: "SOCIAL_EMAIL_REQUIRED"
    httpStatus: 422
    meaning: "최초 가입·연결에 사용할 검증된 제공자 이메일이 없음"
    recovery: "제공자 이메일 동의를 다시 요청하거나 다른 로그인 방식을 선택한다"
  -
    code: "INVALID_CURSOR"
    httpStatus: 422
    meaning: "만료 또는 조건 불일치 커서"
    recovery: "첫 페이지부터 조회한다"
  -
    code: "RATE_LIMITED"
    httpStatus: 429
    meaning: "확정된 운영 정책의 요청 한도 초과"
    recovery: "Retry-After 이후 확인한다"
  -
    code: "SOURCE_UNAVAILABLE"
    httpStatus: 503
    meaning: "외부 자료 조회 장애"
    recovery: "해당 영역 조회만 재시도한다"
  -
    code: "MODEL_UNAVAILABLE"
    httpStatus: 503
    meaning: "분석 제공자 장애"
    recovery: "저장된 작업 상태를 먼저 확인한다"
  -
    code: "AUDIT_UNAVAILABLE"
    httpStatus: 503
    meaning: "필수 감사 기록 저장 실패"
    recovery: "대화록·검수 변경을 차단한다"
  -
    code: "MASKING_FAILED"
    httpStatus: 503
    meaning: "대화록 마스킹 실패"
    recovery: "원문을 반환하지 않는다"
  -
    code: "INTERNAL_ERROR"
    httpStatus: 500
    meaning: "분류되지 않은 기술 장애"
    recovery: "자동 재실행하지 않고 요청 ID로 확인한다"
