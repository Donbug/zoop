      properties:
        jobId:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{8,64}$"
          description: "Client-made idempotency key of this question (not a request-trace id). Resending it never asks twice."
        question:
          type: "string"
          minLength: 1
        context:
          "$ref": "#/components/schemas/ChatContextRequest"
      type: "object"
      required:
        - "jobId"
        - "question"
