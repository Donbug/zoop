          description: "이 구간의 사실 주장이 연결된 근거. 모두 result.citations의 evidenceId여야 하며 general_knowledge 구간은 빈 배열이다. zoop_documented 구간은 sourceKind=zoop_doc, evidence_grounded 구간은 sourceKind=article 또는 company_profile 인용만 가리킨다."
      type: "object"
      required:
        - "basis"
        - "text"
        - "evidenceIds"
      description: "answered 본문의 근거 수준별 구간."
