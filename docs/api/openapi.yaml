        - "publish"
    StatsMetric:
      properties:
        key:
          type: "string"
          enum: ["activeUsers", "onboarding", "nodeCtr", "edgeCtr", "briefingRate", "briefingIssueOpens", "aiQuestions", "aiQuestionRate"]
          description: "Stable metric identifier. activeUsers: distinct active principals; onboarding: completed members / members registered in the selected window; nodeCtr and edgeCtr: distinct map views with a selection / distinct map views; briefingRate: distinct briefing detail views / distinct briefing screen views; briefingIssueOpens: accepted issue-open events; aiQuestions: accepted question submissions; aiQuestionRate: distinct AI views with a submission / distinct AI views."
        group:
          type: "string"
          enum:
            - "usage"
            - "interest"
            - "ai"
        label:
          type: "string"
        kind:
          type: "string"
          enum:
            - "count"
            - "ratio"
        unit:
          type: "string"
          description: "Unit of the count, or of numerator and denominator"
        definition:
          type: "string"
          description: "How the figure is computed, shown next to it"
        availability:
          type: "string"
          enum: ["available", "unavailable"]
          description: "Whether this metric has an integrated, readable source. An available metric with value zero means the source was read and no matching activity was found."
        unavailableReason:
          anyOf:
            -
              type: "string"
              enum: ["not_integrated", "source_unavailable", "insufficient_history"]
            -
              type: "null"
          description: "Reason when availability is unavailable; null when the metric is available."
        count:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Count metric value; null when unavailable and zero only when its source was read with no matching events."
        numerator:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Ratio numerator; null when unavailable."
        denominator:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Ratio denominator; null when unavailable."
        rate:
          anyOf:
            -
              type: "number"
            -
              type: "null"
          description: "0..1; null for counts, unavailable metrics, and ratios below the sample threshold."
        sampleHidden:
          type: "boolean"
          description: "True only for an available ratio whose denominator is below minSample; unavailable sources use availability/unavailableReason."
      type: "object"
      required:
        - "key"
        - "group"
        - "label"
        - "kind"
        - "unit"
        - "definition"
        - "availability"
        - "unavailableReason"
        - "count"
        - "numerator"
        - "denominator"
        - "rate"
        - "sampleHidden"
    StatsSummary:
      properties:
