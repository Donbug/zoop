          - "NFS002"
          - "NFS004"
          - "NFS008"
          - "NFS003"
          - "NFS009"
        screenIds:
          - "A-ADM-05c"
          - "A-ADM-01"
        wbsIds:
          - "6.1.2"
          - "6.11.1"
          - "6.10.1"
          - "6.10.13"
        priority: "P1"
        authority: "공개"
        errorCodes:
          - "INVALID_REQUEST"
          - "RESOURCE_NOT_FOUND"
          - "SOURCE_UNAVAILABLE"
          - "INTERNAL_ERROR"
          - "ACCESS_DENIED"
          - "RATE_LIMITED"
