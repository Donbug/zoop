      properties:
        status:
          type: "string"
          const: "available"
        companyId:
          type: "string"
        period:
          type: "string"
          enum:
            - "1d"
            - "1w"
            - "1m"
            - "1y"
        source:
          "$ref": "#/components/schemas/QuoteSourceOut"
        currency:
          type: "string"
        interval:
          type: "string"
          enum:
            - "5m"
            - "1h"
            - "1d"
            - "1wk"
          description: "공급된 가격 봉 해상도다. 기간별로 고정이며 1d=5m, 1w=1h, 1m=1d, 1y=1wk(주봉)다. 조회 기간과 구분하고 from/to 및 자료 기준 시각을 함께 표시한다. 더 촘촘한 봉을 집계한 경우에도 집계 결과의 해상도를 담으며, 다른 해상도를 이 필드로 위장하지 않는다(x-zoop.chartResolution)."
        range:
          type: "object"
          description: "점이 다루는 실제 구간(거래소 현지 오프셋 ISO 8601). 1d는 고른 거래 세션의 시작부터 세션 종료 또는 to까지이고, 그 밖의 기간은 요청 from(생략 시 기본 시작)부터 to까지다. 차트 x축은 이 구간을 쓴다."
          properties:
            from:
              type: "string"
              format: "date-time"
            to:
              type: "string"
              format: "date-time"
            sessionDate:
              anyOf:
                -
                  type: "string"
                  format: "date"
                -
                  type: "null"
              description: "1d가 고른 거래소 현지 거래일. 다른 기간은 null."
          required:
            - "from"
            - "to"
            - "sessionDate"
        points:
          items:
            "$ref": "#/components/schemas/PricePoint"
          type: "array"
          description: "Oldest first."
      type: "object"
      required:
        - "status"
        - "companyId"
        - "period"
        - "source"
        - "currency"
        - "interval"
        - "range"
        - "points"
    PriceSeriesUnavailable:
      properties:
        status:
          type: "string"
          const: "unavailable"
        companyId:
          type: "string"
        period:
          type: "string"
          enum:
            - "1d"
            - "1w"
            - "1m"
            - "1y"
        reasonCode:
          type: "string"
          enum:
            - "not_connected"
            - "unsupported_symbol"
            - "no_data"
          description: "정상 자료 부재만 표현한다. no_data는 목표 봉 해상도(1d=5m, 1w=1h, 1m=1d, 1y=1wk)의 관측값이 공급자에 없는 경우를 포함한다. 실제 인증·네트워크·형식 장애는 503 SOURCE_UNAVAILABLE이며 unavailable 성공으로 숨기지 않는다."
        reason:
          type: "string"
      type: "object"
