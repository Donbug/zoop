  "/api/v1/companies/{id}/graph":
    get:
      operationId: "getCompanyGraphAsOf"
      summary: "기업·기준 시점 중심 관계 그래프 조회"
      description: "타임라인에서 고른 시각을 asOf로 명시하고 그 시점까지 검증·공개된 기업·이슈 관계만 조회한다(검증 시각·근거 공개 시각 ≤ asOf, 현재 공개 제외 아님). 사업 관계의 유효기간은 표시 여부를 정하지 않고 validity(예정·유효·종료·기간 미상)로 구분한다(FS042). 응답은 실제 사용한 공개 버전을 고정한다. 이후 공개된 문서나 관계를 섞지 않으며 자료 미상·미제공·조회 장애를 구분한다. depth는 실제 연결선의 hop 수다."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "asOf"
          in: "query"
          required: true
          description: "사건 선택에 따라 조회할 정확한 기준 시각. RFC 3339 오프셋이 필수다."
          schema:
            type: "string"
            format: "date-time"
        -
          name: "depth"
          in: "query"
          required: false
          description: "명세의 시점별 그래프 범위 1-hop 또는 2-hop. 운영상의 임의 페이지 상한과 구분한다."
          schema:
            type: "integer"
            enum: [1, 2]
        -
          "$ref": "#/components/parameters/GraphVersion"
        -
          "$ref": "#/components/parameters/RequestId"
      security: []
      responses:
        "200":
          description: "기준 기업과 해당 시점의 관계. 관계가 없으면 빈 결과와 사유다."
          headers:
            X-Request-ID:
              description: "실제 사용한 전송별 요청 ID"
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GraphResponse"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "500":
          "$ref": "#/components/responses/Error500"
        "503":
          "$ref": "#/components/responses/Error503"
      x-zoop:
        fsIds: [FS038, FS040, FS041, FS042, FS055]
        meaningQualifications:
          FS042: "목차·상세 FS042의 시점 기반 관계 그래프 의미다. 요구 42의 재무·실적 공급을 뜻하지 않으며 그 요구는 getCompanyFinancials에 요구 번호로만 연결한다."
        nfsIds: [NFS001, NFS002, NFS004, NFS005, NFS008]
        screenIds: [D-COM-01b, D-COM-02, M-COM-01, D-COM-04, D-COM-05, D-COM-06]
        wbsIds: ["6.1.2", "6.11.1", "6.7.2", "6.7.3", "6.7.4", "6.7.5", "6.7.8", "6.7.10", "6.7.11", "6.7.12", "6.5.1"]
        priority: "P1"
        authority: "공개"
        errorCodes: [INVALID_REQUEST, RESOURCE_NOT_FOUND, VERSION_UNAVAILABLE, SOURCE_UNAVAILABLE, INTERNAL_ERROR]
        prototype:
          method: "GET"
          path: "/api/companies/{id}/graph"
          operationId: "get_company_graph_api_companies__id__graph_get"
          differences:
            - "/api → /api/v1 경로 버전 및 공통 오류·요청 ID 적용."
            - "BFF는 현재 저장된 승인 자료를 문서 공개 시각으로 거른다. 목표는 asOf와 실제 사용한 불변 공개 버전을 함께 고정한다."
        teamQuestions:
          - "목차의 요구 번호 42는 기준일 재무·실적(요구 42)이며 FS042 시점 그래프와 의미가 다르다. 재무 폐기 선언이 없어 별도 유보하며 시점 그래프 의미의 승인 범위는 팀 최종 확인이 필요하다."
          - "날짜 정밀도만 있는 사건을 정확한 조회 asOf로 바꾸는 기준과 이력 보존 기간을 팀이 확인해야 한다."
components:
  securitySchemes:
    memberSession:
      type: "apiKey"
      in: "cookie"
      name: "zoop_session"
      description: "회원·비회원 서버 세션. 개인화/질문/평가는 회원 종류 검사 필수."
    adminSession:
      type: "apiKey"
      in: "cookie"
      name: "zoop_admin_session"
      description: "관리자 세션 및 작업별 권한 검증."
  schemas:
    CompanyStatement:
      type: object
      required: [text, evidenceIds]
      properties:
        text: {type: string}
        evidenceIds:
          type: array
          minItems: 1
          items: {type: string}
    CompanyOutlooks:
      type: object
      required: [schemaVersion, roundId, edition, cutoff, status, resultVersion, generatedAt, scopeNote, companies]
      properties:
        schemaVersion: {type: string, const: zoop-company-outlooks-v1}
        roundId: {type: string}
        edition: {type: string, enum: [morning, evening]}
        cutoff: {type: string, format: date-time}
        status: {type: string, enum: [PASS, WITHHELD]}
        resultVersion: {type: string}
        generatedAt: {type: string, format: date-time}
        scopeNote: {type: string}
        reason: {type: string}
        companies:
          type: array
          items:
            "$ref": "#/components/schemas/CompanyOutlook"
    CompanyOutlook:
      type: object
      required: [companyId, companyName, issueIds, facts, assessment, impact, outlook, conditions, risks, comparison, previous, observedMovement, sources]
      properties:
        companyId: {type: string}
        companyName: {type: string}
        issueIds:
          type: array
          items: {type: string}
        facts:
          type: array
          items: {"$ref": "#/components/schemas/CompanyStatement"}
        assessment: {type: string, enum: [positive, negative, mixed, watch]}
        impact: {"$ref": "#/components/schemas/CompanyStatement"}
        outlook: {"$ref": "#/components/schemas/CompanyStatement"}
        conditions:
          type: array
          minItems: 1
          items: {"$ref": "#/components/schemas/CompanyStatement"}
        risks:
          type: array
          minItems: 1
          items: {"$ref": "#/components/schemas/CompanyStatement"}
        comparison:
          allOf:
            - {"$ref": "#/components/schemas/CompanyStatement"}
            - type: object
              required: [status, previousResultVersion]
              properties:
                status: {type: string, enum: [updated, compared, unavailable]}
                previousResultVersion: {type: [string, 'null']}
        previous:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [available, unavailable]}
            reason: {type: string}
            roundId: {type: string}
            cutoff: {type: string, format: date-time}
            resultVersion: {type: string}
            judgment: {type: object}
        reading:
          "$ref": "#/components/schemas/CompanyShortReading"
        price:
          "$ref": "#/components/schemas/CompanyPrice"
        observedMovement:
          type: object
          required: [status, reason]
          properties:
            status: {type: string, const: unavailable}
            reason: {type: string}
        sources:
          type: array
          items:
            type: object
            required: [evidenceId, documentId, documentVersion, bodySha256, quote, title, url, publishedAt]
            properties:
              evidenceId: {type: string}
              documentId: {type: string}
              documentVersion: {type: string}
              bodySha256: {type: string}
              quote: {type: string}
              title: {type: string}
              url: {type: string, format: uri}
              publishedAt: {type: string, format: date-time}

    CompanyShortReading:
      type: object
      description: 전문을 보존하면서 별도 생성·검증한 짧은 읽기. PASS일 때만 세 문장이 존재합니다.
      required: [status, resultVersion]
      properties:
