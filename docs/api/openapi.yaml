        prototype:
          method: "POST"
          path: "/api/admin/pipeline/candidates/{candidate_id}/decision"
          operationId: "decide_api_admin_pipeline_candidates__candidate_id__decision_post"
          differences:
            - "/api → /api/v1 경로 버전, 공통 오류 코드·요청 ID·세션 보안 규칙 적용."
            - "프로토타입 BFF의 allow는 후보를 곧바로 공개 그래프 반영 경로에 올리며 expectedSourceVersion/expectedSourceRevision 대조(CAS)가 없고 응답도 decision/idempotent/onUserGraph 형태다. 목표의 HOLD 한정 최종 승인·결정성 검사 재확인·원천 CAS·publicChanged=false(승인≠공개)와 다르며 깨끗한 본개발 소비자로 보지 않는다. 프로토타입 BFF/UI 이전은 이번 계약 정렬 범위 밖이다."
        teamQuestions:
          - "대화록 열람/검수 권한, 마스킹 목록, 감사 기록 보존기간과 자동 검증 정책의 지위를 팀이 확정해야 한다."
          - "allow=HOLD 최종 승인(재검증 아님)은 2026-10-21 사용자 정책이다. 원문 FS067-02의 '재검증' 문구와 팀 합의로 확인되지 않았으므로 팀이 원문 정정 또는 확정을 해야 한다."
