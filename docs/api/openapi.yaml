      properties:
        title:
          type: "string"
        id:
          type: "string"
        summary:
          type: "string"
        enabled:
          type: "boolean"
        defaultEnabled:
          type: "boolean"
        changedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
        changedBy:
          anyOf:
            -
              type: "string"
            -
              type: "null"
