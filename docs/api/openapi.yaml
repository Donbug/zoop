      security:
        - adminSession: []
        - {}
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          name: "X-CSRF-Token"
          in: "header"
          required: false
          description: "활성 zoop_admin_session이 있으면 필수이며 해당 세션에 결합된 토큰이어야 한다. 누락/불일치는 403 ACCESS_DENIED이고 무세션 분기로 우회하지 않는다. 세션 없음·무효·만료이면 필요하지 않다. Origin도 검증한다."
