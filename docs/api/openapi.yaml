          type: "string"
          description: "UTC time the question was first received; relative dates are read against its KST day"
          format: "date-time"
        context:
          "$ref": "#/components/schemas/ChatFrozenContext"
        failure:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatFailure"
            -
              type: "null"
        result:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatResult"
            -
              type: "null"
          description: "Only a saved result; null until the job is completed"
