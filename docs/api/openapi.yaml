      required:
        - "outcome"
        - "newArticles"
        - "duplicateArticles"
        - "baselineBefore"
        - "baselineAfter"
        - "baselineAdvanced"
      description: "What one ``ingest-run`` established (FS058). ``outcome`` is None while the run is queued or running.\n``collected``: new articles were processed. ``empty``: the run finished normally and found nothing new\n(a success, not a failure). ``failed``/``cancelled``: nothing is confirmed, so no count is recorded\nand the baseline stays where it was."
