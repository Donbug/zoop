            - "notAppliedReason=admin_decision은 관리자가 거절한 후보만 뜻한다(HOLD 여부와 무관, 프로토타입은 허용·거절 모든 결정). 허용한 HOLD는 applied=true이고, AI REJECT 후보와 비활성 후보(active=false)는 rule=null이다."
        teamQuestions:
          - "대화록 열람/검수 권한, 마스킹 목록, 감사 기록 보존기간과 자동 검증 정책의 지위를 팀이 확정해야 한다."
  "/api/v1/admin/pipeline/candidates/{candidate_id}/decision":
    post:
      tags:
        - "admin-pipeline"
      summary: "후보 거부 또는 운영자 최종 승인"
      description: "관리자는 후보 상세에서 확인한 대상별 revision과 AI 원천 sourceVersion/sourceRevision을 expectedRevision/expectedSourceVersion/expectedSourceRevision으로 보낸다. relationId가 있으면 세 기대값은 해당 relation의 값이다. 서버는 대상·현재 AI 원천을 다시 확인하고 하나라도 다르면 REVISION_CONFLICT/409로 거절하며 결정·감사를 성공으로 기록하지 않는다. allow는 현재 HOLD인 대상에 대한 운영자의 최종 승인이다(2026-10-21 사용자 정책, DecisionResponse.decision=approved). 재검증·모델 호출·작업 접수가 아니며 jobId를 만들지 않는다. 대상이 HOLD가 아니거나 응답 없는 모델 호출이 남아 있는 등 현재 상태와 맞지 않으면 REVISION_CONFLICT/409다. 결정성 검사(스키마·endpoint·정확한 인용 좌표·현재 원천 권리)는 사람이 덮어쓸 수 없으며 통과하지 못하거나 원천이 철회됐으면 VALIDATION_FAILED/422다. 기존 자동 검증 판정과 claim 분포는 이력으로 그대로 남고 수동 승인이 자동 검증을 통과한 것으로 표시되지 않는다. reject는 대상을 제외한다. 이미 ALLOW인 대상의 승인과 확정된 reject의 번복은 이 계약 범위 밖이다. 승인은 공개·그래프 활성화가 아니므로 publicChanged는 항상 false이며 투영과 활성화는 별도 기록이다. 승인 근거(approvalBasis)는 내부 감사 메타데이터이며 이 응답에 넣지 않는다. 이전 계약의 allow(재검증 접수, revalidation_requested, jobId)는 이력으로만 보존하며 승인으로 소급하지 않는다."
      operationId: "decideAnalysisCandidate"
      parameters:
        -
          name: "candidate_id"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          "$ref": "#/components/parameters/RequestId"
        -
          "$ref": "#/components/parameters/CsrfToken"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: "정상 응답"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DecisionResponse"
          headers:
            X-Request-ID:
              description: "실제 사용한 전송별 요청 ID"
              schema:
                type: "string"
        "401":
          "$ref": "#/components/responses/Error401"
        "403":
          "$ref": "#/components/responses/Error403"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "422":
          "$ref": "#/components/responses/Error422"
        "429":
          "$ref": "#/components/responses/Error429"
        "500":
          "$ref": "#/components/responses/Error500"
        "503":
          "$ref": "#/components/responses/Error503"
      security:
        -
          adminSession: []
      x-zoop:
        fsIds:
          - "FS059"
          - "FS067-02"
        meaningQualifications:
          FS067-02: "원문(2026-10-18 고정본)의 '허용은 재검증 대상 전환'은 보존한다. 2026-10-21 사용자 정책은 허용을 HOLD에 대한 운영자 최종 승인으로 해석하며 재검증 작업을 만들지 않는다. 팀 확정이 아니다."
        nfsIds:
          - "NFS001"
