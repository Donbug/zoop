          description: "생성 시각 기준 직전 7일의 반개구간 [generatedAt-7d, generatedAt)."
        requests:
          type: "integer"
          description: "기간 안에 접수된 사용자 요청 수. AI 공급자 실행 시도 횟수와 구분한다."
