    ChatFailure:
      properties:
        kind:
          type: "string"
          enum:
            - "validation_failed"
            - "save_failed"
            - "result_lost"
            - "transient"
            - "budget_exceeded"
            - "permission_denied"
            - "internal"
          description: "transient: 같은 고정 문맥으로 다시 실행하면 달라질 수 있는 시간 초과·공급자 오류. 재실행 가능 여부는 retry로 판단하며, 모델 응답 불명(response_unknown)은 중복 호출·과금을 막기 위해 retry=null이다. budget_exceeded: 같은 입력이면 반드시 다시 넘는 크기 한도(rerun 불가, 범위를 좁힌 새 질문 안내)."
        reason:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          description: "기계 판독용 원인 코드. transient: deadline_guard(시작 전 잔여 기한 부족), provider_error(송신 전 연결 실패·처리 거부가 명시된 오류·형식 불일치 응답), tool_timeout(읽기 전용 도구 조회 상한 초과), response_unknown(모델 송신 후 응답 불명, retry=null). budget_exceeded: context_too_large, output_limit. UI 문구와 관리자 집계의 기준이다."
        message:
          type: "string"
        retry:
          anyOf:
            -
              type: "string"
              enum:
                - "rerun"
                - "save_only"
            -
              type: "null"
          description: "What 'retry' would do: rerun the same job with its frozen context, or only save the kept verified result. null = not allowed. rerun은 작업당 실행 3회(runs ≤ 3)까지이며 이후에는 null이다. reason=response_unknown이면 처음부터 null이다."
      type: "object"
      required:
        - "kind"
        - "reason"
        - "message"
        - "retry"
    ChatFrozenContext:
      properties:
        items:
          items:
            "$ref": "#/components/schemas/ChatContextItem"
          type: "array"
        evidenceCount:
          type: "integer"
          minimum: 0
          maximum: 20
        period:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatPeriod"
            -
              type: "null"
        asOf:
          type:
            - "string"
            - "null"
          format: "date-time"
        graphVersion:
          type:
            - "string"
            - "null"
      type: "object"
      required:
        - "items"
        - "evidenceCount"
        - "period"
        - "asOf"
        - "graphVersion"
      description: "The selection frozen when the question was first received."
    ChatJob:
      properties:
        id:
          type: "string"
        sessionId:
          type: "string"
        seq:
          type: "integer"
        question:
          type: "string"
        status:
          type: "string"
          enum:
            - "queued"
            - "running"
            - "completed"
            - "failed"
            - "cancelled"
        phase:
          anyOf:
            -
              type: "string"
              enum:
                - "planning"
                - "retrieving"
                - "writing"
                - "verifying"
            -
              type: "null"
          description: "running 중 현재 단계(질문 이해·자료 확인·답변 작성·검증). queued와 종료 상태에서는 null이다. 진행 표시용이며 검증 전 본문을 노출하지 않는다. 자료 조회가 없는 경로는 retrieving을 건너뛴다."
        outcome:
          anyOf:
            -
              type: "string"
              enum:
                - "answered"
                - "clarification"
                - "guidance"
                - "insufficient_evidence"
            -
              type: "null"
        askedAt:
          type: "string"
          description: "UTC time the question was first received; relative dates are read against its KST day"
          format: "date-time"
        context:
          "$ref": "#/components/schemas/ChatFrozenContext"
        resolves:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatClarificationReply"
            -
              type: "null"
          description: "이 작업이 답한 확인 질문. 최초 접수 때 고정되며 확인 질문 답이 아니면 null이다."
        failure:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatFailure"
            -
              type: "null"
        result:
          anyOf:
            -
              "$ref": "#/components/schemas/ChatResult"
            -
              type: "null"
          description: "Only a saved result; null until the job is completed"
        runs:
          type: "integer"
          description: "Executions started so far (a rerun starts another). 모델을 호출한 실행만 세며 최대 3이다. save_only는 세지 않는다."
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        finishedAt:
          anyOf:
            -
              type: "string"
              format: "date-time"
            -
              type: "null"
      type: "object"
      required:
        - "id"
        - "sessionId"
        - "seq"
        - "question"
        - "status"
        - "phase"
        - "outcome"
        - "askedAt"
        - "context"
        - "resolves"
        - "failure"
        - "result"
        - "runs"
        - "createdAt"
        - "updatedAt"
        - "finishedAt"
    ChatJobRequest:
      properties:
        jobId:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{8,64}$"
          description: "Client-made idempotency key of this question (not a request-trace id). Resending it never asks twice."
        question:
          type: "string"
          minLength: 1
          maxLength: 4000
          description: "질문 원문. resolves가 있으면 회원에게 보일 답(선택지 label 또는 자유 입력)이다."
        context:
          "$ref": "#/components/schemas/ChatContextRequest"
        resolves:
          "$ref": "#/components/schemas/ChatClarificationReply"
      type: "object"
      description: "새 질문 또는 확인 질문에 대한 답. resolves가 있으면 context를 보내지 않으며 서버가 원 작업의 고정 문맥을 이어받는다."
      required:
