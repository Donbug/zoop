    CandidateRule:
      properties:
        ruleId:
          type: "string"
          description: "The publication rule whose condition covers this candidate (``<ruleId>@<version>``)."
        applied:
          type: "boolean"
          description: "True when the rule is enabled and its condition matches, whatever the candidate's publication state: its\n``hiddenRelations`` are kept off the public graph once it is published (AI pass, or an administrator allow followed by a\nnew import). For a HOLD nobody has decided yet it tells the administrator that allowing it will not make those\nrelations public. It never means the rule published anything: a rule never publishes a HOLD and never turns a HOLD\ninto an approval (AI owner 2026-10-22, 5-A)."
        notAppliedReason:
          anyOf:
            -
              type: "string"
              enum:
                - "admin_decision"
                - "rule_disabled"
            -
              type: "null"
          description: "Why the rule hides nothing here: rule_disabled (switched off), admin_decision (an administrator rejected\nthe candidate, HOLD or not, so it is never published; an allowed HOLD is applied). Null when applied."
        hiddenRelations:
          items:
            type: "string"
          type: "array"
          description: "Relation ids of the candidate the rule keeps off the public graph once it is published. Empty when not\napplied."
      type: "object"
      required:
        - "ruleId"
        - "applied"
        - "notAppliedReason"
        - "hiddenRelations"
      description: "How an application publication rule affects a candidate. Hide-only: see ``ReviewRuleOut``. The candidate's\n``rule`` is null when no rule's condition covers it and when it can never be published (an AI REJECT, or an inactive\ncandidate replaced by a newer job), since a rule has nothing to hide there."
