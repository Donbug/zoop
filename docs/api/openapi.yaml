        - "observedAt"
        - "baseline"
        - "change"
        - "changeRate"
        - "source"
        - "reasonCode"
        - "reason"
      description: "One indicator as it stood when the round was generated. ``status`` separates what each card may claim:\n``ok`` and ``delayed`` carry a value (``delayed`` = the newest value the source had is older than the round expects),\n``unavailable`` = the source answered but has no value for this point in time (or is not connected),\n``failed`` = the request itself failed (network, rate limit, unknown format)."
