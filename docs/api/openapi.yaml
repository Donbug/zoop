paths:
  "/api/v1/auth/session":
    get:
      tags:
        - "auth"
      summary: "회원·비회원 세션과 초기 설정 조회"
      description: "유효한 회원 세션은 해당 회원의 현재 저장된 초기 설정 상태와 함께 member로 반환한다. 유효한 비회원 세션은 guest로 반환하며 user=null, setup.completed=false, setup.tutorialCompleted=false이고 튜토리얼 진행·완료·건너뛰기 상태를 서버에 저장하지 않는다. 세션 없음·만료·폐기 시 새 세션을 만들지 않고 user=null, setup=null인 anonymous와 null csrfToken/expiresAt을 반환하며 무효 zoop_session 쿠키를 제거한다."
      operationId: "getMemberSession"
      responses:
        "200":
          description: "정상 응답"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/SessionResponse"
          headers:
            X-Request-ID:
              description: "실제 사용한 전송별 요청 ID"
              schema:
                type: "string"
