            "$ref": "#/components/schemas/SocialProvider"
          description: "개별 페이지의 회원 인증 제공자 목록이다. 전체 커서 순회 결과는 google/kakao 각각 한 번이며 페이지마다 두 항목 모두를 강제하지 않는다."
