          anyOf:
            -
              type: "string"
            -
              type: "null"
        eligible:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Information only, not a publication count: HOLD review targets in the source jobs the active version references that the rule currently covers (counted from review_targets and AI source revisions, ignoring the switch and admin decisions). The current pending count, not the statistics frozen with a version. Null while that source projection does not exist yet."
        publishedCandidates:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Candidates in the rule's scope that are still public after the rule is applied in the active graph version (not candidates the rule published: a rule never publishes). Counted when that version is built and frozen with it (the statistics at freeze time, AI owner 5-A), so a switch changes it only from the next version. Null while the active version has no frozen count."
        publishedEvents:
          anyOf:
            -
              type: "integer"
            -
              type: "null"
          description: "Events in the rule's scope that are still public after the rule is applied in the active graph version (not events the rule published). Frozen with that version like ``publishedCandidates``. Null while the active version has no frozen count."
        history:
          items:
            "$ref": "#/components/schemas/RuleChangeOut"
          type: "array"
      type: "object"
      required:
        - "title"
        - "id"
        - "summary"
        - "enabled"
        - "defaultEnabled"
        - "changedAt"
        - "changedBy"
        - "reason"
        - "eligible"
        - "publishedCandidates"
        - "publishedEvents"
        - "history"
      description: "An application publication rule; the id carries its version (``<ruleId>@<version>``). A rule can only keep\nalready eligible content off the public graph. It never publishes a HOLD, never turns a HOLD into an approval and never\nchanges an AI judgement input: content is published only by an AI pass inside a handoff or by an administrator allow\nfollowed by a new handoff, import and activation. ``changedAt``/``changedBy``/``reason`` are the latest change, null\nonly while the rule has never been changed (a rule switched back to its default keeps its latest change).\n``history`` is every change, newest first."
