          "type": "boolean"
          "title": "Sent"
          "description": "A request left the runtime for this invocation."
        "unknown":
          "type": "boolean"
          "title": "Unknown"
          "description": "Sent, and its outcome is unknown (timeout or disconnect): it is never sent again."
