            - "type": "null"
          "title": "Recordedat"
      "additionalProperties": false
      "type": "object"
      "required":
        - "state"
        - "resultingSourceRevision"
        - "recordedAt"
      "title": "RelationReviewPhase"
      "description": |-
        Acceptance: whether the decision is recorded in the AI relation ledger. `unconfirmed` means the request was reserved but the service has no
        proof yet that the event was appended; retry the same request (same key and body) to reconcile it.
    "RelationSubmit":
      "additionalProperties": false
      "description": "The S3 `Submit` contract (`zoop-relation-s3`). Fixtures, registries and paths cannot be named. `executionMode: live` is accepted only for an upstream the operator listed as live-approved."
      "properties":
        "schemaVersion":
          "const": "zoop-relation-s3"
          "title": "Schemaversion"
          "type": "string"
        "jobId":
          "description": "Equals the Idempotency-Key."
          "pattern": "^[A-Za-z0-9_.-]{1,120}$"
          "title": "Jobid"
          "type": "string"
        "provenance":
          "$ref": "#/components/schemas/RelationProvenance"
        "upstream":
          "$ref": "#/components/schemas/RelationUpstream"
      "required":
        - "schemaVersion"
        - "jobId"
        - "provenance"
        - "upstream"
      "title": "RelationSubmit"
      "type": "object"
    "RelationUpstream":
      "properties":
        "jobId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Jobid"
          "description": "An operator-prepared S2 extraction job. It must be listed for the calling principal in the server-owned allowlist."
        "inputDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Inputdigest"
      "additionalProperties": false
      "type": "object"
      "required":
        - "jobId"
        - "inputDigest"
      "title": "RelationUpstream"
    "RelationUsage":
      "properties":
        "replayCalls":
          "type": "integer"
          "title": "Replaycalls"
        "startedWithoutReceipt":
          "type": "integer"
          "title": "Startedwithoutreceipt"
        "providerCalls":
          "type": "integer"
          "title": "Providercalls"
        "modelCalls":
          "type": "integer"
          "title": "Modelcalls"
      "additionalProperties": false
      "type": "object"
      "required":
        - "replayCalls"
        - "startedWithoutReceipt"
        - "providerCalls"
        - "modelCalls"
      "title": "RelationUsage"
    "ResultEnvelope":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-1"
        "status":
          "$ref": "#/components/schemas/JobStatus"
        "delivery":
          "$ref": "#/components/schemas/Delivery"
        "job":
          "description": "The runtime `get` payload for the importer, present only when delivery.state is available."
          "oneOf":
            - "$ref": "ai-contract.schema.json#/$defs/JobResult"
            - "type": "null"
        "receipts":
          "items":
            "$ref": "#/components/schemas/CallReceipt"
          "type": "array"
          "title": "Receipts"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
        - "delivery"
        - "job"
        - "receipts"
      "title": "ResultEnvelope"
    "RoutedRequirement":
      "properties":
        "requirementId":
          "type": "string"
          "title": "Requirementid"
        "types":
          "additionalProperties":
            "type": "number"
          "propertyNames":
            "enum":
              - "Q01"
              - "Q02"
              - "Q03"
              - "Q04"
              - "Q05"
              - "Q06"
              - "Q07"
              - "Q08"
          "type": "object"
          "title": "Types"
        "capabilities":
          "additionalProperties":
            "type": "number"
          "type": "object"
          "title": "Capabilities"
        "prohibitedAdvice":
          "type": "number"
          "title": "Prohibitedadvice"
        "dependsOn":
          "anyOf":
            - "$ref": "#/components/schemas/RouterDependency"
            - "type": "null"
      "additionalProperties": false
      "type": "object"
      "required":
        - "requirementId"
        - "types"
        - "capabilities"
        - "prohibitedAdvice"
        - "dependsOn"
      "title": "RoutedRequirement"
      "description": "Closed like every stage answer: a key the worker contract does not define is refused, never relayed."
    "RouterAnswer":
      "properties":
        "requirements":
          "items":
            "$ref": "#/components/schemas/RoutedRequirement"
          "type": "array"
          "title": "Requirements"
      "additionalProperties": false
      "type": "object"
      "required":
        - "requirements"
      "title": "RouterAnswer"
    "RouterDependency":
      "properties":
        "requirementId":
          "type": "string"
          "title": "Requirementid"
        "cardinality":
          "type": "string"
          "enum":
            - "exactly"
            - "atLeast"
            - "atMost"
          "title": "Cardinality"
        "count":
          "type": "integer"
          "maximum": 5.0
          "minimum": 1.0
          "title": "Count"
      "additionalProperties": false
      "type": "object"
      "required":
        - "requirementId"
        - "cardinality"
        - "count"
      "title": "RouterDependency"
    "SectionVerdict":
      "properties":
        "support":
          "anyOf":
            - "type": "string"
              "enum":
                - "supported"
                - "contradicted"
                - "hold"
            - "type": "null"
          "title": "Support"
        "prohibitedAdvice":
          "type": "string"
          "enum":
            - "no"
            - "yes"
            - "hold"
          "title": "Prohibitedadvice"
      "additionalProperties": false
      "type": "object"
      "required":
        - "support"
        - "prohibitedAdvice"
      "title": "SectionVerdict"
    "SourceChange":
      "properties":
        "kind":
          "type": "string"
          "const": "source"
          "title": "Kind"
        "sourceId":
          "type": "string"
          "maxLength": 200
          "minLength": 1
          "title": "Sourceid"
      "additionalProperties": false
      "type": "object"
      "required":
        - "kind"
        - "sourceId"
      "title": "SourceChange"
    "Usage":
      "properties":
        "providerAttempts":
          "type": "integer"
          "title": "Providerattempts"
        "replayCalls":
          "type": "integer"
          "title": "Replaycalls"
        "inputTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Inputtokens"
        "outputTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Outputtokens"
        "cachedTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Cachedtokens"
        "reasoningTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Reasoningtokens"
        "cost":
          "anyOf":
            - "type": "number"
            - "type": "null"
          "title": "Cost"
      "additionalProperties": false
      "type": "object"
      "required":
        - "providerAttempts"
        - "replayCalls"
        - "inputTokens"
        - "outputTokens"
        - "cachedTokens"
        - "reasoningTokens"
        - "cost"
      "title": "Usage"
    "VerificationAnswer":
      "properties":
        "sections":
          "items":
            "$ref": "#/components/schemas/SectionVerdict"
          "type": "array"
          "title": "Sections"
      "additionalProperties": false
      "type": "object"
      "required":
        - "sections"
      "title": "VerificationAnswer"
    "RelationReview":
      "additionalProperties": false
      "description": |-
        One review decision on one relation candidate. The path names the job and the Idempotency-Key is the stable operation id. The reviewer
        is the authenticated principal and cannot be sent; nothing here is the application's own review revision.
      "properties":
        "relationCandidateId":
          "pattern": "^rc-[a-f0-9]{64}$"
          "title": "Relationcandidateid"
          "type": "string"
        "expectedSourceVersion":
          "description": "The job's `sourceVersion`: its `inputDigest`, as read from the result or status."
          "pattern": "^[a-f0-9]{64}$"
          "title": "Expectedsourceversion"
          "type": "string"
        "expectedSourceRevision":
          "description": "The relation's `sourceRevision` as read from the result: the runtime's event-chain revision as a decimal string. Never the application's own revision."
          "pattern": "^[1-9][0-9]{0,8}$"
          "title": "Expectedsourcerevision"
          "type": "string"
        "decision":
          "enum":
            - "allow"
            - "reject"
          "title": "Decision"
          "type": "string"
      "required":
        - "relationCandidateId"
        - "expectedSourceVersion"
        - "expectedSourceRevision"
        - "decision"
      "title": "RelationReview"
      "type": "object"
    "ExposureQuery":
      "additionalProperties": false
      "properties":
        "schemaVersion":
          "const": "zoop-handoff-exposure-1"
          "title": "Schemaversion"
          "type": "string"
        "handoffIds":
          "items":
            "pattern": "^[A-Za-z0-9._:-]{1,200}$"
            "type": "string"
          "maxItems": 20
          "minItems": 1
          "title": "Handoffids"
          "type": "array"
        "changed":
          "discriminator":
            "mapping":
              "document": "#/components/schemas/DocumentChange"
              "grant": "#/components/schemas/GrantChange"
              "s3-relation": "#/components/schemas/RelationChange"
              "source": "#/components/schemas/SourceChange"
            "propertyName": "kind"
          "oneOf":
            - "$ref": "#/components/schemas/DocumentChange"
            - "$ref": "#/components/schemas/SourceChange"
            - "$ref": "#/components/schemas/GrantChange"
            - "$ref": "#/components/schemas/RelationChange"
          "title": "Changed"
      "required":
        - "schemaVersion"
        - "handoffIds"
        - "changed"
      "title": "ExposureQuery"
      "type": "object"
    "ChatStageRequest":
      "additionalProperties": false
      "properties":
        "schemaVersion":
          "const": "zoop-ai-chat-4"
          "title": "Schemaversion"
          "type": "string"
        "invocationId":
          "description": "Identifies one stage of one attempt; must equal Idempotency-Key. The same id and input never send twice."
          "pattern": "^[A-Za-z0-9_.:-]{8,96}$"
          "title": "Invocationid"
          "type": "string"
        "stage":
          "enum":
            - "chat-router"
            - "chat-answer"
            - "chat-verification"
            - "chat-agent"
          "title": "Stage"
          "type": "string"
        "mode":
          "enum":
            - "replay"
            - "live"
          "title": "Mode"
          "type": "string"
        "input":
          "additionalProperties": true
          "description": "The closed zoop-ai-chat-4 stage input (RouterInput, AnswerInput, VerificationInput or AgentInput)."
          "title": "Input"
          "type": "object"
      "required":
        - "schemaVersion"
        - "invocationId"
        - "stage"
        - "mode"
        - "input"
      "title": "ChatStageRequest"
      "type": "object"
    "PlanReference":
      "additionalProperties": false
      "properties":
        "schemaVersion":
          "const": "zoop-ai-plan-admission-1"
          "title": "Schemaversion"
          "type": "string"
        "planId":
          "pattern": "^s2plan-[0-9a-f]{64}$"
          "title": "Planid"
          "type": "string"
        "planDigest":
          "pattern": "^[a-f0-9]{64}$"
          "title": "Plandigest"
          "type": "string"
      "required":
        - "schemaVersion"
        - "planId"
        - "planDigest"
      "title": "PlanReference"
      "type": "object"
    "ObservationExportRequest":
      "additionalProperties": false
      "properties":
        "schemaVersion":
          "const": "zoop-ingestion-s2-1"
          "title": "Schemaversion"
          "type": "string"
        "roundId":
          "maxLength": 200
          "minLength": 1
          "title": "Roundid"
          "type": "string"
        "sourceId":
          "maxLength": 200
          "minLength": 1
          "title": "Sourceid"
          "type": "string"
        "page":
          "minimum": 0
          "title": "Page"
          "type": "integer"
        "ordinal":
          "minimum": 0
          "title": "Ordinal"
          "type": "integer"
        "documentId":
          "minLength": 1
          "title": "Documentid"
          "type": "string"
        "rawVersion":
          "minLength": 1
          "title": "Rawversion"
          "type": "string"
        "documentVersion":
          "minLength": 1
          "title": "Documentversion"
          "type": "string"
      "required":
        - "schemaVersion"
        - "roundId"
        - "sourceId"
        - "page"
        - "ordinal"
        - "documentId"
        - "rawVersion"
        - "documentVersion"
      "title": "ObservationExportRequest"
      "type": "object"
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "description": "Operator-issued token; the service holds only its SHA-256 digest. Roles are the route scopes."
"servers":
  - "url": "http://127.0.0.1:8797"
    "description": "Default loopback development address; deployment endpoint is operator-owned HTTPS ingress."
"tags":
  - "name": "analysis-jobs"
    "description": "S1 analysis jobs over the installed zoop-ai runtime."
  - "name": "relation-jobs"
    "description": "S3 relation/impact candidate jobs over an operator-prepared S2 upstream, through the installed zoop-ai-relation pipeline (replay, or live for an operator-pinned upstream)."
  - "name": "extraction-jobs"
    "description": "S2 event/topic candidate jobs over an operator-approved request, through the installed zoop-ai-extract pipeline (replay, or live for an operator-pinned approval)."
  - "name": "graph-versions"
    "description": "Read-only, nonpublic S3 graph version status and company focus over operator-listed versions, through the installed zoop-ai-graph pipeline (no write, no model)."
  - "name": "graph-handoffs"
    "description": "Read-only, nonpublic AI handoff status and whole-bundle delivery over operator-pinned handoffs, through the installed zoop-ai-handoff export command (no write, no model, no network)."
  - "name": "chat-stages"
    "description": "One chatbot model stage (router, answer or verification) per request, synchronously, through the installed zoop-ai-chat runtime (replay, or live behind the chat gate)."
  - "name": "plan-admissions"
    "description": "Bounded exact plan admission and immutable reference reads; no dispatch."
  - "name": "observations"
    "description": "Synchronous native observation export under current read/store/quote-display rights."
  - "name": "plan-admission-policy"
    "description": "Separate operator-only policy CAS control; never application authority."
