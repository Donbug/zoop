  "/internal/v1/graph-handoffs/exposure":
    "post":
      "tags":
        - "graph-handoffs"
      "summary": "Identity-only exposure of an explicit complete handoff selection"
      "operationId": "queryGraphHandoffExposure"
      "parameters":
        - "name": "X-Request-ID"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[A-Za-z0-9._-]{1,128}$"
          "description": "Optional correlation id, echoed on every response and never used as an idempotency key."
      "responses":
        "200":
          "description": "Complete unchanged identity-only report in the handoff envelope; not current delivery authority or import readiness."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdExposure"
        "401":
          "description": "authentication_required: missing, malformed or unknown bearer token."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
          "headers":
            "WWW-Authenticate":
              "description": "Bearer"
              "schema":
                "type": "string"
        "403":
          "description": "scope_denied: requires handoff.exposure, independent of handoff.read; handoff_not_allowed: any selected entry absent or changed."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
        "409":
          "description": "execution_unavailable, handoff_selection_unmappable or handoff_pin_mismatch; no partial report."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
        "422":
          "description": "invalid_request, changed_identity_unknown, changed_relation_unused or exposure_report_limit."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
        "500":
          "description": "runtime_contract_mismatch, runtime_binding_mismatch or internal_error (not retryable)."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
        "503":
          "description": "runtime_unavailable, runtime_busy, service_configuration_invalid or service_busy (retryable); never an empty bundle."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
          "headers":
            "Retry-After":
              "description": "Seconds before retrying with the same key and body."
              "schema":
                "type": "integer"
        "413":
          "description": "request_too_large: declared or streamed body exceeds 65,536 bytes."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
        "415":
          "description": "unsupported_media_type: requires application/json with UTF-8."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/HdErrorEnvelope"
      "security":
        - "bearerAuth":
            - "handoff.exposure"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ExposureQuery"
      "description": "Requires handoff.exposure, independent of handoff.read. One explicit selection of 1–20 unique handoff IDs; request at most 65,536 UTF-8 bytes. No query parameters, idempotency requirement, job, cache, retry or partial result. Invokes zoop-ai-handoff-exposure directly, never ordinary export. Source rights are not evaluated: frozen identity reads remain possible after source revocation, but every allowlist entry must remain unchanged. A complete allowlist snapshot is checked before the child, after any gate wait, after the child before errors are interpreted, and before response. These are separate observations, not atomic revocation. Closed canonical report limit: 6 MiB including newline; model/provider calls are zero. The CLI validates frozen artifacts; the service compares reported manifest/bundle pins to the allowlist, not hashes of bundle bytes it did not receive. The app must reconcile handoffId, manifestDigest, bundleDigest and contentDigest with its receipt. This endpoint changes no exclusion, revision or activation state; errors and empty/smaller reports never clear exclusions."
