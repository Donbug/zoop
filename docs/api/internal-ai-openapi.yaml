    "ExtractionSubmit":
      "additionalProperties": false
      "description": |-
        The S2 submit reference. It names a request the operator preapproved for this principal; it carries no snapshot, catalogue, observation,
        path, fixture or live mode, and the pipeline's `Submit` body is never accepted from a caller.
      "properties":
        "schemaVersion":
          "const": "zoop-extraction-s2-2"
          "title": "Schemaversion"
          "type": "string"
        "jobId":
          "description": "Equals the Idempotency-Key. The server-owned approval is looked up by this principal and job id."
          "pattern": "^[A-Za-z0-9_.-]{1,120}$"
          "title": "Jobid"
          "type": "string"
        "approvedRequestDigest":
          "description": "SHA-256 of the canonical JSON of the operator-approved S2 request. It must be the digest the operator listed for this principal and job id."
          "pattern": "^[a-f0-9]{64}$"
          "title": "Approvedrequestdigest"
          "type": "string"
      "required":
        - "schemaVersion"
        - "jobId"
        - "approvedRequestDigest"
      "title": "ExtractionSubmit"
      "type": "object"
