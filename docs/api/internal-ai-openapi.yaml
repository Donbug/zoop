          "title": "Estimatedusd"
        "chargedUsd":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Chargedusd"
      "additionalProperties": false
      "type": "object"
      "required":
        - "replayCalls"
        - "startedWithoutReceipt"
        - "providerCalls"
        - "paidModelCalls"
        - "receivedCalls"
        - "unsentCalls"
        - "inputTokens"
        - "outputTokens"
        - "reasoningTokens"
        - "estimatedUsd"
        - "chargedUsd"
      "title": "ExtractionUsage"
      "description": |-
        Accounting. `providerCalls` counts calls transmitted or possibly transmitted (a started call without receipt included), `receivedCalls` the
        ones a reply was stored for, `unsentCalls` the ones definitively NOT sent. A replay job reports 0/null for the live-only fields.
    "Failure":
      "properties":
        "code":
          "type": "string"
          "title": "Code"
        "stage":
          "anyOf":
            - "type": "string"
              "enum":
