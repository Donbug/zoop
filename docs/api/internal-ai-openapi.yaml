      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ObservationExportRequest"
      "description": "Requires observation.read. One complete seven-field native selector plus schemaVersion zoop-ingestion-s2-1. Every request runs installed zoop-ai-ingest export --require-store with credential-filtered environment and server-owned paths. Current read/store/quote-display rights, frozen source configuration, selector, text and locator hashes are checked. Single-context mode reads its configured registry; multicontext mode resolves only an exact selector in the pinned handoff inventory, checked before and after export. Unknown routes are 404; changed or invalid inventory fails closed. Scope covers the configured inventory, not per-observation ownership. No query parameters or caller-supplied paths. One synchronous 200 includes document.text and preserves native optional fields. Child deadline 45 seconds, at most two exports, input limit 2,000,000 bytes and response limit 16 MiB. Repeated requests recheck rights; delivered text cannot be recalled atomically."
