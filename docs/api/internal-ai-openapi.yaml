            "pattern": "^ev-[a-f0-9]{64}$"
          "type": "array"
          "maxItems": 20
          "title": "Evidenceids"
        "verification":
          "type": "string"
          "const": "operator-field-verdict"
          "title": "Verification"
        "reviewer":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Reviewer"
        "decisionRef":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Decisionref"
        "decisionVersion":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Decisionversion"
      "additionalProperties": false
      "type": "object"
      "required":
        - "documentId"
