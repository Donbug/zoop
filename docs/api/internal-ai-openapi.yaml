      "type": "object"
      "required":
        - "jobId"
        - "inputDigest"
        - "provenance"
        - "upstream"
        - "state"
        - "phase"
        - "resumeMode"
        - "failure"
        - "usage"
        - "delivery"
        - "dispatch"
        - "next"
        - "acceptedAt"
        - "observedAt"
      "title": "RelationJobStatus"
    "RelationOperationStatus":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-relation-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-relation-1"
        "operationId":
          "type": "string"
          "title": "Operationid"
        "jobId":
          "type": "string"
          "title": "Jobid"
        "relationCandidateId":
          "type": "string"
          "title": "Relationcandidateid"
        "decision":
          "type": "string"
          "enum":
            - "allow"
            - "reject"
          "title": "Decision"
        "reviewer":
          "type": "string"
          "title": "Reviewer"
        "expectedSourceVersion":
          "type": "string"
          "title": "Expectedsourceversion"
        "expectedSourceRevision":
          "type": "string"
          "title": "Expectedsourcerevision"
        "review":
          "$ref": "#/components/schemas/RelationReviewPhase"
        "revalidation":
          "$ref": "#/components/schemas/RelationRevalidationPhase"
        "publication":
          "$ref": "#/components/schemas/RelationPublicationPhase"
        "next":
          "type": "string"
          "enum":
            - "wait"
            - "recover"
            - "retry_review"
            - "operator_reconcile"
            - "none"
          "title": "Next"
        "acceptedAt":
          "type": "string"
          "title": "Acceptedat"
        "observedAt":
          "type": "string"
          "title": "Observedat"
      "additionalProperties": false
      "type": "object"
      "required":
        - "operationId"
        - "jobId"
        - "relationCandidateId"
        - "decision"
        - "reviewer"
        - "expectedSourceVersion"
        - "expectedSourceRevision"
        - "review"
        - "revalidation"
        - "publication"
        - "next"
        - "acceptedAt"
        - "observedAt"
      "title": "RelationOperationStatus"
      "description": "One review operation, identified exactly by the caller's Idempotency-Key. Content-free; read from the service ledger."
    "RelationProvenance":
      "properties":
        "sourceKind":
          "type": "string"
          "enum":
            - "synthetic"
            - "actual"
          "title": "Sourcekind"
        "executionMode":
          "type": "string"
          "const": "replay"
          "title": "Executionmode"
        "recordingKind":
          "type": "string"
          "const": "authored-test"
          "title": "Recordingkind"
      "additionalProperties": false
      "type": "object"
      "required":
        - "sourceKind"
        - "executionMode"
        - "recordingKind"
      "title": "RelationProvenance"
    "RelationPublicationPhase":
      "properties":
        "state":
          "type": "string"
          "const": "not_published"
          "title": "State"
          "default": "not_published"
      "additionalProperties": false
      "type": "object"
      "title": "RelationPublicationPhase"
      "description": "Publication is never done by this service: the relation stays unpublished whatever the verdict says."
    "RelationReceipt":
      "properties":
        "stage":
          "type": "string"
          "title": "Stage"
        "state":
          "type": "string"
          "title": "State"
        "verdict":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Verdict"
      "additionalProperties": false
      "type": "object"
      "required":
        - "stage"
        - "state"
        - "verdict"
      "title": "RelationReceipt"
      "description": "Per-call accounting metadata: no request/response digest, fixture identity or content."
    "RelationResultEnvelope":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-relation-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-relation-1"
        "status":
          "$ref": "#/components/schemas/RelationJobStatus"
        "delivery":
          "$ref": "#/components/schemas/RelationDelivery"
        "job":
          "anyOf":
            - "$ref": "#/components/schemas/RelationJobContent"
            - "type": "null"
        "receipts":
          "items":
            "$ref": "#/components/schemas/RelationReceipt"
          "type": "array"
          "title": "Receipts"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
        - "delivery"
        - "job"
        - "receipts"
      "title": "RelationResultEnvelope"
    "RelationRevalidationPhase":
      "properties":
        "state":
          "type": "string"
          "enum":
            - "not_requested"
            - "queued"
            - "running"
            - "verified"
            - "superseded"
            - "interrupted"
            - "failed"
            - "cancelled"
          "title": "State"
        "dispatchCount":
          "type": "integer"
          "title": "Dispatchcount"
        "lastOutcome":
          "anyOf":
            - "type": "string"
              "enum":
                - "exited"
                - "busy"
                - "runtime_error"
                - "transport_unknown"
                - "runtime_unavailable"
                - "service_restarted"
                - "cancelled"
            - "type": "null"
          "title": "Lastoutcome"
        "lastRuntimeCode":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Lastruntimecode"
        "verdict":
          "anyOf":
            - "type": "string"
              "enum":
                - "eligible"
                - "hold"
                - "reject"
            - "type": "null"
          "title": "Verdict"
        "resultingSourceRevision":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Resultingsourcerevision"
        "updatedAt":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Updatedat"
      "additionalProperties": false
      "type": "object"
      "required":
        - "state"
        - "dispatchCount"
        - "lastOutcome"
        - "lastRuntimeCode"
        - "verdict"
        - "resultingSourceRevision"
        - "updatedAt"
      "title": "RelationRevalidationPhase"
      "description": "Verification: the automatic re-check that an accepted `allow` requests. A verdict is not approval, and `eligible` is not publication."
    "RelationReviewPhase":
      "properties":
        "state":
          "type": "string"
          "enum":
            - "unconfirmed"
            - "applied"
          "title": "State"
        "resultingSourceRevision":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Resultingsourcerevision"
        "recordedAt":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Recordedat"
      "additionalProperties": false
      "type": "object"
      "required":
        - "state"
        - "resultingSourceRevision"
        - "recordedAt"
      "title": "RelationReviewPhase"
      "description": |-
        Acceptance: whether the decision is recorded in the AI relation ledger. `unconfirmed` means the request was reserved but the service has no
        proof yet that the event was appended; retry the same request (same key and body) to reconcile it.
    "RelationUpstream":
      "properties":
        "jobId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Jobid"
          "description": "An operator-prepared S2 extraction job. It must be listed for the calling principal in the server-owned allowlist."
        "inputDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Inputdigest"
      "additionalProperties": false
      "type": "object"
      "required":
        - "jobId"
        - "inputDigest"
      "title": "RelationUpstream"
    "RelationUsage":
      "properties":
        "replayCalls":
          "type": "integer"
          "title": "Replaycalls"
        "startedWithoutReceipt":
          "type": "integer"
          "title": "Startedwithoutreceipt"
        "providerCalls":
          "type": "integer"
          "title": "Providercalls"
        "modelCalls":
          "type": "integer"
          "title": "Modelcalls"
      "additionalProperties": false
      "type": "object"
      "required":
        - "replayCalls"
        - "startedWithoutReceipt"
        - "providerCalls"
        - "modelCalls"
      "title": "RelationUsage"
    "ResultEnvelope":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-1"
        "status":
          "$ref": "#/components/schemas/JobStatus"
        "delivery":
          "$ref": "#/components/schemas/Delivery"
        "job":
          "description": "The runtime `get` payload for the importer, present only when delivery.state is available."
          "oneOf":
            - "$ref": "ai-contract.schema.json#/$defs/JobResult"
            - "type": "null"
        "receipts":
          "items":
            "$ref": "#/components/schemas/CallReceipt"
          "type": "array"
          "title": "Receipts"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
        - "delivery"
        - "job"
        - "receipts"
      "title": "ResultEnvelope"
    "Usage":
      "properties":
        "providerAttempts":
          "type": "integer"
          "title": "Providerattempts"
        "replayCalls":
          "type": "integer"
          "title": "Replaycalls"
        "inputTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Inputtokens"
        "outputTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Outputtokens"
        "cachedTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Cachedtokens"
        "reasoningTokens":
          "anyOf":
            - "type": "integer"
            - "type": "null"
          "title": "Reasoningtokens"
        "cost":
          "anyOf":
            - "type": "number"
            - "type": "null"
          "title": "Cost"
      "additionalProperties": false
      "type": "object"
      "required":
        - "providerAttempts"
        - "replayCalls"
        - "inputTokens"
        - "outputTokens"
        - "cachedTokens"
        - "reasoningTokens"
        - "cost"
      "title": "Usage"
    "RelationSubmit":
      "additionalProperties": false
      "description": "The S3 `Submit` contract (`zoop-relation-s3`). Fixtures, registries, paths and live mode cannot be named."
      "properties":
        "schemaVersion":
          "const": "zoop-relation-s3"
          "title": "Schemaversion"
          "type": "string"
        "jobId":
          "description": "Equals the Idempotency-Key."
          "pattern": "^[A-Za-z0-9_.-]{1,120}$"
          "title": "Jobid"
          "type": "string"
        "provenance":
          "$ref": "#/components/schemas/RelationProvenance"
        "upstream":
          "$ref": "#/components/schemas/RelationUpstream"
      "required":
        - "schemaVersion"
        - "jobId"
        - "provenance"
        - "upstream"
      "title": "RelationSubmit"
      "type": "object"
    "RelationReview":
      "additionalProperties": false
      "description": |-
        One review decision on one relation candidate. The path names the job and the Idempotency-Key is the stable operation id. The reviewer
        is the authenticated principal and cannot be sent; nothing here is the application's own review revision.
      "properties":
        "relationCandidateId":
          "pattern": "^rc-[a-f0-9]{64}$"
          "title": "Relationcandidateid"
          "type": "string"
        "expectedSourceVersion":
          "description": "The job's `sourceVersion`: its `inputDigest`, as read from the result or status."
          "pattern": "^[a-f0-9]{64}$"
          "title": "Expectedsourceversion"
          "type": "string"
        "expectedSourceRevision":
          "description": "The relation's `sourceRevision` as read from the result: the runtime's event-chain revision as a decimal string. Never the application's own revision."
          "pattern": "^[1-9][0-9]{0,8}$"
          "title": "Expectedsourcerevision"
          "type": "string"
        "decision":
          "enum":
            - "allow"
            - "reject"
          "title": "Decision"
          "type": "string"
      "required":
        - "relationCandidateId"
        - "expectedSourceVersion"
        - "expectedSourceRevision"
        - "decision"
      "title": "RelationReview"
      "type": "object"
    "ExtractionSubmit":
      "additionalProperties": false
      "description": |-
        The S2 submit reference. It names a request the operator preapproved for this principal; it carries no snapshot, catalogue, observation,
        path, fixture or live mode, and the pipeline's `Submit` body is never accepted from a caller.
      "properties":
        "schemaVersion":
          "const": "zoop-extraction-s2-2"
          "title": "Schemaversion"
          "type": "string"
        "jobId":
          "description": "Equals the Idempotency-Key. The server-owned approval is looked up by this principal and job id."
          "pattern": "^[A-Za-z0-9_.-]{1,120}$"
          "title": "Jobid"
          "type": "string"
        "approvedRequestDigest":
          "description": "SHA-256 of the canonical JSON of the operator-approved S2 request. It must be the digest the operator listed for this principal and job id."
          "pattern": "^[a-f0-9]{64}$"
          "title": "Approvedrequestdigest"
          "type": "string"
      "required":
        - "schemaVersion"
        - "jobId"
        - "approvedRequestDigest"
      "title": "ExtractionSubmit"
      "type": "object"
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "description": "Operator-issued token; the service holds only its SHA-256 digest. Roles are the route scopes."
"servers":
  - "url": "http://127.0.0.1:8797"
    "description": "Loopback only. Never exposed directly; reach it through a co-located TLS proxy."
"tags":
  - "name": "analysis-jobs"
    "description": "S1 analysis jobs over the installed zoop-ai runtime."
  - "name": "relation-jobs"
    "description": "S3 relation/impact candidate jobs over an operator-prepared S2 upstream, through the installed zoop-ai-relation pipeline (replay only)."
  - "name": "extraction-jobs"
    "description": "S2 event/topic candidate jobs over an operator-approved request, through the installed zoop-ai-extract pipeline (replay only)."
  - "name": "graph-versions"
    "description": "Read-only, nonpublic S3 graph version status and company focus over operator-listed versions, through the installed zoop-ai-graph pipeline (no write, no model)."
  - "name": "graph-handoffs"
    "description": "Read-only, nonpublic AI handoff status and whole-bundle delivery over operator-pinned handoffs, through the installed zoop-ai-handoff export command (no write, no model, no network)."
