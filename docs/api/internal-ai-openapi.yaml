      "description": "Scope plan.policy. Raw closed policy document; exact If-Match and stable operation Idempotency-Key are required. Exact operator/key/body/If-Match retries return their historical receipt, even after another update. Changed body or If-Match with the same key conflicts (409); a new stale CAS conflicts (412). Identical current bytes do not renew revision/expiry or reset usage. A changed policy terminally retires all prior admissions. A replay receipt is not current state: GET current policy rather than treating it as the latest revision. Policy changes never refund usage and never authorize source/model spending. Application clients have no policy-write method."
