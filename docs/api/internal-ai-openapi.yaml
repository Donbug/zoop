    "RelationJobStatus":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-relation-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-relation-1"
        "jobId":
          "type": "string"
          "title": "Jobid"
        "inputDigest":
          "type": "string"
          "title": "Inputdigest"
        "provenance":
          "$ref": "#/components/schemas/RelationProvenance"
        "upstream":
          "$ref": "#/components/schemas/RelationUpstream"
        "state":
          "type": "string"
          "enum":
            - "queued"
            - "running"
            - "reconciling"
            - "stopped"
            - "ready"
            - "cancelled"
          "title": "State"
        "phase":
          "type": "string"
          "title": "Phase"
        "resumeMode":
          "type": "string"
          "enum":
            - "none"
            - "resume"
            - "reconcile_only"
          "title": "Resumemode"
        "failure":
          "anyOf":
            - "$ref": "#/components/schemas/RelationFailure"
            - "type": "null"
        "usage":
          "$ref": "#/components/schemas/RelationUsage"
        "delivery":
          "$ref": "#/components/schemas/RelationDelivery"
        "dispatch":
          "$ref": "#/components/schemas/RelationDispatch"
        "next":
          "type": "string"
          "enum":
