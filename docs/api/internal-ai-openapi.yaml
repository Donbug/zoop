    "HandoffManifest":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-handoff-1"
          "title": "Schemaversion"
        "handoffId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Handoffid"
        "sourceKind":
          "type": "string"
          "enum":
            - "synthetic"
            - "actual"
          "title": "Sourcekind"
        "policyVersion":
          "type": "string"
          "const": "zoop-public-projection-policy-1"
          "title": "Policyversion"
        "sources":
          "items":
            "$ref": "#/components/schemas/BmSource"
          "type": "array"
          "maxItems": 20
          "minItems": 1
          "title": "Sources"
        "files":
          "$ref": "#/components/schemas/BPolicyFiles"
      "additionalProperties": false
      "type": "object"
      "required":
        - "schemaVersion"
        - "handoffId"
        - "sourceKind"
        - "policyVersion"
        - "sources"
        - "files"
      "title": "HandoffManifest"
      "description": |-
        The operator's frozen manifest exactly as the producer's ledger stores it (closed at every level): pins and file hashes only, no path or secret.
        Its canonical JSON bytes hash to `verification.manifestDigest` and to the bundle's `manifestDigest`.
    "HdBundle":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-handoff-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-handoff-1"
        "handoffId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Handoffid"
        "state":
          "type": "string"
          "enum":
            - "reserved"
            - "ready"
            - "failed"
          "title": "State"
        "publication":
          "type": "string"
          "const": "not-published"
          "title": "Publication"
          "default": "not-published"
        "appImport":
          "type": "string"
          "const": "pending"
          "title": "Appimport"
          "default": "pending"
        "delivery":
          "$ref": "#/components/schemas/HdDelivery"
        "verification":
          "anyOf":
            - "$ref": "#/components/schemas/HdVerification"
            - "type": "null"
        "observedAt":
          "type": "string"
          "title": "Observedat"
        "manifest":
          "anyOf":
            - "$ref": "#/components/schemas/HandoffManifest"
            - "type": "null"
        "bundle":
          "anyOf":
            - "$ref": "#/components/schemas/Bundle"
            - "type": "null"
      "additionalProperties": false
      "type": "object"
      "required":
        - "handoffId"
        - "state"
        - "delivery"
        - "verification"
        - "observedAt"
        - "manifest"
        - "bundle"
      "title": "HdBundle"
      "description": |-
        The status fields plus the frozen `manifest` and the whole `bundle`, only while delivery is current. `manifest` and `bundle` are the producer's own
        artifacts exactly: the canonical JSON bytes of `manifest` hash to `verification.manifestDigest` (= `bundle.manifestDigest`), those of `bundle` to
        `verification.bundleDigest`, so the application can recompute both from this one response. Nothing the service adds is part of either; every
        service field is a sibling.
    "HdDelivery":
      "properties":
        "state":
          "type": "string"
          "enum":
            - "current"
            - "withheld"
          "title": "State"
        "reason":
          "anyOf":
            - "type": "string"
            - "type": "null"
          "title": "Reason"
        "checkedAt":
          "anyOf":
            - "type": "string"
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,6})?\\+00:00$"
            - "type": "null"
          "title": "Checkedat"
          "description": "The producer's own time of the current-authority check. null while withheld."
      "additionalProperties": false
      "type": "object"
      "required":
        - "state"
      "title": "HdDelivery"
    "HdErrorEnvelope":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-handoff-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-handoff-1"
        "error":
          "$ref": "#/components/schemas/ErrorBody"
      "additionalProperties": false
      "type": "object"
      "required":
        - "error"
      "title": "HdErrorEnvelope"
    "HdStatus":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-internal-handoff-1"
          "title": "Schemaversion"
          "default": "zoop-ai-internal-handoff-1"
        "handoffId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Handoffid"
        "state":
          "type": "string"
          "enum":
            - "reserved"
            - "ready"
            - "failed"
          "title": "State"
        "publication":
          "type": "string"
          "const": "not-published"
          "title": "Publication"
          "default": "not-published"
        "appImport":
          "type": "string"
          "const": "pending"
          "title": "Appimport"
          "default": "pending"
        "delivery":
          "$ref": "#/components/schemas/HdDelivery"
        "verification":
          "anyOf":
            - "$ref": "#/components/schemas/HdVerification"
            - "type": "null"
        "observedAt":
          "type": "string"
          "title": "Observedat"
      "additionalProperties": false
      "type": "object"
      "required":
        - "handoffId"
        - "state"
        - "delivery"
        - "verification"
        - "observedAt"
      "title": "HdStatus"
    "HdVerification":
      "properties":
        "manifestDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Manifestdigest"
        "bundleDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Bundledigest"
          "description": "SHA-256 of the canonical UTF-8 bytes of the bundle; equals the operator's pin."
        "contentDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Contentdigest"
        "bundleBytes":
          "type": "integer"
          "title": "Bundlebytes"
        "counts":
          "$ref": "#/components/schemas/BCounts"
        "sources":
          "type": "integer"
          "title": "Sources"
          "description": "Number of S3 source jobs the handoff was frozen from."
        "provenance":
          "$ref": "#/components/schemas/BProvenance"
      "additionalProperties": false
      "type": "object"
      "required":
        - "manifestDigest"
        - "bundleDigest"
        - "contentDigest"
        - "bundleBytes"
        - "counts"
        - "sources"
        - "provenance"
      "title": "HdVerification"
      "description": "What was verified for this very response: digests of the received bytes and the counts the bundle itself reports. No source id, text or title."
    "JobStatus":
