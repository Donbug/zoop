      "title": "ChatStageFailure"
    "ChatStageResult":
      "properties":
        "schemaVersion":
          "type": "string"
          "const": "zoop-ai-chat-4"
          "title": "Schemaversion"
        "invocationId":
          "type": "string"
          "title": "Invocationid"
        "stage":
          "type": "string"
          "enum":
            - "chat-router"
            - "chat-answer"
            - "chat-verification"
            - "chat-agent"
          "title": "Stage"
        "status":
          "type": "string"
          "enum":
            - "succeeded"
            - "failed"
          "title": "Status"
        "answer":
          "anyOf":
            - "$ref": "#/components/schemas/RouterAnswer"
            - "$ref": "#/components/schemas/ChatAnswer"
            - "$ref": "#/components/schemas/VerificationAnswer"
            - "$ref": "#/components/schemas/AgentAnswer"
            - "type": "null"
          "title": "Answer"
          "description": "The typed stage answer when succeeded: RouterAnswer (chat-router), ChatAnswer (chat-answer), VerificationAnswer (chat-verification) or AgentAnswer (chat-agent)."
        "failure":
          "anyOf":
            - "$ref": "#/components/schemas/ChatStageFailure"
            - "type": "null"
        "receipt":
          "anyOf":
            - "$ref": "#/components/schemas/ChatReceipt"
            - "type": "null"
          "description": "Who received the request and what they reported; present once a request was sent."
      "type": "object"
      "required":
        - "schemaVersion"
        - "invocationId"
        - "stage"
        - "status"
        - "answer"
        - "failure"
        - "receipt"
      "title": "ChatStageResult"
      "description": |-
        The outcome. Besides the field shapes the door checks the invariants: `succeeded` has an answer of its own stage's model, no failure and a
        receipt; `failed` has a failure and no answer; `unknown` implies `sent`; a receipt is present exactly when something was sent and names the
        requested mode.
