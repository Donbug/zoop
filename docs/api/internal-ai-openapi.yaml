        "lastOutcome":
          "anyOf":
            - "type": "string"
              "enum":
                - "exited"
                - "busy"
                - "runtime_error"
                - "transport_unknown"
                - "runtime_unavailable"
                - "service_restarted"
                - "cancelled"
            - "type": "null"
