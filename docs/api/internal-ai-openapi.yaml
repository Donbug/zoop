    "BSummaryAvailable":
      "properties":
        "status":
          "type": "string"
          "const": "available"
          "title": "Status"
        "text":
          "type": "string"
          "maxLength": 1404
          "minLength": 1
          "title": "Text"
        "claims":
          "items":
            "$ref": "#/components/schemas/BSummaryClaim"
          "type": "array"
          "maxItems": 5
          "minItems": 1
          "title": "Claims"
        "evidenceIds":
          "items":
            "type": "string"
            "pattern": "^ev-[a-f0-9]{64}$"
          "type": "array"
          "maxItems": 25
          "minItems": 1
          "title": "Evidenceids"
        "generatedAt":
          "type": "string"
          "maxLength": 100
          "title": "Generatedat"
        "resultVersion":
          "type": "string"
          "pattern": "^isr-[a-f0-9]{64}$"
          "title": "Resultversion"
        "language":
          "type": "string"
          "const": "ko"
          "title": "Language"
        "source":
          "$ref": "#/components/schemas/BSummarySource"
        "producer":
          "$ref": "#/components/schemas/BSummaryProducer"
        "verifier":
          "$ref": "#/components/schemas/BSummaryVerifier"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
        - "text"
        - "claims"
        - "evidenceIds"
        - "generatedAt"
        - "resultVersion"
        - "language"
        - "source"
        - "producer"
        - "verifier"
      "title": "BSummaryAvailable"
      "description": |-
        A verified multi-article summary of ONE issue: 1..5 claims, each cited to quote evidence of the issue's own mentions. Its closure with the issue (basis digest,
        result version, result digest, evidence ids inside the basis, execution-mode kinds) is `check_issue_summary`; what this model fixes is the shape and everything a
        value says about itself (claim ids `c1..cn`, `text` = claims joined by a newline, `evidenceIds` = the sorted union of the claims', a strict offset-aware `generatedAt`).
    "BSummaryClaim":
      "properties":
        "claimId":
          "type": "string"
          "pattern": "^c[1-5]$"
          "title": "Claimid"
        "text":
          "type": "string"
          "maxLength": 280
          "minLength": 1
          "title": "Text"
        "evidenceIds":
          "items":
            "type": "string"
            "pattern": "^ev-[a-f0-9]{64}$"
          "type": "array"
          "maxItems": 5
          "minItems": 1
          "title": "Evidenceids"
      "additionalProperties": false
      "type": "object"
      "required":
        - "claimId"
        - "text"
        - "evidenceIds"
      "title": "BSummaryClaim"
      "description": "One sentence of an available summary with the quote evidence ids it rests on (1..5, sorted, unique, all inside the issue's own input basis)."
    "BSummaryProducer":
      "properties":
        "kind":
          "type": "string"
          "enum":
            - "authored-replay"
            - "provider"
          "title": "Kind"
        "model":
          "anyOf":
            - "type": "string"
              "maxLength": 200
              "minLength": 1
            - "type": "null"
          "title": "Model"
        "reasoningEffort":
          "anyOf":
            - "type": "string"
              "maxLength": 50
              "minLength": 1
            - "type": "null"
          "title": "Reasoningeffort"
        "promptVersion":
          "type": "string"
          "maxLength": 200
          "minLength": 1
          "title": "Promptversion"
        "schemaDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Schemadigest"
        "runtimeIdentity":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Runtimeidentity"
      "additionalProperties": false
      "type": "object"
      "required":
        - "kind"
        - "model"
        - "reasoningEffort"
        - "promptVersion"
        - "schemaDigest"
        - "runtimeIdentity"
      "title": "BSummaryProducer"
      "description": |-
        Who wrote the claims. `kind` pairs with the bundle's execution mode: `authored-replay` (an authored answer, no model, `model` and `reasoningEffort` null) in a
        replay bundle, `provider` (a named model and reasoning effort) in a live one.
    "BSummarySource":
      "properties":
        "jobId":
          "type": "string"
          "pattern": "^[A-Za-z0-9._:-]{1,200}$"
          "title": "Jobid"
        "inputDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Inputdigest"
        "resultDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Resultdigest"
        "basisDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Basisdigest"
      "additionalProperties": false
      "type": "object"
      "required":
        - "jobId"
        - "inputDigest"
        - "resultDigest"
        - "basisDigest"
      "title": "BSummarySource"
      "description": |-
        The immutable summary job result this value came from: the job, its input digest, the digest of its result and the basis digest of the issue input it was
        written for. A deterministic `unavailable` value has no job and therefore no source (`null`).
    "BSummaryUnavailable":
      "properties":
        "status":
          "type": "string"
          "const": "unavailable"
          "title": "Status"
        "code":
          "type": "string"
          "enum":
            - "not-requested"
            - "temporal-review-pending"
            - "input-too-large"
            - "producer-invalid"
            - "verifier-hold"
            - "verifier-reject"
          "title": "Code"
        "source":
          "anyOf":
            - "$ref": "#/components/schemas/BSummarySource"
            - "type": "null"
      "additionalProperties": false
      "type": "object"
      "required":
        - "status"
        - "code"
        - "source"
      "title": "BSummaryUnavailable"
      "description": |-
        No summary text exists. A deterministic `code` (`not-requested`, `temporal-review-pending`, `input-too-large`) has no job behind it (`source` null); a job
        `code` (`producer-invalid`, `verifier-hold`, `verifier-reject`) names the pinned result of the job that failed. It is never an empty available summary.
    "BSummaryVerifier":
      "properties":
        "kind":
          "type": "string"
          "enum":
            - "authored-replay"
            - "independent-verifier"
          "title": "Kind"
        "model":
          "anyOf":
            - "type": "string"
              "maxLength": 200
              "minLength": 1
            - "type": "null"
          "title": "Model"
        "adapterIdentity":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Adapteridentity"
        "requestDigest":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
          "title": "Requestdigest"
      "additionalProperties": false
      "type": "object"
      "required":
        - "kind"
        - "model"
        - "adapterIdentity"
        - "requestDigest"
      "title": "BSummaryVerifier"
      "description": "Who checked the claims against the quotes. `authored-replay` in a replay bundle (never an independent model's verdict), `independent-verifier` in a live one."
    "BUnknownGeography":
