      "description": "Scope plan.admit. Resolve only the configured plan root and completely verify the installed plan. Admission atomically persists paired S2/S3 references and cumulative quota, but never submits or dispatches either job. 201 is a first commit; 200 is the original immutable receipt, including inactive history, without regeneration or quota debit. An admission is not present source-rights proof, readiness, spending permission, publication or activation. Manual and online authorities are exclusive; absent online configuration returns execution_unavailable after authentication. Requests are bounded at 2,000,000 bytes. Complete replies are bounded at 16,000,000 bytes; units are never truncated. Revisions, counters and limits are signed 64-bit nonnegative integers (positive for a revision or policy limit)."
