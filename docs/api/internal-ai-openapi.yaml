          "title": "Policyversion"
        "countries":
          "items":
            "type": "string"
          "type": "array"
          "maxItems": 0
          "title": "Countries"
        "verification":
          "type": "string"
          "const": "not-established"
          "title": "Verification"
        "reasonCode":
          "type": "string"
          "enum":
            - "not-stated"
            - "not-supported"
            - "conflicting"
          "title": "Reasoncode"
        "evidenceIds":
          "items":
            "type": "string"
          "type": "array"
          "maxItems": 0
          "title": "Evidenceids"
        "basis":
          "items":
            "$ref": "#/components/schemas/BGeographyBasis"
          "type": "array"
          "maxItems": 1000
          "minItems": 1
          "title": "Basis"
      "additionalProperties": false
      "type": "object"
      "required":
        - "value"
        - "decisionRef"
        - "decisionVersion"
        - "policyVersion"
        - "countries"
        - "verification"
        - "reasonCode"
        - "evidenceIds"
        - "basis"
      "title": "BUnknownGeography"
    "BUpstream":
      "properties":
